function openViewer(list,i,record=true){if(!list.length)return;viewerList=list;viewerIndex=((i%list.length)+list.length)%list.length;const p=list[viewerIndex];if(record)remember({album:p.albumId,photo:p.number,fromPhotos:!detailAlbum,mode,publisher:activePublisher});$('lightbox').classList.add('open');document.body.style.overflow='hidden';showViewer();$('close').focus({preventScroll:true})}
let viewerGeneration=0,routeTimer=null,historyEntry=0;const viewerRoutes=new Map();
function layoutViewer(){
 const p=viewerList[viewerIndex],angle=photoRotation(p),image=$('full'),frame=image.parentElement;
 image.style.cssText='';frame.style.cssText='';
 if(!angle)return;
 const scale=Math.min(1,Math.min(innerWidth,1800)/p.height,Math.max(1,innerHeight-71)/p.width);
 frame.style.width=p.height*scale+'px';frame.style.height=p.width*scale+'px';
 Object.assign(image.style,{position:'absolute',left:'50%',top:'50%',width:p.width*scale+'px',height:p.height*scale+'px',maxWidth:'none',maxHeight:'none',transform:'translate(-50%,-50%) rotate('+angle+'deg)'});
}
window.addEventListener('resize',()=>{if($('lightbox').classList.contains('open'))layoutViewer()});
function showViewer(){
 const p=viewerList[viewerIndex];if(!p)return;
 viewerGeneration++;
 const generation=viewerGeneration;
 layoutViewer();
 const image=$('full'),status=$('media-status');
 status.textContent='불러오는 중';
 image.removeAttribute('src');image.hidden=true;
 const src=p.url,localCopy=exactSavedViewerCopy(p);
 function install(url,allowPreviewFallback=false,fallbackToOriginal=false){
  // Replaying the same denied remote URL with different referrer headers
  // neither restores owner access nor helps a verified local copy.
  const policies=['no-referrer'];
  let retry=0;
  const fail=()=>{
   if(generation!==viewerGeneration)return;
   if(retry>=policies.length){
    if(fallbackToOriginal&&p.ownerAlbum){
     status.textContent='기존 보관 원본 연결 확인 중';
     MimmiPrivate.asset(p,'original').then(privateUrl=>{
      if(generation!==viewerGeneration)return;
      install(privateUrl,true);$('original').href=privateUrl;
     }).catch(error=>{if(generation===viewerGeneration)status.textContent=error.message});
     return;
    }
    if(allowPreviewFallback&&p.ownerAlbum&&p.preview){
     status.textContent='원본 연결 오류 · 보관 미리보기 확인 중';
     MimmiPrivate.asset(p,'preview').then(previewUrl=>{
      if(generation!==viewerGeneration)return;
      install(previewUrl,false);$('original').href=previewUrl;
     }).catch(error=>{if(generation===viewerGeneration)status.textContent=error.message});
     return;
    }
    image.hidden=true;image.removeAttribute('src');
    status.textContent='저장된 사진을 불러오지 못했습니다. 원본 파일이나 이 기기의 보관본을 확인해 주세요.';
    registerImageHealth(url,false);return;
   }
   image.removeAttribute('src');image.referrerPolicy=policies[retry++];
   requestAnimationFrame(()=>{if(generation===viewerGeneration)image.src=url});
  };
  image.onload=()=>{if(generation!==viewerGeneration)return;if(image.naturalWidth>100){image.hidden=false;status.textContent='';registerImageHealth(url,true)}else fail()};
  image.onerror=fail;fail();
 }
 if(localCopy){
  install(localCopy.url,false,true);$('original').href=localCopy.url;
 }else if(p.ownerAlbum||p.vaultAlbum){
  (p.vaultAlbum?PhotoVault.asset(p):MimmiPrivate.asset(p,'original')).then(url=>{
   if(generation===viewerGeneration){install(url,!!p.ownerAlbum);$('original').href=url}
  }).catch(error=>{if(generation===viewerGeneration)status.textContent=error.message});
 }else install(src);
 image.alt=p.name+' · '+p.number;
 $('position').textContent=(viewerIndex+1)+' / '+viewerList.length+' · '+p.width+'×'+p.height;
 if((p.ownerAlbum||p.vaultAlbum)&&!localCopy)$('original').removeAttribute('href');
 else $('original').href=localCopy?.url||src;
}
function hideViewer(){clearTimeout(routeTimer);viewerGeneration++;$('lightbox').classList.remove('open');document.body.style.overflow='';$('full').removeAttribute('src')}
function closeViewer(){if(history.state?.mimmi&&history.state.photo)goBack();else hideViewer()}
function step(n){
 viewerIndex=(viewerIndex+n+viewerList.length)%viewerList.length;showViewer();
 if(history.state?.mimmi){const state={...history.state,photo:viewerList[viewerIndex].number,album:viewerList[viewerIndex].albumId};viewerRoutes.set(state.key,state);clearTimeout(routeTimer);
 // WebKit rate-limits History API writes. Rapid swipes must keep rendering;
 // remember the last photo immediately, and update its URL only after a pause.
 routeTimer=setTimeout(()=>{if($('lightbox').classList.contains('open')&&history.state?.key===state.key)history.replaceState(state,'',routeURL(state))},1000)}
}
function routeURL(s){const q=new URLSearchParams();if(s.album)q.set('album',s.album);if(s.photo)q.set('photo',s.photo);if(s.fromPhotos)q.set('from','photos');if(s.publisher)q.set('publisher',s.publisher);if(s.mode&&s.mode!=='albums')q.set('view',s.mode);return location.pathname+location.search+(q.size?'#'+q:'')}
function remember(s){history.replaceState({...history.state,scroll:window.scrollY},'');const state={mimmi:true,key:Date.now().toString(36)+'-'+(++historyEntry),depth:(history.state?.depth||0)+1,scroll:0,...s};history.pushState(state,'',routeURL(state))}
function goBack(){if(history.state?.mimmi&&history.state.depth>0)history.back();else{const state={mimmi:true,depth:0,mode:activePublisher?'publishers':'albums',publisher:history.state?.album?activePublisher:null,scroll:0};history.replaceState(state,'',routeURL(state));applyRoute(state)}}
function applyRoute(s){$('search-dialog').close();s=viewerRoutes.get(s.key)||s;s={...s,album:canonicalId(s.album)};hideViewer();setMode(s.mode||'albums',s.publisher);if(s.album&&!s.fromPhotos)openAlbum(s.album,false);if(s.photo){const a=stored.find(a=>a.id===s.album);const list=s.fromPhotos?available().flatMap(photosFor).filter(p=>p.name.toLocaleLowerCase().includes($('search').value.toLocaleLowerCase().trim())):a?photosFor(a):[];const i=list.findIndex(p=>p.albumId===s.album&&p.number===Number(s.photo));if(i>=0)openViewer(list,i,false)}if(s.searchOpen)showSearch();requestAnimationFrame(()=>window.scrollTo(0,s.scroll||0))}
function routeFromLocation(){
 const raw=location.hash.slice(1),q=new URLSearchParams(raw);
 // Old Mimmi links used a bare #album-id without an 'album=' key.
 // Safari BFCache and untyped popstate must restore these URLs, too.
 const album=canonicalId(raw&&!raw.includes('=')?decodeURIComponent(raw):q.get('album'));
 return {mimmi:true,depth:0,mode:q.get('view')||'albums',publisher:q.get('publisher'),
         album,photo:q.get('photo'),fromPhotos:q.get('from')==='photos',scroll:0};
}
window.addEventListener('popstate',()=>{applyRoute(history.state?.mimmi?history.state:routeFromLocation())});
window.addEventListener('pageshow',event=>{if(event.persisted&&catalog.length)applyRoute(history.state?.mimmi?history.state:routeFromLocation())});
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=closeViewer;
$('back').onclick=goBack;
function showSearch(){if(!$('search-dialog').open)$('search-dialog').showModal();$('search').focus()}
function closeSearch(){if(history.state?.searchOpen&&history.state.depth>0)history.back();else $('search-dialog').close()}
$('search-toggle').onclick=()=>{remember({mode,publisher:activePublisher,searchOpen:true});showSearch()};
$('search-close').onclick=closeSearch;
$('search-dialog').addEventListener('cancel',e=>{e.preventDefault();closeSearch()});
$('search-dialog').addEventListener('click',e=>{if(e.target===$('search-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSearch()}});
$('search-form').onsubmit=e=>{e.preventDefault();closeSearch()};
$('search').oninput=()=>{hideViewer();setMode(mode,activePublisher);const s={...history.state,mimmi:true,mode,scroll:0};history.replaceState(s,'',routeURL(s))};
$('browse-toggle').onclick=()=>{const next=mode==='publishers'?'albums':'publishers';remember({mode:next});setMode(next);window.scrollTo(0,0)};
$('lightbox').onclick=e=>{if(e.target===$('lightbox'))closeViewer()};
document.addEventListener('keydown',e=>{if(!$('lightbox').classList.contains('open'))return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});
// Never cancel native pinch/long-press or iOS edge navigation. A multi-touch
// gesture remains ineligible for swiping until every finger has been lifted.
let gesture=null;
$('lightbox').addEventListener('touchstart',e=>{if(e.touches.length!==1){gesture=null;return}const t=e.touches[0];gesture={x:t.clientX,y:t.clientY,valid:t.clientX>28&&t.clientX<innerWidth-28&&(visualViewport?.scale||1)<=1.01}},{passive:true});
$('lightbox').addEventListener('touchmove',e=>{if(e.touches.length!==1&&gesture)gesture.valid=false},{passive:true});
$('lightbox').addEventListener('touchcancel',()=>{gesture=null},{passive:true});
$('lightbox').addEventListener('touchend',e=>{if(e.touches.length){gesture=null;return}const g=gesture;gesture=null;const t=e.changedTouches[0];if(!g?.valid||!t||(visualViewport?.scale||1)>1.01)return;const dx=t.clientX-g.x,dy=t.clientY-g.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx>0?-1:1)},{passive:true});

/* Static Pages' SHA-verified owner index is essential for the gallery.
   A transient Pages/CDN error must not silently turn thousands of saved photos
   into an empty catalogue for the lifetime of the page. */
async function fetchOwnerIndexWithRetry(model){
 let lastError;
 for(let attempt=0;attempt<4;attempt++){
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
  try{
   const response=await fetch('owner-index.json',{cache:'no-store',signal:controller.signal});
   if(!response.ok)throw Error('owner-index HTTP '+response.status);
   const index=await response.json();
   if(index?.schema_version!==1||index.model!==model||!Array.isArray(index.albums))
    throw Error('owner-index schema mismatch');
   return index;
  }catch(error){
   lastError=error;
   if(attempt<3)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
  }finally{clearTimeout(timeout)}
 }
 console.warn('Saved owner index failed after four Pages requests:',String(lastError));
 throw lastError;
}

// Backward-compatible hidden verifier is for existing archive QA; no import controls appear in the gallery.
Promise.all([
 fetch('stored-albums.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('stored index unavailable');return r.json()}),
 fetchOwnerIndexWithRetry('mimmi').then(d=>({albums:MimmiPrivate.fromIndex(d)})).catch(error=>({albums:[],error:error.message})), // Complete saved-photo metadata from static Pages; originals remain on TeraBox.
 PhotoVault.albums('mimmi').then(albums=>({albums})).catch(error=>({albums:[],error:error.message})),
 fetch('identity-exclusions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('identity exclusions');return r.json()}),
 fetch('album-covers.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
 fetch('album-aliases.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
 fetch('publishers.json',{cache:'no-store'}).then(r=>r.ok?r.json():{publishers:[]}).catch(()=>({publishers:[]})),
 fetch('number-collision-distinct.json',{cache:'no-store'}).then(r=>r.ok?r.json():{photos:[]}).catch(()=>({photos:[]}))
]).then(([s,owner,vault,exclusions,covers,aliases,publishers,collisions])=>{
 if(!Array.isArray(s.albums)||(s.model&&s.model!=='mimmi'))throw Error('Invalid physical archive index');
 publisherRegistry=publishers;
 albumCovers=covers.covers||{};
 albumAliases=aliases.aliases||{};
 albumAliasEvidence=aliases.evidence||{};
 collisionDistinct=new Set((collisions.photos||[])
  .filter(x=>typeof x.album==='string'&&/^[a-f0-9]{64}$/.test(x.sha256||''))
  .map(x=>x.album+'|'+x.sha256));
 const excludedIds=new Set([...(exclusions.excluded_album_ids||[]),...(exclusions.excluded_source_ids||[])]),
       excludedSources=new Set(exclusions.excluded_source_urls||[]),
       excludedHashes=new Set(exclusions.excluded_image_sha256||[]);
 const allowed=a=>!excludedIds.has(a.id)&&![a.source,...(a.source_pages||[])].some(u=>excludedSources.has(u));
 // Deliberately do NOT open research-only or verified source-host URL indexes.
 // Only SHA-recorded, physically committed local files and authenticated private media.
 localStored=s.albums.filter(allowed).map(a=>({
  ...a,sourceHosted:false,
  images:(a.images||[]).map((p,i)=>({...p,number:Number.isSafeInteger(p.number)&&p.number>=1?p.number:i+1})).filter(p=>!excludedHashes.has(p.sha256))
 })).filter(a=>validImages(a).length);
 ownerStored=(owner.albums||[]).filter(allowed).map(a=>({
  ...a,images:(a.images||[]).filter(p=>!excludedHashes.has(p.sha256))
 })).filter(a=>validImages(a).length);
 vaultStored=(vault.albums||[]).filter(allowed).map(a=>({...a,images:(a.images||[]).filter(p=>!excludedHashes.has(p.sha256))})).filter(a=>validImages(a).length);
 remoteStored=[];publisherWorkReferences=[];
 // Union of real saved files; no count for source-only links or duplicate hashes.
 function rebuildStored(){
  // Never collapse two SHA-distinct saved originals solely because two
  // independent storage indexes reused the same publisher-facing number.
  // Save the physical storage number separately from the gallery number.
  const merged=SavedGalleryPhotoUnion.join([localStored,ownerStored,vaultStored]);
  const joined=MimmiAlbumGrouping.combine(merged,albumAliases,albumAliasEvidence);
  stored=joined.albums;
  rebuildLocalPreviewIndex();
  ownerPhotoIndex=new Map(stored.flatMap(a=>a.images).filter(p=>p.ownerAlbum||p.vaultAlbum).map(p=>[p.url,p]));
  catalog=stored.slice();
 }
 rebuildStored();

 const archivedCount=stored.reduce((n,a)=>n+validImages(a).length,0);
 $('inventory').textContent=archivedCount+'장 · 실제 저장본';

 render();
 const raw=location.hash.slice(1),q=new URLSearchParams(raw);const id=canonicalId(raw&&!raw.includes('=')?decodeURIComponent(raw):q.get('album'));const state={mimmi:true,depth:0,mode:q.get('view')||'albums',publisher:q.get('publisher'),album:id,photo:q.get('photo'),fromPhotos:q.get('from')==='photos',scroll:0};history.replaceState(state,'',routeURL(state));applyRoute(state);

 // Enrich the already-visible gallery when Render wakes; no loading/splash screen.
 MimmiPrivate.albums().then(albums=>{
  if(!Array.isArray(albums)||!albums.length)return;
  const nextOwner=MimmiPrivate.reconcile(ownerStored,albums).filter(allowed).map(a=>({...a,images:(a.images||[]).filter(p=>!excludedHashes.has(p.sha256))})).filter(a=>validImages(a).length);
  if(!nextOwner.length)return;
  // An unchanged remote catalogue must never detach cards while a user scrolls.
  const photoSignature=rows=>JSON.stringify(rows.map(a=>[a.id,(a.images||[]).map(p=>[p.number,p.sha256,p.bytes,p.width,p.height,p.preview_sha256])]));
  if(photoSignature(ownerStored)===photoSignature(nextOwner))return;
  ownerStored=nextOwner;
  rebuildStored();
  // A newly indexed work must be usable immediately without replacing any
  // existing card (which would cancel an ongoing tap or scroll).
  if(!$('browse').hidden && mode==='albums' && !activePublisher && !$('search').value.trim()){
   const grid=$('albumgrid'),shown=new Set([...grid.querySelectorAll('.album[data-id]')].map(b=>b.dataset.id));
   for(const a of available()){
    if(shown.has(a.id))continue;
    const template=document.createElement('template');template.innerHTML=card(a,true);
    const node=template.content.firstElementChild;
    node.onclick=()=>{const current=stored.find(x=>x.id===a.id);if(current&&validImages(current).length)openAlbum(a.id)};
    grid.appendChild(node);shown.add(a.id);
   }
   $('total').textContent=grid.querySelectorAll('.album').length+' albums';
   observeOwner();
  }
  // Keep existing DOM nodes and active scroll/touch/lightbox unchanged.
  // The next user-initiated filter or navigation uses the updated catalogue;
  // never replace all cards from an asynchronous background response.
 }).catch(()=>{});
}).catch(()=>{$('total').textContent='—';$('nothing').textContent='이미지를 불러올 수 없습니다.';$('nothing').hidden=false});
</script>
