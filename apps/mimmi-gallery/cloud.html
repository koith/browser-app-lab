<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MIMMI — 개인 보관소</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;background:#101114;color:#f1f1f3;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:590px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 18px 60px}
a{color:#e8e5df;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #33353a;padding-bottom:20px;gap:12px}
.brand{font-size:21px;font-weight:850;letter-spacing:.1em}.back{font-size:13px;border:1px solid #383940;border-radius:20px;padding:9px 14px}
h1{font-size:28px;letter-spacing:-.04em;margin:42px 0 10px}p{font-size:13px;line-height:1.8;color:#a2a3aa}
fieldset{border:0;padding:0;margin:25px 0 0}label{display:block;color:#c9c9ce;font-size:12px;margin:22px 0 7px}
input{width:100%;padding:15px;border:1px solid #41434a;border-radius:8px;background:#1e2025;color:#fff;font-size:16px}
input:focus{outline:2px solid #c3aeaa;outline-offset:1px}button{font:inherit;cursor:pointer;border-radius:8px;padding:12px 18px}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.primary{background:#e6d7d3;border:0;color:#242027;font-weight:700}
.secondary{background:none;border:1px solid #53535b;color:#ddd}
#status{border-top:1px solid #37373d;margin-top:30px;padding-top:20px;min-height:60px}
#status[data-error=true]{color:#ffb5af}#status[data-error=false]{color:#c4e7d0}
.note{margin-top:25px;color:#888990}
</style></head><body>
<main class="wrap">
<header><a class="brand" href="./">MIMMI</a><a class="back" href="./">← 화보 목록</a></header>
<h1>개인 보관소 연결</h1>
<p>공개 웹사이트에 원본 사진이나 비밀번호를 업로드하지 않습니다. 개인 인증 게이트웨이가 연결되면 보관한 원본을 우선 표시하고, 연결되지 않으면 기존 공개 출처 사진을 표시합니다.</p>
<form id="connect">
<fieldset><label for="api">비공개 보관소 게이트웨이 주소</label>
<input id="api" type="url" inputmode="url" placeholder="https://mimmi-private-gallery-free.onrender.com" autocomplete="url" required>
<label for="token">보관소 접근 토큰</label>
<input id="token" type="password" autocomplete="off" placeholder="접근 토큰" required>
</fieldset><div class="actions"><button class="primary" type="submit">연결 확인 후 갤러리 열기</button>
<button class="secondary" type="button" id="disconnect">연결 해제</button></div></form>
<p id="status" role="status">보관소 접속 정보는 이 브라우저 탭의 세션에만 저장되며, URL이나 GitHub에는 저장되지 않습니다.</p>
<p class="note">사진이 실제로 보관되었는지는 연결 성공 후 인증된 목록과 원본 SHA-256 검증으로 판단합니다. 단순 URL 발견을 보관 완료로 계산하지 않습니다.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='mimmi-owner-session';
function originOf(s){
 const u=new URL(s);
 if(u.username||u.password||u.pathname!=='/'||u.search||u.hash||
    !(u.protocol==='https:'||(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname))))
   throw Error('HTTPS 기반 보관소 주소만 입력할 수 있습니다.');
 return u.origin;
}
try{const existing=JSON.parse(sessionStorage.getItem(KEY)||'null');if(existing?.api)$('api').value=existing.api;else $('api').value='https://mimmi-private-gallery-free.onrender.com';}catch{}
$('disconnect').onclick=()=>{sessionStorage.removeItem(KEY);$('token').value='';$('status').dataset.error='false';$('status').textContent='이 브라우저 탭에서 보관소 연결 정보를 해제했습니다.'};
$('connect').onsubmit=async e=>{
 e.preventDefault();const status=$('status');status.removeAttribute('data-error');status.textContent='인증 및 보관소 연결 확인 중…';
 const button=$('connect').querySelector('button[type=submit]');button.disabled=true;
 try{
  const api=originOf($('api').value),token=$('token').value.trim();
  if(!token||token.length>2048)throw Error('유효한 접근 토큰을 입력하세요.');
  const response=await fetch(api+'/api/catalog',{method:'GET',
      headers:{Authorization:'Bearer '+token},cache:'no-store',mode:'cors'});
  if(!response.ok)throw Error('보관소 응답 '+response.status+' — 주소 또는 인증 상태를 확인하세요.');
  const d=await response.json();
  if(d.schema_version!==1||d.model!=='mimmi'||!Array.isArray(d.albums))
    throw Error('밈미 전용 인증 보관소 형식이 아닙니다.');
  sessionStorage.setItem(KEY,JSON.stringify({api,token}));
  status.dataset.error='false';
  status.textContent='보관소 인증 완료 · '+d.albums.length+'개 화보 · 원본 '+d.albums.reduce((n,a)=>n+(a.images||[]).length,0)+'장. 갤러리로 이동합니다.';
  location.assign('./');
 }catch(error){sessionStorage.removeItem(KEY);status.dataset.error='true';status.textContent='연결 실패: '+error.message}
 finally{button.disabled=false}
};
</script></body></html>
