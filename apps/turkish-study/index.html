<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143a32"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Türkçe 120 · 터키어 독학</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#192d29;font:16px/1.65 system-ui,-apple-system,sans-serif}header{background:#143a32;color:white;padding:20px max(20px,env(safe-area-inset-left));position:sticky;top:0;z-index:3}header strong{font-size:22px}header small{display:block;color:#c6d9ce}main{max-width:740px;margin:auto;padding:20px 16px 104px}h1{font-size:27px;line-height:1.3;margin:8px 0 16px}h2{font-size:20px;margin:0 0 10px}h3{font-size:17px}p{margin:8px 0}small,.muted{color:#5b6b65}header .muted{color:#c6d9ce}.card{background:white;border:1px solid #dfe4dc;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 6px #152b1710}.banner{background:#fff5d9;border:1px solid #e7c96d;padding:12px;border-radius:12px;margin-bottom:16px;font-size:14px}button,input,select{font:inherit}button{border:0;background:#e6eee8;border-radius:12px;padding:10px 14px;color:#15372e;cursor:pointer;min-height:44px}button.primary{background:#176447;color:white;font-weight:650}button:disabled{opacity:.45;cursor:default}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:30px;line-height:1.2;font-weight:750;color:#176447}.tr{font-weight:650;font-size:19px;overflow-wrap:anywhere}.ko{font-size:15px;color:#53625e}.item{border-top:1px solid #e8ece6;padding:12px 0}.item:first-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d9e0db;display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:4}nav button{background:transparent;border-radius:9px;font-size:13px;flex:1;max-width:150px;padding:9px 1px}nav button.active{background:#e5f1e8;font-weight:bold}.progress{background:#e1ebe3;height:9px;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#176447}.choice{display:block;width:100%;text-align:left;margin:6px 0}.good{background:#d4efda!important}.bad{background:#ffe0d8!important}.tag{font-size:12px;display:inline-block;background:#e7ece4;border-radius:8px;padding:3px 8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days button{padding:8px 0;min-width:0;font-size:13px}.days button.done{background:#b6e1c2}.days button.selected{outline:2px solid #176447}input[type=text]{border:1px solid #c9d2cb;border-radius:10px;width:100%;padding:10px}.message{padding:10px 14px;background:#eaf1ec;border-radius:12px;margin:7px 0}.message:nth-child(even){background:#f1eddf}.hide{display:none}details{margin:12px 0}a{color:#176447}audio{width:100%}.k{font-size:14px}.score{font-weight:bold}button:focus-visible{outline:3px solid #ab782b}#notice{min-height:24px;font-size:14px} .clock{font-variant-numeric:tabular-nums}
</style></head><body><header><div class="row between"><div><strong>Türkçe 120</strong><small>에스키셰히르에서 만나요</small></div><select id="profile" aria-label="학습자"><option value="a">학습자 1</option><option value="b">학습자 2</option></select></div></header><main id="main" aria-live="polite">학습 자료 불러오는 중…</main><nav id="nav"><button data-tab="home">홈</button><button data-tab="course">수업</button><button data-tab="words">단어장</button><button data-tab="review">복습</button><button data-tab="settings">설정</button></nav>
<script src="app/release-gate.js"></script>
<script>
"use strict";
const $=x=>document.getElementById(x), main=$("main"), KEY="turkce120-v1", profiles=["a","b"];let curriculum,lessons,releaseManifest,gate,offlineSnapshot=false,ready=false,tab="home",selected=1,profile="a",rate=1,recorder=null,recordUrl=null,stream=null,startTime=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blank=()=>({done:{},attempts:[],cards:{},seconds:0,studyDates:{},departure:"2027-03-21"});
let all={a:blank(),b:blank()};try{const saved=JSON.parse(localStorage.getItem(KEY));if(profiles.every(id=>validProfile(saved?.[id])))all=saved;}catch{}
let state=()=>all[profile];function save(){try{localStorage.setItem(KEY,JSON.stringify(all));return true;}catch{alert("저장 공간을 확인하세요. 설정에서 백업을 내보낼 수 있습니다.");return false;}}
function dateKey(){return new Date().toLocaleDateString("sv-SE")}
function tick(){if(ready&&document.visibilityState==="visible"&&tab==="course"&&lesson(selected)){state().seconds++;state().studyDates[dateKey()]=true;if(state().seconds%15===0)save();const t=$("clock");if(t)t.textContent=Math.floor(state().seconds/60)+"분";}}
setInterval(tick,1000);window.addEventListener("pagehide",save);document.addEventListener("visibilitychange",save);
const lesson=d=>gate?.lesson(d);
const allowed=d=>gate?.allowed(d)===true;
const count=()=>Object.keys(state().done).filter(d=>allowed(Number(d))).length;
function next(){return curriculum.days.find(d=>allowed(d.day)&&!state().done[d.day])?.day??curriculum.days.find(d=>allowed(d.day))?.day??1}
const studied=()=>lessons.lessons.filter(l=>allowed(l.day)&&Boolean(state().done[l.day])).flatMap(l=>l.words.map((w,i)=>({id:l.id+"-V"+(i+1),tr:w[0],ko:w[1],day:l.day})));
function allWords(){return lessons.lessons.filter(l=>allowed(l.day)).flatMap(l=>l.words.map((w,i)=>({id:l.id+"-V"+(i+1),tr:w[0],ko:w[1],day:l.day})));}
function due(){return studied().filter(w=>!state().cards[w.id]?.due||state().cards[w.id].due<=Date.now())}
function btn(text,action,attrs=""){return '<button '+attrs+' data-action="'+action+'">'+esc(text)+'</button>'}
function speakBtn(s){return '<button data-speak="'+esc(s)+'" aria-label="터키어 음성 재생">▶ 듣기</button>'}
function pair(p){return '<div class="item row between"><div><div class="tr" lang="tr">'+esc(p[0])+'</div><div class="ko">'+esc(p[1])+'</div></div>'+speakBtn(p[0])+'</div>'}
function banner(){return '<div class="banner"><b>앱 0.1.1 · '+(gate?.ids.size?'승인된 학습판':'개발판 / 공개 승인 대기')+'</b><br>학습 가능 '+(gate?.ids.size??0)+'/120일 · '+(offlineSnapshot?'오프라인 캐시 · ':'')+'기록은 이 브라우저에만 저장됩니다. 공식 수준 인증이 아닙니다.</div>'}
function card(title,body){return '<section class="card"><h2>'+esc(title)+'</h2>'+body+'</section>'}
function headerPage(title){return banner()+'<h1>'+title+'</h1>'}
function num(n){return String(n).padStart(2,"0")}
function metric(n,l){return '<div class="card"><div class="metric">'+esc(n)+'</div><small>'+esc(l)+'</small></div>'}
function render(){if(!ready)return;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
if(tab==="home"){const days=Math.max(0,Math.ceil((Date.parse(state().departure+"T00:00:00")-Date.now())/86400000));main.innerHTML=headerPage("Bugün · 오늘의 학습")+'<div class="grid">'+metric(count()+"/120","수업 완료")+metric("D-"+days,"출국까지 (예정)")+metric(Math.floor(state().seconds/60)+"분","누적 수업 화면 시간")+metric(due().length,"복습 대상")+'</div>'+card("오늘의 수업",'<div class="tag">DAY '+num(next())+'</div><h3>'+esc(curriculum.days[next()-1].title)+'</h3><button class="primary" disabled hidden></button>'+btn(gate.ids.size?"학습 시작":"공개 승인 대기","start",'class="primary" '+(!gate.ids.size?"disabled":""))+ (gate.ids.size&&count()===gate.ids.size?'<p class="muted">현재 공개된 과정까지 완료했습니다.</p>':'')+'<div class="progress" style="margin-top:16px"><i style="width:'+count()/120*100+'%"></i></div>')+card("학습 요약","학습일 "+Object.keys(state().studyDates).length+"일 · 시험 제출 "+state().attempts.filter(a=>allowed(a.day)).length+"회");}
else if(tab==="course"){const d=curriculum.days[selected-1],l=lesson(selected);main.innerHTML=headerPage("Day "+num(selected)+" · "+esc(d.title))+card("120일 커리큘럼",'<select id="week" aria-label="학습 주차">'+Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'" '+(d.week===i+1?'selected':'')+'>'+(i+1)+'주차</option>').join("")+'</select><div class="days" style="margin-top:12px">'+curriculum.days.filter(x=>x.week===d.week).map(x=>'<button class="'+(allowed(x.day)&&state().done[x.day]?"done ":"")+(x.day===selected?"selected":"")+'" data-day="'+x.day+'" aria-label="Day '+x.day+(allowed(x.day)?' 학습 가능':' 공개 승인 대기')+'">'+x.day+(allowed(x.day)?'':' 🔒')+'</button>').join("")+'</div>')+(l?card("오늘의 목표",'<p>'+esc(l.objective)+'</p><small>권장 60분 · 누적 <span id="clock" class="clock">'+Math.floor(state().seconds/60)+'분</span></small>')+card("1. 어휘 및 발음",(l.alphabet?'<p lang="tr" class="tr">'+esc(l.alphabet)+'</p>':'')+l.words.map(pair).join("")+(!l.words.length?"오늘은 이전 단어를 복습합니다.":""))+card("2. 문법",'<p>'+esc(l.grammar)+'</p><p class="muted">'+esc(l.note)+'</p>')+card("3. 예문",l.examples.map(pair).join(""))+card("4. 실전 회화",l.dialogue.map(p=>'<div class="message"><small>'+esc(p[0])+'</small>'+pair([p[1],p[2]])+'</div>').join("")+'<p>'+esc(l.task)+'</p><div class="row">'+btn("녹음 시작","record")+btn("녹음 종료","stop")+'</div><div id="recordStatus" class="muted">녹음은 서버에 전송하지 않습니다.</div><audio id="recording" controls hidden></audio>')+card("5. 듣기·받아쓰기",'<p>아래 음성을 듣고 터키어로 입력하세요.</p>'+speakBtn(l.examples[0][0])+'<input id="dictation" type="text" autocomplete="off" autocapitalize="off" lang="tr" placeholder="터키어 입력"><div class="row" style="margin:8px 0">'+[..."çğıöşüÇĞİÖŞÜ"].map(c=>'<button data-letter="'+c+'">'+c+'</button>').join("")+'</div>'+btn("정답 확인","dictation")+'<p id="dictationResult"></p>')+card("6. 확인 시험",'<p>정답을 고르세요. 모든 항목에 답해야 제출됩니다.</p><form id="quiz">'+l.questions.map((q,i)=>'<fieldset style="border:0;padding:12px 0;border-top:1px solid #ddd"><legend>'+esc(i+1+". "+q.prompt)+'</legend>'+q.choices.map((c,j)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+esc(c)+'" required> '+esc(c)+'</label>').join("")+'</fieldset>').join("")+'<button type="submit" class="primary">시험 제출</button></form><div id="result"></div>')+card("수업 완료",'<p>확인 시험 80% 이상 달성 후 완료할 수 있습니다. 회화 과제는 직접 연습하세요.</p>'+btn(state().done[selected]?"완료됨":"수업 완료","complete",'class="primary" '+(state().done[selected]?"disabled":""))):card("공개 승인 대기","이 날짜는 아직 학습 공개 승인을 받지 않았습니다. 수업·시험·완료 기능은 잠겨 있습니다."));}
else if(tab==="words"){const ws=studied();main.innerHTML=headerPage("단어장")+card("학습한 단어 "+ws.length+"개",'<input id="search" type="text" aria-label="단어 검색" placeholder="터키어 또는 한국어 검색"><label class="row"><input id="favoritesOnly" type="checkbox"> 즐겨찾기만 보기</label><div id="wordlist">'+wordHtml(ws)+'</div>');}
else if(tab==="review"){const ws=due();main.innerHTML=headerPage("반복 학습")+card("오늘의 복습 "+ws.length+"개",ws.length?ws.map(w=>'<div class="item"><div class="tr" lang="tr">'+esc(w.tr)+'</div>'+speakBtn(w.tr)+'<details><summary>뜻 보기</summary><p>'+esc(w.ko)+'</p><div class="row">'+btn("어려움","review:"+w.id+":0")+btn("보통","review:"+w.id+":1")+btn("쉬움","review:"+w.id+":2")+'</div></details></div>').join(""):"수업을 완료하면 복습할 단어가 여기에 표시됩니다.")+card("오답 기록",state().attempts.filter(a=>allowed(a.day)).flatMap(a=>a.wrong||[]).slice(-30).reverse().map(q=>'<div class="item"><b>'+esc(q.prompt)+'</b><p>내 답: '+esc(q.given)+' / 정답: '+esc(q.answer)+'</p></div>').join("")||"아직 오답이 없습니다.");}
else{main.innerHTML=headerPage("설정 및 기록")+card("음성 설정",'<label>속도 <select id="rate"><option value=".65">느리게</option><option value=".85">보통보다 느리게</option><option value="1" selected>보통</option></select></label><p id="voiceStatus"></p>'+btn("음성 테스트","voiceTest"))+card("출국 예정일",'<input id="departure" type="date" value="'+esc(state().departure)+'">')+card("백업 / 복원",'<p>두 학습자의 기록을 JSON 파일로 내보냅니다. 다른 기기에서 가져올 수 있습니다. 이 파일에는 개인 학습 기록이 포함됩니다. 두 프로필 선택은 기기 내 기록 분리일 뿐 계정 인증이 아닙니다. 기기 초기화·브라우저 데이터 삭제 시 기록을 잃을 수 있습니다.</p>'+btn("백업 내보내기","export")+'<p><input id="import" type="file" accept="application/json"></p>')+card("상태 및 출처",'<p>클라우드 동기화, 검증된 음성 파일, 자동 발음 평가, 전체 교재는 미구현 상태입니다. 승인 목록에 없는 교재·시험은 잠겨 있습니다. 기존 개발판 시험 기록은 보존하되 새 완료 판정에는 현 릴리스의 시험 결과가 필요합니다.</p><a href="curriculum.json">120일 교육과정 JSON</a><br><a href="https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors-search">CEFR 기준</a><br><a href="https://yee.org.tr/tr/turkce-ogretimi/materyaller">Yunus Emre 교육자료</a>');$("rate").value=String(rate);voiceStatus();}
}
function updateWordList(){const q=normalize($("search").value),only=$("favoritesOnly").checked;$("wordlist").innerHTML=wordHtml(studied().filter(w=>(!only||state().cards[w.id]?.favorite)&&(normalize(w.tr).includes(q)||normalize(w.ko).includes(q))));}
function wordHtml(ws){return ws.map(w=>'<div class="item"><div class="row between"><div><div class="tr" lang="tr">'+esc(w.tr)+'</div><div class="ko">'+esc(w.ko)+'</div></div>'+speakBtn(w.tr)+'<button aria-pressed="'+Boolean(state().cards[w.id]?.favorite)+'" data-action="favorite:'+w.id+'">'+(state().cards[w.id]?.favorite?'★ 즐겨찾기':'☆ 즐겨찾기')+'</button></div><small>Day '+w.day+' · 반복 '+(state().cards[w.id]?.stage??0)+'단계</small></div>').join("")||"완료한 수업의 어휘가 표시됩니다.";}
function getVoice(){return window.speechSynthesis?.getVoices().find(v=>/^tr(?:-|$)/i.test(v.lang)&&v.localService!==false);}
function voiceStatus(){const el=$("voiceStatus");if(el)el.textContent=getVoice()?"터키어 음성 발견: "+getVoice().name+" (기기 합성, 발음 미검수)":"터키어 음성이 확인되지 않았습니다. 기기 언어 음성 지원을 확인하세요.";}
function speak(s){const v=getVoice();if(!v){alert("터키어 TTS 음성이 이 기기에서 확인되지 않았습니다. 잘못된 언어로 대신 읽지 않습니다.");return;}const u=new SpeechSynthesisUtterance(s);u.lang="tr-TR";u.voice=v;u.rate=rate;u.onerror=()=>alert("음성 재생에 실패했습니다.");speechSynthesis.cancel();speechSynthesis.speak(u);}
function normalize(s){return s.normalize("NFC").toLocaleLowerCase("tr-TR").trim().replace(/[.!?]+$/,"").replace(/\s+/g," ");}
async function record(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$("recordStatus").textContent="이 브라우저는 녹음을 지원하지 않습니다.";return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));const a=$("recording");if(a){a.src=recordUrl;a.hidden=false;$("recordStatus").textContent="녹음 완료. 듣고 예문과 비교하세요."}stream?.getTracks().forEach(t=>t.stop());};recorder.start();$("recordStatus").textContent="녹음 중…";}catch(e){stream?.getTracks().forEach(t=>t.stop());$("recordStatus").textContent="녹음 실패: "+e.message;}}
function stop(){if(recorder?.state==="recording")recorder.stop();}
function go(t){stop();tab=t;render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(!ready)return;if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.day){stop();selected=+b.dataset.day;render();return}if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.letter){const el=$("dictation");const p=el.selectionStart??el.value.length;el.setRangeText(b.dataset.letter,p,el.selectionEnd??p,"end");el.focus();return}const a=b.dataset.action;if(!a)return;if(a==="start"){if(!gate.ids.size)return;selected=next();go("course")}else if(a==="voiceTest")speak("Merhaba! Nasılsınız?");else if(a==="record"){if(allowed(selected)&&tab==="course"&&recorder?.state!=="recording")record()}else if(a==="stop")stop();else if(a==="dictation"){if(tab!=="course"||!allowed(selected))return;$("dictationResult").textContent=normalize($("dictation").value)===normalize(lesson(selected).examples[0][0])?"정답입니다!":"정답: "+lesson(selected).examples[0][0];}else if(a==="complete"){if(tab!=="course"||!allowed(selected))return;const last=state().attempts.filter(x=>x.day===selected&&x.releaseId===releaseManifest.releaseId&&x.contentRevision===releaseManifest.contentRevision).at(-1);if(!last||last.score<80){alert("확인 시험을 먼저 80% 이상 달성하세요.");return}if(selected>1&&!state().done[selected-1]){alert("이전 수업부터 완료하세요.");return}state().done[selected]=Date.now();save();render();}else if(a.startsWith("favorite:")){const id=a.slice(9);if(tab!=="words"||!studied().some(w=>w.id===id))return;const old=state().cards[id]||{};state().cards[id]={...old,favorite:!old.favorite};save();updateWordList();}else if(a.startsWith("review:")){const [,id,r]=a.split(":"),rating=+r;if(!studied().some(w=>w.id===id)||![0,1,2].includes(rating))return;const old=state().cards[id]?.stage||0,stage=rating===0?0:Math.min(5,old+(rating===2?2:1));const gaps=[1,1,3,7,14,30];state().cards[id]={...state().cards[id],stage,due:Date.now()+gaps[stage]*86400000};save();render();}else if(a==="export"){const url=URL.createObjectURL(new Blob([JSON.stringify({format:KEY,profiles:all},null,2)],{type:"application/json"}));const link=document.createElement("a");link.href=url;link.download="turkce120-backup-"+dateKey()+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
document.addEventListener("submit",e=>{if(e.target.id!=="quiz")return;e.preventDefault();if(!ready||tab!=="course"||!allowed(selected))return;const l=lesson(selected),f=new FormData(e.target);if(!l.questions.every(q=>q.choices.includes(f.get(q.id)))){alert("모든 문제의 보기를 선택하세요.");return;}const wrong=l.questions.filter(q=>f.get(q.id)!==q.answer).map(q=>({id:q.id,prompt:q.prompt,answer:q.answer,given:f.get(q.id)}));const score=Math.round((l.questions.length-wrong.length)/l.questions.length*100);state().attempts.push({day:selected,score,wrong,releaseId:releaseManifest.releaseId,contentRevision:releaseManifest.contentRevision,at:Date.now()});save();$("result").innerHTML='<p class="score">점수 '+score+'점</p>'+wrong.map(q=>'<p>'+esc(q.prompt)+' → '+esc(q.answer)+'</p>').join("");});
function validProfile(p){return p&&typeof p==="object"&&typeof p.done==="object"&&!Array.isArray(p.done)&&p.done!==null&&Object.entries(p.done).every(([k,v])=>/^([1-9]|[1-9][0-9]|1[01][0-9]|120)$/.test(k)&&Number.isFinite(v)&&v>0)&&Array.isArray(p.attempts)&&p.attempts.every(a=>Number.isInteger(a.day)&&a.day>=1&&a.day<=120&&Number.isFinite(a.score)&&a.score>=0&&a.score<=100&&Array.isArray(a.wrong)&&a.wrong.every(q=>q&&typeof q.id==="string"&&typeof q.prompt==="string"&&typeof q.answer==="string"&&(q.given===null||typeof q.given==="string")))&&typeof p.cards==="object"&&p.cards!==null&&!Array.isArray(p.cards)&&typeof p.studyDates==="object"&&p.studyDates!==null&&!Array.isArray(p.studyDates)&&Number.isFinite(p.seconds)&&p.seconds>=0&&typeof p.departure==="string"&&/^\d{4}-\d\d-\d\d$/.test(p.departure);}
document.addEventListener("change",async e=>{if(!ready)return;if(e.target.id==="profile"){save();stop();profile=e.target.value;selected=next();render()}if(e.target.id==="week"){selected=curriculum.days.find(d=>d.week===+e.target.value).day;render()}if(e.target.id==="favoritesOnly")updateWordList();if(e.target.id==="rate")rate=+e.target.value;if(e.target.id==="departure"&&e.target.value){state().departure=e.target.value;save()}if(e.target.id==="import"){try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error("백업 파일 크기가 10MB를 초과합니다");const x=JSON.parse(await file.text());if(x.format!==KEY||!profiles.every(id=>validProfile(x.profiles?.[id])))throw Error("지원하지 않는 백업 형식");if(confirm("현재 두 학습자의 기록을 백업 내용으로 교체할까요?")){const previous=all;all={a:x.profiles.a,b:x.profiles.b};if(!save()){all=previous;throw Error("기기 저장에 실패했습니다");}render();}e.target.value="";}catch(err){alert("복원 실패: "+err.message)}}});
document.addEventListener("input",e=>{if(ready&&e.target.id==="search")updateWordList();});
if(window.speechSynthesis)speechSynthesis.addEventListener("voiceschanged",voiceStatus);
const SNAPSHOT="turkce120-approved-snapshot-v1", SNAPKEY=new URL("app/release-snapshot",location.href).href;
async function clearSnapshot(){try{await caches.delete(SNAPSHOT)}catch{}}
async function loadRelease(){
 const files=["curriculum.json","lessons.json","RELEASE_MANIFEST.json"];
 // Unique request key also prevents the legacy v0.1.0 worker from returning older per-file caches.
 const requestKey=Date.now().toString(36)+Math.random().toString(36).slice(2);
 const responses=await Promise.allSettled(files.map(async f=>fetch(f+"?bundle="+requestKey,{cache:"no-store"})));
 let bundle;
 if(responses.every(x=>x.status==="rejected")){
   const cache=await caches.open(SNAPSHOT), cached=await cache.match(SNAPKEY);
   if(!cached)throw Error("네트워크에 연결해 최신 승인 목록을 확인하세요.");
   bundle=await cached.json();offlineSnapshot=true;
 }else{
   if(responses.some(x=>x.status!=="fulfilled"||!x.value.ok)){await clearSnapshot();throw Error("출고 자료를 확인하지 못했습니다.");}
   try{bundle=await Promise.all(responses.map(x=>x.value.json()));releaseGate(bundle[2],bundle[0],bundle[1]);}
   catch(e){await clearSnapshot();throw e;}
   // Store a single coherent response, not independently refreshed JSON entries.
   try{const cache=await caches.open(SNAPSHOT);await cache.put(SNAPKEY,new Response(JSON.stringify(bundle),{headers:{"Content-Type":"application/json"}}));}catch{await clearSnapshot();}
 }
 [curriculum,lessons,releaseManifest]=bundle;
 gate=releaseGate(releaseManifest,curriculum,lessons);ready=true;selected=next();render();
}
loadRelease().catch(err=>{ready=false;main.textContent="학습 잠금 · "+err.message;document.querySelectorAll("nav button").forEach(b=>b.disabled=true);$("profile").disabled=true;});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(console.warn);
</script></body></html>
