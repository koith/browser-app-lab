<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>당근 통합검색</title>
<style>
:root{--c:#ff6f0f;--c2:#e95f00;--soft:#fff1e6;--ink:#212124;--sub:#868b94;--line:#e5e7eb;--panel:#f7f8f8;--danger:#d93a3a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif}body{padding-bottom:calc(24px + env(safe-area-inset-bottom));overscroll-behavior-y:none}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top))}.top{padding:0 16px 9px;font-weight:850;color:var(--c);font-size:17px}.ver{font-size:10px;color:#b8bcc3;margin-left:5px}.tabs{display:flex;gap:22px;padding:0 16px}.tab{position:relative;border:0;background:none;color:var(--sub);font-weight:750;padding:2px 0 10px}.tab.on{color:var(--ink)}.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--c);border-radius:3px}.search{display:flex;gap:8px;padding:0 16px 10px}.inputWrap{position:relative;flex:1}.inputWrap input{width:100%;border:0;outline:0;background:var(--panel);border-radius:10px;padding:11px 38px 11px 14px;font-size:16px}.clear{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:0;border-radius:50%;background:#c6cad1;color:#fff}.clear.show{display:block}.go{border:0;border-radius:10px;background:var(--c);color:#fff;font-weight:800;padding:0 18px}.go:disabled{opacity:.45}.chips{display:flex;gap:8px;overflow:auto;padding:0 16px 10px;scrollbar-width:none}.chip{flex:none;border:1px solid var(--line);background:#fff;color:#4d5159;border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:650}.chip.on{border-color:var(--c);background:var(--soft);color:var(--c2)}.chip.primary.on{background:var(--c);color:#fff}main{padding:12px 16px 0}.status{font-size:13px;color:var(--sub);line-height:1.55;margin-bottom:10px}.status b{color:var(--ink)}.err{color:var(--danger)}.retry{display:none;border:0;background:#fff0f0;color:var(--danger);font-size:12.5px;font-weight:750;border-radius:8px;padding:7px 10px;margin-bottom:8px}.retry.show{display:inline-block}.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--soft);border-top-color:var(--c);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}.loading{text-align:center;color:var(--sub);padding:55px 0}.card{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.card.sold{opacity:.52}.thumb{width:82px;height:82px;object-fit:cover;background:var(--panel);border-radius:8px;flex:none}.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}.title{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:15px;font-weight:800}.meta,.desc{font-size:12.5px;color:var(--sub);line-height:1.35}.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{text-align:center;color:var(--sub);padding:55px 10px;line-height:1.7;font-size:14px}.back{display:none;position:fixed;inset:0;background:#0006;z-index:40}.back.open{display:block}.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:84vh;padding-bottom:env(safe-area-inset-bottom);flex-direction:column}.sheet.open{display:flex}.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--line)}.sheetHead h2{font-size:16px;margin:0}.count{font-size:13px;color:var(--c);font-weight:750}.limit{padding:9px 18px 0;font-size:12.5px;color:var(--sub)}.sheetBody{padding:4px 18px 12px;overflow:auto}.prov{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px}.prov button{border:0;background:none;color:var(--c);font-size:12.5px;font-weight:750}.guWrap{display:flex;flex-wrap:wrap;gap:7px}.gu{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:13px}.gu.on{border-color:var(--c);background:var(--soft);color:var(--c2);font-weight:700}.foot{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}.foot button{border:0;border-radius:10px;padding:13px;font-weight:800}.secondary{background:var(--panel);color:#4d5159;flex:0 0 92px}.done{background:var(--c);color:#fff;flex:1}.excRow{display:flex;gap:8px;margin:12px 0}.excRow input{flex:1;border:0;background:var(--panel);border-radius:10px;padding:11px 12px}.excRow button{border:0;background:var(--c);color:#fff;border-radius:10px;padding:0 15px;font-weight:800}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:0;background:var(--soft);color:var(--c2);border-radius:999px;padding:7px 10px;font-size:13px}
</style></head><body>
<header><div class="top">당근 통합검색 <span class="ver">v2.1</span></div><div class="tabs"><button class="tab on" data-mode="sell">중고거래</button><button class="tab" data-mode="group">모임</button><button class="tab" data-mode="comm">동네생활</button></div><div class="search"><div class="inputWrap"><input id="q" type="search" enterkeyhint="search" autocomplete="off"><button id="clear" class="clear">×</button></div><button id="go" class="go">검색</button></div><div class="chips"><button id="regionChip" class="chip primary">지역 선택 ▾</button><button id="newChip" class="chip on">최신순</button><button id="priceChip" class="chip">낮은가격순</button><button id="distChip" class="chip">가까운순</button><button id="saleChip" class="chip">거래가능만</button><button id="excChip" class="chip">제외어 ▾</button></div></header>
<main><div id="status" class="status"></div><button id="retry" class="retry">실패 지역 다시 검색</button><div id="results"></div></main>
<div id="regionBack" class="back"></div><div id="regionSheet" class="sheet"><div class="sheetHead"><h2>검색 지역</h2><span id="regionCount" class="count"></span></div><div id="limit" class="limit"></div><div id="regionBody" class="sheetBody"></div><div class="foot"><button id="regionClear" class="secondary">전체 해제</button><button id="regionDone" class="done">완료</button></div></div>
<div id="excBack" class="back"></div><div id="excSheet" class="sheet"><div class="sheetHead"><h2>제외할 단어</h2><span id="excCount" class="count"></span></div><div class="sheetBody"><div class="excRow"><input id="excInput" placeholder="예: 고장, 부품"><button id="excAdd">추가</button></div><div id="tags" class="tags"></div></div><div class="foot"><button id="excClear" class="secondary">전체 삭제</button><button id="excDone" class="done">완료</button></div></div>
<script>
const API='https://browser-app-lab.vercel.app/api';
const MAX_DONGS=200,BATCH=3,GAP=2500,WAVE_SIZE=18,WAVE_COOLDOWN=10000,DONG_TTL=86400000,AUTO_RETRY_DELAY=8000;
const LS={regions:'dgn_regions_v2',selected:'dgn_selected_v2',dongs:'dgn_dongs_v2',exclude:'dgn_exclude_v2',diag:'dgn_diag_v21'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let mode='sell',sortMode='new',onSale=false,myPos=null,searching=false,regions=load(LS.regions,[]),selected=new Set(load(LS.selected,[])),dongCache=load(LS.dongs,{}),excludes=load(LS.exclude,{sell:[],group:[],comm:[]}),items=[],codeMeta={},failedCodes=[],lastMeta={};
const state={sell:{q:'',items:[],meta:{}},group:{q:'',items:[],meta:{}},comm:{q:'',items:[],meta:{}}};
const endpoint=()=>mode==='group'?'daangn-group':mode==='comm'?'daangn-community':'daangn';
function placeholder(){return mode==='sell'?'검색어를 입력하세요':mode==='group'?'모임 검색 (예: 등산, 독서)':'동네생활 검색 (예: 맛집, 분실)'}
function setStatus(s){$('status').innerHTML=s||''}
function toggleClear(){$('clear').classList.toggle('show',!!$('q').value)}
function setMode(m){if(m===mode)return;state[mode]={q:$('q').value,items:[...items],meta:lastMeta};mode=m;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));const sell=m==='sell';$('priceChip').style.display=sell?'':'none';$('distChip').style.display=sell?'':'none';$('saleChip').style.display=sell?'':'none';$('newChip').style.display=m==='group'?'none':'';$('q').placeholder=placeholder();$('q').value=state[m].q||'';items=[...(state[m].items||[])];lastMeta=state[m].meta||{};failedCodes=[];$('retry').classList.remove('show');toggleClear();render();updateStatus();renderTags()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('q').oninput=toggleClear;$('clear').onclick=()=>{$('q').value='';toggleClear();$('q').focus()};$('q').onkeydown=e=>{if(e.key==='Enter'){e.target.blur();searchAll()}};$('go').onclick=()=>searchAll();
function open(id,b){$(id).classList.add('open');$(b).classList.add('open')}function close(id,b){$(id).classList.remove('open');$(b).classList.remove('open')}
$('regionChip').onclick=()=>{renderRegions();open('regionSheet','regionBack')};$('regionBack').onclick=()=>close('regionSheet','regionBack');$('regionDone').onclick=()=>{close('regionSheet','regionBack');if($('q').value.trim()&&selected.size)searchAll()};$('regionClear').onclick=()=>{selected.clear();save(LS.selected,[...selected]);renderRegions();updateRegionChip()};
async function loadRegions(){try{const r=await fetch(`${API}/daangn-regions`),d=await r.json();if(!r.ok||!Array.isArray(d.list))throw new Error(d.error||'지역 목록 오류');regions=d.list;save(LS.regions,regions);updateRegionChip()}catch(e){if(!regions.length)setStatus(`<span class="err">지역 목록 로딩 실패: ${esc(e.message||e)}</span>`)}}
async function dongsFor(r,force=false){if(!r)return[];const hit=dongCache[r.code];if(!force&&hit&&Date.now()-hit.at<DONG_TTL&&Array.isArray(hit.list))return hit.list;for(let a=0;a<2;a++){try{const res=await fetch(`${API}/daangn-dongs?gu=${encodeURIComponent(r.name)}&province=${encodeURIComponent(r.province)}`),d=await res.json();if(!res.ok||!Array.isArray(d.list)||!d.list.length)throw new Error(d.error||'동 목록 없음');dongCache[r.code]={at:Date.now(),list:d.list};save(LS.dongs,dongCache);return d.list}catch(e){if(a)throw e;await sleep(700)}}return[]}
async function projectedCount(add,r){let n=0;for(const c of selected)n+=(await dongsFor(regions.find(x=>x.code===c))).length;if(add&&!selected.has(add))n+=(await dongsFor(r)).length;return n}
function renderRegions(){if(!regions.length){$('regionBody').innerHTML='<div class="empty">지역 목록 불러오는 중...</div>';return}const by={};regions.forEach(r=>(by[r.province]??=[]).push(r));let h='';for(const p of ['서울특별시','경기도']){const list=by[p]||[];h+=`<div class="prov"><strong>${p}</strong><button data-prov="${p}">${list.every(r=>selected.has(r.code))?'전체 해제':'전체 선택'}</button></div><div class="guWrap">${list.map(r=>`<button class="gu ${selected.has(r.code)?'on':''}" data-code="${esc(r.code)}">${esc(r.name)}</button>`).join('')}</div>`}$('regionBody').innerHTML=h;document.querySelectorAll('.gu').forEach(b=>b.onclick=async()=>{const c=b.dataset.code,r=regions.find(x=>x.code===c);if(selected.has(c))selected.delete(c);else{if(await projectedCount(c,r)>MAX_DONGS){$('limit').innerHTML=`<span class="err">동네 ${MAX_DONGS}곳을 넘을 수 없습니다.</span>`;return}selected.add(c)}save(LS.selected,[...selected]);renderRegions();updateRegionChip()});document.querySelectorAll('[data-prov]').forEach(b=>b.onclick=async()=>{const list=by[b.dataset.prov]||[],all=list.every(r=>selected.has(r.code));if(all)list.forEach(r=>selected.delete(r.code));else for(const r of list){if(selected.has(r.code))continue;if(await projectedCount(r.code,r)>MAX_DONGS)break;selected.add(r.code)}save(LS.selected,[...selected]);renderRegions();updateRegionChip()});updateRegionChip()}
function updateRegionChip(){const rs=regions.filter(r=>selected.has(r.code));$('regionChip').textContent=!rs.length?'지역 선택 ▾':rs.length===1?`${rs[0].name} ▾`:`${rs[0].name} 외 ${rs.length-1} ▾`;$('regionChip').classList.toggle('on',!!rs.length);$('regionCount').textContent=rs.length?`${rs.length}곳 선택`:'';$('limit').textContent=`동네 최대 ${MAX_DONGS}곳 · 18곳마다 안정화 대기`}
async function selectedCodes(){const out=[],fails=[];codeMeta={};for(const r of regions.filter(x=>selected.has(x.code))){try{for(const d of await dongsFor(r)){out.push(d.code);codeMeta[d.code]={gu:d.gu||r.name,dong:d.dong||null}}}catch{fails.push(r.name)}}return{codes:[...new Set(out)].slice(0,MAX_DONGS),dongFails:fails}}
$('excChip').onclick=()=>{renderTags();open('excSheet','excBack')};$('excBack').onclick=()=>close('excSheet','excBack');$('excDone').onclick=()=>{close('excSheet','excBack');render();updateStatus()};$('excAdd').onclick=addExc;$('excInput').onkeydown=e=>{if(e.key==='Enter')addExc()};$('excClear').onclick=()=>{excludes[mode]=[];save(LS.exclude,excludes);renderTags();render();updateStatus()};function addExc(){const v=$('excInput').value.trim();if(v&&!excludes[mode].includes(v))excludes[mode].push(v);$('excInput').value='';save(LS.exclude,excludes);renderTags();render();updateStatus()}function renderTags(){const a=excludes[mode]||[];$('excCount').textContent=a.length?`${a.length}개`:'';$('tags').innerHTML=a.map((x,i)=>`<button class="tag" data-i="${i}">${esc(x)} ×</button>`).join('');document.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);save(LS.exclude,excludes);renderTags();render();updateStatus()});$('excChip').classList.toggle('on',a.length>0)}
$('newChip').onclick=()=>setSort('new');$('priceChip').onclick=()=>setSort('price');$('distChip').onclick=()=>setSort('dist');$('saleChip').onclick=()=>{onSale=!onSale;$('saleChip').classList.toggle('on',onSale);render();updateStatus()};function setSort(m){sortMode=m;['new','price','dist'].forEach(x=>$(`${x}Chip`).classList.toggle('on',x===m));if(m==='dist'&&!myPos)navigator.geolocation.getCurrentPosition(p=>{myPos=[p.coords.latitude,p.coords.longitude];render()},()=>{sortMode='new';$('newChip').classList.add('on');$('distChip').classList.remove('on');setStatus('<span class="err">위치 권한이 없어 가까운순을 사용할 수 없습니다.</span>')});render()}
const coords={강남구:[37.517,127.047],서초구:[37.484,127.033],송파구:[37.515,127.106],강동구:[37.53,127.124],마포구:[37.566,126.902],종로구:[37.573,126.979],성동구:[37.563,127.036],광진구:[37.538,127.082],용산구:[37.532,126.99],영등포구:[37.526,126.896],수원시:[37.263,127.029],성남시:[37.42,127.127],고양시:[37.658,126.832],용인시:[37.241,127.178]};function distance(it){if(!myPos)return 1e9;const c=coords[it.gu]||coords[(it.gu||'').split(' ')[0]];if(!c)return 1e9;return Math.hypot((myPos[0]-c[0])*111,(myPos[1]-c[1])*88)}
function visible(){let a=items.filter(it=>!(excludes[mode]||[]).some(w=>(it.title||'').toLowerCase().includes(w.toLowerCase())));if(mode==='sell'&&onSale)a=a.filter(it=>it.status==='on_sale');if(sortMode==='price'&&mode==='sell')a.sort((x,y)=>(x.price??1e15)-(y.price??1e15));else if(sortMode==='dist'&&mode==='sell')a.sort((x,y)=>distance(x)-distance(y));else if(sortMode==='new')a.sort((x,y)=>(y.sortTime||0)-(x.sortTime||0));return a}
const fmtPrice=v=>v==null?'가격 정보 없음':v===0?'나눔':Number(v).toLocaleString('ko-KR')+'원';function ago(t){if(!t)return'';const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return'방금 전';if(s<3600)return`${Math.floor(s/60)}분 전`;if(s<86400)return`${Math.floor(s/3600)}시간 전`;return`${Math.floor(s/86400)}일 전`}
function render(){const a=visible();if(!a.length){$('results').innerHTML=searching?'':items.length?'<div class="empty">필터 조건에 맞는 결과가 없습니다.</div>':'<div class="empty">검색 결과가 없습니다.</div>';return}$('results').innerHTML=a.map(it=>{const img=it.thumb?`<img class="thumb" src="${esc(it.thumb)}" loading="lazy">`:'<div class="thumb"></div>';if(mode==='sell')return`<a class="card ${it.status==='sold'?'sold':''}" href="${esc(it.url)}" target="_blank">${img}<div class="info"><div class="title">${esc(it.title)}</div><div class="price">${fmtPrice(it.price)}</div><div class="meta">${esc(it.dong||it.gu||'')}${it.sortTime?' · '+ago(it.sortTime):''}${it.isBoosted?' · 끌올':''}${it.status==='sold'?' · 판매완료':''}</div></div></a>`;if(mode==='group')return`<a class="card" href="${esc(it.url)}" target="_blank">${img}<div class="info"><div class="title">${esc(it.title)}</div><div class="meta">${esc(it.place||it.gu||'')}${it.members!=null?' · 멤버 '+Number(it.members).toLocaleString()+'명':''}</div>${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}</div></a>`;return`<a class="card" href="${esc(it.url)}" target="_blank">${img}<div class="info"><div class="title">${esc(it.title)}</div><div class="meta">${esc(it.dong||it.gu||'')}${it.sortTime?' · '+ago(it.sortTime):''}</div>${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}</div></a>`}).join('')}
function updateStatus(){if(!lastMeta.codes)return setStatus('');let s=`동네 <b>${lastMeta.codes}</b>곳 · 정상 <b>${lastMeta.ok}</b>곳 · 결과 <b>${visible().length}</b>건 · ${lastMeta.sec}초`;if(lastMeta.failed)s+=` · <span class="err">실패 ${lastMeta.failed}곳</span>`;if(lastMeta.blocked)s+=` · <span class="err">차단응답 ${lastMeta.blocked}곳</span>`;if(lastMeta.dongFails)s+=` · <span class="err">동 목록 실패 ${lastMeta.dongFails}곳</span>`;setStatus(s);$('retry').classList.toggle('show',failedCodes.length>0)}
async function requestBatch(q,codes){const r=await fetch(`${API}/${endpoint()}?q=${encodeURIComponent(q)}&regions=${encodeURIComponent(codes.join(','))}`),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function runCodes(q,codes,{allowAutoRetry=false,dongFails=[]}={}){const t0=Date.now(),seen=new Set(items.map(x=>x.url));let ok=0,blocked=0,fail=[];for(let i=0;i<codes.length;i+=BATCH){const b=codes.slice(i,i+BATCH),done=Math.min(i+BATCH,codes.length);setStatus(`<span class="spin"></span>검색 중 ${done}/${codes.length} · 현재 <b>${items.length}</b>건`);try{const d=await requestBatch(q,b);ok+=d.okRegionCount??Math.max(0,b.length-(d.errors||[]).length);blocked+=d.blockedCount||0;for(const e of d.errors||[])fail.push(e.region);for(const it of d.items||[]){if(seen.has(it.url))continue;seen.add(it.url);const m=codeMeta[it.region]||{};items.push({...it,gu:m.gu||it.gu||'',dong:it.dong||m.dong||null})}}catch{fail.push(...b)}render();if(done<codes.length){if(done%WAVE_SIZE===0){setStatus(`<span class="spin"></span>${done}/${codes.length} 완료 · 안정화 대기 10초`);await sleep(WAVE_COOLDOWN)}else await sleep(GAP)}}failedCodes=[...new Set(fail)];lastMeta={codes:codes.length,ok,failed:failedCodes.length,blocked,dongFails:dongFails.length,sec:((Date.now()-t0)/1000).toFixed(1),batch:BATCH,gap:GAP,wave:WAVE_SIZE};save(LS.diag,{at:Date.now(),mode,q,...lastMeta,failedCodes});if(allowAutoRetry&&failedCodes.length){const retry=[...failedCodes];setStatus(`<span class="spin"></span>실패 ${retry.length}곳 자동 재시도 대기 중...`);await sleep(AUTO_RETRY_DELAY);failedCodes=[];const before=items.length;const r=await runCodes(q,retry,{allowAutoRetry:false});r.autoRecovered=items.length-before;return r}return lastMeta}
async function searchAll(opts={}){const q=$('q').value.trim();if(!q){setStatus('<span class="err">검색어를 입력하세요.</span>');return}if(!selected.size){setStatus('<span class="err">지역을 먼저 선택하세요.</span>');renderRegions();open('regionSheet','regionBack');return}if(searching)return;searching=true;$('go').disabled=true;if(!opts.retryOnly){items=[];failedCodes=[];$('results').innerHTML='<div class="loading"><span class="spin"></span> 동네 목록 확인 중...</div>'}try{let codes,dongFails=[];if(opts.retryOnly){codes=[...failedCodes];failedCodes=[]}else{const out=await selectedCodes();codes=out.codes;dongFails=out.dongFails}await runCodes(q,codes,{allowAutoRetry:!opts.retryOnly,dongFails});state[mode]={q,items:[...items],meta:lastMeta};render();updateStatus()}catch(e){setStatus(`<span class="err">검색 실패: ${esc(e.message||e)}</span>`)}finally{searching=false;$('go').disabled=false;if(!items.length)render()}}
$('retry').onclick=()=>{if(failedCodes.length)searchAll({retryOnly:true})};$('q').placeholder=placeholder();toggleClear();updateRegionChip();renderTags();loadRegions();
</script></body></html>
