/* Editorial design language: graphic monochrome, restrained signal orange,
   animated halftone atmosphere. No copied site assets or scripts. */
:root{--ink:#171815;--paper:#e8e7e0;--surface:#f6f5ee;--line:#b5b4ac;--accent:#ef5c31;--muted:#64645d;color:var(--ink);background:var(--paper);font-family:Arial,"Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}

.ambient::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#e8e7e0dd 8%,#e9e8e2a8 60%,#e5e3d8d8 100%);z-index:1}
.halftone{position:absolute;will-change:transform;opacity:.58;background-image:radial-gradient(circle,#454640 1.15px,transparent 1.65px);background-size:9px 9px;filter:contrast(140%);transform-origin:center}
.halftone-a{width:110vw;height:110vw;max-width:1150px;max-height:1150px;top:-29vw;right:-29vw;border-radius:50%;mask-image:radial-gradient(ellipse at center,#000 4%,#0009 30%,transparent 67%);animation:dot-drift 28s ease-in-out infinite alternate}
.halftone-b{width:76vw;height:76vw;max-width:800px;max-height:800px;bottom:-30vw;left:-28vw;border-radius:50%;opacity:.32;mask-image:radial-gradient(circle,#000 6%,transparent 66%);animation:dot-orbit 35s ease-in-out infinite alternate}
@keyframes dot-drift{0%{transform:translate3d(-3%,1%,0) rotate(-10deg) scale(.9)}50%{transform:translate3d(8%,8%,0) rotate(12deg) scale(1.1)}100%{transform:translate3d(-6%,14%,0) rotate(27deg) scale(.92)}}
@keyframes dot-orbit{0%{transform:translate3d(-6%,0,0) rotate(0)}100%{transform:translate3d(12%,-13%,0) rotate(-30deg)}}

.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
main{padding:12px 19px 55px;max-width:1380px}

<script>
(function(){
"use strict";
const API="https://api.bsky.app/xrpc/app.bsky.feed.searchPosts";
const TERMS=["뒷계","섹트","일탈계"];
const DAY=86400000, MIN_WINDOW=3600000, CHUNK_DAYS=7, MAX_REQUESTS=85, MAX_POSTS=4500;
const cloudMode=location.hostname!=="koith.github.io";
let posts=[],ids=new Map(),active="all",needle="",fromMs=0,toMs=0,nextEnd=0,pending=[],requestCount=0,daysCovered=0,incomplete=0,failed=0,runID=0,busy=false,shown=0,visibleLimit=270,cloudOffset=0,cloudTotal=0;
const $=id=>document.getElementById(id);
const el=(tag,className,text)=>{let n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n};
const dayText=ms=>new Date(ms).toISOString().slice(0,10);
const parseDay=s=>Date.parse(s+"T00:00:00Z");
const validUrl=s=>{try{let u=new URL(s);return u.protocol==="https:"?u.href:""}catch{return ""}};
const niceDate=s=>{let d=new Date(s);return isNaN(d)? "날짜 미상":d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})};
function status(s){$("status").textContent=s}
function getMedia(p){
  let e=p.embed||{},m=e.media||e;
  if(Array.isArray(m.images))return m.images.map(i=>({type:"image",url:validUrl(i.fullsize||i.thumb),thumb:validUrl(i.thumb||i.fullsize),alt:i.alt||"첨부 이미지"})).filter(x=>x.url);
  if(String(m.$type||"").includes("video")||m.playlist)return [{type:"video",url:validUrl(m.playlist),thumb:validUrl(m.thumbnail)}];
  if(m.external&&m.external.thumb)return [{type:"external",url:validUrl(m.external.uri),thumb:validUrl(m.external.thumb)}];
  return [];
}
// Bluesky label settings distinguish adult-media warnings from mandatory
// restriction labels. Warn-class adult labels must not hide media by default
// when the viewer explicitly requests them. Never derive missing media URLs.
const ADULT_MEDIA_LABELS=new Set(["porn","sexual","nudity","adult","suggestive","nsfw","sexual-figurative","sexual-cartoon"]);
const RESTRICTED_LABELS=new Set(["!hide","!takedown","csam","graphic-media","gore","self-harm"]);
function mediaLabels(p){
  let collected=[];
  for(let x of p.labels||[])if(typeof x.val==="string")collected.push(x.val.toLowerCase());
  for(let x of p.record?.labels?.values||[])if(typeof x.val==="string")collected.push(x.val.toLowerCase());
  for(let x of p.author?.labels||[])if(typeof x.val==="string")collected.push(x.val.toLowerCase());
  for(let x of p.embed?.labels||[])if(typeof x.val==="string")collected.push(x.val.toLowerCase());
  return [...new Set(collected)];
}
function mediaPolicy(p){
  let values=mediaLabels(p);
  return {adult:values.some(v=>ADULT_MEDIA_LABELS.has(v)),
          restricted:values.some(v=>RESTRICTED_LABELS.has(v))};
}
function hideMedia(p){
  return !!p.restricted || (!!p.adultLabeled && !$("showAdultMedia").checked);
}
function addPost(p,term){
  if(!p||!p.uri||typeof p.record?.text!=="string"||!p.record.text.includes(term))return false;
  let uri=String(p.uri),old=ids.get(uri);
  if(old){old.terms.add(term);return false}
  let a=p.author||{},rkey=uri.split("/").pop(),did=uri.split("/")[2]||"",handle=a.did||did||a.handle;
  if(!rkey||!handle)return false;
  let url="https://bsky.app/profile/"+encodeURIComponent(handle)+"/post/"+encodeURIComponent(rkey);
  let policy=mediaPolicy(p);
  let rec={id:uri,author:a.displayName||a.handle||"게시글",text:p.record.text,posted:p.record.createdAt||p.indexedAt||"",indexed:p.indexedAt||p.record.createdAt||"",url,
      terms:new Set([term]),media:getMedia(p),adultLabeled:policy.adult,restricted:policy.restricted};
  posts.push(rec);ids.set(uri,rec);return true;
}

/*
 * Explicit advertising-content heuristic, not a judgement about the author's
 * identity, sexual activity or legitimacy. Scores only text/links and globally
 * repeated templates; it never stores author-specific behavioral profiles.
 * Labels mean "광고 의심" and not a verified commercial transaction.
 */
const AD_PATTERNS=[
  {points:3,reason:"광고·판매 문구",re:/(?:광고|홍보|할인|이벤트|입장료|구독료|유료(?:방|자료|콘텐츠|컨텐츠)|판매(?:중|합니다|해요|해드립니다|가능)|구매(?:문의|가능|하세요)|가입(?:하세요|문의)|쿠폰|공구|협찬|체험단|스폰서|대행(?:해|합니다)|선착순|리딩방|후원\s*(?:계좌|받)|계정\s*판매)/i},
  {points:3,reason:"외부 채널·유료 구독 유도",re:/(?:t\.me\/|텔레그램|telegram|오픈카톡|오픈채팅|open\.kakao|채널\s*입장|fantrie|onlyfans|patreon|fansly|팬트리|온리팬스)/i},
  {points:2,reason:"외부 링크",re:/(?:https?:\/\/|(?:www\.)[\da-z.-]+\.[a-z]{2,}|discord\.gg\/|linktr\.ee\/|lit\.link\/|bio\.site\/)/i},
  {points:2,reason:"문의·가입 유도",re:/(?:문의\s*(?:주세요|주세용|환영|가능|받습니다)|DM\s*(?:주세요|문의)|디엠\s*(?:주세요|문의)|(?:프로필|고정글|링크)\s*(?:확인|클릭|봐)|(?:모집중|구독자\s*모집|초대\s*받)|(?:무료\s*체험|첫\s*입장))/i},
  {points:2,reason:"결제·송금 정보",re:/(?:결제|입금|가격표|정가|회비|정기구독|만원|페이팔|수익|송금|계좌)/i}
];
function fingerprint(text){
  return String(text||"").normalize("NFKC").replace(/https?:\/\/\S+/gi,"")
    .replace(/#[^\s#]+/g,"").replace(/[^\p{L}\p{N}]/gu,"").toLowerCase();
}
function adEvidence(post,count){
  let text=String(post.text||""),key=fingerprint(text);
  let repeats=key.length>=28?(count.get(key)||0):0,score=0,reasons=[];
  function mark(value,reason){score+=value;reasons.push(reason)}
  let hashtags=(text.match(/#[^\s#]+/g)||[]).length;
  if(repeats>=3)mark(4,"같은 홍보형 문구 반복 "+repeats+"건");
  else if(repeats>=2)mark(hashtags>=4?4:2,"동일 문구 반복 "+repeats+"건");
  for(let test of AD_PATTERNS)if(test.re.test(text))mark(test.points,test.reason);
  if(hashtags>=8)mark(2,"해시태그 과다");
  else if(hashtags>=5)mark(1,"해시태그 다수");
  if(post.externalLink)mark(1,"외부 사이트 연결");
  return {score,reasons};
}
function updateAdScores(){
  let count=new Map();
  for(let p of posts){let k=fingerprint(p.text);if(k.length>=28)count.set(k,(count.get(k)||0)+1)}
  for(let p of posts)p.adEvidence=adEvidence(p,count);
}
function suspectedAd(post){
  let threshold=$("adLevel").value==="standard"?6:4;
  return (post.adEvidence?.score||0)>=threshold;
}

function matchesText(p){return (active==="all"||p.terms.has(active))&&(!needle||p.text.toLowerCase().includes(needle))}
function filtered(){
  let hide=$("hideAds").checked;
  return posts.filter(p=>matchesText(p)&&(!hide||!suspectedAd(p)))
    .sort((a,b)=>String(b.indexed).localeCompare(String(a.indexed)));
}
function tile(p){
  let article=el("article","post"),button=el("button","post-open");button.type="button";button.setAttribute("aria-label","게시글 상세 보기");
  article.dataset.mediaPolicy=p.restricted?"restricted":p.adultLabeled?"adult":"general";
  let thumb=el("div","post-thumb"),first=p.media[0],blocked=hideMedia(p);
  if(first&&!blocked&&first.thumb){
    let img=el("img");img.src=first.thumb;img.alt="게시글 대표 이미지";img.loading="lazy";img.referrerPolicy="no-referrer";
    img.addEventListener("error",()=>img.remove());thumb.append(img);
  }else{
    let label=blocked?(p.restricted?"제한된 미디어":"성인 미디어 숨김"):first?.type==="video"?"영상 보기":first?"미리보기 없음":"글 보기";
    thumb.append(el("span","text-icon"+(blocked?" hide-icon":""),label));
  }
  if(first?.type==="video"&&!blocked)thumb.append(el("span","video-mark","▶ 영상"));
  if(p.media.length>1&&!blocked)thumb.append(el("span","media-num","+"+(p.media.length-1)));
  let body=el("div","post-body"),title=el("div","post-title");
  title.append(el("span","author",p.author),el("span","tag",Array.from(p.terms)[0]));
  if(suspectedAd(p))title.append(el("span","post-ad-marker","광고 의심"));
  body.append(title,el("p","post-excerpt",p.text),el("div","post-date",niceDate(p.posted)));
  button.append(thumb,body);
  button.addEventListener("click",()=>openDetail(p));
  article.append(button);return article;
}
function appendMedia(parent,m,post,one){
  if(m.type==="image"){
    let src=validUrl(m.url);if(!src)return;
    let link=el("a",one?"single":"");link.href=src;link.target="_blank";link.rel="noopener noreferrer";
    let img=el("img");img.src=src;img.loading="lazy";img.alt=m.alt||"첨부 사진";img.referrerPolicy="no-referrer";
    link.append(img);parent.append(link);
  }else if(m.type==="video"){
    let src=validUrl(m.url),poster=validUrl(m.thumb);
    if(src){
      let v=el("video",one?"single":"");v.controls=true;v.playsInline=true;v.preload="metadata";v.referrerPolicy="no-referrer";v.src=src;
      if(poster)v.poster=poster;
      v.addEventListener("error",()=>{v.replaceWith(sourceLink(post,"영상 원문에서 보기"))});
      parent.append(v);
    }else parent.append(sourceLink(post,"영상 원문에서 보기"));
  }else if(m.type==="external"){
    let link=sourceLink(post,"외부 미디어 원문 열기");parent.append(link);
  }
}
function sourceLink(p,text){
  let a=el("a","",text||"원문 보기");
  let url=validUrl(p.url);
  if(url){a.href=url;a.target="_blank";a.rel="noopener noreferrer"}else a.removeAttribute("href");
  return a;
}
function openDetail(p){
  let node=$("detailContent");node.replaceChildren();
  node.append(el("div","dialog-author",p.author),el("div","dialog-date",niceDate(p.posted)));
  if(suspectedAd(p)){
    node.append(el("div","ad-detail","광고 의심 · "+(p.adEvidence?.reasons||[]).join(" / ")));
  }
  node.append(el("p","dialog-text",p.text||"(본문 없음)"));
  if(p.media.length){
    if(hideMedia(p)){
      let message=p.restricted?"서비스 제한 라벨이 적용된 미디어입니다. SNS 원문에서 확인하세요.":"성인 미디어 표시가 꺼져 있습니다.";
      node.append(el("div","dialog-notice",message));
    }else{
      let media=el("div","dialog-media");
      for(let m of p.media.slice(0,30))appendMedia(media,m,p,p.media.length===1);
      if(media.childNodes.length)node.append(media);
      else node.append(el("div","dialog-notice","현재 제공된 이미지·영상 주소가 없습니다. SNS 원문에서 확인하세요."));
    }
  }
  let actions=el("div","dialog-actions");actions.append(sourceLink(p,"SNS 원문 보기"));node.append(actions);
  document.body.classList.add("modal-open");
  $("detail").showModal();
}
function closeDetail(){
  $("detail").close();document.body.classList.remove("modal-open");$("detailContent").replaceChildren();
}
function draw(){
  updateAdScores();
  let matching=posts.filter(matchesText),suspected=matching.filter(suspectedAd).length;
  let hidden=$("hideAds").checked?suspected:0;
  let rows=filtered(),list=$("feed");list.replaceChildren();
  $("adSummary").textContent="광고 의심 "+suspected.toLocaleString()+"건 · "+(hidden?"숨김 "+hidden.toLocaleString()+"건":"광고 포함 표시");
  let limit=visibleLimit,frag=document.createDocumentFragment();
  for(let p of rows.slice(0,limit))frag.append(tile(p));
  if(!rows.length)frag.append(el("div","empty",busy?"게시글 검색 중…":"해당 기간·검색 조건의 게시글이 없습니다."));
  list.append(frag);shown=Math.min(rows.length,limit);
  $("listMore").classList.toggle("hidden",rows.length<=limit);
  $("showMore").textContent="수집된 게시글 "+Math.min(180,Math.max(0,rows.length-limit))+"개 더 보기";
  let coverage=cloudMode?" · 테라박스 저장본":" · 조회 "+daysCovered+"일 / "+(Math.ceil((toMs-fromMs)/DAY))+"일";
  let warnings=(failed||incomplete)?" · 일부 구간 미확인 "+(failed+incomplete)+"건":"";
  $("count").textContent=rows.length.toLocaleString()+"건"+(hidden?" · 광고 "+hidden.toLocaleString()+"건 제외":"")+(rows.length>limit?" · "+limit+"건 표시":"");
  $("count").setAttribute("aria-label",rows.length.toLocaleString()+"개 표시 / "+matching.length.toLocaleString()+"개 조회"+coverage+warnings);
}
function startBusy(){busy=true;$("refresh").disabled=true;$("applyDate").disabled=true;$("more").disabled=true}
function endBusy(){busy=false;$("refresh").disabled=false;$("applyDate").disabled=false;$("more").disabled=false}
function resetData(){posts=[];ids.clear();pending=[];visibleLimit=270;requestCount=0;daysCovered=0;failed=0;incomplete=0;draw()}
async function fetchWindow(segment){
  let url=new URL(API);url.searchParams.set("q",segment.term);url.searchParams.set("sort","latest");url.searchParams.set("limit","100");
  url.searchParams.set("since",new Date(segment.start).toISOString());url.searchParams.set("until",new Date(segment.end).toISOString());
  for(let attempt=0;attempt<3;attempt++){
    let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);
    try{
      let res=await fetch(url.href,{mode:"cors",cache:"no-store",headers:{"Accept":"application/json"},signal:controller.signal});
      if((res.status===429||res.status>=500)&&attempt<2){await new Promise(r=>setTimeout(r,500*(attempt+1)));continue}
      if(!res.ok)throw Error("HTTP "+res.status);
      let j=await res.json();if(!Array.isArray(j.posts))throw Error("Bad API response");
      return j;
    }catch(e){if(attempt===2||String(e).includes("403")||String(e).includes("400"))throw e;await new Promise(r=>setTimeout(r,300*(attempt+1)))}
    finally{clearTimeout(timer)}
  }
}
async function processWork(work,epoch){
  // Process a bounded number of official time-window requests.
  // Search cursor requests previously yielded HTTP 403; split saturated windows.
  let queue=work,done=0,added=0;
  async function worker(){
    while(queue.length&&requestCount<MAX_REQUESTS&&epoch===runID){
      let item=queue.shift();requestCount++;
      try{
        let j=await fetchWindow(item);
        if(epoch!==runID)return;
        for(let p of j.posts){if(posts.length>=MAX_POSTS)break;if(addPost(p,item.term))added++}
        let needSplit=(!!j.cursor||j.posts.length>=95||(typeof j.hitsTotal==="number"&&j.hitsTotal>j.posts.length+2));
        if(needSplit&&item.end-item.start>MIN_WINDOW&&requestCount<MAX_REQUESTS){
          let middle=Math.floor((item.start+item.end)/2);
          if(middle>item.start&&middle<item.end){
            queue.unshift({term:item.term,start:middle,end:item.end},{term:item.term,start:item.start,end:middle});
          }else incomplete++;
        }else if(needSplit)incomplete++;
      }catch(e){failed++}
      done++;if(done%3===0||!queue.length){
        status("수집 중 · "+posts.length.toLocaleString()+"건 · 요청 "+requestCount+"/"+MAX_REQUESTS);
        draw();
      }
      if(posts.length>=MAX_POSTS)break;
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  return {left:queue,added};
}
function setPreset(days){
  $("dateSummary").textContent="최근 "+days+"일";
  let today=new Date(),end=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
  $("startDate").value=dayText(end-(days-1)*DAY);$("endDate").value=dayText(end);
  for(let btn of $("presets").querySelectorAll("button"))btn.classList.toggle("active",Number(btn.dataset.days)===days);
}
function getDates(){
  let s=parseDay($("startDate").value),e=parseDay($("endDate").value);
  if(!Number.isFinite(s)||!Number.isFinite(e)||e<s)throw Error("시작·종료 날짜를 확인해주세요.");
  if(e-s>365*DAY)throw Error("한 번에 최대 365일을 선택할 수 있습니다.");
  if(e>Date.now()+DAY)throw Error("미래 날짜는 조회할 수 없습니다.");
  return [s,e+DAY];
}
async function loadBatch(reset){
  if(busy)return;
  if(reset){
    let dates;try{dates=getDates()}catch(e){status(e.message);return}
    let days=Math.ceil((dates[1]-dates[0])/DAY);
    $("dateSummary").textContent=days+"일 · "+$("startDate").value+" ~ "+$("endDate").value;
    runID++;fromMs=dates[0];toMs=dates[1];nextEnd=toMs;resetData();
  }
  if(!pending.length&&nextEnd<=fromMs){status("선택 기간 조회를 마쳤습니다 · "+posts.length+"건");$("paging").classList.add("hidden");return}
  startBusy();let epoch=runID;
  let queue=pending.splice(0);
  if(!queue.length){
    let batchStart=Math.max(fromMs,nextEnd-CHUNK_DAYS*DAY);
    for(let d=nextEnd-DAY;d>=batchStart;d-=DAY){
      let end=Math.min(d+DAY,nextEnd);
      for(let term of TERMS)queue.push({term,start:d,end});
    }
    daysCovered+=Math.ceil((nextEnd-batchStart)/DAY);
    nextEnd=batchStart;
  }
  // The request cap is reset per load, not across the whole historical range.
  requestCount=0;
  status("날짜별 검색 시작 · "+posts.length+"건");draw();
  let r=await processWork(queue,epoch);
  pending=r.left;
  endBusy();posts.sort((a,b)=>String(b.indexed).localeCompare(String(a.indexed)));
  if(!pending.length&&nextEnd<=fromMs)status("선택 기간 조회 완료 · "+posts.length.toLocaleString()+"건"+((failed||incomplete)?" · 일부 구간 미확인":""));
  else status("조회 "+daysCovered+"일 · "+posts.length.toLocaleString()+"건 · 이전 기간 추가 수집 가능");
  $("paging").classList.toggle("hidden",!pending.length&&nextEnd<=fromMs);
  $("more").textContent=pending.length?"누락 위험 구간 이어서 조회":"이전 7일 더 수집";
  draw();
}
let cloudBusy=false;
async function loadCloud(reset){
  if(cloudBusy)return;cloudBusy=true;startBusy();
  if(reset){resetData();cloudOffset=0;cloudTotal=0}
  try{
    if(reset){
      let key=new URLSearchParams(location.hash.slice(1)).get("access");
      if(key){
        history.replaceState(null,"",location.pathname+location.search);
        let result=await fetch("/api/activate",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",cache:"no-store",body:JSON.stringify({token:key})});
        if(!result.ok)throw Error("전용 주소가 유효하지 않습니다.");
      }
    }
    let r=await fetch("/api/posts?limit=60&offset="+cloudOffset,{credentials:"same-origin",cache:"no-store"});
    if(!r.ok)throw Error("테라박스 목록을 불러올 수 없습니다.");
    let data=await r.json();cloudTotal=data.total;
    for(let p of data.posts||[]){
      if(ids.has(p.id))continue;
      let media=(p.media||[]).map(m=>({type:String(m.mime||"").startsWith("video/")?"video":"image",url:validUrl(new URL(m.url,location.origin).href),thumb:validUrl(new URL(m.url,location.origin).href),alt:"첨부파일"}));
      let row={id:p.id,author:p.platform||"SNS",text:p.text||"",posted:p.posted_at,indexed:p.posted_at,url:validUrl(p.source_url),terms:new Set(["클라우드"]),media,adultLabeled:false,restricted:false};
      ids.set(p.id,row);posts.push(row);
    }
    cloudOffset+=(data.posts||[]).length;
    status("테라박스 저장 게시글");$("paging").classList.toggle("hidden",cloudOffset>=cloudTotal);
    $("more").textContent="저장된 게시글 더 보기";
    draw();
  }catch(e){status(e.message);if(!posts.length)$("feed").replaceChildren(el("div","empty",e.message))}
  finally{cloudBusy=false;endBusy()}
}
$("detail").addEventListener("close",()=>{document.body.classList.remove("modal-open");$("detailContent").replaceChildren()});
$("detail").addEventListener("click",e=>{if(e.target===$("detail"))closeDetail()});
$("closeDetail").addEventListener("click",closeDetail);
$("refresh").addEventListener("click",()=>cloudMode?loadCloud(true):loadBatch(true));
$("applyDate").addEventListener("click",()=>loadBatch(true));
$("more").addEventListener("click",()=>cloudMode?loadCloud(false):loadBatch(false));
$("showMore").addEventListener("click",()=>{visibleLimit+=180;draw()});
$("tabs").addEventListener("click",e=>{let button=e.target.closest("button[data-term]");if(!button)return;active=button.dataset.term;visibleLimit=270;for(let b of $("tabs").querySelectorAll("button"))b.classList.toggle("active",b===button);draw()});
$("presets").addEventListener("click",e=>{let b=e.target.closest("button[data-days]");if(!b)return;setPreset(Number(b.dataset.days));loadBatch(true)});
$("hideAds").addEventListener("change",()=>{visibleLimit=270;draw()});
$("showAdultMedia").addEventListener("change",()=>{visibleLimit=270;draw()});
$("adLevel").addEventListener("change",()=>{visibleLimit=270;draw()});
setPreset(30);
if(cloudMode){
  $("source").textContent="테라박스 저장 게시글 · 글/사진/영상";
  $("tabs").classList.add("hidden");$("datePanel").classList.add("hidden");
  $("footnote").textContent="게시글별 원문과 미디어는 테라박스에서 필요할 때만 불러옵니다.";
  loadCloud(true);
}else loadBatch(true);
})();
</script>

<script>
/* Interactive halftone: touching/dragging locally removes dots, and the
   removed region grows back over ~1.7 s. Built with Canvas2D; no dependencies.
   A pre-rendered dot atlas prevents per-dot work on every animation frame. */
(function(){
  "use strict";
  var canvas=document.getElementById("dotField");
  if(!canvas||!canvas.getContext)return;
  var ctx=canvas.getContext("2d",{alpha:true});
  if(!ctx)return;
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)");
  var atlas=document.createElement("canvas"),actx=atlas.getContext("2d",{alpha:true});
  if(!actx)return;
  var W=0,H=0,scale=1,margin=42,hits=[],frameId=0,lastFrame=0,lastHit=0;
  var idleTime=1750,maxHits=36;
  function makeAtlas(){
    W=window.innerWidth;H=window.innerHeight;
    scale=Math.min(window.devicePixelRatio||1,1.6);
    canvas.width=Math.max(1,Math.round(W*scale));
    canvas.height=Math.max(1,Math.round(H*scale));
    ctx.setTransform(scale,0,0,scale,0,0);
    atlas.width=Math.round((W+2*margin)*scale);
    atlas.height=Math.round((H+2*margin)*scale);
    actx.setTransform(scale,0,0,scale,0,0);
    actx.clearRect(0,0,W+2*margin,H+2*margin);
    var step=W<740?12:13;
    // Scanned-style density fields — more dots in upper right & lower left.
    for(var y=-margin;y<H+margin+step;y+=step){
      for(var x=-margin;x<W+margin+step;x+=step){
        var nx=x/Math.max(1,W),ny=y/Math.max(1,H);
        var d1=Math.pow((nx-.79)/.59,2)+Math.pow((ny-.14)/.6,2);
        var d2=Math.pow((nx-.11)/.54,2)+Math.pow((ny-.8)/.57,2);
        var focus=Math.min(1,Math.exp(-d1*1.65)*.92+Math.exp(-d2*2.1)*.68);
        var alpha=.10+.57*focus;
        var radius=.68+1.05*focus;
        actx.beginPath();actx.fillStyle="rgba(34,65,59,"+alpha.toFixed(3)+")";
        actx.arc(x+margin,y+margin,radius,0,Math.PI*2);actx.fill();
      }
    }
    render(performance.now(),true);
  }
  function render(now,force){
    if(!force&&now-lastFrame<33){frameId=requestAnimationFrame(render);return}
    lastFrame=now;
    ctx.clearRect(0,0,W,H);
    var dx=reduced.matches?0:Math.sin(now*.00024)*11;
    var dy=reduced.matches?0:Math.cos(now*.00019)*9;
    ctx.drawImage(atlas,Math.round((margin+dx)*scale),
      Math.round((margin+dy)*scale),Math.round(W*scale),Math.round(H*scale),
      0,0,W,H);
    if(hits.length){
      ctx.save();ctx.globalCompositeOperation="destination-out";
      for(var i=0;i<hits.length;i++){
        var hit=hits[i],age=now-hit.t;
        if(age>=idleTime)continue;
        var strength=age<100?Math.min(1,age/36):Math.pow(Math.max(0,1-(age-100)/(idleTime-100)),1.45);
        var r=hit.r;
        var grad=ctx.createRadialGradient(hit.x,hit.y,0,hit.x,hit.y,r);
        grad.addColorStop(0,"rgba(0,0,0,"+(.98*strength)+")");
        grad.addColorStop(.38,"rgba(0,0,0,"+(.91*strength)+")");
        grad.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle=grad;ctx.fillRect(hit.x-r,hit.y-r,2*r,2*r);
      }
      ctx.restore();
      hits=hits.filter(function(h){return now-h.t<idleTime});
    }
    if(!document.hidden&&(!reduced.matches||hits.length))frameId=requestAnimationFrame(render);
    else frameId=0;
  }
  function redraw(){if(!frameId)frameId=requestAnimationFrame(render)}
  function record(e){
    if(!e||!Number.isFinite(e.clientX)||!Number.isFinite(e.clientY))return;
    var now=performance.now();
    if(e.type==="pointermove"){
      if(e.pointerType!=="mouse"&&e.buttons===0)return;
      if(now-lastHit<35)return;
      var last=hits[hits.length-1];
      if(last&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<18)return;
    }
    lastHit=now;
    hits.push({x:e.clientX,y:e.clientY,t:now,r:W<740?104:136});
    if(hits.length>maxHits)hits.splice(0,hits.length-maxHits);
    redraw();
  }
  document.addEventListener("pointerdown",record,{passive:true});
  document.addEventListener("pointermove",record,{passive:true});
  document.addEventListener("visibilitychange",redraw,{passive:true});
  window.addEventListener("resize",function(){
    cancelAnimationFrame(frameId);frameId=0;makeAtlas();redraw();
  },{passive:true});
  if(reduced.addEventListener)reduced.addEventListener("change",redraw);
  makeAtlas();redraw();
})();
</script>
