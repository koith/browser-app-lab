<style>
:root{color-scheme:dark;font-family:굴림,Gulim,Dotum,Arial,sans-serif;color:#f3f6ff;background:#09112b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 10%,#263c81 0%,#101d48 36%,#080c22 100%)}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:11px 9px 18px}.titleline{width:min(calc(100vw - 18px),800px);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#b7ccfe;text-shadow:1px 1px #000;min-height:21px}.titleline strong{font-size:13px;letter-spacing:.7px;color:white}.titleline button{font-size:11px;color:#d4e9ff;background:linear-gradient(#3a6dbb,#152653);border:1px solid #8297d2;border-radius:3px;padding:3px 8px;cursor:pointer}.frame{position:relative;width:min(calc(100vw - 18px),800px);height:auto;aspect-ratio:800 / 600;max-height:calc(100dvh - 104px);background:#141e4b;border:0;outline:1px solid #788ad2;box-shadow:0 0 0 1px #0a0c35,0 4px 0 #080d2d,0 12px 55px #000b;overflow:hidden;isolation:isolate}.reference{width:100%;height:100%;position:absolute;inset:0;object-fit:fill;user-select:none;pointer-events:none;image-rendering:auto}.hotspot{position:absolute;z-index:4;cursor:pointer;appearance:none;border:0;background:transparent;color:transparent;font-size:0;padding:0;touch-action:manipulation}.hotspot:hover,.hotspot:focus-visible{outline:2px solid #faff74;outline-offset:-2px;box-shadow:inset 0 0 13px #ffea6b77;border-radius:7px}.hotspot:active{background:#ffee6630}.overlay{position:absolute;z-index:5}.bottomnav{width:min(calc(100vw - 18px),800px);display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.bottomnav button{appearance:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:-.5px;color:#e7eeff;background:linear-gradient(180deg,#607bb7 0%,#2e4e9c 18%,#233e8b 50%,#1e2d64 100%);text-shadow:1px 1px 1px #101c50;border:1px solid #7189c4;border-top-color:#b2baff;border-radius:4px;padding:6px 12px;box-shadow:inset 0 1px #adbeff4b,0 2px #040821}.bottomnav button.active{border-color:#f1d999;color:#ffe29f;background:linear-gradient(#7250b2,#352d7f)}.bottomnav button:hover{filter:brightness(1.18)}.tinyline{font-size:10px;letter-spacing:-.25px;color:#7d92c4;text-align:center}.tooltip{position:absolute;z-index:10;max-width:78%;min-width:230px;left:50%;top:47%;transform:translate(-50%,-50%);padding:15px 14px 12px;background:linear-gradient(#dde7ff,#aec7ee 23%,#f8f8ff 25%,#d6defc 85%,#adc0ef);color:#111d55;box-shadow:0 7px 0 #0b1044,0 11px 26px #000d;border:4px ridge #6082d3;border-radius:7px;text-align:center;font-size:13px;font-weight:bold;line-height:1.55}.tooltip .heading{background:linear-gradient(#4260b1,#253b7f);margin:-13px -12px 12px;padding:5px;color:#fff;border-radius:3px 3px 0 0;font-size:14px}.tooltip button{font-size:12px;cursor:pointer;background:linear-gradient(#fff,#b8cbf4);border:2px outset #8faade;color:#1b2f7c;border-radius:4px;margin:9px 3px 0;padding:5px 15px;font-family:inherit}.tooltip input{font-size:13px;padding:5px;color:#131b54;background:#f9faff;border:1px solid #5a77be;border-radius:2px;width:185px;max-width:100%}.scene-input{position:absolute;z-index:8;background:#fdfdff;border:1px solid #93a8d9;color:#080c34;outline:none;font:12px 굴림,Gulim,sans-serif}.town-chat-input{left:2.1%;top:18%;width:46%;height:3.5%;font-size:clamp(9px,1.5vw,12px);border:0;box-shadow:none;padding:1px 4px}.dice-chat-input{left:1.8%;top:94.5%;width:52%;height:3%;background:transparent;border:0;font-size:11px}.livechat{position:absolute;left:3%;top:2.5%;width:48%;max-height:13%;color:white;font-size:clamp(9px,1.4vw,12px);text-shadow:1px 1px black;z-index:7;overflow:hidden;pointer-events:none}.livechat p{margin:0}.floating-message{position:absolute;bottom:23%;left:30%;max-width:52%;z-index:10;background:#ffffd9;color:#22223f;border:2px solid #748cc2;border-radius:7px;padding:4px 8px;font-size:clamp(10px,1.5vw,13px);box-shadow:2px 3px #242963ad}.selected-card{position:absolute;z-index:3;border:2px solid #ffe58e;box-shadow:0 0 7px 3px #f2c34a7e;pointer-events:none;transition:left .12s}.gp-plate{position:absolute;z-index:5;left:68%;top:63%;font-weight:bold;color:#f5f5ff;text-shadow:1px 1px #040318;font-size:clamp(9px,1.5vw,12px);background:#2f27589e;padding:2px 4px;border-radius:2px}.dice-mini-hud{position:absolute;z-index:8;right:0.5%;bottom:0.5%;border:2px ridge #99b2ea;background:linear-gradient(95deg,#25205b,#254482);color:#fff;padding:5px 8px;font-size:clamp(9px,1.35vw,11px);text-shadow:1px 1px #000;max-width:35%;line-height:1.35}.dice-mini-hud button{font-weight:bold;cursor:pointer;background:linear-gradient(#edecff,#708cdc);border:1px solid #f4f5ff;border-radius:4px;color:#10296e;font-family:inherit;padding:4px 12px;display:block;margin:4px auto 1px}.game-die{position:absolute;z-index:6;top:60%;left:46%;font-size:clamp(18px,5vw,35px);filter:drop-shadow(1px 3px 3px black);pointer-events:none;transition:transform .2s}.result-note{position:absolute;z-index:7;top:7%;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:12px;background:#242f78d9;color:#fffbbd;border:1px solid #c6cffd;text-shadow:1px 1px #070e3a;font-weight:bold;font-size:clamp(11px,1.7vw,15px);white-space:nowrap;box-shadow:0 2px 9px #0009}.character-counter{position:absolute;left:1.2%;top:7%;background:#fff9e3;color:#263261;padding:2px 5px;font-weight:bold;z-index:5;font-size:clamp(9px,1.6vw,14px)}.marker-player{position:absolute;z-index:5;top:43%;left:35%;width:5%;aspect-ratio:1;border:2px solid #d8fef7;background:#32bdddcc;border-radius:50%;box-shadow:0 0 14px #5fffdd,0 0 3px black;transition:top .3s,left .3s}.marker-enemy{position:absolute;z-index:5;top:43%;left:65%;width:5%;aspect-ratio:1;border:2px solid #fff2bd;background:#df685dcb;border-radius:50%;box-shadow:0 0 12px #ff9b56;transition:top .3s,left .3s}.original-screen{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}.info-strip{position:absolute;z-index:6;bottom:0;left:0;right:0;color:white;font-size:12px;padding:7px 12px;background:#202a61bd;text-shadow:0 1px black}.scene-logo{position:absolute;top:1%;left:2%;z-index:5;color:white;text-shadow:1px 2px 4px black;font-weight:bold;font-size:clamp(12px,3vw,20px)}@media(max-width:630px){body{padding:6px 3px 20px;gap:6px}.frame{width:calc(100vw - 8px);max-height:calc(100dvh - 130px)}.titleline,.bottomnav{width:calc(100vw - 8px)}.bottomnav button{flex:1 1 28%;padding:8px 3px;font-size:11px}.tinyline{font-size:9px}.tooltip{min-width:0;width:85%;font-size:12px;padding:10px}.tooltip .heading{margin:-8px -8px 7px}.dice-mini-hud{padding:2px;font-size:8px}.dice-mini-hud button{padding:2px 5px;font-size:10px}}
</style></head><body>
<div class="titleline"><strong>♣ 4LEAF Browser — ORIGINAL SCENE RECONSTRUCTION</strong><span><button id="nick-change">별명</button>　<span id="player-display">Guest</span>　<span id="gp-display">3,000 GP</span></span></div>
<div id="frame" class="frame" role="application" aria-label="4LEAF 고전 브라우저 복원 인터랙티브 플레이"><img id="reference" class="reference" src="assets/dice_ref.png" alt="원본 4LEAF 게임 인터페이스"><div id="interactive-layer"></div><div id="modal-root"></div></div>
<div class="bottomnav" id="nav"><button data-scene="lobby">주잔 타운</button><button data-scene="rooms">방 선택</button><button data-scene="board">게임 플레이</button><button data-scene="town">하이아칸 채팅</button><button data-scene="shop">매직카덴</button><button data-scene="street">켈티카 거리</button><button data-scene="sky">아노마라드</button></div>
<div class="tinyline">© 원본 4LEAF / Softmax · 비공식 보존·복원 실험 · 실제 다른 이용자와 연결되지 않는 1인 플레이</div>
<script>
(()=>{'use strict';
const frame=document.getElementById('frame'),pic=document.getElementById('reference'),layer=document.getElementById('interactive-layer'),modal=document.getElementById('modal-root');
const nameEl=document.getElementById('player-display'),gpEl=document.getElementById('gp-display');
const asset=(name)=>'assets/'+name;
let nickname=localStorage.getItem('leaf_name')||'Guest', gp=Math.max(0,Number(localStorage.getItem('leaf_gp')||3000)),wins=Number(localStorage.getItem('leaf_wins')||0),scene='lobby',card=0,chars=['루시안','보리스','이솔렛','살라딘','철가면','데미안','루시퍼','조안'],chatLogs=[],room='추억의 방';
const diceFaces=['⚀','⚁','⚂','⚃','⚄','⚅'];
let turn=0,pos=0,foe=0,hp=100,enemyHp=100,ended=false,rolls=0;
const screens={lobby:['dice_ref.png',800,600],rooms:['dice_ref2.png',800,600],board:['board.jpg',800,600],town:['chat.jpg',794,528],shop:['shop_ref.png',541,402],street:['street.jpg',2153,543],sky:['sky.jpg',794,528],intro:['intro.jpg',800,600]};
const save=()=>{localStorage.setItem('leaf_name',nickname);localStorage.setItem('leaf_gp',String(gp));localStorage.setItem('leaf_wins',String(wins));nameEl.textContent=nickname;gpEl.textContent=gp.toLocaleString()+' GP'};save();
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function rectangle(node,x,y,w,h){Object.assign(node.style,{position:'absolute',left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}
function hot(x,y,w,h,label,fn){const b=el('button','hotspot');rectangle(b,x,y,w,h);b.type='button';b.setAttribute('aria-label',label);b.title=label;b.addEventListener('click',fn);layer.appendChild(b);return b}
function popup(title,content,actions){modal.replaceChildren();const box=el('div','tooltip');const h=el('div','heading');h.textContent=title;box.appendChild(h);const p=el('div');p.textContent=content;box.appendChild(p);for(const a of actions||[{title:'확인',fn:()=>modal.replaceChildren()}]){const b=el('button');b.textContent=a.title;b.onclick=()=>{modal.replaceChildren();a.fn?.()};box.appendChild(b)}modal.appendChild(box)}
function toast(text){const e=el('div','result-note');e.textContent=text;layer.appendChild(e);setTimeout(()=>e.remove(),2100)}
function route(next){if(!screens[next])return;scene=next;layer.replaceChildren();modal.replaceChildren();let [src,w,h]=screens[next];frame.style.aspectRatio=w+' / '+h;frame.style.maxWidth=Math.min(w,800)+'px';pic.src=asset(src);pic.onerror=()=>{if(scene==='sky'){pic.src=asset('street.jpg')}else if(scene==='board'){pic.src=asset('dice_ref2.png')}};document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===next));
 if(next==='lobby')renderLobby();if(next==='rooms')renderRooms();if(next==='town')renderTown();if(next==='shop')renderShop();if(next==='street')renderStreet();if(next==='sky')renderSky();if(next==='board')renderBoard();if(next==='intro')hot(0,0,100,100,'시작하기',()=>route('lobby'));
 history.replaceState(null,'','#'+next);
}
function chrome(){hot(0,0,19,10,'포리프 홈',()=>route('sky'));hot(60,0,7,11,'타운 선택',()=>route('lobby'));hot(69,0,6,10,'하이아칸 채팅',()=>route('town'));hot(80,0,5,10,'매직카덴',()=>route('shop'));hot(90,0,6,10,'주사위의 잔영',()=>route('rooms'))}
function renderLobby(){chrome();for(let i=0;i<4;i++){hot(4,13+i*14,28,13,['이스핀 채널','나야트레이 채널','클로에 채널','밀라 채널'][i],()=>{room=['이스핀','나야트레이','클로에','밀라'][i];route('rooms')});hot(67,13+i*14,28,13,['티치엘 채널','앙이스 채널','벤야 채널','라운드 채널'][i],()=>{room=['티치엘','앙이스','벤야','라운드'][i];route('rooms')})}hot(34,14,32,56,'주사위의 잔영 대기실',()=>route('rooms'));hot(88,73,10,7,'채팅 타운',()=>route('town'));addChat(1.9,82.4,50,12)}
function renderRooms(){chrome();for(let i=0;i<11;i++)hot(2,15+i*3.6,49,3.5,'게임방 '+(i+1),()=>{room=i===0?'추억의 방':'주사위 '+(i+1)+'번 방';toast(room+' 선택')});hot(5,62,31,14,'방 생성',()=>popup('CREATE ROOM','새로운 1인용 주사위의 잔영 방을 생성합니다.',[{title:'생성',fn:()=>start()},{title:'취소'}]));hot(43,62,31,14,'방 입장',()=>start());hot(56,48,41,9,'방 정보',()=>toast(room));addChat(2,82,52,11.7)}
function addChat(x,y,w,h){const form=el('form','overlay');rectangle(form,x,y,w,h);form.style.height='auto';form.style.zIndex='6';form.style.display='flex';form.style.gap='2px';const input=el('input','scene-input');input.style.cssText='position:static;width:85%;height:19px;background:#f5f7ff;color:#102357;font:12px Gulim;border:1px solid #8295c7;';input.placeholder='대화 입력';input.setAttribute('aria-label','대화 입력');const send=el('button');send.style.cssText='background:#a7c0f3;color:#152e68;border:1px solid #e1e6ff;cursor:pointer';send.textContent='▶';form.onsubmit=e=>{e.preventDefault();let msg=input.value.trim().slice(0,100);if(!msg)return;chatLogs.push('['+nickname+'] '+msg);chatLogs=chatLogs.slice(-4);input.value='';toast(nickname+': '+msg)};form.append(input,send);layer.appendChild(form)}
function renderTown(){hot(1,16.6,52,5,'채팅 입력란',()=>document.getElementById('town-talk').focus());const input=el('input','scene-input town-chat-input');input.id='town-talk';input.placeholder='여기에 메시지를 입력하세요';input.maxLength=120;layer.appendChild(input);input.onkeydown=e=>{if(e.key==='Enter'){let t=input.value.trim();if(t){chatLogs.push(t);const floating=el('div','floating-message');floating.textContent=nickname+': '+t;layer.querySelectorAll('.floating-message').forEach(e=>e.remove());layer.appendChild(floating);input.value=''}e.preventDefault()}};hot(91,1,8,8,'참여자 목록',()=>popup('참여자 목록','이 화면은 로컬 재현이므로 실제 접속자는 없습니다.'));hot(88,93,11,6,'나가기',()=>route('lobby'));hot(79,73,6,7,'동작 및 감정 표현',()=>toast('✧ 반갑습니다!'));hot(0,93,12,7,'타운 변경',()=>route('lobby'))}
const items=['살라딘','시라노','카트린느','크리스티나','철가면','이올린','보리스','루시안'],prices=[250,400,600,700,450,550,350,300];
function renderShop(){for(let c=0;c<8;c++){const x=8.5+(c%4)*9.8,y=19+Math.floor(c/4)*19;hot(x,y,9,18,'카드 '+items[c],()=>{card=c;layer.querySelector('.selected-card')?.remove();let e=el('div','selected-card');rectangle(e,x,y,9,18);layer.appendChild(e);toast(items[c]+' / '+prices[c]+' GP')})}hot(49.5,70,11.6,10,'카드 구입',()=>{if(gp<prices[card])popup('매직카덴','GP가 부족합니다.');else{gp-=prices[card];save();popup('카드 구입',items[card]+' 카드를 '+prices[card]+' GP에 구입했습니다.');layer.querySelector('.gp-plate').textContent=gp.toLocaleString()+' GP';}});hot(63,70,11.4,10,'카드 판매',()=>{gp+=Math.floor(prices[card]*.7);save();popup('카드 판매',items[card]+' 카드를 판매했습니다.');layer.querySelector('.gp-plate').textContent=gp.toLocaleString()+' GP';});hot(4,1,9,8,'아노마라드 상공',()=>route('sky'));hot(15,1,9,8,'하이아칸 채팅',()=>route('town'));hot(29,1,9,8,'주사위의 잔영',()=>route('lobby'));hot(12,14,14,4,'일반 카드',()=>toast('Normal'));hot(28,14,14,4,'Valuable 카드',()=>toast('Valuable'));hot(46,14,14,4,'Rare 카드',()=>toast('Rare'));const bar=el('div','gp-plate');bar.textContent=gp.toLocaleString()+' GP';layer.appendChild(bar)}
function renderStreet(){hot(6,10,16,70,'네냐플 마법학원',()=>route('town'));hot(39,18,18,70,'매직카덴',()=>route('shop'));hot(65,10,15,70,'주사위의 잔영',()=>route('lobby'));const strip=el('div','info-strip','켈티카의 거리　　← 마법학원　　매직카덴　　주사위의 잔영 →');layer.appendChild(strip)}
function renderSky(){hot(22,13,29,65,'북 하이아칸',()=>route('town'));hot(54,14,34,67,'켈티카의 거리',()=>route('street'));hot(33,82,30,15,'주사위의 잔영',()=>route('lobby'));const strip=el('div','info-strip','아노마라드 상공　 |　북 하이아칸　 ·　켈티카의 거리　 ·　주사위의 잔영');layer.appendChild(strip)}
function start(){turn=0;pos=0;foe=0;hp=100;enemyHp=100;ended=false;rolls=0;route('board');toast(room+' · GAME START!')}
function roll(){if(ended){start();return}let die=1+Math.floor(Math.random()*6),enemy=1+Math.floor(Math.random()*6);pos=Math.min(pos+die,45);foe=Math.min(foe+enemy,45);rolls++;let clash=Math.abs(pos-foe)<3;let event=['주사위를 굴렸습니다!','아이템 카드 획득','발판 이동','마법의 힘 발동','GP +50','체스맨 특수 능력!'][die-1];if(die===5){gp+=50;save()}if(clash){let dmg=5+Math.floor(Math.random()*13);enemyHp=Math.max(0,enemyHp-dmg);let ret=4+Math.floor(Math.random()*9);hp=Math.max(0,hp-ret);event='BATTLE　적에게 '+dmg+' 피해 / 내 HP -'+ret}if(pos>=45||enemyHp<=0||hp<=0){ended=true;let won=hp>0&&(pos>=45||enemyHp<=0);if(won){gp+=300;wins++;save()}event=won?'★ VICTORY! +300 GP':'GAME OVER · 다시 도전하세요'}turn=die;renderBoard();toast('⚄ '+die+'　'+event);if(ended){popup('주사위의 잔영',event,[{title:'다시 하기',fn:()=>start()},{title:'대기실',fn:()=>route('rooms')}])}}
function renderBoard(){hot(43,60,15,16,'ROLL! 주사위 굴리기',roll);hot(93,91,6,9,'나가기',()=>route('rooms'));hot(1,1,12,8,'메뉴',()=>popup('주사위의 잔영',room+' / '+rolls+'턴 진행중',[{title:'계속',fn:()=>{}},{title:'나가기',fn:()=>route('rooms')} ]));let die=el('div','game-die');die.textContent=diceFaces[(turn||1)-1];layer.appendChild(die);let me=el('div','marker-player'),enemy=el('div','marker-enemy');me.style.left=(21+(pos%8)*5.4)+'%';me.style.top=(34+Math.floor(pos/8)*3.7)+'%';enemy.style.left=(24+(foe%8)*5.2)+'%';enemy.style.top=(37+Math.floor(foe/8)*3.5)+'%';layer.append(me,enemy);let hud=el('div','dice-mini-hud');hud.innerHTML='<strong>주사위의 잔영 · '+room+'</strong><div>'+nickname+' HP '+hp+'　/　상대 '+enemyHp+'</div><div>현재 '+pos+'칸　목표 45칸　'+rolls+'턴</div>';const btn=el('button');btn.textContent=ended?'다시 하기':'⚄ ROLL';btn.onclick=roll;hud.appendChild(btn);layer.appendChild(hud);addChat(23.3,85.5,42,7)}
document.getElementById('nav').addEventListener('click',e=>{const btn=e.target.closest('[data-scene]');if(btn){if(btn.dataset.scene==='board')start();else route(btn.dataset.scene)}});document.getElementById('nick-change').onclick=()=>{let input;popup('4LEAF 프로필','닉네임을 입력해 주세요.',[{title:'저장',fn:()=>{if(input?.value.trim()){nickname=input.value.trim().slice(0,14);save()}}},{title:'취소'}]);const box=modal.querySelector('.tooltip');input=el('input');input.id='nick-input';input.value=nickname;box.insertBefore(input,box.querySelector('button'))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal.replaceChildren();if(scene==='board')route('rooms')}if(e.key===' '&&scene==='board'&&!e.target.closest('input,button')){e.preventDefault();roll()}});route((location.hash||'').slice(1) in screens?location.hash.slice(1):'lobby');
window.__4LEAF_CLASSIC__={route,roll,start,getState:()=>({scene,nickname,gp,wins,turn,pos,foe,hp,enemyHp,ended})};
})();
</script></body></html>
