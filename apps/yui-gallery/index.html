<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>YUI · PHOTO GALLERY</title><link rel="stylesheet" href="gallery.css"></head>
<body>
<header class="top"><a class="logo" href="./" aria-label="YUI Gallery 홈">YUI<span> / gallery</span></a><nav aria-label="갤러리 탐색"><button class="nav active" data-view="photos">사진</button><button class="nav" data-view="albums">화보</button><button class="nav" data-view="sns">SNS</button></nav><label class="library-link" for="files" title="내 ZIP 화보 불러오기" role="button" tabindex="0">내 화보 ＋</label><input id="files" type="file" accept=".zip,application/zip" multiple hidden></header>
<main>
 <section class="heading"><div class="heading-line"><h1 id="heading">사진</h1><span id="count" class="count"></span></div></section>
 <section class="tools" aria-label="사진 필터"><input id="search" type="search" placeholder="화보 검색" aria-label="화보 검색"><select id="order" aria-label="사진 순서"><option value="default">기본순</option><option value="reverse">역순</option></select></section>
 <section id="photoGrid" class="masonry" aria-label="사진 목록"></section>
 <section id="albumGrid" class="album-grid" hidden></section>
 <section id="empty" class="empty" hidden>표시할 사진이 없습니다.</section>
</main>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="사진 확대 보기" hidden><div class="viewer-top"><span id="viewerTitle"></span><button id="close" aria-label="닫기" title="닫기">✕</button></div><button id="prev" class="turn previous" aria-label="이전 이미지">‹</button><img id="large" alt="선택한 사진" /><button id="next" class="turn following" aria-label="다음 이미지">›</button><div class="viewer-bottom"><span id="position"></span><button id="save" title="사진 저장">저장 ↓</button></div></div>
<div id="notice" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script><script src="gallery.js" defer></script><script src="gallery-import.js" defer></script></body></html>
