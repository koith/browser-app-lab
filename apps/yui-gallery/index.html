<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="color-scheme" content="dark">
<title>YUI — Gallery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;color:#f5f5f6;background:#101114;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.shell{max-width:1480px;margin:0 auto;padding:0 clamp(14px,3.2vw,48px)}
.topbar{position:relative;height:76px;display:flex;align-items:center;gap:34px;border-bottom:1px solid #2a2b2e}
.version-chip{position:absolute;top:5px;right:1px;font-size:10px;font-weight:450;letter-spacing:.02em;color:#878891;white-space:nowrap;pointer-events:none}
.inventory{margin:10px 0 0;color:#999aa0;font-size:12px}
.logo{font-size:23px;font-weight:850;letter-spacing:.22em;white-space:nowrap}.logo span{font-size:10px;font-weight:500;letter-spacing:.15em;color:#8a8b8e;margin-left:9px}
.mainnav{display:flex;align-items:center;gap:25px;margin-left:auto}
.mainnav a{font-size:13px;color:#babac0;transition:color .2s}.mainnav a:hover{color:#fff}
.topsearch{background:#1b1d22;border:1px solid #393a40;border-radius:8px;min-width:170px;max-width:240px;width:20vw;padding:11px 14px;color:#fff;font-size:13px;outline:none}
.topsearch:focus{border-color:#bbb4a8}.topsearch::placeholder{color:#888992}
.titleline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:36px 0 22px}
.eyebrow{color:#c7bdac;font-size:11px;font-weight:700;letter-spacing:.22em}
h1{margin:8px 0 0;font-weight:750;font-size:clamp(34px,5vw,56px);letter-spacing:-.055em;line-height:1.05}
.counter{font-size:12px;color:#98999f;white-space:nowrap}
.filters{display:flex;align-items:center;gap:25px;border-bottom:1px solid #303136;margin-bottom:22px;overflow:auto}
.filter{background:none;border:0;border-bottom:2px solid transparent;color:#999aa0;padding:12px 1px 13px;white-space:nowrap;font-size:13px}
.filter.active{color:#fff;border-bottom-color:#f4f2ec;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:55px}
.album{position:relative;background:#1b1d21;overflow:hidden;aspect-ratio:3/4;cursor:pointer;display:block;border:0;width:100%;padding:0;text-align:left}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .32s ease;opacity:.92}
.album:hover img{transform:scale(1.045)}
.album .gradient{position:absolute;inset:43% 0 0;background:linear-gradient(transparent,#000e)}
.album .name{position:absolute;bottom:35px;left:17px;right:14px;color:#fff;font-size:clamp(14px,1.45vw,19px);font-weight:720;line-height:1.35;text-shadow:0 2px 13px #000b}
.album .number{position:absolute;bottom:15px;left:17px;font-size:12px;color:#d5d4d2;text-shadow:0 1px 6px #000b}
.album .placeholder{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:linear-gradient(145deg,#33333a,#1a1c21);color:#6d6e72;font-size:54px;font-weight:800}
.photo-grid{columns:5 195px;column-gap:11px;margin-bottom:58px}
.photo{break-inside:avoid;margin:0 0 11px;display:block;position:relative;cursor:pointer;background:#24262b;border:0;padding:0;width:100%;overflow:hidden}
.photo img{display:block;width:100%;height:auto;min-height:100px;object-fit:cover;transition:transform .25s}
.photo:hover img{transform:scale(1.035)}
.photo span{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 9px;background:linear-gradient(transparent,#000c);font-size:11px;color:#f5f5f5;opacity:0;transition:opacity .2s;text-align:left}
.photo:hover span{opacity:1}
.subnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.back{background:none;border:0;color:#c9c9cb;padding:0;font-size:13px}
.detail-title{font-size:clamp(24px,4vw,38px);font-weight:750;letter-spacing:-.035em;margin:0 0 5px}
.detail-count{font-size:12px;color:#92939a;margin:0 0 22px}
.empty{padding:90px 18px;text-align:center;color:#98999f}
footer{border-top:1px solid #292b30;padding:27px 0 55px;color:#84858b;font-size:11px;display:flex;justify-content:space-between;gap:18px}
#lightbox{position:fixed;inset:0;z-index:20;background:#07080af8;display:none;align-items:center;justify-content:center;flex-direction:column;touch-action:pan-y}
#lightbox.open{display:flex}
#full{max-width:min(95vw,1800px);max-height:calc(100dvh - 125px);object-fit:contain}
.lighttop{position:absolute;top:0;left:0;right:0;height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;color:#c3c4c9;font-size:12px}
.lightbtn{border:0;background:#262830b5;color:#f4f4f7;width:41px;height:41px;border-radius:50%;font-size:21px;display:grid;place-items:center}
.lightbottom{position:absolute;bottom:15px;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:center}
.lightbottom a,.lightbottom button{border:0;color:inherit;cursor:pointer;padding:10px 16px;background:#2a2b30;border-radius:8px;font-size:12px}
#lightbox.zoomed{overflow:auto;display:block;padding:70px 0 90px;text-align:center}#lightbox.zoomed #full{max-width:none;max-height:none}#lightbox.zoomed .lighttop,#lightbox.zoomed .lightbottom{position:fixed}#media-status{position:absolute;bottom:67px;font-size:12px;color:#ccc}#lightbox.zoomed #media-status{display:none}
.arrow{position:absolute;top:48%;z-index:2}.arrow.prev{left:17px}.arrow.next{right:17px}
button:focus-visible,a:focus-visible{outline:2px solid #ddd4c7;outline-offset:3px}
[hidden]{display:none!important}
@media(max-width:990px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.mainnav{gap:15px}.topbar{gap:14px}}
@media(max-width:680px){.topbar{height:67px;flex-wrap:wrap}.logo{font-size:21px}.logo span{font-size:9px}.mainnav{gap:15px}.mainnav a{font-size:12px}.topsearch{min-width:0;width:100%;max-width:none;order:5;height:39px;margin-top:-1px}.topbar:has(.topsearch){height:111px;align-content:center;padding-bottom:9px}.titleline{padding:25px 0 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.album .name{font-size:14px;left:11px;bottom:30px}.album .number{left:11px;bottom:12px;font-size:11px}.photo-grid{columns:2 130px;column-gap:8px}.photo{margin-bottom:8px}.filters{gap:22px;margin-bottom:13px}.counter{font-size:11px}#full{max-height:calc(100dvh - 115px)}.arrow{width:35px;height:35px}.arrow.prev{left:6px}.arrow.next{right:6px}}
@media(prefers-reduced-motion:reduce){.album img,.photo img{transition:none}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <a href="./" class="logo" aria-label="YUI 갤러리 홈">YUI<span>GALLERY</span></a>
 <nav class="mainnav" aria-label="이동"><a href="cloud.html">클라우드</a></nav>
 <input id="search" class="topsearch" type="search" placeholder="화보 검색" aria-label="화보 검색">
 <small id="app-version" class="version-chip">v0.1.0-beta.4</small>
</header>
<div id="browse">
 <div class="titleline"><div><div class="eyebrow">COLLECTION</div><h1>Yui Gallery</h1><p class="inventory" id="inventory">수집 화보를 불러오는 중</p></div><span class="counter" id="total"></span></div>
 <div class="filters"><button class="filter active" data-filter="albums">화보</button><button class="filter" data-filter="photos">사진</button><button class="filter" data-filter="all">전체 작품 목록</button></div>
 <div id="albumgrid" class="grid"></div>
 <div id="photogrid" class="photo-grid" hidden></div>
 <div id="nothing" class="empty" hidden>표시할 사진이 없습니다.</div>
</div>
<div id="detail" hidden>
 <div class="titleline"><div><button class="back" id="back">← 화보 목록</button><h2 class="detail-title" id="albumname"></h2></div><span class="counter" id="albumtotal"></span></div>
 <div id="detailphotos" class="photo-grid"></div>
</div>
<footer><span>YUI GALLERY</span><span>개별 이미지 · 수집 파일 화질 유지</span></footer>
</div>
<div id="lightbox" role="dialog" aria-label="사진 보기" aria-modal="true">
 <div class="lighttop"><span id="position"></span><button class="lightbtn" id="close" aria-label="닫기">×</button></div>
 <button class="lightbtn arrow prev" id="prev" aria-label="이전 사진">‹</button><img id="full" alt="화보 사진"><button class="lightbtn arrow next" id="next" aria-label="다음 사진">›</button>
 <p id="media-status" role="status"></p><div class="lightbottom"><button id="zoom" aria-pressed="false">확대</button><a id="original" target="_blank" rel="noopener">사진 열기 ↗</a><button id="download">개별 다운로드</button></div>
</div>
<script src="owner-media.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
let catalog=[],stored=[],localStored=[],remoteStored=[],ownerStored=[],mode='albums',activeAlbum=null,viewerList=[],viewerIndex=0,detailAlbum=null;
const titleMap={'cn-huantuji':'幻图集 · Yui','cn-chaotuji':'潮图集 · Yui','cn-miaohuaying':'喵画影 · Yui','cn-yuntu8':'云图吧 · Yui','cn-wantuzhi-everyday':'Everyday Life','cn-yingyuge':'影语阁 · Yui','v04':'SWEETBOX · Teddy Bear'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getName(a){return a.title||catalog.find(x=>x.id===a.id)?.title||titleMap[a.id]||a.id}
function validImages(a){return (a.images||[]).filter(x=>{if(a.ownerHosted&&x.ownerAlbum===a.id&&x.url==='owner:'+a.id+':'+x.number)return true;if(typeof x.url!=='string')return false;if(x.url.startsWith('stored-albums/'))return true;if(!a.sourceHosted)return false;try{const u=new URL(x.url);return u.protocol==='https:'&&(u.hostname==='cdn.jliji.com'||/^(?:(?:imgx\d{3}|images\d{2})\.pixibb\.com|(?:wes|bis)\.misskon\.com|lux\.mrcong\.com|s\.wujituku\.com|lh\d\.ggpht\.com)$/.test(u.hostname));}catch{return false}})}
function available(){return stored.filter(x=>validImages(x).length).sort((a,b)=>validImages(b).length-validImages(a).length)}
function setMode(m){mode=m;activeAlbum=null;$('detail').hidden=true;$('browse').hidden=false;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===m));render()}
function photosFor(a){return validImages(a).map((p,i)=>({...p,name:getName(a),albumId:a.id,number:p.number??i+1}))}
function card(a,hasImages){
 const owned=stored.find(x=>x.id===a.id)||a;
 const p=validImages(owned),cover=p[0]?.url||'',count=p.length,expected=a.photos??a.expected??catalog.find(x=>x.id===a.id)?.photos??null;
 const label=getName(a);
 const n=count?(count+'장'+(owned.ownerHosted?' · 개인 보관본':owned.sourceHosted?' · 출처 열람':'')+(expected!=null&&expected!==count?' / '+expected+'장':'')):(expected!=null?expected+'장 · 미수집':'미수집');
 const cloudCover=owned.ownerHosted?p[0]:null;
 const img=cloudCover?'<img data-owner="'+esc(cloudCover.url)+'" alt="'+esc(label)+' 표지">':cover?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(cover)+'" alt="'+esc(label)+' 표지">':'<div class="placeholder">Y</div>';
 return '<button class="album" data-id="'+esc(a.id)+'" data-available="'+(hasImages?'1':'0')+'" aria-label="'+esc(label)+'">'+img+'<div class="gradient"></div><strong class="name">'+esc(label)+'</strong><span class="number">'+esc(n)+'</span></button>';
}
function photoHTML(p,i){return '<button class="photo" data-i="'+i+'" aria-label="'+esc(p.name)+' 사진 '+p.number+'"><img loading="lazy" referrerpolicy="no-referrer" '+(p.ownerAlbum?'data-owner="'+esc(p.url):'src="'+esc(p.url))+'" alt="'+esc(p.name)+' 사진 '+p.number+'"><span>'+esc(p.name)+' · '+p.number+'</span></button>'}
const ownerObserver=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)continue;ownerObserver.unobserve(e.target);const p=ownerStored.flatMap(a=>a.images).find(p=>p.url===e.target.dataset.owner);if(p)YuiPrivate.asset(p).then(url=>{if(e.target.isConnected)e.target.src=url}).catch(()=>{e.target.alt='보관본 연결을 확인해 주세요'})}},{rootMargin:'200px'});
function observeOwner(){document.querySelectorAll('img[data-owner]:not([src])').forEach(i=>ownerObserver.observe(i))}
function render(){
 const q=$('search').value.toLocaleLowerCase().trim();
 const items=available(),all=items.flatMap(photosFor),match=s=>String(s).toLocaleLowerCase().includes(q);
 $('albumgrid').hidden=mode==='photos';$('photogrid').hidden=mode!=='photos';$('nothing').hidden=true;
 if(mode==='photos'){
  const visible=all.filter(p=>match(p.name));$('photogrid').innerHTML=visible.map(photoHTML).join('');
  $('photogrid').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openViewer(visible,Number(b.dataset.i)));
  $('total').textContent=visible.length+' photos';
  $('nothing').hidden=visible.length>0;
 }else{
  const src=mode==='all'?catalog:items;
  const matched=src.filter(a=>match(getName(a)));
  $('albumgrid').innerHTML=matched.map(a=>card(a,mode!=='all')).join('');
  $('albumgrid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openAlbum(b.dataset.id));
  $('total').textContent=matched.length+' albums';
  $('nothing').hidden=matched.length>0;
 }
 observeOwner();
}
function openAlbum(id){
 const a=stored.find(x=>x.id===id);
 if(!a||!validImages(a).length)return;
 const photos=photosFor(a);detailAlbum=a;$('browse').hidden=true;$('detail').hidden=false;
 $('albumname').textContent=getName(a);$('albumtotal').textContent=photos.length+' photos';
 $('detailphotos').innerHTML=photos.map(photoHTML).join('');
 $('detailphotos').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openViewer(photos,Number(b.dataset.i)));
 observeOwner();history.replaceState(null,'','#'+encodeURIComponent(id));
 window.scrollTo(0,0);
}
function openViewer(list,i){if(!list.length)return;viewerList=list;viewerIndex=((i%list.length)+list.length)%list.length;$('lightbox').classList.add('open');document.body.style.overflow='hidden';showViewer()}
let viewerGeneration=0;
function showViewer(){
 const p=viewerList[viewerIndex];if(!p)return;
 viewerGeneration++;$('lightbox').classList.remove('zoomed');$('zoom').setAttribute('aria-pressed','false');$('zoom').textContent='확대';
 $('media-status').textContent='불러오는 중';$('download').disabled=false;
 $('full').onload=()=>{$('media-status').textContent=''};$('full').onerror=()=>{$('media-status').textContent='사진을 불러오지 못했습니다. 사진 열기로 출처를 확인해 주세요.'};
 $('full').removeAttribute('src');$('full').referrerPolicy='no-referrer';if(p.ownerAlbum){const generation=viewerGeneration;YuiPrivate.asset(p).then(url=>{if(generation===viewerGeneration){$('full').src=url;$('original').href=url}}).catch(error=>{if(generation===viewerGeneration)$('media-status').textContent=error.message})}else $('full').src=p.url;$('full').alt=p.name+' · '+p.number;
 $('position').textContent=(viewerIndex+1)+' / '+viewerList.length+' · '+p.width+'×'+p.height+' · 공개 웹판';
 if(p.ownerAlbum)$('original').removeAttribute('href');else $('original').href=p.url;
}
function closeViewer(){viewerGeneration++;$('lightbox').classList.remove('open','zoomed');document.body.style.overflow=''}
function step(n){viewerIndex=(viewerIndex+n+viewerList.length)%viewerList.length;showViewer()}
$('zoom').onclick=()=>{const zoomed=$('lightbox').classList.toggle('zoomed');$('zoom').setAttribute('aria-pressed',String(zoomed));$('zoom').textContent=zoomed?'맞춤':'확대'};
$('download').onclick=async()=>{
 const p=viewerList[viewerIndex],generation=viewerGeneration;if(!p)return;
 $('download').disabled=true;$('media-status').textContent='파일 확인 중';
 try{
  const response=await fetch(p.ownerAlbum?await YuiPrivate.asset(p):p.url,{referrerPolicy:'no-referrer'});if(!response.ok)throw Error('HTTP '+response.status);
  const blob=await response.blob();
  if(p.bytes&&blob.size!==p.bytes)throw Error('파일 크기 불일치');
  if(p.sha256){const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==p.sha256)throw Error('SHA-256 불일치')}
  const ext=p.extension||new URL(p.url,location.href).pathname.split('.').pop();
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=p.albumId+'-'+String(p.number).padStart(4,'0')+'.'+(/^(jpe?g|png|webp|avif)$/.test(ext)?ext:'jpg');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  if(generation===viewerGeneration)$('media-status').textContent='파일 다운로드 요청 완료';
 }catch(error){if(generation===viewerGeneration)$('media-status').textContent='다운로드 실패 · '+error.message+' · 사진 열기에서 저장할 수 있습니다.'}
 finally{if(generation===viewerGeneration)$('download').disabled=false}
};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=closeViewer;
$('back').onclick=()=>{history.replaceState(null,'',location.pathname);$('browse').hidden=false;$('detail').hidden=true;detailAlbum=null;window.scrollTo(0,0)};
$('search').oninput=()=>{if(!$('detail').hidden){$('back').click()}render()};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setMode(b.dataset.filter));
$('lightbox').onclick=e=>{if(e.target===$('lightbox'))closeViewer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!(!$('lightbox').classList.contains('open')))closeViewer();else if($('lightbox').classList.contains('open')&&e.key==='ArrowLeft')step(-1);else if($('lightbox').classList.contains('open')&&e.key==='ArrowRight')step(1)});
let startX=0;$('lightbox').addEventListener('touchstart',e=>{startX=e.changedTouches[0]?.screenX||0},{passive:true});$('lightbox').addEventListener('touchend',e=>{const d=(e.changedTouches[0]?.screenX||0)-startX;if(e.changedTouches.length===1&&!$('lightbox').classList.contains('zoomed')&&Math.abs(d)>55)step(d>0?-1:1)},{passive:true});
Promise.all([
 fetch('stored-albums.json').then(r=>{if(!r.ok)throw Error('stored data');return r.json()}),
 fetch('albums.json').then(r=>{if(!r.ok)throw Error('catalog');return r.json()}),
 YuiPrivate.albums().then(albums=>({albums})).catch(error=>({albums:[],error:error.message})),
 fetch('additional-source-albums.json',{cache:'no-store'}).then(r=>r.ok?r.json():{albums:[]}).catch(()=>({albums:[]})),
 fetch('source-viewer-albums.json',{cache:'no-store'}).then(r=>r.ok?r.json():{albums:[]}).catch(()=>({albums:[]}))
]).then(([s,c,owner,extra,remote])=>{
 localStored=s.albums||[];catalog=c.albums||[];
 remoteStored=[...new Map([...(remote.albums||[]),...(extra.albums||[])].map(a=>[a.id,a])).values()].filter(a=>a.status==='verified_collected_individual_files_source_hosted_online_view').map(a=>({...a,sourceHosted:true}));
 ownerStored=owner.albums;const ownerIds=new Set(ownerStored.map(a=>a.id));
 stored=[...ownerStored,...remoteStored.filter(a=>!ownerIds.has(a.id)),...localStored];
 const localCount=localStored.reduce((n,a)=>n+validImages(a).length,0);
 const remoteCount=remoteStored.reduce((n,a)=>n+validImages(a).length,0);
 $('inventory').textContent=localCount+'장 저장 · '+remoteCount+'장 출처 열람'+(ownerStored.length?' · '+ownerStored.reduce((n,a)=>n+a.images.length,0)+'장 개인 보관본':owner.error?' · 보관소 연결 실패: '+owner.error:remoteCount?' · 대용량 개인 클라우드 연결 전':'');
 render();
 const id=decodeURIComponent(location.hash.slice(1));if(id)openAlbum(id);
}).catch(()=>{$('total').textContent='—';$('nothing').textContent='이미지를 불러올 수 없습니다.';$('nothing').hidden=false});
</script>
</body></html>
