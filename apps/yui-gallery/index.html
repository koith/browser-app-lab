<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="color-scheme" content="dark">
<title>YUI — Gallery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;color:#f5f5f6;background:#101114;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.shell{max-width:1480px;margin:0 auto;padding:0 clamp(14px,3.2vw,48px)}
.topbar{position:relative;height:76px;display:flex;align-items:center;gap:34px;border-bottom:1px solid #2a2b2e}
.version-chip{position:absolute;top:5px;right:1px;font-size:10px;font-weight:450;letter-spacing:.02em;color:#878891;white-space:nowrap;pointer-events:none}
.inventory{margin:10px 0 0;color:#999aa0;font-size:12px}
.logo{font-size:23px;font-weight:850;letter-spacing:.22em;white-space:nowrap}.logo span{font-size:10px;font-weight:500;letter-spacing:.15em;color:#8a8b8e;margin-left:9px}
.mainnav{display:flex;align-items:center;gap:25px;margin-left:auto}
.mainnav a{font-size:13px;color:#babac0;transition:color .2s}.mainnav a:hover{color:#fff}
.search-toggle{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;padding:9px;border:0;border-radius:50%;background:#ffffff0d;color:#ffffff80}
.search-toggle:hover,.search-toggle:focus-visible{color:#fff;background:#ffffff20}
.search-toggle svg{width:19px;height:19px}
#search-dialog{position:fixed;inset:0;width:min(420px,calc(100% - 28px));margin:auto;padding:20px;border:1px solid #ffffff25;border-radius:12px;background:#191b20;color:#f5f5f6;box-shadow:0 12px 48px #0008}
#search-dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
.search-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:14px}
#search-close{border:0;background:none;color:#ccc;width:36px;height:36px;font-size:25px}
.topsearch{background:#101114;border:1px solid #393a40;border-radius:8px;width:100%;padding:12px;color:#fff;font-size:16px;outline:none}
#search-form button[type=submit]{display:block;margin:14px 0 0 auto;padding:9px 18px;border:1px solid #ffffff25;border-radius:7px;background:#303239;color:#fff;font-size:13px}
.topsearch:focus{border-color:#bbb4a8}.topsearch::placeholder{color:#888992}
.titleline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:36px 0 22px}
.eyebrow{color:#c7bdac;font-size:11px;font-weight:700;letter-spacing:.22em}
h1{margin:8px 0 0;font-weight:750;font-size:clamp(34px,5vw,56px);letter-spacing:-.055em;line-height:1.05}
.counter{font-size:12px;color:#98999f;white-space:nowrap}
.filters{display:flex;align-items:center;gap:25px;border-bottom:1px solid #303136;margin-bottom:22px;overflow:auto}
.filter{background:none;border:0;border-bottom:2px solid transparent;color:#999aa0;padding:12px 1px 13px;white-space:nowrap;font-size:13px}
.filter.active{color:#fff;border-bottom-color:#f4f2ec;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:55px}
.album{position:relative;background:#1b1d21;overflow:hidden;aspect-ratio:3/2;cursor:pointer;display:block;border:0;width:100%;padding:0;text-align:left}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .32s ease;opacity:.92}
.album:hover img{transform:scale(1.045)}
.album .gradient{position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#0008)}
.album .name{position:absolute;bottom:9px;left:9px;right:9px;color:#ffffff73;font-size:clamp(11px,1vw,13px);font-weight:500;line-height:1.25;text-shadow:0 1px 6px #0008;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cover-labels{position:absolute;top:8px;left:8px;max-width:calc(100% - 80px);pointer-events:none}
.publisher-sticker,.edition-sticker{font-size:9px;font-weight:550;line-height:1.35;padding:3px 5px;border:1px solid #ffffff20;border-radius:4px;background:#17191e85;color:#ffffffe0;backdrop-filter:blur(3px)}
.publisher-sticker{display:inline-block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;vertical-align:top}
.album-count{display:block;margin-top:3px;font-size:9px;line-height:1.3;color:#ffffff88;text-shadow:0 1px 5px #000b;white-space:nowrap}
.edition-sticker{position:absolute;top:8px;right:8px;pointer-events:none;color:#ffffffb3}
.edition-sticker[data-kind="ai"]{color:#e3d1f2;background:#29223799}
.album .placeholder{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:linear-gradient(145deg,#33333a,#1a1c21);color:#6d6e72;font-size:54px;font-weight:800}
.photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;align-items:start;margin-bottom:30px}
.photo{margin:0;display:block;position:relative;cursor:pointer;background:#24262b;border:0;padding:0;width:100%;overflow:hidden}
.photo img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;transition:transform .25s}
.photo:hover img{transform:scale(1.035)}
.photo span{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 9px;background:linear-gradient(transparent,#000c);font-size:11px;color:#f5f5f5;opacity:0;transition:opacity .2s;text-align:left}
.photo:hover span{opacity:1}
.subnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.back{background:none;border:0;color:#c9c9cb;padding:0;font-size:13px}
.detail-title{font-size:clamp(24px,4vw,38px);font-weight:750;letter-spacing:-.035em;margin:0 0 5px}
.detail-count{font-size:12px;color:#92939a;margin:0 0 22px}
.empty{padding:90px 18px;text-align:center;color:#98999f}
footer{border-top:1px solid #292b30;padding:27px 0 55px;color:#84858b;font-size:11px;display:flex;justify-content:space-between;gap:18px}
#lightbox{position:fixed;inset:0;z-index:20;background:#07080af8;display:none;align-items:center;justify-content:center;padding:65px 0 6px;touch-action:auto}
#lightbox.open{display:flex}
.media-frame{position:relative;display:flex;max-width:100%;line-height:0}
#full{display:block;max-width:min(100vw,1800px);max-height:calc(100dvh - 71px);width:auto;height:auto;object-fit:contain;touch-action:auto;-webkit-touch-callout:default;user-select:auto}
.lighttop{position:fixed;top:0;left:0;right:0;min-height:60px;padding:calc(env(safe-area-inset-top) + 9px) clamp(14px,3.2vw,48px) 9px;display:flex;align-items:center;gap:12px;color:#a3a4aa;font-size:11px;z-index:3}
.lightbtn{border:0;background:#262830b5;color:#f4f4f7;width:41px;height:41px;flex-shrink:0;border-radius:50%;font-size:21px;display:grid;place-items:center}
#original{position:absolute;right:10px;bottom:10px;border:1px solid #ffffff25;background:#17191e55;color:#fff;border-radius:7px;padding:10px 12px;font-size:12px;line-height:1;backdrop-filter:blur(2px);opacity:.55;transition:opacity .15s}
#original:focus-visible{opacity:1;outline:2px solid #fff;outline-offset:2px}
@media(hover:hover){#original:hover{opacity:.9}}
#original:not([href]){display:none}
#media-status{position:absolute;bottom:65px;left:15px;right:15px;text-align:center;font-size:12px;color:#ccc;pointer-events:none}
.arrow{position:absolute;top:48%;z-index:2}.arrow.prev{left:17px}.arrow.next{right:17px}
button:focus-visible,a:focus-visible{outline:2px solid #ddd4c7;outline-offset:3px}
[hidden]{display:none!important}
@media(max-width:990px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.mainnav{gap:15px}.topbar{gap:14px}}
@media(max-width:680px){.topbar{height:67px;flex-wrap:wrap}.logo{font-size:21px}.logo span{font-size:9px}.mainnav{gap:15px}.mainnav a{font-size:12px}.titleline{padding:25px 0 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.album .name{font-size:12px;left:9px;right:9px;bottom:9px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.filters{gap:22px;margin-bottom:13px}.counter{font-size:11px}.arrow{width:35px;height:35px}.arrow.prev{left:6px}.arrow.next{right:6px}}
@media(prefers-reduced-motion:reduce){.album img,.photo img{transition:none}}
/* Keep controls in the same place while giving photographs the available space. */
.topbar{position:sticky;top:0;z-index:10;background:#101114;padding-top:env(safe-area-inset-top);height:calc(76px + env(safe-area-inset-top))}
.browse-meta{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:10px 0 0;font-size:11px;color:#92939a}
.inventory{margin:0;font-size:11px;min-width:0}
.filters{margin-top:3px}
#back{width:41px;height:41px;flex-shrink:0;background:#262830b5;border-radius:50%;font-size:21px;color:#f4f4f7}
.detail-heading{min-width:0;display:none;align-items:center;gap:10px;flex:1}
.detail-title{font-size:13px;font-weight:550;line-height:1.4;letter-spacing:0;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#albumtotal{font-size:10px;flex-shrink:0}
#detail{padding-top:10px}
.detail-view .topbar{height:calc(60px + env(safe-area-inset-top));gap:12px;padding-bottom:0;flex-wrap:nowrap}
.detail-view .logo,.detail-view .mainnav,.detail-view .search-toggle{display:none}
.detail-view .detail-heading{display:flex}
.detail-view .version-chip{font-size:9px;top:calc(env(safe-area-inset-top) + 2px)}
footer{padding:15px 0 25px;justify-content:flex-end}
@media(max-width:680px){.topbar{height:calc(67px + env(safe-area-inset-top))}.browse-meta{gap:8px}.inventory{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.counter{font-size:10px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <a href="./" class="logo" aria-label="YUI 갤러리 홈">YUI<span>GALLERY</span></a>
 <div class="detail-heading"><button class="back" id="back" aria-label="화보 목록으로 돌아가기">‹</button><h2 class="detail-title" id="albumname"></h2><span class="counter" id="albumtotal"></span></div>
 <nav class="mainnav" aria-label="이동"><a href="cloud.html">클라우드</a></nav>
 <button id="search-toggle" class="search-toggle" aria-label="화보 검색 열기" aria-haspopup="dialog" aria-controls="search-dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
 <small id="app-version" class="version-chip">v0.1.0-beta.12</small>
</header>
<div id="browse">
 <div class="browse-meta"><p class="inventory" id="inventory">화보를 불러오는 중</p><span class="counter" id="total"></span></div>
 <div class="filters"><button class="filter active" data-filter="albums">화보</button><button class="filter" data-filter="photos">사진</button><button class="filter" data-filter="all">전체 작품 목록</button></div>
 <div id="albumgrid" class="grid"></div>
 <div id="photogrid" class="photo-grid" hidden></div>
 <div id="nothing" class="empty" hidden>표시할 사진이 없습니다.</div>
</div>
<div id="detail" hidden>
 <div id="detailphotos" class="photo-grid"></div>
</div>
<footer><span>개별 이미지 · 수집 파일 화질 유지</span></footer>
</div>
<dialog id="search-dialog" aria-labelledby="search-label">
 <form id="search-form">
  <div class="search-heading"><label id="search-label" for="search">화보 검색</label><button id="search-close" type="button" aria-label="검색 닫기">×</button></div>
  <input id="search" class="topsearch" type="search" placeholder="화보명" autocomplete="off" autofocus>
  <button type="submit">적용</button>
 </form>
</dialog>
<div id="lightbox" role="dialog" aria-label="사진 보기" aria-modal="true">
 <div class="lighttop"><button class="lightbtn" id="close" aria-label="닫기">×</button><span id="position"></span><small class="version-chip">v0.1.0-beta.12</small></div>
 <button class="lightbtn arrow prev" id="prev" aria-label="이전 사진">‹</button><div class="media-frame"><img id="full" alt="화보 사진"><a id="original" target="_blank" rel="noopener">사진 열기 ↗</a></div><button class="lightbtn arrow next" id="next" aria-label="다음 사진">›</button>
 <p id="media-status" role="status"></p>
</div>
<script src="owner-media.js"></script>
<script src="gallery-labels.js?v=0.1.0-beta.10"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
let catalog=[],stored=[],localStored=[],remoteStored=[],ownerStored=[],albumAliases={},albumCovers={},mode='albums',activeAlbum=null,viewerList=[],viewerIndex=0,detailAlbum=null;
function canonicalId(id){const seen=new Set();while(albumAliases[id]&&!seen.has(id)){seen.add(id);id=albumAliases[id]}return id}
const titleMap={'cn-huantuji':'幻图集 · Yui','cn-chaotuji':'潮图集 · Yui','cn-miaohuaying':'喵画影 · Yui','cn-yuntu8':'云图吧 · Yui','cn-wantuzhi-everyday':'Everyday Life','cn-yingyuge':'影语阁 · Yui','v04':'SWEETBOX · Teddy Bear'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getName(a){return a.title||catalog.find(x=>x.id===a.id)?.title||titleMap[a.id]||a.id}
const publicPhotoHosts=['pbs.twimg.com','djawaphoto.com','blog.hacosta.co.jp','img1.gamersky.com','upload3.inven.co.kr','pub-376e2756f81341f087a414464f9a25ec.r2.dev'];
function validImages(a){return (a.images||[]).filter(x=>{if(a.ownerHosted&&x.ownerAlbum===a.id&&x.url==='owner:'+a.id+':'+x.number)return true;if(typeof x.url!=='string')return false;if(x.url.startsWith('stored-albums/'))return true;if(!a.sourceHosted)return false;try{const u=new URL(x.url);return u.protocol==='https:'&&!u.username&&!u.password&&([...publicPhotoHosts,'www.girl-atlas.com','cdn.jliji.com','cdn.v2ph.com','i0.wp.com','i1.wp.com','i2.wp.com','cdn1.thismore.fun','cdn2.thismore.fun'].includes(u.hostname)||/^(?:(?:imgx\d{3}|images\d{2})\.pixibb\.com|(?:wes|bis)\.misskon\.com|lux\.mrcong\.com|s\.wujituku\.com|lh\d\.ggpht\.com)$/.test(u.hostname));}catch{return false}})}
function available(){return stored.filter(x=>validImages(x).length).sort((a,b)=>validImages(b).length-validImages(a).length)}
function setMode(m){mode=m;activeAlbum=null;detailAlbum=null;document.body.classList.remove('detail-view');$('detail').hidden=true;$('browse').hidden=false;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===m));render()}
function photosFor(a){return validImages(a).map((p,i)=>({...p,name:getName(a),albumId:a.id,number:p.number??i+1}))}
function card(a,hasImages){
 const owned=stored.find(x=>x.id===a.id)||a;
 const p=validImages(owned),configuration=albumCovers[owned.id],selected=p.find(p=>p.sha256&&p.sha256===configuration?.sha256)||p[0],cover=selected?.url||'',count=p.length,expected=a.photos??a.expected??catalog.find(x=>x.id===a.id)?.photos??null;
 const label=getName(a),labels=YuiLabels.describe(owned),shortTitle=YuiLabels.coverTitle({...owned,title:label});
 const focused=selected?.sha256&&selected.sha256===configuration?.sha256;
 const position=focused&&Array.isArray(configuration.position)&&configuration.position.length===2&&configuration.position.every(n=>Number.isFinite(n)&&n>=0&&n<=100)?configuration.position:[50,20];
 const fit=focused&&configuration.fit==='contain'?'contain':'cover',style='object-position:'+position[0]+'% '+position[1]+'%;object-fit:'+fit;
 const n=count?(expected!=null&&expected!==count?count+' / '+expected+'장':count+'장'):(expected!=null?expected+'장 · 미확보':'장수 미확인');
 const cloudCover=owned.ownerHosted?selected:null;
 const img=cloudCover?'<img data-owner="'+esc(cloudCover.url)+'" style="'+style+'" alt="'+esc(label)+' 표지">':cover?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(cover)+'" style="'+style+'" alt="'+esc(label)+' 표지">':'<div class="placeholder">Y</div>';
 return '<button class="album" data-id="'+esc(a.id)+'" data-available="'+(hasImages?'1':'0')+'" aria-label="'+esc(label+' · '+labels.publisher+' · '+n+' · '+labels.edition)+'">'+img+'<div class="gradient"></div><span class="cover-labels"><span class="publisher-sticker" title="발행사: '+esc(labels.publisher)+'">'+esc(labels.publisher)+'</span><span class="album-count">'+esc(n)+'</span></span><span class="edition-sticker" data-kind="'+esc(labels.kind)+'" title="'+esc(labels.detail)+'">'+esc(labels.edition)+'</span><strong class="name" title="'+esc(label)+'">'+esc(shortTitle)+'</strong></button>';
}
function photoHTML(p,i){return '<button class="photo" data-i="'+i+'" aria-label="'+esc(p.name)+' 사진 '+p.number+'"><img loading="lazy" referrerpolicy="no-referrer" '+(p.ownerAlbum?'data-owner="'+esc(p.url):'src="'+esc(p.url))+'" alt="'+esc(p.name)+' 사진 '+p.number+'"><span>'+esc(p.name)+' · '+p.number+'</span></button>'}
const ownerObserver=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)continue;ownerObserver.unobserve(e.target);const p=ownerStored.flatMap(a=>a.images).find(p=>p.url===e.target.dataset.owner);if(p)YuiPrivate.asset(p).then(url=>{if(e.target.isConnected)e.target.src=url}).catch(()=>{e.target.alt='보관본 연결을 확인해 주세요'})}},{rootMargin:'200px'});
function observeOwner(){document.querySelectorAll('img[data-owner]:not([src])').forEach(i=>ownerObserver.observe(i))}
function render(){
 const q=$('search').value.toLocaleLowerCase().trim();
 const items=available(),all=items.flatMap(photosFor),match=s=>String(s).toLocaleLowerCase().includes(q);
 $('albumgrid').hidden=mode==='photos';$('photogrid').hidden=mode!=='photos';$('nothing').hidden=true;
 if(mode==='photos'){
  const visible=all.filter(p=>match(p.name));$('photogrid').innerHTML=visible.map(photoHTML).join('');
  $('photogrid').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openViewer(visible,Number(b.dataset.i)));
  $('total').textContent=visible.length+' photos';
  $('nothing').hidden=visible.length>0;
 }else{
  const src=mode==='all'?catalog:items;
  const matched=src.filter(a=>match(getName(a)));
  $('albumgrid').innerHTML=matched.map(a=>card(a,mode!=='all')).join('');
  $('albumgrid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openAlbum(b.dataset.id));
  $('total').textContent=matched.length+' albums';
  $('nothing').hidden=matched.length>0;
 }
 observeOwner();
}
function openAlbum(id,record=true){
 id=canonicalId(id);
 const a=stored.find(x=>x.id===id);
 if(!a||!validImages(a).length)return;
 if(record)remember({album:id,mode});
 const photos=photosFor(a);detailAlbum=a;document.body.classList.add('detail-view');$('browse').hidden=true;$('detail').hidden=false;
 $('albumname').textContent=getName(a);$('albumtotal').textContent=photos.length+'장'+(a.expected&&photos.length<a.expected?' / '+a.expected+'장 · 일부':'');
 $('detailphotos').innerHTML=photos.map(photoHTML).join('');
 $('detailphotos').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openViewer(photos,Number(b.dataset.i)));
 observeOwner();
 window.scrollTo(0,0);
}
function openViewer(list,i,record=true){if(!list.length)return;viewerList=list;viewerIndex=((i%list.length)+list.length)%list.length;const p=list[viewerIndex];if(record)remember({album:p.albumId,photo:p.number,fromPhotos:!detailAlbum,mode});$('lightbox').classList.add('open');document.body.style.overflow='hidden';showViewer();$('close').focus({preventScroll:true})}
let viewerGeneration=0,routeTimer=null,historyEntry=0;const viewerRoutes=new Map();
function showViewer(){
 const p=viewerList[viewerIndex];if(!p)return;
 viewerGeneration++;
 $('media-status').textContent='불러오는 중';
 $('full').onload=()=>{$('media-status').textContent=''};$('full').onerror=()=>{$('media-status').textContent='사진을 불러오지 못했습니다. 사진 열기로 출처를 확인해 주세요.'};
 $('full').removeAttribute('src');$('full').referrerPolicy='no-referrer';if(p.ownerAlbum){const generation=viewerGeneration;YuiPrivate.asset(p).then(url=>{if(generation===viewerGeneration){$('full').src=url;$('original').href=url}}).catch(error=>{if(generation===viewerGeneration)$('media-status').textContent=error.message})}else $('full').src=p.url;$('full').alt=p.name+' · '+p.number;
 $('position').textContent=(viewerIndex+1)+' / '+viewerList.length+' · '+p.width+'×'+p.height;
 if(p.ownerAlbum)$('original').removeAttribute('href');else $('original').href=p.url;
}
function hideViewer(){clearTimeout(routeTimer);viewerGeneration++;$('lightbox').classList.remove('open');document.body.style.overflow='';$('full').removeAttribute('src')}
function closeViewer(){if(history.state?.yui&&history.state.photo)goBack();else hideViewer()}
function step(n){
 viewerIndex=(viewerIndex+n+viewerList.length)%viewerList.length;showViewer();
 if(history.state?.yui){const state={...history.state,photo:viewerList[viewerIndex].number,album:viewerList[viewerIndex].albumId};viewerRoutes.set(state.key,state);clearTimeout(routeTimer);
 // WebKit rate-limits History API writes. Rapid swipes must keep rendering;
 // remember the last photo immediately, and update its URL only after a pause.
 routeTimer=setTimeout(()=>{if($('lightbox').classList.contains('open')&&history.state?.key===state.key)history.replaceState(state,'',routeURL(state))},1000)}
}
function routeURL(s){const q=new URLSearchParams();if(s.album)q.set('album',s.album);if(s.photo)q.set('photo',s.photo);if(s.fromPhotos)q.set('from','photos');if(s.mode&&s.mode!=='albums')q.set('view',s.mode);return location.pathname+location.search+(q.size?'#'+q:'')}
