name: 4LEAF actual Dice roll liveness with suspended Web Animations
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/dice-fall.js'
      - 'apps/4leaf/rog/tests/dice-waapi-never-finish-recovery.cjs'
      - 'apps/4leaf/rog/tests/dice-original-roll-tables.cjs'
      - '.github/workflows/rog-dice-waapi-liveness.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/dice-fall.js'
      - 'apps/4leaf/rog/tests/dice-waapi-never-finish-recovery.cjs'
      - 'apps/4leaf/rog/tests/dice-original-roll-tables.cjs'
      - '.github/workflows/rog-dice-waapi-liveness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-frozen-waapi:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check actual client and regression
        run: |
          node --check apps/4leaf/rog/dice-fall.js
          node --check apps/4leaf/rog/game.js
          node --check apps/4leaf/rog/tests/dice-waapi-never-finish-recovery.cjs
      - name: Install real browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Serve actual source
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/rog-dice-liveness.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rog-dice-liveness.log
          exit 1
      - name: Verify D6+D4 source values and repeat roll after animation finish never settles
        env:
          FOURLEAF_BROWSER: ${{ matrix.engine }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/dice-waapi-never-finish-recovery.cjs
      - name: DIE-02 replay original D4x4 D6x6 outcomes twice with fixed seed
        env:
          FOURLEAF_BROWSER: ${{ matrix.engine }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/dice-original-roll-tables.cjs
