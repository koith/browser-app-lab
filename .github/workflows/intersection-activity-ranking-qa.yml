name: INTERSECTION Public Activity Ranking QA

on:
  pull_request:
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/post_activity_ranking.js"
      - "apps/demand-research/test_post_activity_ranking.mjs"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/test_public_video_trends.mjs"
      - ".github/workflows/intersection-activity-ranking-qa.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/post_activity_ranking.js"
      - "apps/demand-research/test_post_activity_ranking.mjs"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/test_public_video_trends.mjs"
      - ".github/workflows/intersection-activity-ranking-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-account-ranking-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/demand-research/index.html
            apps/demand-research/post_activity_ranking.js
            apps/demand-research/test_post_activity_ranking.mjs
            apps/demand-research/public_video_trends.js
            apps/demand-research/test_public_video_trends.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check ranking and embedded page scripts
        working-directory: apps/demand-research
        run: |
          node --check post_activity_ranking.js
          node --check public_video_trends.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          assert html.index('id="activityRanking"')<html.index('id="feed"')
          assert '<script src="post_activity_ranking.js" defer></script>' in html
          scripts=[s for s in re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S) if s.strip()]
          assert len(scripts)>=2
          for i,script in enumerate(scripts):
              Path('/tmp/intersection-inline-'+str(i)+'.js').write_text(script)
          PY
          for f in /tmp/intersection-inline-*.js; do node --check "$f"; done
      - name: Execute pure ranking tests and DOM interactions
        working-directory: apps/demand-research
        run: |
          npm install --no-save --no-package-lock jsdom@25.0.1
          node test_post_activity_ranking.mjs
          node test_public_video_trends.mjs
