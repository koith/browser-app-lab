name: 4LEAF original dice board layout QA
on:
  push:
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/original-tiles.css'
      - 'apps/4leaf/rog/world-perspective.css'
      - 'apps/4leaf/rog/tests/board-layout.cjs'
      - 'apps/4leaf/rog/tests/dmp-tile-overlap-audit.cjs'
      - 'apps/4leaf/rog/board-camera.js'
      - 'apps/4leaf/rog/dice-original-obs.css'
      - 'apps/4leaf/rog/genesis-chessman-actors.js'
      - 'apps/4leaf/rog/tests/genesis-chessman-actors.cjs'
      - 'apps/4leaf/rog/tests/dice-horizontal-native-actors.cjs'
      - 'apps/4leaf/rog/tests/dice-dmp-full-camera.cjs'
      - 'apps/4leaf/rog/dice-source-roll.js'
      - 'apps/4leaf/rog/tests/dice-source-roll.cjs'
      - 'apps/4leaf/rog/dice-fall.js'
      - 'apps/4leaf/rog/dice-d4-source-fallback.css'
      - 'apps/4leaf/rog/tests/dice-fall.cjs'
      - 'apps/4leaf/rog/dice-native-tis-alpha.js'
      - 'apps/4leaf/rog/dice-native-pawn-dmp-depth.css'
      - 'apps/4leaf/rog/tests/dice-native-pawn-dmp-depth.cjs'
      - 'apps/4leaf/rog/tests/dice-native-tis-alpha.cjs'
      - 'apps/4leaf/rog/tests/dice-native-tis-full-outline.cjs'
      - '.github/workflows/rog-board-layout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-board-layout.yml'
  workflow_dispatch:
jobs:
  board-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all original DMP cells for duplicate positions and severe WEB projection collisions
        run: node apps/4leaf/rog/tests/dmp-tile-overlap-audit.cjs
      - run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - run: |
          nohup python3 -m http.server 8765 --directory apps/4leaf/rog >/tmp/leaf-board-server.log 2>&1 &
          sleep 2
          curl -fSsI http://127.0.0.1:8765/index.html
      - name: Verify genuine DMP painter order of original Registry actors versus overlapping source TIS platforms
        run: node apps/4leaf/rog/tests/dice-native-pawn-dmp-depth.cjs
      - name: Verify real source TIS multi-color alpha with a live game turn
        run: node apps/4leaf/rog/tests/dice-native-tis-alpha.cjs
      - name: Verify every native TIS image pixel survives full board alpha clipping
        run: node apps/4leaf/rog/tests/dice-native-tis-full-outline.cjs
      - run: node apps/4leaf/rog/tests/board-layout.cjs
      - name: "Reproduce iPhone screenshot: zero horizontal TIS overlap and 2 original Genesis OBS players"
        run: node apps/4leaf/rog/tests/dice-horizontal-native-actors.cjs
      - name: Verify genuine native Genesis OBS chessman and no giant fabricated missing-body proxy
        run: node apps/4leaf/rog/tests/genesis-chessman-actors.cjs
      - name: Verify full expanded DMP camera touch, pan, zoom and tile visibility
        run: node apps/4leaf/rog/tests/dice-dmp-full-camera.cjs
      - name: Verify original IMG.pak 16-frame ROLL is decoded and visibly animated on first cold roll
        run: node apps/4leaf/rog/tests/dice-source-roll.cjs
      - name: Verify D4 result-specific tetrahedral landing and D6 gameplay motion
        run: node apps/4leaf/rog/tests/dice-fall.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-dice-board-layout-screens
          path: |
            leaf-board-*.png
            rog-dmp-overlap-audit.json
          retention-days: 7
