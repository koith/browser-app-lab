name: 4LEAF extract 47 original full chessman source animations
on:
  push:
    branches: [feat/4leaf-all-original-37-actors-20261101]
    paths:
      - .github/workflows/rog-extract-47-actors.yml
      - apps/4leaf/rog/tools/extract-all-original-37-actors.py
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source extractor prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unshield
          python3 -m pip install --break-system-packages pillow
      - name: Retrieve original archive with content authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/4leaf-origin /tmp/4leaf-resources
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          p=Path('/tmp/4leaf-origin/4leaf.zip')
          digest=hashlib.sha1()
          req=urllib.request.Request('https://archive.org/download/4leaf/4leaf.zip',
             headers={'User-Agent':'Mozilla/5.0 4LEAF archival source preservation'})
          with urllib.request.urlopen(req,timeout=120) as r,p.open('wb') as f:
              while chunk:=r.read(1<<20):
                  f.write(chunk);digest.update(chunk)
                  if f.tell()>90*1024*1024:raise ValueError('archive too large')
          assert digest.hexdigest()=='86526d89679ae39b85fe9808da97ad871b7888d9'
          print('ORIGINAL_2002_ARCHIVE_SHA1_VERIFIED',digest.hexdigest())
          PY
          unzip -q /tmp/4leaf-origin/4leaf.zip data1.cab data1.hdr -d /tmp/4leaf-origin
          unshield x -d /tmp/4leaf-resources /tmp/4leaf-origin/data1.cab >/dev/null
      - name: Extract all authenticated full original OBS actor frames
        run: |
          set -euo pipefail
          python3 apps/4leaf/rog/tools/extract-all-original-37-actors.py /tmp/4leaf-resources "$GITHUB_WORKSPACE"
          node --check apps/4leaf/rog/original/OBS/action-full/manifest.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('apps/4leaf/rog/original/OBS/action-full')
          files=list(base.glob('*.png'))
          summary=json.loads((base/'provenance.json').read_text())
          assert summary['actorCount']==47 and summary['frames']==47*37
          assert len(files)==47*37,(len(files),47*37)
          assert summary['originalExeActionTableDecoded'] is False
          for id,m in summary['members'].items():
              frames=list(base.glob(m['member'].replace('.obs','')+'-*.png'))
              assert len(frames)==37,(id,len(frames))
          print('ORIGINAL_ACTOR_FRAMES_VERIFIED',len(files))
          PY
      - name: Push source PNGs and manifest in Git commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4LEAF source restoration bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/4leaf/rog/original/OBS/action-full
          git diff --cached --quiet || git commit -m "data(4leaf): complete 47 authentic 37-frame source actor packets (1739 sprites)"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            sleep 3
          done
          exit 1
