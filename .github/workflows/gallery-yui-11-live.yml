name: Gallery Eleven Newly Archived Yui Originals In Live Browser
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-yui-11-live.yml'
      - 'apps/gallery-archive/qa_cloudflare_pages_browser.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-yui-11-live.yml'
      - 'apps/gallery-archive/qa_cloudflare_pages_browser.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-11-yui-actual-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  eleven-exact-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real Chromium/WebKit and strict image decoder
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify exactly 11 new Yui saved originals, actual SHA, native rendered lightbox, reload
        shell: bash
        run: |
          python -m py_compile apps/gallery-archive/qa_cloudflare_pages_browser.py
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR candidate gallery transport overlay; actual Pages/Worker photos.
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --browser '${{ matrix.browser }}' --new-yui-11
          else
            # On main, verify the exact public Pages JS/HTML and real decoded owner files.
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --browser '${{ matrix.browser }}' --deployed --new-yui-11
          fi
      - name: Report only actual tested photos, never candidate URLs
        if: success()
        run: |
          echo "Yui public-yui-sns slots 455..465: exact signed Cloudflare originals SHA/bytes/pixels; native actual browser photo, visible album, lightbox and reload PASS in ${{ matrix.browser }}. Physical iPhone hardware NOT tested." >> "$GITHUB_STEP_SUMMARY"
