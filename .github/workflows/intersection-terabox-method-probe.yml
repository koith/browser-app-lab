name: INTERSECTION — TeraBox Synthetic Upload Method Diagnosis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/demand-research/terabox_method_probe.py

permissions:
  contents: read

jobs:
  test-real-private-terabox-methods:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: intersection-terabox-method-diagnostic
      cancel-in-progress: false
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_UPLOAD_THREADS: "1"
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require private TeraBox authentication without logging credentials
        run: |
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" || { echo "::error::Private archive credential unavailable"; exit 1; }
      - name: Install pinned TeraBox-enabled rclone
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -qi terabox
      - name: Test synthetic non-private uploads and SHA256 remote readback
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          python terabox_method_probe.py
