name: 4LEAF historic source archive gameplay coverage
on:
  push:
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/sw.js'
      - 'apps/4leaf/rog/pwa-runtime.js'
      - 'apps/4leaf/rog/manifest.webmanifest'
      - 'apps/4leaf/rog/tests/pwa-dice-upgrade.cjs'
      - 'apps/4leaf/rog/classic-focus.css'
      - 'apps/4leaf/rog/board-camera.js'
      - 'apps/4leaf/rog/dice-native-minimap-navigation.css'
      - 'apps/4leaf/rog/tests/dice-native-minimap-navigation.cjs'
      - 'apps/4leaf/rog/dice-dmp-camera-controls.css'
      - 'apps/4leaf/rog/dice-source-dmp-terrain-explorer.js'
      - 'apps/4leaf/rog/dice-source-dmp-terrain-explorer.css'
      - 'apps/4leaf/rog/tests/dice-source-dmp-terrain-explorer.cjs'
      - 'apps/4leaf/rog/tests/dice-dmp-full-camera.cjs'
      - 'apps/4leaf/rog/world-perspective.css'
      - 'apps/4leaf/rog/original-stage.css'
      - 'apps/4leaf/rog/dice-source-roll.css'
      - 'apps/4leaf/rog/dice-fall.js'
      - 'apps/4leaf/rog/genesis-chessman-actors.js'
      - 'apps/4leaf/rog/genesis-chessman-actors.css'
      - 'apps/4leaf/rog/tests/genesis-chessman-actors.cjs'
      - 'apps/4leaf/rog/tests/dice-original-obs-chessmen.cjs'
      - 'apps/4leaf/rog/original/OBS/**'
      - 'apps/4leaf/rog/dice-original-obs.css'
      - 'apps/4leaf/rog/dice-fall.css'
      - 'apps/4leaf/rog/tests/dice-fall.cjs'
      - 'apps/4leaf/rog/tests/dice-historical-24-clash.cjs'
      - 'apps/4leaf/rog/dice-2004-full-frame.css'
      - 'apps/4leaf/rog/tests/dice-2004-full-frame.cjs'
      - 'apps/4leaf/rog/dice-source-roll.js'
      - 'apps/4leaf/rog/tests/dice-source-roll.cjs'
      - 'apps/4leaf/rog/tests/dice-source-native-ui.cjs'
      - 'apps/4leaf/rog/dice-source-native-ui.css'
      - 'apps/4leaf/rog/dice-source-native-chat-scroll.js'
      - 'apps/4leaf/rog/original/IMG/okcancelbut.png'
      - 'apps/4leaf/rog/original/IMG/scrollbutton.png'
      - 'apps/4leaf/rog/original/IMG/stats.png'
      - 'apps/4leaf/rog/dice-native-client-frame.css'
      - 'apps/4leaf/rog/dice-native-menu-chrome.css'
      - 'apps/4leaf/rog/dice-native-dialog-event.css'
      - 'apps/4leaf/rog/tests/dice-native-dialog-event.cjs'
      - 'apps/4leaf/rog/dice-native-tis-clean.css'
      - 'apps/4leaf/rog/dice-native-tis-depth.css'
      - 'apps/4leaf/rog/dice-native-tis-orientation.css'
      - 'apps/4leaf/rog/dice-ai-autoplay.css'
      - 'apps/4leaf/rog/tests/dice-ai-resume-guard.cjs'
      - 'apps/4leaf/rog/tests/dice-native-orientation-manual.cjs'
      - 'apps/4leaf/rog/dice-native-tis-alpha.js'
      - 'apps/4leaf/rog/dice-native-pawn-dmp-depth.css'
      - 'apps/4leaf/rog/tests/dice-native-pawn-dmp-depth.cjs'
      - 'apps/4leaf/rog/tests/dice-cooccupied-pawns.cjs'
      - 'apps/4leaf/rog/tests/dice-native-tis-alpha.cjs'
      - 'apps/4leaf/rog/tests/dice-native-tis-depth.cjs'
      - 'apps/4leaf/rog/dice-native-battle-podium.css'
      - 'apps/4leaf/rog/dice-native-battle-dice.css'
      - 'apps/4leaf/rog/tests/dice-native-battle-dice.cjs'
      - 'apps/4leaf/rog/tests/dice-battle-podium.cjs'
      - 'apps/4leaf/rog/dice-native-client-frame.js'
      - 'apps/4leaf/rog/tests/dice-native-frame.cjs'
      - 'apps/4leaf/rog/tests/archive-coverage.cjs'
      - '.github/workflows/rog-archive-coverage.yml'
  workflow_dispatch:
jobs:
  full-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Replay all 25 historical map wins and check desktop/mobile game
        run: node apps/4leaf/rog/tests/archive-coverage.cjs
      - name: Verify genuine rolled dice pip topology and live original-screenshot duel in Chromium
        run: node apps/4leaf/rog/tests/dice-native-battle-dice.cjs
      - name: Verify actual 2.5D mechanical duel platforms and original forest in Chromium
        run: node apps/4leaf/rog/tests/dice-battle-podium.cjs
      - name: Verify genuine DMP painter order of original Registry actors versus overlapping source TIS platforms
        run: node apps/4leaf/rog/tests/dice-native-pawn-dmp-depth.cjs
      - name: Verify two actual source OBS chessmen remain distinct when sharing one DMP start tile
        run: node apps/4leaf/rog/tests/dice-cooccupied-pawns.cjs
      - name: Verify real chessman-card identity and 8-head web pose control, not chat avatars
        run: node apps/4leaf/rog/tests/genesis-chessman-actors.cjs
      - name: Exercise recovered OBS animated source characters in real Chromium match
        run: node apps/4leaf/rog/tests/dice-original-obs-chessmen.cjs
      - name: Check 145x97 original TIS chroma-key renderer syntax and file origin fallback
        run: node apps/4leaf/rog/tests/dice-native-tis-alpha.cjs
      - name: Navigate source-native minimap and visible DMP camera viewport in desktop/mobile Chromium
        run: node apps/4leaf/rog/tests/dice-native-minimap-navigation.cjs
      - name: Serve actual source TIS images on same-origin HTTP for pixel-accurate DMP acceptance
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/4leaf-source-tis-http.log 2>&1 &
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 -I http://127.0.0.1:8765/original/Tiles/0015.png >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - name: Inspect real recovered DMP source tiles and warp destinations with camera and accessible events
        run: node apps/4leaf/rog/tests/dice-source-dmp-terrain-explorer.cjs
      - name: Explore full 1450x1120 original DMP camera via mouse, keyboard, wheel and mobile pinch
        run: node apps/4leaf/rog/tests/dice-dmp-full-camera.cjs
      - name: Exercise genuine mobile dice button twice and test original DMP tile painting
        run: node apps/4leaf/rog/tests/dice-mobile-roll-dmp-order.cjs
      - name: Verify native 145x97 TIS and independently depth-sorted original DMP cells in live Chromium
        run: node apps/4leaf/rog/tests/dice-native-tis-depth.cjs
      - name: Verify saved AI turns pause on reload and remain manually rollable
        run: node apps/4leaf/rog/tests/dice-ai-resume-guard.cjs
      - name: Verify corrected hex orientation and manual player turns
        run: node apps/4leaf/rog/tests/dice-native-orientation-manual.cjs
      - name: Validate actual source Genesis dialog and live event message in Chromium
        run: node apps/4leaf/rog/tests/dice-native-dialog-event.cjs
      - name: Register complete original 800px source battlefield, both side rails and 3 native HUD regions
        run: node apps/4leaf/rog/tests/dice-2004-full-frame.cjs
      - name: Verify genuine 2004-positioned ROLL control invokes actual dice engine without duplicate turn
        run: node apps/4leaf/rog/tests/dice-source-roll.cjs
      - name: Recover native 2002 source UI confirmations and live game chat scroll Chromium
        run: node apps/4leaf/rog/tests/dice-source-native-ui.cjs
      - name: Verify game waits for actual gravity, bouncing and face-specific 3D die stops
        run: node apps/4leaf/rog/tests/dice-fall.cjs
      - name: Replay 2004 Ironmask Destroy 24 vs Damian Block 24 fixed-tie ability cancellation
        run: node apps/4leaf/rog/tests/dice-historical-24-clash.cjs
      - name: Chromium verify recovered 800x600 / 406x152 / 172x152 functioning Dice frame
        run: node apps/4leaf/rog/tests/dice-native-frame.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-original-screen-focused-samples
          path: |
            rog-classic-focus*.png
            rog-source-*.png
