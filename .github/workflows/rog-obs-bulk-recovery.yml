name: 4LEAF recover native OBS chessman poses
on:
  push:
    paths:
      - '.github/workflows/rog-obs-bulk-recovery.yml'
      - 'apps/4leaf/rog/tools/decode-original-obs-bulk.py'
      - 'apps/4leaf/rog/tests/test_obs_native_640stride.py'
      - 'apps/4leaf/rog/tools/probe-original-obs-near-rows.py'
      - 'apps/4leaf/rog/tools/probe-original-obs-640stride.py'
      - 'apps/4leaf/rog/tools/audit-original-dice-resources.py'
      - 'apps/4leaf/rog/tools/decode-original-img-spr.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-validated-pixel-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install read-only archive extractor and Pillow indexed palette codec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unshield
          python3 -m pip install --break-system-packages pillow
      - name: Verify native 640-stride OBS packet decoder against exact expected source pixel positions
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/decode-original-obs-bulk.py
          python3 apps/4leaf/rog/tests/test_obs_native_640stride.py
      - name: Verify SHA1 of the historically archived 2002 client, unpack resource data only
        run: |
          mkdir -p /tmp/leaf-obs-installer /tmp/leaf-obs-resources
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,time
          target=Path('/tmp/leaf-obs-installer/client.zip')
          expected='86526d89679ae39b85fe9808da97ad871b7888d9'
          urls=['https://archive.org/download/4leaf/4leaf.zip',
                'https://archive.org/download/4leaf/4leaf.zip?download=1']
          for attempt in range(5):
              try:
                  url=urls[attempt%len(urls)]
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (4LEAF preservation scan)'})
                  with urllib.request.urlopen(request,timeout=120) as r,target.open('wb') as f:
                      h=hashlib.sha1();count=0
                      while data:=r.read(1048576):
                          count+=len(data)
                          if count>90*1024*1024:raise ValueError('Archive exceeds secure size limit')
                          h.update(data);f.write(data)
                  if h.hexdigest()!=expected:
                      raise ValueError('Archive SHA1 mismatch; refusing unverified original')
                  print('VERIFIED_ORIGINAL_2002_CLIENT_SHA1',h.hexdigest(),'bytes',count)
                  break
              except Exception as e:
                  if attempt==4:raise
                  print('Original archive retry:',attempt+1,str(e)[:180],flush=True)
                  target.unlink(missing_ok=True);time.sleep(4+attempt*2)
          PY
          unzip -q /tmp/leaf-obs-installer/client.zip 'data1.cab' 'data1.hdr' -d /tmp/leaf-obs-installer
          unshield x -d /tmp/leaf-obs-resources /tmp/leaf-obs-installer/data1.cab >/dev/null
          rm -f /tmp/leaf-obs-installer/client.zip
      - name: Inventory historical Dice 3D, sprite, model and battle resource names from SHA-verified client
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/audit-original-dice-resources.py
          python3 apps/4leaf/rog/tools/audit-original-dice-resources.py \
            /tmp/leaf-obs-resources /tmp/leaf-dice-package-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-original-Dice-package-manifest
          path: /tmp/leaf-dice-package-inventory.json
          retention-days: 12
      - name: Extract only strictly validated per-card source OBS pixels
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/decode-original-obs-bulk.py
          source="$(find /tmp/leaf-obs-resources -type f -iname 'OBS.pak' | head -1)"
          test -n "$source"
          python3 apps/4leaf/rog/tools/decode-original-obs-bulk.py \
            "$source" \
            apps/4leaf/rog/original/chessmen.json \
            apps/4leaf/rog/original/OBS
          node --check apps/4leaf/rog/original/OBS/animation-extra.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('apps/4leaf/rog/original/OBS')
          report=json.loads((root/'bulk-source-report.json').read_text())
          assert report['accepted']>=62,(report['accepted'],len(report['rejected']))
          assert report['framePNGs']>=2,report
          assert len(list((root/'bulk').glob('*.png')))==report['framePNGs'],report
          print('ORIGINAL_OBS_STRICT_FRAMES_VERIFIED',report['accepted'],report['framePNGs'])
          PY
      - name: Preview ONLY conservatively near-height rejected OBS sprites, without committing them as live originals
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/probe-original-obs-near-rows.py
          source="$(find /tmp/leaf-obs-resources -type f -iname 'OBS.pak' | head -1)"
          test -n "$source"
          python3 apps/4leaf/rog/tools/probe-original-obs-near-rows.py \
            "$source" \
            apps/4leaf/rog/original/chessmen.json \
            apps/4leaf/rog/original/OBS/bulk-source-report.json \
            /tmp/leaf-obs-near-row-quarantine
          test -s /tmp/leaf-obs-near-row-quarantine/probe-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-near-row-quarantine-not-production
          path: /tmp/leaf-obs-near-row-quarantine
          retention-days: 7
      - name: Test native OBS 2-byte scanline skip hypothesis against strict 2002 source frame geometry
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/probe-original-obs-640stride.py
          source="$(find /tmp/leaf-obs-resources -type f -iname 'OBS.pak' | head -1)"
          test -n "$source"
          python3 apps/4leaf/rog/tools/probe-original-obs-640stride.py \
            "$source" apps/4leaf/rog/original/chessmen.json \
            apps/4leaf/rog/original/OBS/bulk-source-report.json
          test -s /tmp/leaf-obs-640stride-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-obs-640stride-pixel-position-proof
          path: /tmp/leaf-obs-640stride-proof.json
          retention-days: 7
      - name: Decode genuine 2002 ROLL and eventRoll1 animation frames with original 640-stride palette codec
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/decode-original-img-spr.py
          source="$(find /tmp/leaf-obs-resources -type f -iname 'IMG.pak' | grep -i '/Dice/' | head -1)"
          test -n "$source"
          python3 apps/4leaf/rog/tools/decode-original-img-spr.py "$source" apps/4leaf/rog/original/SourceSPR
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('apps/4leaf/rog/original/SourceSPR')
          report=json.loads((path/'manifest.json').read_text())
          assert report['videoStride']==640,report
          frames=report['spriteAnimations']
          assert frames['roll.spr']['frameCount']==4,frames['roll.spr']
          assert frames['eventRoll1.spr']['frameCount']==16,frames['eventRoll1.spr']
          assert len(list(path.glob('*.png')))==20
          assert frames['roll.spr']['frames'][0]['width']==158
          assert frames['roll.spr']['frames'][0]['height']==100
          print('VERIFIED_GENUINE_2002_IMG_SPR',len(list(path.glob('*.png'))))
          PY
      - name: Keep offline PWA sprite inventory synchronized with every verified source frame
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('apps/4leaf/rog')
          sw=root/'sw.js'
          source=sw.read_text()
          sprites=sorted(p.stem for p in (root/'original/OBS/bulk').glob('*.png'))
          pattern=r"const NATIVE_OBS_BULK_FILES='[^']*'\.split\(' '\);"
          native="const NATIVE_OBS_BULK_FILES='"+' '.join(sprites)+"'.split(' ');"
          updated,count=re.subn(pattern,lambda _:native,source,count=1)
          assert count==1, "Refusing to alter unknown offline resource table"
          # The 4+16 authentic PNGs must be cached on first game visit,
          # independent from the previous inaccessible CSS roll proxy.
          extra="const ORIGINAL_SOURCE_SPR_FILES='roll-00 roll-01 roll-02 roll-03 "+' '.join(
            'eventRoll1-'+str(i).zfill(2) for i in range(16)
          )+"'.split(' ');"
          if 'const ORIGINAL_SOURCE_SPR_FILES=' not in updated:
              updated=updated.replace("const NATIVE_TIS_FILES=",extra+"\nconst NATIVE_TIS_FILES=",1)
              updated=updated.replace(
                ".concat(NATIVE_OBS_BULK_FILES.map(id=>'./original/OBS/bulk/'+id+'.png'));",
                ".concat(NATIVE_OBS_BULK_FILES.map(id=>'./original/OBS/bulk/'+id+'.png'))"+
                ".concat(ORIGINAL_SOURCE_SPR_FILES.map(id=>'./original/SourceSPR/'+id+'.png'));"
              )
              if 'ORIGINAL_SOURCE_SPR_FILES.map' not in updated:
                  raise RuntimeError('SourceSPR cache insertion failed')
          if updated!=source:
              updated,n=re.subn(r"const REVISION='4leaf-revival-pwa-v(\d+)'",
                lambda m:"const REVISION='4leaf-revival-pwa-v"+str(int(m.group(1))+1)+"'",
                updated,count=1)
              assert n==1, "PWA cache version missing"
              sw.write_text(updated)
              print('SOURCE_OBS_OFFLINE_CACHE_UPDATED',len(sprites))
          else:
              print('SOURCE_OBS_OFFLINE_CACHE_UNCHANGED',len(sprites))
          PY
      - name: Import strictly decoded OBS pixels into isolated feature branch ONLY
        if: github.ref == 'refs/heads/restore-4leaf-obs-640stride-native-20261020'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4leaf/rog/original/OBS/bulk \
            apps/4leaf/rog/original/OBS/animation-extra.js \
            apps/4leaf/rog/original/OBS/bulk-source-report.json \
            apps/4leaf/rog/original/SourceSPR \
            apps/4leaf/rog/sw.js
          if git diff --cached --quiet; then
            echo 'No new source frames accepted; no fabricated assets to publish'
            exit 0
          fi
          git commit -m 'assets(4leaf): use strictly decoded 2002 OBS chessman body frames'
          for attempt in 1 2 3; do
            git pull --rebase origin restore-4leaf-obs-640stride-native-20261020
            if git push origin HEAD:restore-4leaf-obs-640stride-native-20261020; then exit 0; fi
            sleep "$((attempt*3))"
          done
          echo 'Failed to safely rebase native sprite additions'; exit 1
      - name: Reject unreviewed OBS artifact promotion on any other branch
        if: github.ref != 'refs/heads/restore-4leaf-obs-640stride-native-20261020'
        run: echo 'No production merge or main push for experimental source decoding'
      - name: Remove original installer and encrypted binary after extraction
        if: always()
        run: rm -rf /tmp/leaf-obs-installer /tmp/leaf-obs-resources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-2002-obs-source-coverage
          path: apps/4leaf/rog/original/OBS/bulk-source-report.json
          retention-days: 10
