name: Gallery Perceptual Duplicate Evidence QA
on:
  pull_request:
    paths:
      - apps/gallery-archive/perceptual_duplicate_audit.py
      - apps/gallery-archive/test_perceptual_duplicate_audit.py
      - apps/gallery-archive/direct_photo_pipeline.py
      - .github/workflows/gallery-perceptual-duplicate-evidence-qa.yml
  push:
    branches: [main]
    paths:
      - apps/gallery-archive/perceptual_duplicate_audit.py
      - apps/gallery-archive/test_perceptual_duplicate_audit.py
      - .github/workflows/gallery-perceptual-duplicate-evidence-qa.yml
permissions:
  contents: read
jobs:
  non-destructive-duplicate-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify standalone duplicate candidates with real image bytes
        run: |
          python -m py_compile apps/gallery-archive/perceptual_duplicate_audit.py
          python apps/gallery-archive/test_perceptual_duplicate_audit.py
