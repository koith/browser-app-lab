name: Gallery Owner Archive One-Shot Census - Read Only
on:
  push:
    branches: [run/gallery-owner-census-one-shot-20261117]
    paths:
      - '.github/workflows/gallery-unindexed-owner-inventory.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Which existing owner archive to census'
        required: true
        type: choice
        options:
          - mimmi
          - yui
permissions:
  contents: read
  issues: write
concurrency:
  group: gallery-unindexed-owner-inventory-${{ inputs.model }}
  cancel-in-progress: false
jobs:
  read-only-census:
    strategy:
      fail-fast: false
      matrix:
        model: [mimmi, yui]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MODEL: ${{ matrix.model }}
      GH_TOKEN: ${{ github.token }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate privacy-safe inventory parser offline
        run: |
          python -m py_compile apps/gallery-archive/inventory_unindexed_owner_files.py
          python apps/gallery-archive/test_inventory_unindexed_owner_files.py
      - name: Install checksum-pinned read-only TeraBox storage client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          binary="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
      - name: Read catalog and file metadata only, never media bytes
        shell: bash
        run: |
          set -euo pipefail
          case "$MODEL" in
            mimmi) export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"; remote='archive:MimmiArchive' ;;
            yui) export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"; remote='archive:YuiArchive' ;;
            *) exit 2 ;;
          esac
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          "$RUNNER_TEMP/bin/rclone" cat "$remote/metadata/catalog.json" --timeout 75s --retries 2 > "$RUNNER_TEMP/owner-catalog.json" 2> "$RUNNER_TEMP/catalog-stderr"
          # lsjson reports paths and sizes, not image bytes; restrict logs to aggregate counts.
          timeout 660 "$RUNNER_TEMP/bin/rclone" lsjson "$remote" -R --files-only --timeout 75s --retries 2 > "$RUNNER_TEMP/owner-lsjson.json" 2> "$RUNNER_TEMP/lsjson-stderr"
          python apps/gallery-archive/inventory_unindexed_owner_files.py --model "$MODEL" --listing "$RUNNER_TEMP/owner-lsjson.json" --catalog "$RUNNER_TEMP/owner-catalog.json" | tee "$RUNNER_TEMP/owner-census-result.log"
          echo 'Read-only owner archive file census complete; no files downloaded, uploaded or deleted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only aggregate counts for the two-model one-shot investigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'owner-census-result.log'
          rows=[x for x in p.read_text().splitlines() if x.startswith('OWNER_ARCHIVE_UNINDEXED_INVENTORY ')]
          if len(rows)!=1: raise SystemExit('Missing verified census report')
          data=json.loads(rows[0].split(' ',1)[1])
          if data.get('model')!=os.environ['MODEL'] or data.get('read_only') is not True: raise SystemExit('Invalid model census')
          body=('One-time verified read-only TeraBox census '+data['model']+': '
                'unindexed original image candidates='+str(data['unindexed_original_image_candidates'])+
                ', other image candidates='+str(data['unindexed_other_image_candidates'])+
                ', archive candidates='+str(data['unindexed_archive_candidates'])+
                ', catalog referenced files missing='+str(data['catalog_referenced_files_missing'])+
                ', catalog photo records='+str(data['catalog_photo_records'])+
                '. No media bytes downloaded; only aggregate counts exposed.')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'owner-census-issue-comment.txt').write_text(''.join(body))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/605/comments" -f body="$(cat "$RUNNER_TEMP/owner-census-issue-comment.txt")" --silent
