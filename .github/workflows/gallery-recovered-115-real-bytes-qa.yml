name: Mimmi 115 Recovered Pages Files SHA and Browser Decode QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/gallery-archive/qa_recovered_115_real_bytes.py
      - .github/workflows/gallery-recovered-115-real-bytes-qa.yml
  push:
    branches: [main]
    paths:
      - apps/gallery-archive/qa_recovered_115_real_bytes.py
      - .github/workflows/gallery-recovered-115-real-bytes-qa.yml
permissions:
  contents: read
jobs:
  actual-saved-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: SHA-256 verify and decode all 115 already-committed recovered real Pages files
        run: python apps/gallery-archive/qa_recovered_115_real_bytes.py --browser ${{ matrix.browser }}
