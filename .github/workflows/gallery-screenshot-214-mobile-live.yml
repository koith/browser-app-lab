name: Gallery iPhone Screenshot 158 Photos Real Pages Mobile QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_screenshot_214_mobile_live.py'
      - '.github/workflows/gallery-screenshot-214-mobile-live.yml'
  workflow_run:
    workflows: ['Gallery Live 214 Existing Incident Originals Acceptance']
    types: [completed]
permissions:
  contents: read
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile apps/gallery-archive/qa_screenshot_214_mobile_live.py
  live-after-214-sha-readback:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Screenshot albums UI actual tiles and fullscreen (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mobile browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps '${{ matrix.browser }}'
      - name: Open real Pages as mobile and verify all 97 Yui and 61 Mimmi screenshot tiles
        run: |
          python apps/gallery-archive/qa_screenshot_214_mobile_live.py --browser '${{ matrix.browser }}'
          echo '${{ matrix.browser }}: 158 user screenshot images decoded, fullscreen exact SHA samples PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is Playwright mobile emulation, not physical iPhone hardware.' >> "$GITHUB_STEP_SUMMARY"
