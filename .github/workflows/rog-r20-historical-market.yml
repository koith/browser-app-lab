name: 4LEAF historical 2003 Magic Carden market source acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/original/market-price-snapshots.js'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/r20-historical-market-prices.cjs'
      - '.github/workflows/rog-r20-historical-market.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/original/market-price-snapshots.js'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/r20-historical-market-prices.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-2003-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-r20-market-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
      - run: node apps/4leaf/rog/tests/r20-historical-market-prices.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-2003-market-native-shop
          if-no-files-found: ignore
          path: leaf-r20-historic-market-shop.png
