name: Mimmi Public Pagination Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - apps/mimmi-gallery/probe_public_album_pagination.py
      - .github/workflows/mimmi-public-pagination-probe.yml
permissions:
  contents: read
jobs:
  pagination:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect real pagination hrefs, without guessing inaccessible URLs
        run: python apps/mimmi-gallery/probe_public_album_pagination.py
