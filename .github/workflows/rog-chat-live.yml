name: 4LEAF ROG published ChatRoom browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rog-chat-live.yml'
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  published-chat:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait until published scripts match the checked-out original reconstruction
        shell: bash
        run: |
          set -euo pipefail
          base='https://koith.github.io/browser-app-lab/apps/4leaf/rog'
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fLsS --max-time 15 --retry 2 --retry-delay 2 \
                 "$base/social-chat.js?qa=${GITHUB_SHA}" -o /tmp/leaf-social-live.js &&
               curl -fLsS --max-time 15 --retry 2 --retry-delay 2 \
                 "$base/world-social.css?qa=${GITHUB_SHA}" -o /tmp/leaf-world-live.css &&
               cmp -s /tmp/leaf-social-live.js apps/4leaf/rog/social-chat.js &&
               cmp -s /tmp/leaf-world-live.css apps/4leaf/rog/world-social.css &&
               curl -fLsS --max-time 15 "$base/registry-native-avatar-dialog.js?qa=${GITHUB_SHA}" -o /tmp/leaf-registry-live.js &&
               curl -fLsS --max-time 15 "$base/registry-native-avatar-dialog.css?qa=${GITHUB_SHA}" -o /tmp/leaf-registry-live.css &&
               cmp -s /tmp/leaf-registry-live.js apps/4leaf/rog/registry-native-avatar-dialog.js &&
               cmp -s /tmp/leaf-registry-live.css apps/4leaf/rog/registry-native-avatar-dialog.css &&
               curl -fLsS --max-time 15 "$base/mainframe-native-toolbar.css?qa=${GITHUB_SHA}" -o /tmp/leaf-toolbar-live.css &&
               cmp -s /tmp/leaf-toolbar-live.css apps/4leaf/rog/mainframe-native-toolbar.css &&
               curl -fLsS --max-time 15 "$base/world-map-source-moon.css?qa=${GITHUB_SHA}" -o /tmp/leaf-moon-live.css &&
               cmp -s /tmp/leaf-moon-live.css apps/4leaf/rog/world-map-source-moon.css &&
               curl -fLsS --max-time 15 "$base/dice-native-client-frame.css?qa=${GITHUB_SHA}" -o /tmp/leaf-dice-live.css &&
               curl -fLsS --max-time 15 "$base/dice-native-client-frame.js?qa=${GITHUB_SHA}" -o /tmp/leaf-dice-live.js &&
               cmp -s /tmp/leaf-dice-live.css apps/4leaf/rog/dice-native-client-frame.css &&
               curl -fLsS --max-time 15 "$base/dice-native-battle-dice.css?qa=${GITHUB_SHA}" -o /tmp/leaf-battle-pips-live.css &&
               cmp -s /tmp/leaf-battle-pips-live.css apps/4leaf/rog/dice-native-battle-dice.css &&
               cmp -s /tmp/leaf-dice-live.js apps/4leaf/rog/dice-native-client-frame.js &&
               curl -fLsS --max-time 15 "$base/dice-native-chessmen-hud.css?qa=${GITHUB_SHA}" -o /tmp/leaf-chessman-live.css &&
               cmp -s /tmp/leaf-chessman-live.css apps/4leaf/rog/dice-native-chessmen-hud.css &&
               curl -fLsS --max-time 15 "$base/dice-original-selector.css?qa=${GITHUB_SHA}" -o /tmp/leaf-selector-live.css &&
               cmp -s /tmp/leaf-selector-live.css apps/4leaf/rog/dice-original-selector.css &&
               curl -fLsS --max-time 15 "$base/dice-native-tis-clean.css?qa=${GITHUB_SHA}" -o /tmp/leaf-tis-live.css &&
               cmp -s /tmp/leaf-tis-live.css apps/4leaf/rog/dice-native-tis-clean.css &&
               curl -fLsS --max-time 15 "$base/dice-native-tis-depth.css?qa=${GITHUB_SHA}" -o /tmp/leaf-tis-depth-live.css &&
               cmp -s /tmp/leaf-tis-depth-live.css apps/4leaf/rog/dice-native-tis-depth.css &&
               curl -fLsS --max-time 15 "$base/game.js?qa=${GITHUB_SHA}" -o /tmp/leaf-game-live.js &&
               cmp -s /tmp/leaf-game-live.js apps/4leaf/rog/game.js &&
               curl -fLsS --max-time 15 "$base/original-stage.css?qa=${GITHUB_SHA}" -o /tmp/leaf-game-stage-live.css &&
               cmp -s /tmp/leaf-game-stage-live.css apps/4leaf/rog/original-stage.css &&
               curl -fLsS --max-time 15 "$base/sw.js?qa=${GITHUB_SHA}" -o /tmp/leaf-pwa-live.js &&
               cmp -s /tmp/leaf-pwa-live.js apps/4leaf/rog/sw.js &&
               curl -fLsS --max-time 15 "$base/dice-native-tis-alpha.js?qa=${GITHUB_SHA}" -o /tmp/leaf-tis-alpha-live.js &&
               cmp -s /tmp/leaf-tis-alpha-live.js apps/4leaf/rog/dice-native-tis-alpha.js &&
               curl -fLsS --max-time 15 "$base/dice-native-pawn-dmp-depth.css?qa=${GITHUB_SHA}" -o /tmp/leaf-pawn-depth.css &&
               cmp -s /tmp/leaf-pawn-depth.css apps/4leaf/rog/dice-native-pawn-dmp-depth.css &&
               curl -fLsS --max-time 15 "$base/board-camera.js?qa=${GITHUB_SHA}" -o /tmp/leaf-camera-live.js &&
               cmp -s /tmp/leaf-camera-live.js apps/4leaf/rog/board-camera.js &&
               curl -fLsS --max-time 15 "$base/dice-native-minimap-navigation.css?qa=${GITHUB_SHA}" -o /tmp/leaf-minimap-nav-live.css &&
               cmp -s /tmp/leaf-minimap-nav-live.css apps/4leaf/rog/dice-native-minimap-navigation.css &&
               curl -fLsS --max-time 15 "$base/dice-dmp-camera-controls.css?qa=${GITHUB_SHA}" -o /tmp/leaf-camera-controls-live.css &&
               cmp -s /tmp/leaf-camera-controls-live.css apps/4leaf/rog/dice-dmp-camera-controls.css &&
               curl -fLsS --max-time 15 "$base/dice-source-dmp-terrain-explorer.js?qa=${GITHUB_SHA}" -o /tmp/leaf-source-dmp-explorer.js &&
               curl -fLsS --max-time 15 "$base/dice-source-dmp-terrain-explorer.css?qa=${GITHUB_SHA}" -o /tmp/leaf-source-dmp-explorer.css &&
               cmp -s /tmp/leaf-source-dmp-explorer.js apps/4leaf/rog/dice-source-dmp-terrain-explorer.js &&
               cmp -s /tmp/leaf-source-dmp-explorer.css apps/4leaf/rog/dice-source-dmp-terrain-explorer.css &&
               curl -fLsS --max-time 15 "$base/dice-native-menu-chrome.css?qa=${GITHUB_SHA}" -o /tmp/leaf-menu-live.css &&
               cmp -s /tmp/leaf-menu-live.css apps/4leaf/rog/dice-native-menu-chrome.css &&
               curl -fLsS --max-time 15 "$base/dice-native-dialog-event.css?qa=${GITHUB_SHA}" -o /tmp/leaf-native-dialog.css &&
               cmp -s /tmp/leaf-native-dialog.css apps/4leaf/rog/dice-native-dialog-event.css &&
               curl -fLsS --max-time 15 "$base/dice-ai-autoplay.css?qa=${GITHUB_SHA}" -o /tmp/leaf-autoplay.css &&
               cmp -s /tmp/leaf-autoplay.css apps/4leaf/rog/dice-ai-autoplay.css &&
               curl -fLsS --max-time 15 "$base/dice-native-battle-podium.css?qa=${GITHUB_SHA}" -o /tmp/leaf-podium-live.css &&
               cmp -s /tmp/leaf-podium-live.css apps/4leaf/rog/dice-native-battle-podium.css &&
               curl -fLsS --max-time 15 "$base/chatroom-native-ringbtn.css?qa=${GITHUB_SHA}" -o /tmp/leaf-ring-live.css &&
               cmp -s /tmp/leaf-ring-live.css apps/4leaf/rog/chatroom-native-ringbtn.css &&
               curl -fLsS --max-time 15 "$base/chatroom-native-scrollbar.js?qa=${GITHUB_SHA}" -o /tmp/leaf-scroll-live.js &&
               curl -fLsS --max-time 15 "$base/chatroom-native-scrollbar.css?qa=${GITHUB_SHA}" -o /tmp/leaf-scroll-live.css &&
               cmp -s /tmp/leaf-scroll-live.js apps/4leaf/rog/chatroom-native-scrollbar.js &&
               cmp -s /tmp/leaf-scroll-live.css apps/4leaf/rog/chatroom-native-scrollbar.css &&
               curl -fLsS --max-time 15 "$base/pwa-runtime.js?qa=${GITHUB_SHA}" -o /tmp/leaf-pwa-runtime.js &&
               curl -fLsS --max-time 15 "$base/sw.js?qa=${GITHUB_SHA}" -o /tmp/leaf-pwa-sw.js &&
               curl -fLsS --max-time 15 "$base/index.html?qa=${GITHUB_SHA}" -o /tmp/leaf-pwa-index.html &&
               cmp -s /tmp/leaf-pwa-runtime.js apps/4leaf/rog/pwa-runtime.js &&
               curl -fLsS --max-time 15 "$base/dice-source-roll.js?qa=${GITHUB_SHA}" -o /tmp/leaf-source-roll.js &&
               curl -fLsS --max-time 15 "$base/dice-source-roll.css?qa=${GITHUB_SHA}" -o /tmp/leaf-source-roll.css &&
               cmp -s /tmp/leaf-source-roll.js apps/4leaf/rog/dice-source-roll.js &&
               cmp -s /tmp/leaf-source-roll.css apps/4leaf/rog/dice-source-roll.css &&
               curl -fLsS --max-time 15 "$base/dice-2004-full-frame.css?qa=${GITHUB_SHA}" -o /tmp/leaf-full-frame.css &&
               cmp -s /tmp/leaf-full-frame.css apps/4leaf/rog/dice-2004-full-frame.css &&
               cmp -s /tmp/leaf-pwa-sw.js apps/4leaf/rog/sw.js &&
               cmp -s /tmp/leaf-pwa-index.html apps/4leaf/rog/index.html; then
              ready=1
              echo "Published JS/CSS byte-for-byte match the checked-out source at ${GITHUB_SHA}"
              break
            fi
            echo "Published files not ready on attempt $attempt; retrying in 10 seconds"
            sleep 10
          done
          test "$ready" = "1"
      - name: Install real Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Verify published MainFrame native 120x270 sprite navigation and mobile on public Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/mainframe-native-toolbar.cjs
      - name: Verify original Registry Avatar Select PNGs and live avatar choice sync between two published Pages visitors
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/registry-native-avatar-dialog.cjs
      - name: Verify original expression atlas buttons and two real visitors on public Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/chatroom-native-expressions.cjs
      - name: Verify published source-native room-master creation panel, original Cancel and real private room
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/chatroom-native-owner-dialog.cjs
      - name: Verify published original room3/5 foreground uses exact 1:1 source pixels
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/chatroom-native-furniture-sizes.cjs
      - name: Verify published KnightTown sign pixels correlate with independent source backdrop
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/knighttown-sign-registration.cjs
      - name: Verify published source KnightTown original six region scene and functional Recordable routing
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/knighttown-original.cjs
      - name: Run real public 4LEAF ChatRoom, WorldMap, WebRTC and mobile tests
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/world-chat.cjs
      - name: Verify 16 published ChatTown districts show actual joinable permanent rooms
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/permanent-chatrooms.cjs
      - name: Verify actual public original ChatRoom 52x40 source scrollbar and accessible real history
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/chat-native-scrollbar.cjs
      - name: Verify published source Registry alpha and live original 1/3/5 vs 2/4/6 portraits
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/registry-native-portraits.cjs
      - name: Verify real public source four-up chessmen and actual item use in Chromium
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-chessmen-hud.cjs
      - name: Verify public source WorldMap full moon and original ChatTown north/south navigation
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/world-map-moon.cjs
      - name: Validate original-photo-referenced actual battle dice pips on public Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-battle-dice.cjs
      - name: Verify original-forest-backed live BATTLE stage, real actors, dice and mobile
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-battle-podium.cjs
      - name: Navigate actual source minimap and DMP viewport on published GitHub Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-minimap-navigation.cjs
      - name: Verify actual source DMP tile events and warp destination live camera without phantom moves on published Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-source-dmp-terrain-explorer.cjs
      - name: Explore live published DMP map with genuine camera drag, keyboard, wheel and pinch
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-dmp-full-camera.cjs
      - name: Prove published PWA refreshes the real roll code despite an intentionally stale cache
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/pwa-dice-upgrade.cjs
      - name: Verify publicly deployed original 800px game world with both native player rails and side HUD
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-2004-full-frame.cjs
      - name: Verify archived 2004-positioned ROLL HUD drives genuine public Chromium game
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-source-roll.cjs
      - name: Prove published 4LEAF phone dice rolls twice and DMP neighbor geometry is still source-aligned
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-mobile-roll-dmp-order.cjs
      - name: Install WebKit to test Safari-engine touch on public Pages
        run: npx playwright install webkit --with-deps
      - name: Verify the original battlefield ROLL HUD on public Safari-engine touchscreen
        env:
          FOURLEAF_BROWSER: webkit
          FOURLEAF_MOBILE: '1'
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-source-roll.cjs
      - name: Verify two genuine mobile dice rolls and DMP layout in WebKit on deployed Pages
        env:
          FOURLEAF_BROWSER: webkit
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-mobile-roll-dmp-order.cjs
      - name: Verify published full-size 145x97 original TIS raised platform overlap, DMP depth and mobile zoom
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-tis-depth.cjs
      - name: Verify published saved AI games cannot autoplay until manually re-enabled
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-ai-resume-guard.cjs
      - name: Verify corrected hex orientation and manual player turns
        run: node apps/4leaf/rog/tests/dice-native-orientation-manual.cjs
      - name: Verify true DMP tile-avatar interleaved painter order on actual published Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-pawn-dmp-depth.cjs
      - name: Check transparent original source TIS sprites and real turn on deployed Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-tis-alpha.cjs
      - name: Verify live game events and native Genesis dialog on published Pages
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-dialog-event.cjs
      - name: Verify deployed 800x600 native Dice frame, original ABILITY button, chat and minimap in Chromium
        env:
          FOURLEAF_TEST_URL: https://koith.github.io/browser-app-lab/apps/4leaf/rog/
        run: node apps/4leaf/rog/tests/dice-native-frame.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-rog-live-published-chat-screens
          path: leaf-*.png
          retention-days: 7

  public-qa-receipt:
    name: Publish GitHub status for the exact public 4LEAF Chromium run
    needs: [published-chat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report success ONLY if the published browser QA really passed
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ needs.published-chat.result }}' === 'success' ? 'success' : 'failure';
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: '4leaf/public-pages-chromium',
              description: state === 'success' ?
                'Published 4LEAF mobile dice and native DMP/TIS browser QA passed' :
                'Public 4LEAF browser QA failed, skipped or not yet deployed',
              target_url
            });
