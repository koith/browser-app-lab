name: Yui Mimmi Image-First Reverse Source Search
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/gallery-archive/reverse_image_discovery.py
      - apps/gallery-archive/test_reverse_image_discovery.py
      - .github/workflows/gallery-image-first-reverse-search.yml
permissions:
  contents: read
concurrency:
  group: gallery-image-first-search
  cancel-in-progress: false
jobs:
  reverse-public-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.12.3'
      - name: Check public photo URL safety and search-result extraction
        run: |
          python -m py_compile apps/gallery-archive/reverse_image_discovery.py
          python apps/gallery-archive/test_reverse_image_discovery.py
      - name: Verify title-first discovery, distinct volume identities and research-only accounting
        run: |
          python -m py_compile apps/gallery-archive/visual_work_discovery.py
          python apps/gallery-archive/test_visual_work_discovery.py
      - name: Find public pages for unseen Yui works using rotating title searches
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python apps/gallery-archive/visual_work_discovery.py \
            --search --max-works 4 --offset "$((GITHUB_RUN_NUMBER * 4))" \
            --out "$RUNNER_TEMP/title-first-leads.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"title-first-leads.json"
          x=json.loads(p.read_text())
          assert x['research_only_not_gallery_inventory']
          assert x['physical_new_files']==x['visible_new_files']==0
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write("## Title-first previously unregistered Yui works\n\n")
              out.write(f"Titles checked: {x['total_works']}; unregistered: {x['unmapped_works']}\n\n")
              out.write("Search hits are research leads, not stored images.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: yui-title-first-public-search-leads
          path: ${{ runner.temp }}/title-first-leads.json
          retention-days: 30
          if-no-files-found: error
      - name: Reverse search real on-disk public photo seeds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # A search result is NOT a photo download or a new gallery entry.
          python apps/gallery-archive/reverse_image_discovery.py \
            --seeds 6 --offset "$((GITHUB_RUN_NUMBER * 6))" \
            --output "$RUNNER_TEMP/reverse-leads.json" --delay 2
          python - <<'PY'
          from pathlib import Path
          import json,os
          path=Path(os.environ["RUNNER_TEMP"])/"reverse-leads.json"
          doc=json.loads(path.read_text())
          assert doc["research_only_not_acquired"]
          assert doc["new_private_photos_stored"] == doc["gallery_images_added"] == 0
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Real-photo reverse image discovery\n\n")
              out.write(f"Public stored photo seeds searched: {doc['seed_queries']}\n\n")
              out.write(f"Source result pages found: {doc['candidate_page_urls']}\n\n")
              out.write(f"Engine outcomes: {doc['engine_status_counts']}\n\n")
              out.write("Research only: no original downloaded, rehosted or added to gallery.\n")
              out.write("Only Google Lens ordinary public results; blocked/login results are not bypassed.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: yui-mimmi-reverse-image-source-leads
          path: ${{ runner.temp }}/reverse-leads.json
          retention-days: 30
          if-no-files-found: warn
