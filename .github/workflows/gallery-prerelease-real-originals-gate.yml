name: Gallery Pre-Release Real Existing Photo Acceptance Gate
on:
  pull_request:
    paths:
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/gateway/media_cache.py'
      - 'apps/gallery-archive/qa_prerelease_real_owner_gateway.py'
      - '.github/workflows/gallery-prerelease-real-originals-gate.yml'
permissions:
  contents: read
jobs:
  offline-gateway-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate both image variants before any existing owner credentials are accessed
        run: |
          python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt
          python -m py_compile apps/gallery-archive/qa_prerelease_real_owner_gateway.py apps/mimmi-gallery/cloud/gateway/main.py
          python apps/mimmi-gallery/cloud/test_owner_rescue_cache.py
          python apps/mimmi-gallery/cloud/test_provider_denial_gate.py
          python apps/mimmi-gallery/cloud/test_media_versions.py

  real-staged-owner-originals:
    needs: offline-gateway-safety
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        model: [mimmi, yui]
    env:
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install gateway candidate and pinned authorized original reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o "$RUNNER_TEMP/owner-client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/owner-client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/owner-client" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/owner-client.zip" -d "$RUNNER_TEMP/owner-client"
          binary="$(find "$RUNNER_TEMP/owner-client" -type f -name rclone -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Before deployment verify real originals, previews and cover on staged gateway
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          test -n "$MIMMI_COOKIE"
          test -n "$YUI_COOKIE"
          echo "::add-mask::$MIMMI_COOKIE"
          echo "::add-mask::$YUI_COOKIE"
          python apps/gallery-archive/qa_prerelease_real_owner_gateway.py --model "$MODEL"
          echo "- $MODEL: complete user-reported album ORIGINAL SHA+PREVIEW+cover in stage PASS" >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    runs-on: ubuntu-24.04
    needs: [offline-gateway-safety, real-staged-owner-originals]
    if: always()
    steps:
      - name: Never give release approval for partial, skipped or failed owner checks
        env:
          OFFLINE: ${{ needs.offline-gateway-safety.result }}
          REAL: ${{ needs.real-staged-owner-originals.result }}
        run: |
          test "$OFFLINE" = success
          test "$REAL" = success
          echo 'PREDEPLOY_REAL_ORIGINALS_BOTH_MODELS_VERIFIED'
          echo 'This is an approval to consider deploying the reviewed commit, NOT a claim that Render or an actual iPhone already passed.' >> "$GITHUB_STEP_SUMMARY"
