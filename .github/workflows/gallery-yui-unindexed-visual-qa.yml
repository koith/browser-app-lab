name: Gallery Yui Existing Inven Novel SHA vs Visual Same-Photo Check
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-yui-unindexed-visual-qa.yml'
      - 'apps/gallery-archive/probe_unindexed_inven_visual.py'
permissions:
  contents: read
jobs:
  compare-existing-owner-photos:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive/qa_existing_owner_exact_file.py
            apps/gallery-archive/probe_unindexed_inven_visual.py
            apps/mimmi-gallery/cloud/gateway/cookie_format.py
            apps/yui-gallery/stored-albums.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'Pillow==11.3.0'
          python -m py_compile apps/gallery-archive/probe_unindexed_inven_visual.py
      - name: Install existing checksum-pinned TeraBox client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          binary="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Read 13 known Yui album photos and 4 extra candidates, report scores only
        shell: bash
        run: |
          set -euo pipefail
          export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone cat 'archive:YuiArchive/metadata/catalog.json' --timeout 75s --retries 2 > "$RUNNER_TEMP/catalog.json" 2> "$RUNNER_TEMP/secret-errors"
          timeout 650 rclone lsjson 'archive:YuiArchive' -R --files-only --timeout 75s --retries 2 > "$RUNNER_TEMP/listing.json" 2> "$RUNNER_TEMP/list-errors"
          python apps/gallery-archive/probe_unindexed_inven_visual.py \
            --catalog "$RUNNER_TEMP/catalog.json" --listing "$RUNNER_TEMP/listing.json" \
            --saved apps/yui-gallery/stored-albums.json
