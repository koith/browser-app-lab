name: Gallery Owner Auto Rehydrate Mobile UI Regression
on:
  pull_request:
    paths:
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/index.html'
      - 'apps/gallery-archive/qa_owner_auto_rehydrate_browser.py'
      - '.github/workflows/gallery-owner-auto-rehydrate-ui-qa.yml'
permissions:
  contents: read
jobs:
  mobile-mock-503-to-200:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: auto-recovery visible tiles (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real mobile browser
        run: |
          python -m pip install 'playwright==1.58.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps '${{ matrix.browser }}'
          python -m py_compile apps/gallery-archive/qa_owner_auto_rehydrate_browser.py
      - name: Test both screenshot albums 503 to exact-owner restored thumbnail without refresh
        run: |
          python apps/gallery-archive/qa_owner_auto_rehydrate_browser.py --browser '${{ matrix.browser }}'
          echo 'UI mocked 503-to-200 transition passed; NOT live 214 owner originals nor physical iPhone' >> "$GITHUB_STEP_SUMMARY"
