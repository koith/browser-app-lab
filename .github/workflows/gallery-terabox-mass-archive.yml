name: Yui and Mimmi Real-Byte Mass TeraBox Archive
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/gallery-archive/terabox_stage.py'
      - 'apps/gallery-archive/verify_terabox.py'
      - 'apps/gallery-archive/test_stage.py'
      - '.github/workflows/gallery-terabox-mass-archive.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/terabox_stage.py'
      - 'apps/gallery-archive/verify_terabox.py'
      - 'apps/gallery-archive/test_stage.py'
      - '.github/workflows/gallery-terabox-mass-archive.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gallery-terabox-private-mass-upload
  cancel-in-progress: false
jobs:
  stage-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.3.0'
      - run: |
          python -m py_compile apps/gallery-archive/terabox_stage.py apps/gallery-archive/verify_terabox.py
          python apps/gallery-archive/test_stage.py
  mirror:
    if: github.ref == 'refs/heads/main'
    needs: stage-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [yui, mimmi]
    env:
      GH_TOKEN: ${{ github.token }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install photo decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Install checksum-pinned unofficial TeraBox rclone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/client" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/client"
          exe="$(find "$RUNNER_TEMP/client" -type f -name rclone -print -quit)"
          test -n "$exe"
          install -m 755 "$exe" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download all previously verified physical image ZIP artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input"
          download() {
            local run="$1" archive="$2"
            local destination="$RUNNER_TEMP/input/$run/$archive"
            mkdir -p "$destination"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$archive" --dir "$destination"
            if [[ "$(find "$destination" -name '*-private-import.zip' | wc -l)" -eq 0 ]]; then
              # The recovered 17-photo Actions artifact holds an outer ZIP.
              wrapper="$(find "$destination" -maxdepth 2 -type f -name '*.actions.zip' -print -quit)"
              if [[ -n "$wrapper" ]]; then
                mkdir -p "$destination/unpacked"
                unzip -q "$wrapper" -d "$destination/unpacked"
              fi
            fi
            test "$(find "$destination" -name '*-private-import.zip' | wc -l)" -gt 0
          }
          if [[ "${{ matrix.model }}" == "yui" ]]; then
            for archive in yui-original-verified-pixibb-large yui-original-verified-pixibb-other yui-original-verified-public-editorial yui-original-verified-source-variety-one yui-original-verified-source-variety-two; do
              download 40840677573 "$archive"
            done
            download 40796345185 yui-green91-real-private-files
          else
            for batch in 0 1 2; do
              download 40836863341 "mimmi-original-new-private-$batch"
              download 40840677680 "mimmi-original-new-private-$batch"
            done
            download 40841274270 mimmi-recovered-unfilled-17-private
          fi
          echo "PHYSICALLY_PRESERVED_INPUT_ZIPS=$(find "$RUNNER_TEMP/input" -name '*-private-import.zip' | wc -l)"
      - name: Verify all SHA, byte lengths and decoded dimensions and stage private media
        shell: bash
        run: |
          set -euo pipefail
          extras=()
          if [[ "${{ matrix.model }}" == "mimmi" ]]; then extras+=(--include-public); fi
          python apps/gallery-archive/terabox_stage.py --model "${{ matrix.model }}" \
            --inputs "$RUNNER_TEMP/input" --out "$RUNNER_TEMP/stage" "${extras[@]}"
      - name: Upload only to the owner's authenticated TeraBox
        shell: bash
        run: |
          set -euo pipefail
          export RCLONE_CONFIG_ARCHIVE_TYPE=terabox
          if [[ "${{ matrix.model }}" == "yui" ]]; then
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"
            remote="archive:YuiArchive"
          else
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"
            remote="archive:MimmiArchive"
          fi
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone lsd archive: --timeout 40s --retries 1 >/dev/null 2>"$RUNNER_TEMP/auth-errors"
          rclone copy "$RUNNER_TEMP/stage/originals" "$remote/originals" --ignore-existing --transfers 3 --checkers 4 --retries 3 --timeout 90s 2>"$RUNNER_TEMP/orig-errors"
          rclone copy "$RUNNER_TEMP/stage/previews" "$remote/previews" --ignore-existing --transfers 4 --checkers 4 --retries 3 --timeout 90s 2>"$RUNNER_TEMP/preview-errors"
          echo "Remote media upload submitted; SHA readback is still required."
      - name: Independently read back every cloud media byte, then publish catalog
        shell: bash
        run: |
          set -euo pipefail
          export RCLONE_CONFIG_ARCHIVE_TYPE=terabox
          if [[ "${{ matrix.model }}" == "yui" ]]; then
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"
            remote="archive:YuiArchive"
          else
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"
            remote="archive:MimmiArchive"
          fi
          python apps/gallery-archive/verify_terabox.py --stage "$RUNNER_TEMP/stage" --remote "$remote" --workers 8
          rclone copyto "$RUNNER_TEMP/stage/metadata/catalog.json" "$remote/metadata/catalog.json"
          rclone copyto "$RUNNER_TEMP/stage/metadata/remote-verification.json" "$remote/metadata/remote-verification.json"
          expected="$(sha256sum "$RUNNER_TEMP/stage/metadata/catalog.json" | cut -d' ' -f1)"
          actual="$(rclone cat "$remote/metadata/catalog.json" | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$actual"
          echo "Original and preview bytes verified and TeraBox catalogue published: $remote" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve only audit metadata, not original photographs, in Actions summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-terabox-audit-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/stage/metadata/stage-audit.json
            ${{ runner.temp }}/stage/metadata/remote-verification.json
          if-no-files-found: warn
          retention-days: 30
