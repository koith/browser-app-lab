name: 4LEAF published Pages actual-game acceptance
on:
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/app-version.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/check-4leaf-r14-public.cjs'
      - '.github/workflows/4leaf-r14-public-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-r14:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser
        run: |
          npm install --no-save playwright
          npx playwright install '${{ matrix.engine }}' --with-deps
      - name: Check published main release/PWA and actual WorldMap gameplay
        env:
          FOURLEAF_BROWSER: '${{ matrix.engine }}'
        run: node .github/scripts/check-4leaf-r14-public.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: r14-public-live-failure-${{ matrix.engine }}
          path: 4leaf-r14-public-fail-*.png
          if-no-files-found: ignore
