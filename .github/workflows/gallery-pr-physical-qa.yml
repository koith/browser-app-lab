name: Gallery PR Physical Photo & Source Search QA (Free Mac)
on:
  push:
    branches: [feat/gallery-cumulative-source-aliases-20261114]
    paths:
      - '.github/workflows/gallery-pr-physical-qa.yml'
      - 'apps/yui-gallery/stored-albums.json'
      - 'apps/gallery-archive/publish_new_public_photos_to_pages.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-photo-and-crawler-qa:
    runs-on: macos-15
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gallery-cumulative-source-aliases-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Compile the new actual image-first search and collecting code
        run: |
          python -m py_compile apps/gallery-archive/reverse_seed_priority.py apps/gallery-archive/reverse_image_sweep.py apps/gallery-archive/source_alias_search.py apps/gallery-archive/source_name_ledger.py apps/gallery-archive/publisher_completion.py apps/gallery-archive/direct_photo_pipeline.py apps/gallery-archive/publish_new_public_photos_to_pages.py
          python apps/gallery-archive/test_source_names_publisher.py
          python apps/gallery-archive/test_source_alias_search.py
      - name: Test every seeded image can be reverse-searched without invented photos
        run: |
          (cd apps/gallery-archive && python test_reverse_image_sweep.py)
          (cd apps/gallery-archive && python test_direct_photo_pipeline.py)
      - name: Check both models' actual static gallery and all new Yui JPEG SHA+dimensions
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          distinct=set()
          for model in ('mimmi','yui'):
              root=Path('apps')/(model+'-gallery')
              data=json.loads((root/'stored-albums.json').read_text(encoding='utf-8'))
              total=0
              for album in data['albums']:
                  for image in album.get('images',[]):
                      p=root/image['url']
                      assert p.is_file(),p
                      raw=p.read_bytes()
                      sha=hashlib.sha256(raw).hexdigest()
                      assert sha==image['sha256'],p
                      assert len(raw)==image['bytes'],p
                      with Image.open(p) as im:
                          im.verify()
                      with Image.open(p) as im:
                          im.load()
                          assert im.size==(image['width'],image['height']),(p,im.size)
                      total+=1
                  
              if 'physical_verified_image_count' in data:
                  assert data['physical_verified_image_count']==total,(model,total,data['physical_verified_image_count'])
              print('MODEL_REAL_PHOTOS_VERIFIED',model,total,flush=True)
          for suffix,expected in [('79e69bf2e145281853e9','79e69bf2e145281853e90ae4a10487e827e9c83a19d4144ccd2eee3da85ae8e8'),('94d889c67b3fd7749d16','94d889c67b3fd7749d1610373ac32b2c03d066618d35fd2dfaf70569f8d359ed')]:
              p=Path('apps/yui-gallery/stored-albums/public-yui-sns')/(suffix+'.jpg')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected,p
              distinct.add(expected)
          assert len(distinct)==2
          print('YUI_NEW_PUBLIC_SNS_TWO_DISTINCT_REAL_FILES_SHA_PASS')
          PY
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
