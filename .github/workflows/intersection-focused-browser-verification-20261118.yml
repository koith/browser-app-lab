name: INTERSECTION — Focused Verified Popup and Archive 20261118
on:
  push:
    branches:
      - agent/intersection-fix-qa-fixture-20261118
    paths:
      - apps/demand-research/test_post_modal_inline_backup_browser.py
      - apps/demand-research/test_account_archive_picker_browser.py
      - .github/workflows/intersection-focused-browser-verification-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
    steps:
      - uses: actions/checkout@v4
      - name: Install browser-driver library (browser binaries preinstalled)
        run: python -m pip install --disable-pip-version-check --quiet playwright==1.56.0
      - name: Verify post block confirm closes popup, modal fixed height, purge response
        run: python apps/demand-research/test_post_modal_inline_backup_browser.py
      - name: Verify account switch waits feed and nickname never disappears
        run: python apps/demand-research/test_account_archive_picker_browser.py
