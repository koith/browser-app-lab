name: 4LEAF source special tiles and market historical rule gate
on:
  pull_request:
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/source-rules-shop-20261121.cjs'
      - '.github/workflows/rog-source-rules-shop-20261121.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/source-rules-shop-20261121.cjs'
      - '.github/workflows/rog-source-rules-shop-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      FOURLEAF_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install "$FOURLEAF_BROWSER" --with-deps
          nohup python3 -m http.server 8765 --directory apps/4leaf/rog >/tmp/leaf-rules.log 2>&1 &
          sleep 2
      - run: node apps/4leaf/rog/tests/source-rules-shop-20261121.cjs
      - run: node apps/4leaf/rog/tests/shop-original-serial-resale.cjs
