name: Yui Full Image and Owner Gallery Verification
on:
  push:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-verification.yml
  pull_request:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-viewing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            os: ubuntu-24.04
          - engine: webkit
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free local tools
        timeout-minutes: 7
        run: |
          pip install Pillow requests playwright==1.58.0 gallery-dl fastapi httpx
          python -m playwright install ${{ matrix.engine }}
      - name: Verify byte preservation and collector behavior
        run: |
          node apps/yui-gallery/test_version.cjs
          python apps/yui-gallery/test_auto_registration.py
          python apps/yui-gallery/test_gallery_dl_collector.py
          python apps/yui-gallery/test_source_viewer_manifest.py
          python apps/yui-gallery/cloud/test_ingest_directories.py
          python apps/yui-gallery/cloud/test_verify_remote.py
          python apps/yui-gallery/cloud/test_gateway.py
      - name: Verify mobile navigation, decode every image and check original links
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-http.log 2>&1 &
          python apps/yui-gallery/qa_mobile_navigation.py --engine ${{ matrix.engine }} --out yui-navigation-${{ matrix.engine }}.json
          python apps/yui-gallery/qa_gallery.py --engine ${{ matrix.engine }} --out yui-${{ matrix.engine }}.json
          python apps/yui-gallery/qa_owner_media.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gallery-${{ matrix.engine }}
          path: yui-${{ matrix.engine }}.json
          archive: false
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-${{ matrix.engine }}
          path: yui-navigation-${{ matrix.engine }}.json
          archive: false
          if-no-files-found: ignore
