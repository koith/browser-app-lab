name: Yui Full Stored-Image and Private Gateway Verification
on:
  push:
    branches: [main]
    paths: ['apps/yui-gallery/**', '.github/workflows/yui-gallery-verification.yml']
  pull_request:
    paths: ['apps/yui-gallery/**', '.github/workflows/yui-gallery-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-files-and-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free QA browser and image validators
        run: |
          python -m pip install Pillow requests playwright==1.58.0 fastapi httpx
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Verify manifest truth, photo hashes, and collection policy
        run: |
          node apps/yui-gallery/test_version.cjs
          node apps/yui-gallery/test_gallery_labels.cjs
          node apps/yui-gallery/test_publishers.cjs
          python apps/yui-gallery/test_identity_policy.py
          python apps/yui-gallery/test_photo_quality_policy.py
          python apps/yui-gallery/test_source_viewer_manifest.py
          python apps/yui-gallery/cloud/test_gateway.py
      - name: Verify every published Pages file; private originals have separate deployed SHA QA
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-http.log 2>&1 &
          python apps/yui-gallery/qa_gallery.py --public-pages-files --engine ${{ matrix.engine }} --workers 1 --out yui-physical-${{ matrix.engine }}.json
          python apps/yui-gallery/qa_owner_media.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-physical-${{ matrix.engine }}
          path: yui-physical-${{ matrix.engine }}.json
          if-no-files-found: ignore
          retention-days: 14
