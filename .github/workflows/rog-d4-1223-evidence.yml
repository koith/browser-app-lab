name: 4LEAF examine preserved 1223 OBS D4 candidate
on:
  push:
    branches: [research/4leaf-d4-1223-20261101]
    paths: [.github/workflows/rog-d4-1223-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch preserved SHA-verified original extraction evidence and isolate candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13077121974/zip" -o "$RUNNER_TEMP/leaf-artifact.zip"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          a=zipfile.ZipFile(__import__('os').environ['RUNNER_TEMP']+'/leaf-artifact.zip')
          names=a.namelist()
          want=lambda s: next((n for n in names if n.lower().endswith(s.lower())),None)
          candidates=want('d4-candidates.json')
          contacts=[n for n in names if n.lower().endswith('/1223.png')]
          meta=[n for n in names if n.lower().endswith('/1223.json')]
          assert candidates and contacts and meta,(candidates,contacts,meta,names[:30])
          root=Path('apps/4leaf/rog/docs/evidence/1223')
          root.mkdir(parents=True,exist_ok=True)
          selected=[]
          for n in contacts:
              safe=n.replace('/','-').replace('..','_')
              raw=a.read(n)
              (root/safe).write_bytes(raw)
              selected.append({'file':safe,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'pathInArtifact':n})
          for n in meta:
              safe=n.replace('/','-').replace('..','_')
              raw=a.read(n)
              (root/safe).write_bytes(raw)
              selected.append({'file':safe,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'pathInArtifact':n})
          d4=json.loads(a.read(candidates))
          (root/'d4-candidates.json').write_text(json.dumps(d4,indent=2)+'\n')
          (root/'source-provenance.json').write_text(json.dumps({
              'artifactId':13077121974,'sourceRunId':41290777900,
              'archiveSHA1':'86526d89679ae39b85fe9808da97ad871b7888d9',
              'selected':selected,'matchingCandidates':[x for x in d4 if x.get('member','').lower()=='1223.obs'],
              'warning':'OBS contact sheets are candidate evidence, NOT proof of 3D D4 original mesh or exact frame-to-result mapping'
          },indent=2)+'\n')
          print('1223 evidence:',json.dumps(selected))
          PY
      - name: Store only reviewable original candidate evidence on research branch
        run: |
          set -euo pipefail
          git config user.name "4LEAF source-evidence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/4leaf/rog/docs/evidence/1223/
          git commit -m "test(4leaf): preserve original OBS 1223 contact sheets and metadata"
          git push origin HEAD:refs/heads/research/4leaf-d4-1223-20261101
