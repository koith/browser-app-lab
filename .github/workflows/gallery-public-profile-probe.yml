name: Gallery Social Public Timeline Source Probe
on:
  workflow_dispatch:
  push:
    branches: [main, feat/gallery-public-social-mirror-20261030, fix/gallery-social-cdn-failure-analysis-20261030]
    paths:
      - 'apps/gallery-archive/probe_public_profile_media.py'
      - 'apps/gallery-archive/collect_teapawt_public.py'
      - '.github/workflows/gallery-public-profile-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 Pillow
      - run: python -m py_compile apps/gallery-archive/probe_public_profile_media.py
      - run: python apps/gallery-archive/probe_public_profile_media.py
