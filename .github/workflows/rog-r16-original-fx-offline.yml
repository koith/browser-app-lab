name: 4LEAF R16 exact original duel FX cold-offline PWA acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/sw.js'
      - 'apps/4leaf/rog/app-version.json'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/tests/native-offline-cache.cjs'
      - 'apps/4leaf/rog/tests/r16-offline-native-fx-source-integrity.cjs'
      - '.github/workflows/rog-r16-original-fx-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r16-original-fx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source pixels and service worker file integrity
        run: |
          node --check apps/4leaf/rog/sw.js
          node --check apps/4leaf/rog/tests/native-offline-cache.cjs
          node apps/4leaf/rog/tests/r16-offline-native-fx-source-integrity.cjs
      - name: Install actual Chromium for cold-offline PWA browser QA
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve real 4LEAF static app
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/4leaf-r16-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fLsS --max-time 2 http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/4leaf-r16-http.log
          exit 1
      - name: Cold-offline PWA authentic MainFrame / chat / dice / native OBS effects
        env:
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/native-offline-cache.cjs
