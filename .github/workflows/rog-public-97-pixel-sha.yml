name: 4LEAF published all native 97 CHR original frame PNG source integrity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rog-public-97-pixel-sha.yml'
      - '.github/scripts/check-4leaf-public-97-chr-pixels.cjs'
      - 'apps/4leaf/rog/app-version.json'
      - 'apps/4leaf/rog/chr-body-source-map.js'
      - 'apps/4leaf/rog/original/OBS/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rog-public-97-pixel-sha.yml'
      - '.github/scripts/check-4leaf-public-97-chr-pixels.cjs'
      - 'apps/4leaf/rog/app-version.json'
      - 'apps/4leaf/rog/chr-body-source-map.js'
      - 'apps/4leaf/rog/original/OBS/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premerge-local-source-pixels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all archived native actor PNGs against their own manifest SHA256
        env:
          FOURLEAF_LOCAL_ONLY: '1'
        run: node .github/scripts/check-4leaf-public-97-chr-pixels.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: fourleaf-premerge-local-all-native-frame-shas
          path: 4leaf-local-97-source-pixel-audit.json
          retention-days: 14
  public-source-pixels:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Verify live manifest and release metadata exactly match checkout'
        run: |
          set -euo pipefail
          base="https://koith.github.io/browser-app-lab/apps/4leaf/rog"
          for item in app-version.json chr-body-source-map.js original/OBS/referenced/chr-bodies-manifest.js; do
            file=$(mktemp)
            ok=0
            for attempt in $(seq 1 50); do
              curl -fsSL --retry 1 --connect-timeout 10 --max-time 25 "$base/$item?sha_source=${GITHUB_SHA}" -o "$file" || true
              if cmp -s "$file" "apps/4leaf/rog/$item"; then
                echo "LIVE_ORIGINAL_MANIFEST_SHA_PASS $item"
                ok=1
                break
              fi
              sleep 12
            done
            rm -f "$file"
            if [ "$ok" != "1" ]; then
              echo "::error::Published source is stale: $item"
              exit 1
            fi
          done
      - name: 'Verify ALL original source frames of 97 CHR bodies on actual published Pages'
        run: node .github/scripts/check-4leaf-public-97-chr-pixels.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourleaf-public-all-97-frames-pixel-sha
          path: 4leaf-public-97-source-pixel-audit.json
          if-no-files-found: ignore
          retention-days: 14
