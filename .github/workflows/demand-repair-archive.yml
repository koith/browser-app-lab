name: INTERSECTION — Verify and Rebuild Private TeraBox Archive
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/demand-research/rebuild_archive.py"
      - "apps/demand-research/inspect_terabox_status.py"
      - "apps/demand-research/test_archive_integrity_status.py"
      - ".github/workflows/demand-repair-archive.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/rebuild_archive.py"
      - "apps/demand-research/inspect_terabox_status.py"
      - "apps/demand-research/test_archive_integrity_status.py"
      - "apps/demand-research/recover_spool_artifacts.py"
      - ".github/workflows/demand-replay-encrypted.yml"
      - "apps/demand-research/demand_archive.py"
      - ".github/workflows/demand-repair-archive.yml"
permissions:
  contents: read
  actions: read
concurrency:
  # Same production group as encrypted replay, to avoid overlapping
  # long-running cloud maintenance requests on the unofficial backend.
  group: ${{ github.event_name == 'pull_request' && format('intersection-repair-pr-{0}', github.head_ref) || 'intersection-private-maintenance-production' }}
  cancel-in-progress: false
  queue: max
jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate read-only archive reconciliation and media SHA sampling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==46.0.4
          cd apps/demand-research
          python -m py_compile rebuild_archive.py inspect_terabox_status.py test_archive_integrity_status.py
          python -m pytest -q test_archive_integrity_status.py test_rebuild_index_readback.py
  repair-and-verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      # Single TeraBox upload chunk avoids parallel backend request bursts.
      RCLONE_CONFIG_ARCHIVE_UPLOAD_THREADS: "1"
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
      DEMAND_TERABOX_REMOTE: "archive:DemandResearch"
      DEMAND_CAPTURE_PUBLIC_ALLOWED: "1"
      DEMAND_ARCHIVE_RECOVERY_KEY: ${{ secrets.DEMAND_ARCHIVE_RECOVERY_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if private archive configuration missing
        run: test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
      - name: Install fixed TeraBox rclone backend
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -qi terabox
      # Private AES-GCM replay is separately operated by demand-replay-encrypted.yml
      # using the same GitHub concurrency group. Running both serially in
      # this 20-minute job previously starved the catalog's verification time.
      - name: Validate and restore posts, publish compact catalog, then verify via fresh reader
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1050s python rebuild_archive.py
      - name: Read-only post-journal inventory
        if: always()
        working-directory: apps/demand-research
        run: python inspect_terabox_status.py
