name: Yui 18 Missing Web Photo Numbers Byte Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yui-18-public-missing-byte-recovery.yml'
      - 'apps/gallery-archive/package_yui_known_gaps.py'
permissions:
  contents: read
concurrency:
  group: yui-18-specific-missing-photo-recovery
  cancel-in-progress: false
jobs:
  recover-known-numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install free original image and ordinary browser verification tools
        run: |
          python -m pip install 'requests==2.32.5' 'Pillow==11.3.0' 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Verify both photo source and numbered missing-slot packager
        run: |
          python -m py_compile apps/yui-gallery/download_jliji_collections.py
          python -m py_compile apps/gallery-archive/package_yui_known_gaps.py
      - name: Download publicly visible original image bytes and every page member
        run: |
          python apps/yui-gallery/download_jliji_collections.py \
            --albums teddy-bear97,wet-yui80
      - name: Retain only exact numbered holes without overwriting previous 159 photos
        run: |
          python apps/gallery-archive/package_yui_known_gaps.py \
            --source yui-jliji-full-private \
            --out "$RUNNER_TEMP/yui-known-18"
      - name: Deliver only downloaded real verified files to owner-private incremental importer
        uses: actions/upload-artifact@v4
        with:
          name: yui-original-verified-jliji-missing-18
          path: ${{ runner.temp }}/yui-known-18/*-private-import.zip
          if-no-files-found: error
          retention-days: 5
      - name: Record evidence without publishing photos in the gallery prematurely
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-18-known-public-number-gap-audit
          path: |
            ${{ runner.temp }}/yui-known-18/audit.json
            yui-jliji-full-private/summary.json
          if-no-files-found: warn
          retention-days: 15
