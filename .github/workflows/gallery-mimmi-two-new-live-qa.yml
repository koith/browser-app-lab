name: Gallery Mimmi Two New Exact Originals and Deployed Native Browser QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_cloudflare_full_remote.py'
      - '.github/workflows/gallery-mimmi-two-new-live-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_cloudflare_full_remote.py'
      - '.github/workflows/gallery-mimmi-two-new-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-mimmi-new-two-live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-new-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet 'Pillow==11.3.0'
          python -m py_compile apps/gallery-archive/qa_cloudflare_full_remote.py
          python apps/gallery-archive/qa_cloudflare_full_remote.py --scope recent
  deployed-two-native:
    needs: exact-new-two
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install independent native browser for real published gallery
        run: |
          python -m pip install --quiet 'playwright==1.58.0' 'requests' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify both genuinely new physical Mimmi photographs through public Pages
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/qa_new_physical_photos.py \
            --model mimmi --browser '${{ matrix.browser }}' \
            --since-commit cda1fb7946b9ff7db2d08875c26886f4a28a5f78 \
            --current-commit e7ca381c2cae28b5cda7e986966a2b495ad92a4a \
            --out "$RUNNER_TEMP/mimmi-two-${{ matrix.browser }}.json"
      - name: Print only verified real photo results, not URL/index guesses
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('mimmi-two-*.json'):
              d=json.loads(p.read_text())
              print('G03_NEW_TWO_NATIVE_RESULT',json.dumps({
                'model':d.get('model'), 'browser':d.get('browser'),
                'new_rows':d.get('all_new_or_upgraded_rows'),
                'real_photos_verified':len(d.get('photos',[])),
                'success':d.get('success',False), 'reload_pass':d.get('reload_pass',False),
                'photos':[{'album':x['album'],'number':x['number'],
                           'thumbnail_decoded':x['thumbnail_decoded'],
                           'lightbox_decoded':x['lightbox_decoded'],
                           'download_sha256_verified':x['download_sha256_verified']}
                          for x in d.get('photos',[])]
              },ensure_ascii=False))
          PY
  suspect-rudy-59-readonly:
    # Separate from two-photo release: a transient 1042/404 must not
    # cause valid new originals to be reported absent.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet 'Pillow==11.3.0'
          python apps/gallery-archive/qa_cloudflare_full_remote.py --scope incident
