name: Gallery title clue discovery research gate
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/title_clue_discovery.py'
      - 'apps/gallery-archive/test_title_clue_discovery.py'
      - 'apps/gallery-archive/collect_title_official_samples.py'
      - '.github/workflows/gallery-title-clue-discovery.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-title-clue-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: title-clue-official-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model: [yui, mimmi]
    env:
      MODEL: ${{ matrix.model }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 Pillow
      - name: Verify title clues and source transport
        run: |
          python apps/gallery-archive/test_title_clue_discovery.py
          python -m py_compile apps/gallery-archive/collect_title_official_samples.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'apps/gallery-archive')
          from collect_title_official_samples import OfficialPublicSession
          client=OfficialPublicSession()
          for u in ('https://example.com/photo.jpg','https://djawaphoto.com/shop/cart','https://djawaphoto.com/login'):
              try: client.get(u)
              except ValueError: pass
              else: raise AssertionError('unapproved URL passed')
          print('OFFICIAL_TRANSPORT_BOUNDARY_PASS')
          PY
      - name: Resume previous persistent search state
        run: |
          set -euo pipefail
          mkdir -p /tmp/title-clue
          for run in 44736840457 44736754147; do
            if gh run download "$run" -n "title-clue-research-$MODEL" -D /tmp/title-clue 2>/dev/null && test -s "/tmp/title-clue/$MODEL.sqlite"; then break; fi
          done
          test -s "/tmp/title-clue/$MODEL.sqlite"
          python -c "import sqlite3;q=sqlite3.connect('/tmp/title-clue/$MODEL.sqlite'); print('OFFICIAL_RESUME',q.execute('select kind,status,count(*) from task group by kind,status').fetchall())"
      - name: Continue search and export official article evidence
        run: |
          python apps/gallery-archive/title_clue_discovery.py --model "$MODEL" --state "/tmp/title-clue/$MODEL.sqlite" --out "/tmp/title-clue/$MODEL.json" --official-seeds --budget 120 --max-seconds 100 --collection-evidence "/tmp/title-clue/$MODEL-collection.json"
      - name: Real publisher sample collection in both PR and production
        run: |
          python apps/gallery-archive/collect_title_official_samples.py --model "$MODEL" --evidence "/tmp/title-clue/$MODEL-collection.json" --stage "/tmp/title-clue/$MODEL-stage"
      - name: Reconcile actual SHA-verified official photos in working tree
        run: |
          shopt -s nullglob
          for stage in "/tmp/title-clue/$MODEL-stage"/batch-*; do
            if test -f "$stage/metadata/catalog.json"; then
              python apps/gallery-archive/publish_new_public_photos_to_pages.py --model "$MODEL" --stage "$stage" --limit 60 --budget 36000000
            fi
          done
      - name: Save only verified public publisher samples on production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for retry in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for stage in "/tmp/title-clue/$MODEL-stage"/batch-*; do
              if test -f "$stage/metadata/catalog.json"; then
                python apps/gallery-archive/publish_new_public_photos_to_pages.py --model "$MODEL" --stage "$stage" --limit 60 --budget 36000000
              fi
            done
            git add "apps/$MODEL-gallery/stored-albums.json" "apps/$MODEL-gallery/stored-albums/" "apps/$MODEL-gallery/album-covers.json"
            if git diff --cached --quiet; then echo "OFFICIAL_NO_NEW_GALLERY_BYTES $MODEL"; exit 0; fi
            git commit -m "gallery: reconcile verified official samples for $MODEL"
            if git push origin HEAD:main; then echo "OFFICIAL_GALLERY_COMMIT $MODEL $(git rev-parse HEAD)"; exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-clue-research-${{ matrix.model }}
          path: |
            /tmp/title-clue/${{ matrix.model }}.sqlite
            /tmp/title-clue/${{ matrix.model }}.json
            /tmp/title-clue/${{ matrix.model }}-collection.json
            /tmp/title-clue/${{ matrix.model }}-stage/batch-*/metadata/collection-audit.json
            /tmp/title-clue/${{ matrix.model }}-stage/batch-*/metadata/pages-publication.json
          retention-days: 90
