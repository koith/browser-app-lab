name: Gallery title clue discovery research gate
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/title_clue_discovery.py'
      - 'apps/gallery-archive/test_title_clue_discovery.py'
      - 'apps/gallery-archive/direct_photo_pipeline.py'
      - '.github/workflows/gallery-title-clue-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/title_clue_discovery.py'
      - '.github/workflows/gallery-title-clue-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [yui, mimmi]
    env:
      MODEL: ${{ matrix.model }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Test title analysis and saved checkpoint handling
        run: python apps/gallery-archive/test_title_clue_discovery.py
      - name: Restore previous actual title-discovery checkpoint, never restart from zero
        run: |
          mkdir -p /tmp/title-clue
          # Pick a successful prior same-workflow artifact. The original run
          # used one combined artifact, newer runs use per-model artifacts.
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gallery-title-clue-discovery.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id'); do
            if gh run download "$run" -n "title-clue-research-$MODEL" -D /tmp/title-clue 2>/dev/null && test -s "/tmp/title-clue/$MODEL.sqlite"; then
              echo "TITLE_CLUE_RESUMED_RUN $run model=$MODEL"
              break
            fi
          done
          if ! test -s "/tmp/title-clue/$MODEL.sqlite"; then
            gh run download 44731500463 -n title-clue-research-evidence -D /tmp/title-clue
          fi
          test -s "/tmp/title-clue/$MODEL.sqlite"
          python -c "import sqlite3; q=sqlite3.connect('/tmp/title-clue/$MODEL.sqlite'); print('TITLE_CLUE_RESTORED',q.execute('select kind,status,count(*) from task group by kind,status').fetchall())"
      - name: Continue existing page queue and test permitted alternative search engines
        run: |
          python apps/gallery-archive/title_clue_discovery.py --model "$MODEL" --state "/tmp/title-clue/$MODEL.sqlite" --out "/tmp/title-clue/$MODEL.json" --official-seeds --budget 120 --max-seconds 180 --collection-evidence "/tmp/title-clue/$MODEL-collection.json"
      - name: Collect and verify actual official public samples, not candidate URLs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import json,os,subprocess,sys
          model=os.environ['MODEL']; root='/tmp/title-clue/'
          evidence=root+model+'-collection.json'
          rows=json.load(open(evidence))['targets']
          ids=[r['id'] for r in rows if r.get('urls')]
          if not ids:
              print('TITLE_CLUE_NO_OFFICIAL_COLLECTION_TARGETS',model)
              sys.exit(0)
          stage=root+model+'-stage'
          args=[sys.executable,'apps/gallery-archive/direct_photo_pipeline.py','--model',model,
                '--owner','apps/'+model+'-gallery/owner-index.json','--out',stage,
                '--reverse-evidence',evidence,'--official-publisher-only',
                '--max-new','60','--max-pages','8','--render-budget','0']
          for aid in ids[:60]: args.extend(['--album-id',aid])
          subprocess.run(args,check=True,timeout=360)
          audit=json.load(open(stage+'/metadata/collection-audit.json'))
          print('TITLE_CLUE_PHYSICAL_STAGED',model,audit['new_local_individual_files'])
          for row in audit.get('results',[]):
              print('TITLE_CLUE_WORK',row.get('id'),row.get('individual_files_saved'),row.get('published_image_candidates'),len(row.get('failures',[])))
          PY
      - name: Reconcile public sample files into existing Gallery Pages manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          STAGE="/tmp/title-clue/$MODEL-stage"
          if ! test -f "$STAGE/metadata/catalog.json"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for retry in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python apps/gallery-archive/publish_new_public_photos_to_pages.py --model "$MODEL" --stage "$STAGE" --limit 60 --budget 36000000
            git add "apps/$MODEL-gallery/stored-albums.json" "apps/$MODEL-gallery/stored-albums/" "apps/$MODEL-gallery/album-covers.json"
            if git diff --cached --quiet; then echo "TITLE_CLUE_NO_NEW_GALLERY_BYTES $MODEL"; exit 0; fi
            git commit -m "gallery: reconcile verified official public samples for $MODEL"
            if git push origin HEAD:main; then echo "TITLE_CLUE_PHYSICAL_COMMITTED $MODEL $(git rev-parse HEAD)"; exit 0; fi
          done
          exit 1
      - name: Preserve durable per-model cursor and verified official collection input
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-clue-research-${{ matrix.model }}
          path: |
            /tmp/title-clue/${{ matrix.model }}.sqlite
            /tmp/title-clue/${{ matrix.model }}.json
            /tmp/title-clue/${{ matrix.model }}-collection.json
            /tmp/title-clue/${{ matrix.model }}-stage/metadata/collection-audit.json
            /tmp/title-clue/${{ matrix.model }}-stage/metadata/pages-publication.json
          retention-days: 90
          if-no-files-found: error
