name: INTERSECTION — Promotional Media Ad Filter QA

on:
  pull_request:
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/test_ad_promo_filter.mjs"
      - ".github/workflows/intersection-ad-filter-qa.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/test_ad_promo_filter.mjs"
      - ".github/workflows/intersection-ad-filter-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intersection-ad-filter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ad-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate campaign detector and ordinary post false positives
        run: |
          set -euo pipefail
          node --check apps/demand-research/test_ad_promo_filter.mjs
          node apps/demand-research/test_ad_promo_filter.mjs
