          fi
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone copy "$RUNNER_TEMP/stage/originals" "$remote/originals" --ignore-existing \
            --transfers 3 --checkers 4 --timeout 60s --retries 2 2>"$RUNNER_TEMP/transfer-errors"
          rclone copy "$RUNNER_TEMP/stage/previews" "$remote/previews" --ignore-existing \
            --transfers 3 --checkers 4 --timeout 60s --retries 2 2>"$RUNNER_TEMP/transfer-errors"
          python apps/gallery-archive/verify_terabox.py --stage "$RUNNER_TEMP/stage" \
            --remote "$remote" --workers 6 --only-staged
          rclone copyto "$RUNNER_TEMP/stage/metadata/catalog.json" "$remote/metadata/catalog.json"
          expected="$(sha256sum "$RUNNER_TEMP/stage/metadata/catalog.json" | cut -d' ' -f1)"
          actual="$(rclone cat "$remote/metadata/catalog.json" | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$actual"
          cat "$RUNNER_TEMP/stage/metadata/incremental-merge.json" >> "$GITHUB_STEP_SUMMARY"
          echo "New photo byte files remotely SHA verified; old photo numbers preserved" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public-free audit statistics without original image bytes
        uses: actions/upload-artifact@v4
        if: steps.previous.outputs.ready == 'true'
        with:
          name: gallery-terabox-incremental-audit-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/stage/metadata/incremental-merge.json
            ${{ runner.temp }}/stage/metadata/remote-verification.json
          if-no-files-found: warn
          retention-days: 30
