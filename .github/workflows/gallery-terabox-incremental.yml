name: Gallery Automatic New Photo Bytes to Private TeraBox
on:
  workflow_run:
    workflows:
      - "Mimmi Missing SHA Public Photos To Private ZIP Archive"
      - "Mimmi Full Public PixiBB SHA Photo Gap Backfill"
      - "Yui Public Sources To Private Original-Byte Archives"
      - "Yui Known Missing 18 Photo Slots Physical Recovery"
      - "Yui 137 Public Web Album Bytes Private Recovery"
      - "Yui 18 Missing Web Photo Numbers Byte Recovery"
      - "Yui Public SNS Photo Archive"
      - "Independent Yui and Mimmi Photoshoot Original Byte Archive"
      - "Gallery Public Creator Social Bulk Photo Bytes"
    types: [completed]
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-terabox-incremental.yml'
  pull_request:
    paths:
      - 'apps/gallery-archive/merge_incremental.py'
      - 'apps/gallery-archive/test_incremental.py'
      - 'apps/gallery-archive/terabox_stage.py'
      - 'apps/gallery-archive/verify_terabox.py'
      - '.github/workflows/gallery-terabox-incremental.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-integrity-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.3.0'
      - run: |
          python -m py_compile apps/gallery-archive/*.py
          python apps/gallery-archive/test_stage.py
          python apps/gallery-archive/test_incremental.py
  import:
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    needs: offline-integrity-tests
    concurrency:
      # Each owner model has an independent folder and catalog; do not let
      # the pending Yui import cancel the Mimmi matrix job (or vice versa).
      group: gallery-terabox-private-mass-upload-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [yui, mimmi]
    env:
      GH_TOKEN: ${{ github.token }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Choose only trusted recent source workflow run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          model="${{ matrix.model }}"
          if [[ "$model" == yui ]]; then workflow='yui-private-bulk-archive.yml';pattern='^yui-original-verified-';else workflow='mimmi-private-missing-archive.yml';pattern='^mimmi-original-new-private-';fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            if [[ "$model" == yui && "$SOURCE_NAME" != 'Yui Public Sources To Private Original-Byte Archives' && "$SOURCE_NAME" != 'Yui Known Missing 18 Photo Slots Physical Recovery' && "$SOURCE_NAME" != 'Yui 137 Public Web Album Bytes Private Recovery' && "$SOURCE_NAME" != 'Yui 18 Missing Web Photo Numbers Byte Recovery' && "$SOURCE_NAME" != 'Yui Public SNS Photo Archive' && "$SOURCE_NAME" != 'Independent Yui and Mimmi Photoshoot Original Byte Archive' && "$SOURCE_NAME" != 'Gallery Public Creator Social Bulk Photo Bytes' ]] || [[ "$model" == mimmi && "$SOURCE_NAME" != 'Mimmi Missing SHA Public Photos To Private ZIP Archive' && "$SOURCE_NAME" != 'Mimmi Full Public PixiBB SHA Photo Gap Backfill' && "$SOURCE_NAME" != 'Independent Yui and Mimmi Photoshoot Original Byte Archive' && "$SOURCE_NAME" != 'Gallery Public Creator Social Bulk Photo Bytes' ]]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT";exit 0
            fi
            if [[ "$SOURCE_NAME" == 'Mimmi Full Public PixiBB SHA Photo Gap Backfill' ]]; then
              pattern='^mimmi-pixibb-new-verified-[0-9]+              pattern='^yui-original-verified-jliji-137$'
            fi
            if [[ "$SOURCE_NAME" == 'Yui 18 Missing Web Photo Numbers Byte Recovery' ]]; then
              pattern='^yui-original-verified-jliji-missing-18$'
            fi
            if [[ "$SOURCE_NAME" == 'Independent Yui and Mimmi Photoshoot Original Byte Archive' ]]; then
              # This collector emits model-separated physical ZIP artifacts
              # rather than the historical single-source naming convention.
              pattern="^gallery-$model-independent-originals$"
            fi
            if [[ "$SOURCE_NAME" == 'Gallery Public Creator Social Bulk Photo Bytes' ]]; then
              pattern="^gallery-$model-social-originals$"
            fi
            run="$SOURCE_RUN_ID"
          else
            if [[ "$model" == yui ]]; then
              workflow='yui-18-public-missing-byte-recovery.yml'
              pattern='^yui-original-verified-jliji-missing-18$'
            fi
            run="$(gh run list --repo "$GITHUB_REPOSITORY" -w "$workflow" --branch main \
                    --json databaseId,conclusion --limit 20 \
                    --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          fi
          if [[ -z "$run" || ! "$run" =~ ^[0-9]+$ ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "No successful public-image file archive run for $model" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "source_run=$run" >> "$GITHUB_OUTPUT"
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
          echo "model=$model source_archive_run=$run"
      - name: Download only actual newly captured private-import ZIP photos
        if: steps.source.outputs.skip != 'true'
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          run="${{ steps.source.outputs.source_run }}"
          pattern="${{ steps.source.outputs.pattern }}"
          mkdir -p "$RUNNER_TEMP/new"
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
                      --jq '.artifacts[].name' | grep -E "$pattern" || true)"
          count=0
          while IFS= read -r name;do
            [[ -n "$name" ]] || continue
            folder="$RUNNER_TEMP/new/$run/$name"
            mkdir -p "$folder"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --name "$name" --dir "$folder"
            count=$((count+1))
          done <<< "$names"
          if [[ "$count" -eq 0 ]] || [[ "$(find "$RUNNER_TEMP/new" -name '*-private-import.zip' | wc -l)" -eq 0 ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "No new physical ZIPs for ${{ matrix.model }}. No falsely archived photos." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install checksum-pinned unofficial TeraBox client
        if: steps.source.outputs.skip != 'true' && steps.acquire.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          f="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          install -m 755 "$f" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Authenticate owner storage and read previous SHA-verified catalog
        if: steps.source.outputs.skip != 'true' && steps.acquire.outputs.skip != 'true'
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.model }}" == yui ]]; then
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"
            remote="archive:YuiArchive"
          else
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"
            remote="archive:MimmiArchive"
          fi
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          if rclone cat "$remote/metadata/catalog.json" > "$RUNNER_TEMP/old-private-catalog.json" 2>"$RUNNER_TEMP/remote-errors"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Initial private mass upload is not fully SHA-verified yet; keep retrying later" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage only real captured bytes and merge without losing previous private photos
        if: steps.previous.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/terabox_stage.py \
            --model "${{ matrix.model }}" --inputs "$RUNNER_TEMP/new" \
            --out "$RUNNER_TEMP/stage" --minimum 1
          python apps/gallery-archive/merge_incremental.py \
            --stage "$RUNNER_TEMP/stage" \
            --previous "$RUNNER_TEMP/old-private-catalog.json" \
            --model "${{ matrix.model }}"
      - name: Append new originals/previews and full-SHA verify only the newly uploaded byte files
        if: steps.previous.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.model }}" == yui ]]; then
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"
            remote="archive:YuiArchive"
          else
            export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"
            remote="archive:MimmiArchive"
          fi
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone copy "$RUNNER_TEMP/stage/originals" "$remote/originals" --ignore-existing \
            --transfers 3 --checkers 4 --timeout 60s --retries 2 2>"$RUNNER_TEMP/transfer-errors"
          rclone copy "$RUNNER_TEMP/stage/previews" "$remote/previews" --ignore-existing \
            --transfers 3 --checkers 4 --timeout 60s --retries 2 2>"$RUNNER_TEMP/transfer-errors"
          python apps/gallery-archive/verify_terabox.py --stage "$RUNNER_TEMP/stage" \
            --remote "$remote" --workers 6 --only-staged
          rclone copyto "$RUNNER_TEMP/stage/metadata/catalog.json" "$remote/metadata/catalog.json"
          expected="$(sha256sum "$RUNNER_TEMP/stage/metadata/catalog.json" | cut -d' ' -f1)"
          actual="$(rclone cat "$remote/metadata/catalog.json" | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$actual"
          cat "$RUNNER_TEMP/stage/metadata/incremental-merge.json" >> "$GITHUB_STEP_SUMMARY"
          echo "New photo byte files remotely SHA verified; old photo numbers preserved" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public-free audit statistics without original image bytes
        uses: actions/upload-artifact@v4
        if: steps.previous.outputs.ready == 'true'
        with:
          name: gallery-terabox-incremental-audit-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/stage/metadata/incremental-merge.json
            ${{ runner.temp }}/stage/metadata/remote-verification.json
          if-no-files-found: warn
          retention-days: 30

            fi
            if [[ "$SOURCE_NAME" == 'Yui Known Missing 18 Photo Slots Physical Recovery' ]]; then
              pattern='^yui-known-missing-18-private-files              pattern='^yui-original-verified-jliji-137$'
            fi
            if [[ "$SOURCE_NAME" == 'Yui 18 Missing Web Photo Numbers Byte Recovery' ]]; then
              pattern='^yui-original-verified-jliji-missing-18$'
            fi
            if [[ "$SOURCE_NAME" == 'Independent Yui and Mimmi Photoshoot Original Byte Archive' ]]; then
