name: Five Yui Photo Editions — Actual Public Image Backfill
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/acquire_five_observed_public_albums.py'
      - 'apps/gallery-archive/five_public_observed_yui_20261116.json'
      - '.github/workflows/gallery-five-actual-public-photo-backfill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: five-yui-visible-originals-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  acquire-and-commit-actual-images:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing decoder and public HTTP tools
        run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Compile and verify original archive publisher
        run: |
          python -m py_compile apps/gallery-archive/acquire_five_observed_public_albums.py apps/gallery-archive/publish_new_public_photos_to_pages.py
          (cd apps/gallery-archive && python test_publish_photo_provenance.py)
          (cd apps/gallery-archive && python test_verified_dynamic_work_publish.py)
      - name: Actually download 60 individually observed public files for five albums
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/acquire_five_observed_public_albums.py \
            --stage "${{ runner.temp }}/five-public-editions" \
            --max-photos 60
          cat "${{ runner.temp }}/five-public-editions/five-public-photo-backfill-report.json"
      - name: Verify actual unique saved image count and copy into own PR
        shell: bash
        run: |
          set -euo pipefail
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/stored-albums.json apps/yui-gallery/stored-albums
          if git diff --cached --quiet; then
            echo 'FIVE_ALBUMS_NO_NEW_SHA_OR_ACCESS_DENIED' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git commit -m "feat(gallery): physically store new SHA-distinct Yui public photos from five editions"
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
            echo 'FIVE_ALBUMS_NEW_FILES_COMMITTED_TO_PR' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FIVE_ALBUMS_REAL_FILES_STAGED_MAIN_MANUAL_REVIEW_REQUIRED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive five-edition acquisition results, including all failed URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-yui-actual-new-photo-results
          path: ${{ runner.temp }}/five-public-editions/five-public-photo-backfill-report.json
          if-no-files-found: warn
          retention-days: 14
