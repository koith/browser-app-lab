name: 4LEAF SHOP-02 historically sourced live transactions
on:
  pull_request:
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/shop-original-serial-resale.cjs'
      - 'apps/4leaf/rog/tests/cardshop-native-sale.cjs'
      - 'apps/4leaf/rog/tests/r21-source-era-shop.cjs'
      - '.github/workflows/rog-shop02-source-transactions.yml'
  push:
    branches: [main, '4leaf/shop02-final-20261125']
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/shop-original-serial-resale.cjs'
      - 'apps/4leaf/rog/tests/cardshop-native-sale.cjs'
      - 'apps/4leaf/rog/tests/r21-source-era-shop.cjs'
      - '.github/workflows/rog-shop02-source-transactions.yml'
permissions:
  contents: read
jobs:
  original-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      FOURLEAF_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install "$FOURLEAF_BROWSER" --with-deps
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/shop02.log 2>&1 &
          sleep 2
      - run: node apps/4leaf/rog/tests/shop-original-serial-resale.cjs
      - run: node apps/4leaf/rog/tests/cardshop-native-sale.cjs
      - run: node apps/4leaf/rog/tests/r21-source-era-shop.cjs
      - name: Public same-version and identical game/source shop on main
        if: github.event_name == 'push'
        run: |
          set -e
          base=https://koith.github.io/browser-app-lab/apps/4leaf/rog/
          found=0
          for i in $(seq 1 50); do
            if curl -fsSL --max-time 15 "${base}app-version.json?shop02=$GITHUB_SHA-$i" -o /tmp/shop02-public-version && cmp -s apps/4leaf/rog/app-version.json /tmp/shop02-public-version; then found=1; break; fi
            sleep 8
          done
          test "$found" = 1
          for f in game.js index.html sw.js original/market-price-snapshots.js; do
            curl -fsSL --max-time 30 "${base}${f}?shop02=$GITHUB_SHA" -o /tmp/shop02-public-file
            cmp "apps/4leaf/rog/$f" /tmp/shop02-public-file
          done
          FOURLEAF_TEST_URL="$base" node apps/4leaf/rog/tests/shop-original-serial-resale.cjs
          FOURLEAF_TEST_URL="$base" node apps/4leaf/rog/tests/cardshop-native-sale.cjs
          FOURLEAF_TEST_URL="$base" node apps/4leaf/rog/tests/r21-source-era-shop.cjs
