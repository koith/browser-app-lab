name: Public Photo Review QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 requests Pillow
      - run: python -m py_compile apps/yui-gallery/sns_archive.py
      - run: python apps/yui-gallery/sns_archive.py --discover-only --max-pages 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-photo-metadata
          path: yui-sns-discovery.json
