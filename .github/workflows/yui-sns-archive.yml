name: Public Photo Review QA
on:
  push:
    paths:
      - apps/yui-gallery/sns_archive.py
      - .github/workflows/yui-sns-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 requests Pillow
      - run: python -m py_compile apps/yui-gallery/sns_archive.py
      - run: python apps/yui-gallery/sns_archive.py --max-pages 85 --workers 5 --part-size 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-photo-archive
          path: |
            yui-sns-archive/*.zip
            yui-sns-archive/*.json
