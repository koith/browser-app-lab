name: Yui Image Error States
on:
  push:
    paths: [apps/yui-gallery/**, .github/workflows/yui-image-error-states.yml]
  pull_request:
    paths: [apps/yui-gallery/**, .github/workflows/yui-image-error-states.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  error-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble@sha256:cd8493e380df200a471821e2690b710eab8d793dde3c0946fd0a39a961022914
      options: --init --ipc=host
    strategy:
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow playwright==1.58.0
      - name: Verify real gallery handling of fixture 451 and 503 without external image requests
        run: python apps/yui-gallery/test_image_error_states.py --engine ${{ matrix.engine }}
