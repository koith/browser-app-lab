name: Yui Public SNS Photo Archive
on:
  push:
    paths:
      - apps/yui-gallery/download_sns_public.py
      - apps/yui-gallery/paginated-sns-index.json
      - .github/workflows/yui-public-sns-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: python -m pip install requests pillow playwright==1.58.0
      - name: Download publicly posted original-size images and validate
        run: python apps/yui-gallery/download_sns_public.py
      - name: Audit image inventory and ZIP
        run: |
          python - <<'PY'
          import json,zipfile,pathlib
          info=json.load(open('yui-sns-originals/summary.json'))['Yui-public-SNS']
          with zipfile.ZipFile('yui-sns-originals-verified.zip') as z:
            assert z.testzip() is None
            files=[n for n in z.namelist() if n.lower().endswith(('.jpeg','.jpg','.webp','.png'))]
            assert len(files)==info['stored_files']
            assert all(z.getinfo(n).file_size>1000 for n in files)
          assert info['stored_files']>=30,info
          print('VERIFIED_REAL_FILES',json.dumps(info))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-public-sns-original-files
          path: |
            yui-sns-originals-verified.zip
            yui-sns-cursor-discovery.json
            yui-sns-originals/summary.json
          retention-days: 90
          if-no-files-found: warn
