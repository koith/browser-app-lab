name: Yui Public SNS Photo Archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: python -m pip install requests pillow beautifulsoup4
      - name: Download publicly posted original-size images and validate
        run: python apps/yui-gallery/download_sns_public.py --output yui-sns-individuals --max-pages 85 --delay 1
      - name: Audit every individual file
        run: |
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'apps/yui-gallery')
          from public_photo_archive import verified_record,atomic_json
          root=pathlib.Path('yui-sns-individuals')
          info=json.loads((root/'manifest.json').read_text())
          for row in info['images']: verified_record(root,row)
          assert not info['failures'],info['failures']
          assert info['unique_files']>0
          summary={k:v for k,v in info.items() if k not in ('images','failures')}
          summary['permanent_cloud_uploaded']=0
          atomic_json(root/'summary.json',summary)
          print('VERIFIED_INDIVIDUAL_FILES',json.dumps(summary))
          PY
      # Reports only. Do not wrap photographs in the artifact service's container.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yui-public-sns-file-verification-report
          path: yui-sns-individuals/summary.json
          archive: false
          retention-days: 90
          if-no-files-found: warn
