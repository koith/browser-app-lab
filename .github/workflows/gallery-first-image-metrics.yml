name: Gallery — First Image Latency and Full SHA Coverage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_gallery_first_image_metrics.py'
      - '.github/workflows/gallery-first-image-metrics.yml'
permissions:
  contents: read
concurrency:
  group: gallery-first-image-metrics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-image-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile apps/gallery-archive/qa_gallery_first_image_metrics.py
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Time first decoded public cover and audit complete SHA visibility
        run: python apps/gallery-archive/qa_gallery_first_image_metrics.py --browser ${{ matrix.browser }}
