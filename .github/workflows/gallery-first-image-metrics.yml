name: Gallery — First Image Latency and Full SHA Coverage
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  pull_request:
    paths:
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/index.html'
      - 'apps/gallery-archive/test_fast_cover_bootstrap.py'
      - 'apps/gallery-archive/test_reuse_fast_cover_nodes.cjs'
      - 'apps/gallery-archive/test_local_saved_detail_previews.cjs'
      - 'apps/gallery-archive/test_progressive_photo_grid.cjs'
      - 'apps/gallery-archive/qa_gallery_first_image_metrics.py'
  push:
    branches: [main]
    paths:
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/index.html'
      - 'apps/gallery-archive/test_fast_cover_bootstrap.py'
      - 'apps/gallery-archive/test_reuse_fast_cover_nodes.cjs'
      - 'apps/gallery-archive/test_local_saved_detail_previews.cjs'
      - 'apps/gallery-archive/test_progressive_photo_grid.cjs'
      - 'apps/gallery-archive/qa_gallery_first_image_metrics.py'
      - '.github/workflows/gallery-first-image-metrics.yml'
permissions:
  contents: read
concurrency:
  group: gallery-first-image-metrics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-image-audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile apps/gallery-archive/qa_gallery_first_image_metrics.py
          python apps/gallery-archive/test_fast_cover_bootstrap.py
          node apps/gallery-archive/test_reuse_fast_cover_nodes.cjs
          node apps/gallery-archive/test_local_saved_detail_previews.cjs
          node apps/gallery-archive/test_progressive_photo_grid.cjs
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Time first decoded public cover and audit complete SHA visibility
        shell: bash
        run: |
          flags=()
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then flags+=(--verify-progressive); fi
          python apps/gallery-archive/qa_gallery_first_image_metrics.py --browser '${{ matrix.browser }}' "${flags[@]}"
