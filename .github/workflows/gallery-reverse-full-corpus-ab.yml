name: Yui Mimmi ALL Owner Albums Reverse Image and Named Work Source Comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/gallery-archive/reverse_full_corpus_ab.py
      - apps/gallery-archive/test_reverse_full_corpus_ab.py
      - apps/gallery-archive/reverse_full_aggregate.py
      - .github/workflows/gallery-reverse-full-corpus-ab.yml
permissions:
  contents: read
jobs:
  verify-all-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python -m py_compile apps/gallery-archive/reverse_full_corpus_ab.py apps/gallery-archive/reverse_full_aggregate.py
          python apps/gallery-archive/test_reverse_full_corpus_ab.py
  query-all-images-and-titles:
    needs: verify-all-seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [yui, mimmi]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      MODEL: ${{ matrix.model }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - name: All public seed images through Yandex/Bing/Lens/TinEye and ALL title leads
        shell: bash
        run: |
          python apps/gallery-archive/reverse_full_corpus_ab.py \
            --model "$MODEL" --shard "$SHARD" --shards 8 \
            --delay 0.7 --out "$RUNNER_TEMP/reverse-full-$MODEL-$SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-full-${{ matrix.model }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/reverse-full-${{ matrix.model }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 21
  must-account-for-all-owner-seeds:
    if: always()
    needs: [verify-all-seeds, query-all-images-and-titles]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: reverse-full-*
          path: /tmp/reverse-full
          merge-multiple: true
      - run: |
          python apps/gallery-archive/reverse_full_aggregate.py \
            --dir /tmp/reverse-full --shards 8 \
            --out /tmp/reverse-gallery-full-coverage-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-gallery-full-coverage-report
          path: /tmp/reverse-gallery-full-coverage-report.json
          if-no-files-found: warn
          retention-days: 21
