name: Gallery Optical-First Watermark-Second Visual Evidence QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/photo_quality_evidence.py'
      - 'apps/gallery-archive/direct_photo_pipeline.py'
      - 'apps/gallery-archive/test_photo_quality_evidence.py'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/image-quality.js'
      - 'apps/mimmi-gallery/image-quality.js'
      - 'apps/mimmi-gallery/cloud/gateway/catalog_view.py'
      - '.github/workflows/gallery-optical-first-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/photo_quality_evidence.py'
      - 'apps/gallery-archive/direct_photo_pipeline.py'
      - 'apps/gallery-archive/test_photo_quality_evidence.py'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/image-quality.js'
      - 'apps/mimmi-gallery/image-quality.js'
      - 'apps/mimmi-gallery/cloud/gateway/catalog_view.py'
      - '.github/workflows/gallery-optical-first-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optical-photo-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.2.1'
      - name: Inspect real JPEG pixels and test order of preferences
        run: |
          python apps/gallery-archive/test_photo_quality_evidence.py
          python -m py_compile apps/gallery-archive/direct_photo_pipeline.py apps/gallery-archive/photo_quality_evidence.py apps/mimmi-gallery/cloud/gateway/catalog_view.py
          node apps/gallery-archive/test_gallery_visual_quality.cjs
          node apps/gallery-archive/test_quality_same_photo.cjs
