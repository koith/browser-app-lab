name: G05 Actual New Photo 469 SHA and Deployed Browser Acceptance
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_g05_new_sns_live.py'
      - '.github/workflows/gallery-g05-new-sns-live.yml'
      - 'apps/yui-gallery/stored-albums.json'
      - 'apps/yui-gallery/stored-albums/public-yui-sns/**'
  workflow_run:
    workflows:
      - "Deploy static content to Pages"
      - "pages build and deployment"
    types: [completed]
permissions:
  contents: read
jobs:
  exact-current-new-original:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real decoding and browser dependencies
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.58.0'
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python -m playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Prove exact original bytes and no user archive collision
        run: python apps/gallery-archive/qa_g05_new_sns_live.py
      - name: Exact published commit, real gallery photo tile, image decode and reload
        if: github.event_name == 'workflow_run'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          python apps/gallery-archive/qa_g05_new_sns_live.py --browser ${{ matrix.browser }}
