name: INTERSECTION — GitHub Encrypted Account Live Viewer E2E
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "INTERSECTION — Verified One-ZIP Public Account Rescue"
      - "INTERSECTION — Mirror Verified TeraBox ZIP to Encrypted GitHub"
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/intersection-github-live-viewer-qa.yml"
      - "apps/demand-research/test_live_account_archive_browser.py"
      - "apps/demand-research/test_live_account_index_browser.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-github-live-viewer-qa.yml"
      - "apps/demand-research/test_live_account_archive_browser.py"
      - "apps/demand-research/test_live_account_index_browser.py"
      - "apps/demand-research/account_archive_view.html"
      - "apps/demand-research/account_archive_view.css"
      - "apps/demand-research/account_archive_view.js"

permissions:
  contents: read

concurrency:
  # The earlier single pending slot was replaced during rapid app commits.
  group: ${{ github.event_name == 'pull_request' && format('intersection-github-live-viewer-pr-{0}', github.head_ref) || 'intersection-github-live-viewer-production' }}
  cancel-in-progress: false
  queue: max

jobs:
  syntax-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live browser acceptance test is syntactically safe
        run: python -m py_compile apps/demand-research/test_live_account_archive_browser.py apps/demand-research/test_live_account_index_browser.py
  live-verified-reader:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Verify actual GitHub release original is readable through webapp
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://intersection-originals-free.onrender.com"
          def request(path, *, byte_range=None, timeout=120):
              headers={"Accept":"application/json","User-Agent":"intersection-live-github-backup-qa"}
              if byte_range: headers["Range"]=byte_range
              req=urllib.request.Request(BASE+path,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,{k.lower():v for k,v in r.headers.items()},r.read(1500000 if byte_range else 3000000)
          def get(path, timeout=120):
              code,_,body=request(path,timeout=timeout)
              if code!=200:raise RuntimeError("Live account API status invalid")
              return json.loads(body)
          status=get("/api/target-archive/status")
          if status.get("storage")!="github_encrypted_temporary":
              raise RuntimeError("Live gateway is not configured for encrypted GitHub storage")
          print("LIVE_GITHUB_TEMP_BACKUP_ENABLED",flush=True)
          response=get("/api/account-archives",timeout=170)
          accounts=[a for a in response.get("accounts",[]) if
                    a.get("backup_kind")=="github_temp_sha_verified" and
                    a.get("posts_verified_in_bundle",0)>0]
          if not accounts:raise RuntimeError("No independently verified live account ZIP")
          print("LIVE_ENCRYPTED_RELEASE_DISCOVERED count",len(accounts),flush=True)
          account=accounts[0]
          key=account["key"]
          if not key.startswith(("bluesky-","mastodon-")):
              raise RuntimeError("Invalid verified account key")
          prefix="/api/account-archives/"+key
          details=get(prefix+"/backup-status",timeout=100)
          if (details.get("state")!="REMOTE_ZIP_SHA_VERIFIED" or
              details.get("storage")!="github_encrypted_temporary"):
              raise RuntimeError("Live source ZIP has not passed SHA verification")
          print("LIVE_GITHUB_ZIP_VERIFIED posts",details.get("public_posts"),
                "objects",details.get("original_objects"),flush=True)
          profile=get(prefix+"/profile")
          if not profile.get("available"):raise RuntimeError("Live profile snapshot unavailable")
          print("LIVE_VERIFIED_PROFILE_READBACK",flush=True)
          feed=get(prefix+"/feed?offset=0&limit=50")
          posts=feed.get("posts",[])
          if not posts or feed.get("total",0)<1:
              raise RuntimeError("Live account post feed unavailable")
          print("LIVE_VERIFIED_ACCOUNT_FEED total",feed["total"],flush=True)
          post=posts[0]
          thread=get(prefix+"/threads/"+post["id"],timeout=120)
          if not isinstance(thread.get("replies"),list):
              raise RuntimeError("Live account reply panel unavailable")
          print("LIVE_VERIFIED_REPLY_PANEL captured",bool(thread.get("captured")),flush=True)
          has_media=False
          index=0
          for offset in (0,50,100,150,200,250,300,350,400):
              page=posts if offset==0 else get(prefix+"/feed?offset="+str(offset)+"&limit=50")
              rows=page if offset==0 else page.get("posts",[])
              for row in rows:
                  if row.get("media"):
                      has_media=True
                      media=row["media"][0]
                      code,headers,blob=request(media["url"],byte_range="bytes=0-1023",timeout=170)
                      if (code!=206 or not blob or "content-range" not in headers
                              or headers.get("accept-ranges")!="bytes"):
                          print("LIVE_MEDIA_RANGE_DIAGNOSTICS status",code,
                                "size",len(blob),
                                "has_content_range",bool(headers.get("content-range")),
                                "accept_ranges",headers.get("accept-ranges"),flush=True)
                          raise RuntimeError("Original media HTTP Range read failed")
                      print("LIVE_VERIFIED_MEDIA_RANGE bytes",len(blob),flush=True)
                      break
              if has_media:break
          if not has_media:raise RuntimeError("Selected verified ZIP lacks downloadable original media")
          code,_,html=request("/account-archive")
          if code!=200 or b'accountSelect' not in html:
              raise RuntimeError("Actual account-viewer page unavailable")
          print("LIVE_ACCOUNT_WEB_VIEWER_HTML_READY",flush=True)
          print("LIVE_GITHUB_BACKUP_END_TO_END_VERIFIED",flush=True)
          PY

  live-browser:
    # Never overlap encrypted original ZIP readback with browser load on the
    # same 512MiB free Render instance; observed OOM under concurrent QA.
    needs: [live-verified-reader]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright API (Chromium and WebKit preinstalled)
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      # User-facing archived SNS playback is P0, so its result is reported
      # independently before any unrelated account-index JS errors.
      - name: Exercise real stored posts, original media, detail, tabs and responsive layout
        run: python apps/demand-research/test_live_account_archive_browser.py
      - name: Verify verified account-index UI in real desktop Chromium and mobile WebKit
        run: python apps/demand-research/test_live_account_index_browser.py
