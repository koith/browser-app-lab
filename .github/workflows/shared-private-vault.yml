name: Both Galleries Individual Original Archive QA
on:
  pull_request:
    paths:
      - apps/gallery-archive/**
      - apps/yui-gallery/index.html
      - apps/mimmi-gallery/index.html
      - .github/workflows/shared-private-vault.yml
  push:
    paths:
      - apps/gallery-archive/**
      - apps/yui-gallery/index.html
      - apps/mimmi-gallery/index.html
      - .github/workflows/shared-private-vault.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install free individual-image validators
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Verify unchanged original bytes, resume, corruption refusal and no photo bundles
        run: |
          python apps/gallery-archive/test_direct_photo_pipeline.py
          python apps/gallery-archive/test_visual_public_work.py
          python apps/gallery-archive/test_remote_readback_deadline.py
          python apps/gallery-archive/test_work_coverage.py
      - name: Require deployed new-photo QA separately from fixture tests
        run: |
          echo 'Individual file fixtures passed. This is not a new-photo acquisition or deployed browser result.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real Chromium/WebKit decoding and complete download SHA are checked by Gallery Newly Stored Exact Original Mobile QA.' >> "$GITHUB_STEP_SUMMARY"
