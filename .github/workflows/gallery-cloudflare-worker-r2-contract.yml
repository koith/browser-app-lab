name: Gallery Private Storage Worker (No Cloud Access) Contract
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/cloudflare-owner-gateway/**'
      - '.github/workflows/gallery-cloudflare-worker-r2-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/cloudflare-owner-gateway/**'
      - '.github/workflows/gallery-cloudflare-worker-r2-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-private-r2-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent AWS signature reference (no account credentials)
        run: python -m pip install botocore==1.40.70
      - name: Check Worker and Pages client with an existing actual JPEG
        run: node apps/gallery-archive/cloudflare-owner-gateway/worker.test.mjs
      - name: Check private S3 signing, limits and local HTTP readback
        run: node apps/gallery-archive/cloudflare-owner-gateway/private-s3.test.mjs
      - name: Syntax-check transport modules
        run: |
          node --check apps/gallery-archive/cloudflare-owner-gateway/worker.mjs
          node --check apps/gallery-archive/cloudflare-owner-gateway/private-s3.mjs
          node --check apps/gallery-archive/cloudflare-owner-gateway/pages-client.mjs
