name: Gallery Six Real Albums After Cloudflare Owner Replica
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Gallery Free Bound Assets Replica"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: gallery-six-real-albums-after-replica
  cancel-in-progress: false
jobs:
  six-album-real-browser:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install actual browser engine and exact image file verifier
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify six priority albums through live Pages, exact source, photo originals, lightbox and reload
        run: |
          python -m py_compile apps/gallery-archive/qa_cloudflare_pages_browser.py
          python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --all-p0 --browser '${{ matrix.browser }}'
      - name: Report proven production UI acceptance only
        if: success()
        run: |
          echo "### Gallery actual published six-album acceptance: ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real Pages JS/config exact bytes, two models, six owned albums, decoded covers, SHA-256 originals, native lightbox, reload." >> "$GITHUB_STEP_SUMMARY"
          echo "- Separate owner-to-Cloudflare full inventory completeness is governed by the replica run; this does not prove physical iPhone hardware." >> "$GITHUB_STEP_SUMMARY"
