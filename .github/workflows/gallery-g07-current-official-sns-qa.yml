name: G07 Current Author-Verified New Public SNS Bytes
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/collect_new_creator_public_shas.py'
      - 'apps/gallery-archive/publish_new_public_photos_to_pages.py'
      - 'apps/gallery-archive/qa_g07_new_public_saved_sha.py'
      - '.github/workflows/gallery-g07-current-official-sns-qa.yml'
permissions:
  contents: write
concurrency:
  group: g07-author-public-sns-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  verify-committed-public-photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.3.0' 'playwright==1.56.0'
      - name: Verify committed actual JPEG, SHA, bytes, decoded pixels and owner nonduplication
        run: python apps/gallery-archive/qa_g07_new_public_saved_sha.py
  fetch-and-stage-current-author-photo-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0'
      - name: Fetch current model-authored public images and independently decode originals
        run: |
          python -m py_compile apps/gallery-archive/collect_teapawt_public.py apps/gallery-archive/collect_new_creator_public_shas.py
          python apps/gallery-archive/collect_new_creator_public_shas.py --stage "$RUNNER_TEMP/g07-new-social" --max-pages 2 --max-photos 36
      - name: Refresh the latest PR sources before publishing only distinct SHA originals
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$PR_HEAD:refs/remotes/origin/$PR_HEAD"
          git checkout -B "$PR_HEAD" "refs/remotes/origin/$PR_HEAD"
          python apps/gallery-archive/publish_new_public_photos_to_pages.py --model yui --stage "$RUNNER_TEMP/g07-new-social" --limit 18 --budget 14000000
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/stored-albums.json apps/yui-gallery/stored-albums
          if git diff --cached --quiet; then
            echo 'G07_NO_ACTUALLY_NEW_SHA_ORIGIN_PHOTOS' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "feat(G07): add current creator public images with real SHA-verified bytes"
            git push origin "HEAD:refs/heads/$PR_HEAD"
            echo 'G07_NEW_ACTUAL_PUBLIC_IMAGES_STORED_TO_FREE_PAGES_PR' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-current-author-real-photo-evidence
          path: |
            ${{ runner.temp }}/g07-new-social/metadata/collection-audit.json
            ${{ runner.temp }}/g07-new-social/metadata/pages-publication.json
          retention-days: 7
          if-no-files-found: warn
