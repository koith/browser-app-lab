name: Gallery Exact-SHA Device Media Cache Pre-Deploy QA
on:
  pull_request:
    paths:
      - 'apps/mimmi-gallery/gallery-cover-sw.js'
      - 'apps/yui-gallery/gallery-cover-sw.js'
      - 'apps/mimmi-gallery/test_cover_sw.cjs'
      - 'apps/yui-gallery/test_cover_sw.cjs'
      - 'apps/gallery-archive/test_device_owner_photo_sw.cjs'
      - 'apps/gallery-archive/qa_device_photo_sw_browser.py'
      - '.github/workflows/gallery-device-verified-cache-qa.yml'
permissions:
  contents: read
jobs:
  strict-owner-photo-sha-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify original cover cache still works, no credentialed cross-model photo caching
        run: |
          set -euo pipefail
          node --check apps/mimmi-gallery/gallery-cover-sw.js
          node --check apps/yui-gallery/gallery-cover-sw.js
          node apps/mimmi-gallery/test_cover_sw.cjs
          node apps/yui-gallery/test_cover_sw.cjs
          node apps/gallery-archive/test_device_owner_photo_sw.cjs mimmi
          node apps/gallery-archive/test_device_owner_photo_sw.cjs yui
          python -m py_compile apps/gallery-archive/qa_device_photo_sw_browser.py

  local-webkit-chromium-reload:
    needs: strict-owner-photo-sha-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        model: [mimmi, yui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install actual browser and PNG test fixture
        run: |
          python -m pip install 'playwright==1.58.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-origin browser 200 first then provider 503 after reload
        run: |
          python apps/gallery-archive/qa_device_photo_sw_browser.py --browser ${{ matrix.browser }} --model ${{ matrix.model }}

  release-gate:
    needs: [strict-owner-photo-sha-cache, local-webkit-chromium-reload]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse release until all four real browsers and both existing scopes pass
        env:
          OFFLINE: ${{ needs.strict-owner-photo-sha-cache.result }}
          BROWSERS: ${{ needs.local-webkit-chromium-reload.result }}
        run: |
          test "$OFFLINE" = success
          test "$BROWSERS" = success
          echo 'OWNER_DEVICE_CACHE_PREDEPLOY_REAL_CHROMIUM_WEBKIT_4_OF_4_PASS'
          echo 'This covers previously fetched photos only; never claim the first missing photo is recovered from 503 or that iPhone hardware was tested.' >> "$GITHUB_STEP_SUMMARY"
