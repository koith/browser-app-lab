name: INTERSECTION — Live Archived Profile Image Readback
on:
  push:
    branches:
      - fix/backup-button-private-gateway
    paths:
      - apps/demand-research/test_live_profile_media_browser.py
      - .github/workflows/intersection-profile-media-live-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intersection-live-profile-original-media
  cancel-in-progress: true

jobs:
  actual-profile-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check read-only live media test syntax
        run: python -m py_compile apps/demand-research/test_live_profile_media_browser.py
      - name: Install pinned Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Decode REAL saved banner and circular avatar on production HTTPS
        run: python apps/demand-research/test_live_profile_media_browser.py
