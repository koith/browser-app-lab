name: Mimmi Six-Language Photo Work Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mimmi-gallery/discover_pixibb_search.py'
      - 'apps/mimmi-gallery/test_pixibb_search.py'
      - '.github/workflows/mimmi-pixibb-alias-search.yml'
  schedule:
    - cron: '05 16 * * 1,5'
permissions:
  contents: write
concurrency:
  group: mimmi-alias-work-discovery-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Validate strict model-identity and site origin policies
        run: |
          python -m py_compile apps/mimmi-gallery/discover_pixibb_search.py
          python apps/mimmi-gallery/test_pixibb_search.py
      - name: Search multiple public variants, verify Mimmi-specific album headings
        run: python apps/mimmi-gallery/discover_pixibb_search.py --pages 2 --limit 80
      - name: Verify only real public album URLs and safe UTF-8 work metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("apps/mimmi-gallery/pixibb-discovered-seeds.json").read_text())
          assert d["model"]=="mimmi"
          for a in d["albums"]:
            assert a["source"].startswith("https://cosplay.pixibb.com/")
            assert a["pages"]>=1 and a["pages"]<=30
          print("MIMMI_ALTERNATE_ALIAS_SITE_SEARCH",d["summary"])
          PY
      - name: Store research leads without overclaiming photo downloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mimmi-gallery/pixibb-discovered-seeds.json
          if ! git diff --cached --quiet; then git commit -m "Discover verified Mimmi PixiBB galleries by six language variants"; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
