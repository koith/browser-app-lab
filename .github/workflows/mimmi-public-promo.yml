name: Mimmi DJAWA Public Promotional Image Search
on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 3,6'
  push:
    paths:
      - 'apps/mimmi-gallery/collect_gumroad_public.py'
      - 'apps/mimmi-gallery/test_gumroad_public.py'
      - '.github/workflows/mimmi-public-promo.yml'
permissions:
  contents: write
concurrency:
  group: mimmi-source-index-writer-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 Pillow
      - name: Test public-only product and photo parsers
        run: |
          python -m py_compile apps/mimmi-gallery/collect_gumroad_public.py
          python apps/mimmi-gallery/test_gumroad_public.py
      - name: Verify individual photographs visible in public publisher product promotions
        run: python apps/mimmi-gallery/collect_gumroad_public.py --books 70 --images 6
      - name: Verify source safety and report actual fetched promotional count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apps/mimmi-gallery/gumroad-public-previews.json').read_text())
          assert d['model']=='mimmi'
          assert d['summary']['private_cloud_saved']==0
          assert d['summary']['albums_checked']>=20
          for a in d['albums']:
              assert a['images']==[]
              for p in a['samples']:
                  assert p['url'].startswith(('https://public-files.gumroad.com/','https://assets.gumroad.com/','https://static-2.gumroad.com/'))
                  assert len(p['sha256'])==64 and p['bytes']>4500
          print('MIMMI_PUBLIC_PROMO_IMAGE_VERIFIED',d['summary'])
          PY
      - name: Commit only verified source URL evidence and rebuild Mimmi gallery
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+koith@users.noreply.github.com"
          git add apps/mimmi-gallery/gumroad-public-previews.json
          if ! git diff --cached --quiet; then git commit -m "Verify additional Mimmi publisher-linked public promo images"; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          python apps/mimmi-gallery/build_model_gallery.py
          git add apps/mimmi-gallery/source-viewer-albums.json apps/mimmi-gallery/albums.json
          if ! git diff --cached --quiet; then git commit -m "Refresh deduplicated Mimmi photo list"; fi
          git push origin "HEAD:$GITHUB_REF_NAME"
