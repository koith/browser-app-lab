name: Mimmi Gallery Mobile Album and Image Fallback QA
on:
  push:
    paths:
      - 'apps/mimmi-gallery/**'
      - '.github/workflows/mimmi-gallery-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          npx playwright install --with-deps webkit
      - name: Exercise actual mobile album UX, cross-model new tab, and photo fallback
        run: |
          python -m http.server 8765 --directory apps >/tmp/mimmi-static.log 2>&1 &
          node apps/mimmi-gallery/test_mobile_album.cjs
      - name: Verify iPhone-like WebKit source-host images and graceful fallback
        run: node apps/mimmi-gallery/test_webkit_photo.cjs
      - name: Save individual Chromium screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mimmi-chromium-single-screenshot
          path: mimmi-mobile-v4.png
          archive: false
          retention-days: 30
          if-no-files-found: ignore
      - name: Save individual WebKit screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mimmi-webkit-single-screenshot
          path: mimmi-webkit-v4.png
          archive: false
          retention-days: 30
          if-no-files-found: ignore
