name: Mimmi Latest-Yui Beta18 Clone Mobile Browser and WebKit QA
on:
  push:
    paths:
      - 'apps/mimmi-gallery/**'
      - '.github/workflows/mimmi-gallery-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          npx playwright install --with-deps webkit
      - name: Verify multi-source fallback, 130-photo pagination, and V2PH batch rotation
        run: |
          python -m pip install requests beautifulsoup4 Pillow
          python apps/mimmi-gallery/test_multipage_cross_source.py
          python apps/mimmi-gallery/test_xiutu_public.py
      - name: Exercise actual mobile album UX, cross-model new tab, and photo fallback
        run: |
          python -m http.server 8765 --directory apps >/tmp/mimmi-static.log 2>&1 &
          node apps/mimmi-gallery/test_mobile_album.cjs
      - name: Verify iPhone-like WebKit private authentication UI
        run: node apps/mimmi-gallery/test_private_cloud_ui.cjs
      - name: Verify iPhone-like WebKit source-host images and graceful fallback
        run: node apps/mimmi-gallery/test_webkit_photo.cjs
      - name: Save individual Chromium screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mimmi-chromium-single-screenshot
          path: mimmi-beta18-clone-chromium.png
          archive: false
          retention-days: 30
          if-no-files-found: ignore
      - name: Save individual WebKit screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mimmi-webkit-single-screenshot
          path: mimmi-beta18-clone-webkit.png
          archive: false
          retention-days: 30
          if-no-files-found: ignore
