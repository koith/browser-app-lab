name: 4LEAF inspect complete original chessman action packets
on:
  push:
    branches: [research/4leaf-actor-full-action-20261101]
    paths: [.github/workflows/rog-actor-full-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover SHA-verified contact sheets and native frame metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13079399441/zip" -o "$RUNNER_TEMP/leaf-actions.zip"
          python3 - <<'PY'
          import zipfile,json,hashlib
          from pathlib import Path
          source=zipfile.ZipFile(__import__('os').environ['RUNNER_TEMP']+'/leaf-actions.zip')
          names=source.namelist()
          root=Path('apps/4leaf/rog/docs/evidence/actor-full')
          root.mkdir(parents=True,exist_ok=True)
          report={'artifactId':13079399441,'sourceRunId':41297724959,'source2002ArchiveSHA1':'86526d89679ae39b85fe9808da97ad871b7888d9','members':[],'sourceActionTableConfirmed':False}
          for stem in ('1040','1046','1078','1084','1088','1166'):
              sheets=[n for n in names if n.lower().endswith('/'+stem+'.png') and '/members/' in '/'+n]
              metas=[n for n in names if n.lower().endswith('/'+stem+'.json') and '/members/' in '/'+n]
              for n in sheets+metas:
                  b=source.read(n)
                  label=n.replace('/','-')
                  (root/label).write_bytes(b)
                  report['members'].append({'file':label,'artifactPath':n,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          assert len(report['members'])>=8,report
          (root/'source-provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          print('ORIGINAL_SOURCE_ACTOR_SHEETS',len(report['members']),json.dumps(report['members'])[:3000])
          PY
      - name: Commit reviewed evidence to isolated branch
        run: |
          git config user.name "4LEAF source-evidence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/4leaf/rog/docs/evidence/actor-full
          git diff --cached --quiet || git commit -m "data(4leaf): archived 37-frame chessman contact sheets for action mapping"
          git push origin "HEAD:refs/heads/research/4leaf-actor-full-action-20261101"
