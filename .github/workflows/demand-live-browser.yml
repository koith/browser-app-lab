name: Demand Research — Instant Public Post Viewer Browser QA
on:
  push:
    branches:
      - main
      - fix/demand-direct-live-view-20261101
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/test_live_browser.py"
      - "apps/demand-research/test_private_social_browser.py"
      - "apps/demand-research/test_post_modal_inline_backup_browser.py"
      - "apps/demand-research/free_discovery.js"
      - "apps/demand-research/account_watch.js"
      - "apps/demand-research/account_auto_analysis.js"
      - "apps/demand-research/account_index_client.js"
      - "apps/demand-research/test_account_index_search_browser.py"
      - "apps/demand-research/test_account_watch_browser.py"
      - "apps/demand-research/test_watch_migration_browser.py"
      - "apps/demand-research/test_free_discovery_browser.py"
      - ".github/workflows/demand-live-browser.yml"
  pull_request:
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/test_live_browser.py"
      - "apps/demand-research/test_private_social_browser.py"
      - "apps/demand-research/test_post_modal_inline_backup_browser.py"
      - "apps/demand-research/account_watch.js"
      - "apps/demand-research/account_auto_analysis.js"
      - "apps/demand-research/account_index_client.js"
      - "apps/demand-research/test_account_index_search_browser.py"
      - "apps/demand-research/test_account_watch_browser.py"
      - "apps/demand-research/test_watch_migration_browser.py"
      - ".github/workflows/demand-live-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demand-live-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify account watcher JS/Python syntax before browser
        run: |
          node --check apps/demand-research/account_watch.js
          node --check apps/demand-research/account_auto_analysis.js
          node --check apps/demand-research/account_index_client.js
          python -m py_compile apps/demand-research/test_account_watch_browser.py
          python -m py_compile apps/demand-research/test_post_modal_inline_backup_browser.py
      - name: Install headless Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Grouped posts, attached images and no-password DOM fixture
        run: python apps/demand-research/test_live_browser.py
      - name: Synthetic private gateway social search UI (one request, badge, profile link)
        run: python apps/demand-research/test_private_social_browser.py
      - name: Post popup blocklist, modal backup and touch-scroll regression (Chromium/WebKit)
        run: python apps/demand-research/test_post_modal_inline_backup_browser.py
      - name: Public account watch mobile/browser QA (source-only, no personal identity merge)
        run: python apps/demand-research/test_account_watch_browser.py
      - name: Automatic all-SNS unified feed fixture (no search UI, dedup, date replay)
        run: python apps/demand-research/test_free_discovery_browser.py
      - name: Live autonomous all-SNS integration in Chromium (aggregate-only)
        run: python apps/demand-research/test_free_discovery_browser.py --live
      - name: Real public API from browser with CORS (aggregate-only, no retained posts)
        run: python apps/demand-research/test_live_browser.py --live

  account-search-mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic Chromium and mobile WebKit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Test mobile search clear without blur and source filter
        run: python apps/demand-research/test_account_index_search_browser.py
      - name: Watch-list migration preserves first-visit private archive deep links
        run: python apps/demand-research/test_watch_migration_browser.py
