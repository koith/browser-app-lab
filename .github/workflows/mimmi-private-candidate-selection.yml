name: Mimmi Physical Candidate Selection Regression
on:
  push:
    paths:
      - 'apps/mimmi-gallery/archive_private_missing.py'
      - 'apps/mimmi-gallery/missing_candidates.py'
      - 'apps/mimmi-gallery/test_missing_candidates.py'
      - '.github/workflows/mimmi-private-candidate-selection.yml'
  pull_request:
    paths:
      - 'apps/mimmi-gallery/archive_private_missing.py'
      - 'apps/mimmi-gallery/missing_candidates.py'
      - 'apps/mimmi-gallery/test_missing_candidates.py'
      - '.github/workflows/mimmi-private-candidate-selection.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify duplicate SHA positions and batch partition
        run: python -m unittest discover -s apps/mimmi-gallery -p test_missing_candidates.py -v
      - name: Python syntax checks
        run: python -m py_compile apps/mimmi-gallery/archive_private_missing.py apps/mimmi-gallery/missing_candidates.py
