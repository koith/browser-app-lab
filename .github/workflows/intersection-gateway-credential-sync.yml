name: INTERSECTION - Restore private gateway credential from GitHub Actions

on:
  workflow_dispatch:
  schedule:
    # The free Render server is stateless and can spin down after inactivity.
    # Reauthorize its in-memory TeraBox reader without exposing any cookie.
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-gateway-credential-sync.yml"
      - "apps/demand-research/gateway.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: intersection-gateway-credential-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TERABOX_PRIVATE_NDUS: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
    steps:
      - name: Reject missing private archive secret
        run: |
          test -n "$TERABOX_PRIVATE_NDUS" || { echo "::error::Existing TeraBox credential is missing"; exit 1; }
      - name: Send short-lived GitHub signed assertion and credential over HTTPS
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          endpoint=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in endpoint else '?'
          token_url=endpoint+sep+urllib.parse.urlencode({'audience':'intersection-originals-free/credential-v1'})
          token_request=urllib.request.Request(token_url,headers={
              'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(token_request,timeout=15) as response:
              token=json.load(response)['value']
          body=json.dumps({'assertion':token,'credential':os.environ['TERABOX_PRIVATE_NDUS']}).encode()
          request=urllib.request.Request(
              'https://intersection-originals-free.onrender.com/api/bridge/credential',
              data=body,method='POST',headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=90) as response:
              answer=json.load(response)
          if answer.get('accepted') is not True or answer.get('storage_configured') is not True:
              raise SystemExit('Authenticated gateway credential handshake not accepted')
          print('INTERSECTION_GATEWAY_CREDENTIAL_SYNC_ACCEPTED')
          PY
