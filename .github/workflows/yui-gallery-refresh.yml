name: Yui gallery public-feed refresh
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yui-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install public feed parser
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Read public post links
        run: python apps/yui-gallery/sync_feed.py
      - name: Commit feed changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/feed.json
          git diff --cached --quiet || (git commit -m "Update Yui public photo links" && git pull --rebase origin main && git push origin HEAD:main)
