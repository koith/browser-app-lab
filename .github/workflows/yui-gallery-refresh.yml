name: Yui gallery public-feed refresh
on:
  schedule:
    - cron: '40 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read public post links
        run: python apps/yui-gallery/sync_feed.py
      - name: Commit feed changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/feed.json
          git diff --cached --quiet || (git commit -m "Update Yui public photo links" && git push)
