name: Mimmi V2PH Actor Wide Discovery
on:
  workflow_dispatch:
  schedule:
    # Rotate through the 35+ public albums across the week, not 10 teasers.
    - cron: '25 1,5,9,13,17,21 * * *'
  push:
    paths:
      - apps/mimmi-gallery/discover_v2ph_actor.py
      - apps/mimmi-gallery/test_v2ph_actor.py
      - apps/mimmi-gallery/test_multipage_cross_source.py
      - apps/mimmi-gallery/reveal_v2ph_album.py
      - .github/workflows/mimmi-v2ph-actor-expansion.yml
permissions:
  contents: write
concurrency:
  group: mimmi-v2ph-deep-actor-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public HTML and real scrolling browser runtimes
        run: |
          python -m pip install requests beautifulsoup4 Pillow 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Compile and test scoped actor discovery and full-page semantics
        run: |
          python -m py_compile apps/mimmi-gallery/discover_v2ph_actor.py apps/mimmi-gallery/reveal_v2ph_album.py
          python apps/mimmi-gallery/test_v2ph_actor.py
          python apps/mimmi-gallery/test_multipage_cross_source.py
      - name: Crawl full public album pagination in rotating batches, not 10-photo previews
        shell: bash
        run: |
          # The crawler dynamically wraps the ever-increasing run number by
          # actual discovered album count. No configured work is skipped.
          batch="$GITHUB_RUN_NUMBER"
          echo "MIMMI_V2PH_SWEEP_SEQUENCE=$batch (all known and newly discovered actor works)"
          python apps/mimmi-gallery/discover_v2ph_actor.py --pages 12 --albums 90 --images 300 --album-pages 40 --batch-index "$batch" --batch-size 8 --scroll
      - name: Validate verified public image manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apps/mimmi-gallery/v2ph-actor-previews.json').read_text())
          assert d['summary']['actor_albums_discovered']>=0
          assert d['summary']['private_cloud_photos_archived']==0
          for a in d['albums']:
            assert a['images']==[]
            for i in a['samples']:
              assert i['sha256'] and i['bytes']>4000
          print('MIMMI_ACTOR_WIDE_VERIFY_RESULT',d['summary'])
          PY
      - name: Publish verified actor images safely despite simultaneous source updates
        shell: bash
        run: |
          # Preserve current crawled manifest in memory, merge with latest main
          # and retry racing writes without losing previously saved SHA evidence.
          python apps/gallery-archive/commit_crawler_research.py \
            --manifest v2ph-actor-previews.json --retries 8
