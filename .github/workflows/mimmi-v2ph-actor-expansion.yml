name: Mimmi V2PH Actor Wide Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * 2,5'
  push:
    paths:
      - apps/mimmi-gallery/discover_v2ph_actor.py
      - apps/mimmi-gallery/test_v2ph_actor.py
      - .github/workflows/mimmi-v2ph-actor-expansion.yml
permissions:
  contents: write
concurrency:
  group: mimmi-actor-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 Pillow
      - name: Compile and test scoped actor discovery
        run: |
          python -m py_compile apps/mimmi-gallery/discover_v2ph_actor.py
          python apps/mimmi-gallery/test_v2ph_actor.py
      - name: Discover broad actor album set and verify displayed photo bytes
        run: python apps/mimmi-gallery/discover_v2ph_actor.py --pages 8 --albums 70 --images 12
      - name: Validate verified public image manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apps/mimmi-gallery/v2ph-actor-previews.json').read_text())
          assert d['summary']['actor_albums_discovered']>=0
          assert d['summary']['private_cloud_photos_archived']==0
          for a in d['albums']:
            assert a['images']==[]
            for i in a['samples']:
              assert i['sha256'] and i['bytes']>4000
          print('MIMMI_ACTOR_WIDE_VERIFY_RESULT',d['summary'])
          PY
      - name: Publish real public preview URLs and hashes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mimmi-gallery/v2ph-actor-previews.json
          if ! git diff --cached --quiet; then
            git commit -m "Index verified Mimmi V2PH actor photo previews"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
