name: Yui Mimmi Video Gallery Real Browser QA
on:
  pull_request:
    paths:
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/videos.html'
      - 'apps/mimmi-gallery/videos.html'
      - 'apps/yui-gallery/videos.json'
      - 'apps/mimmi-gallery/videos.json'
      - 'apps/gallery-archive/test_video_gallery.cjs'
      - 'apps/gallery-archive/qa_video_gallery.py'
      - '.github/workflows/gallery-video-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/yui-gallery/videos.html'
      - 'apps/mimmi-gallery/videos.html'
      - 'apps/yui-gallery/videos.json'
      - 'apps/mimmi-gallery/videos.json'
      - 'apps/gallery-archive/test_video_gallery.cjs'
      - 'apps/gallery-archive/qa_video_gallery.py'
      - '.github/workflows/gallery-video-qa.yml'
permissions:
  contents: read
concurrency:
  group: gallery-video-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          node apps/gallery-archive/test_video_gallery.cjs
          python -m py_compile apps/gallery-archive/qa_video_gallery.py
  real-browser:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python apps/gallery-archive/qa_video_gallery.py --browser '${{ matrix.browser }}'
