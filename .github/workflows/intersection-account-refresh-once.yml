name: INTERSECTION — One-time real immutable account backup verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-account-refresh-once.yml"

permissions:
  contents: read

jobs:
  one-time-archive-readback:
    if: github.repository == 'koith/browser-app-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    concurrency:
      group: intersection-target-zip-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    env:
      DEMAND_ACCOUNT_TEMP_STORAGE: github_release
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verified account archive encryption dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Incrementally capture registered public account and read back remote ciphertext
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=10s 1160s python target_account_bundle.py --scheduled
          echo 'Only TARGET_ACCOUNT_GITHUB_TEMP_SHA_VERIFIED with remote_sha256_verified=true verifies real remote account archive.' >> "$GITHUB_STEP_SUMMARY"
