name: INTERSECTION — Fast Private Public-Post Capture
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/demand-research/demand_archive.py"
      - "apps/demand-research/demand_capture_job.py"
      - "apps/demand-research/recovery_spool.py"
      - "apps/demand-research/recover_spool_artifacts.py"
      - "apps/demand-research/test_demand_archive.py"
      - "apps/demand-research/test_terabox_parent_fallback.py"
      - "apps/demand-research/test_flat_first_observation.py"
      - "apps/demand-research/test_rebuild_index_readback.py"
      - "apps/demand-research/test_recovery_spool.py"
      - "apps/demand-research/rebuild_archive.py"
      - ".github/workflows/demand-fast-capture.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/demand_archive.py"
      - "apps/demand-research/demand_capture_job.py"
      - "apps/demand-research/recovery_spool.py"
      - "apps/demand-research/recover_spool_artifacts.py"
      - ".github/workflows/demand-fast-capture.yml"
permissions:
  contents: read
concurrency:
  # PR testing must never evict a queued production archive run.
  # Both schedule + main push share the same production serialization group.
  group: intersection-fast-private-capture-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false
jobs:
  offline-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test private archive crash recovery and public capture without external accounts
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          cd apps/demand-research
          python -m py_compile demand_archive.py demand_capture_job.py recovery_spool.py recover_spool_artifacts.py test_demand_archive.py test_terabox_parent_fallback.py test_flat_first_observation.py rebuild_archive.py test_rebuild_index_readback.py test_recovery_spool.py
          python -m pip install --disable-pip-version-check cryptography==46.0.4
          python -m pytest -q test_demand_archive.py test_terabox_parent_fallback.py test_flat_first_observation.py test_rebuild_index_readback.py test_recovery_spool.py
  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
      DEMAND_TERABOX_REMOTE: "archive:DemandResearch"
      DEMAND_CAPTURE_PUBLIC_ALLOWED: "1"
      DEMAND_FAST_CAPTURE_MODE: "1"
      DEMAND_ARCHIVE_RECOVERY_KEY: ${{ secrets.DEMAND_ARCHIVE_RECOVERY_KEY }}
      DEMAND_RECOVERY_SPOOL_DIR: "/tmp/intersection-private-recovery"
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed if private TeraBox credential is not available
        run: |
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" || { echo "::error::Private archive credential missing: capture not started"; exit 1; }
      - name: Install pinned private TeraBox backend
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -qi terabox
          rm -rf /tmp/rclone.zip /tmp/rclone-extra
      - name: Install authenticated encryption for private recovery
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Capture public originals with an encrypted pre-upload safety buffer
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=10s 1080s python demand_capture_job.py
          echo 'Private capture attempted; aggregate counters are in job log.' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist encrypted recovery buffers only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intersection-private-recovery-${{ github.run_id }}
          path: /tmp/intersection-private-recovery/*.enc
          retention-days: 14
          if-no-files-found: ignore
          compression-level: 0
