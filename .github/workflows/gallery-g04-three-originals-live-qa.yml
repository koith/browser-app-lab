name: Gallery G04 Three New Original Photos Live QA
on:
  pull_request:
    paths:
      - .github/workflows/gallery-g04-three-originals-live-qa.yml
      - apps/gallery-archive/verification/g04-chinokun-new-originals.json
  push:
    branches: [main]
    paths:
      - .github/workflows/gallery-g04-three-originals-live-qa.yml
      - apps/gallery-archive/verification/g04-chinokun-new-originals.json
permissions:
  contents: read
jobs:
  audit-three-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          case=json.loads(Path('apps/gallery-archive/verification/g04-chinokun-new-originals.json').read_text())
          owner=json.loads(Path('apps/yui-gallery/owner-index.json').read_text())
          album=case['selection']['yui'][0]
          assert album['id']=='yui-chinokun-illustar-2026-public'
          assert len(album['images'])==3
          remote=next(a for a in owner['albums'] if a['id']==album['id'])
          for photo in album['images']:
              present=next(p for p in remote['images'] if p['number']==photo['number'])
              for key in ('sha256','width','height','bytes'):
                  assert photo[key]==present[key]
          print('G04_NEW_3_REMOTE_SHA_ROWS_VALIDATED')
          PY
  exact-new-photo-browser:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: audit-three-originals
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright==1.58.0' requests
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exact new original, preview, lightbox, download SHA and reload
        run: |
          python apps/gallery-archive/qa_new_physical_photos.py \
            --model yui --browser '${{ matrix.browser }}' \
            --selection apps/gallery-archive/verification/g04-chinokun-new-originals.json \
            --out "$RUNNER_TEMP/g04-yui-${{ matrix.browser }}.json"
      - name: Record actual decoded photos
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('g04-yui-*.json'):
              d=json.loads(p.read_text())
              print('G04_NEW_PHOTO_BROWSER_RESULT',d['browser'],d.get('success'),
                    [(x['album'],x['number'],x['download_sha256_verified']) for x in d.get('photos',[])],
                    'reload_pass',d.get('reload_pass'))
          PY
