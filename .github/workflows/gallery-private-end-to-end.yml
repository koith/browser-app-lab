name: Authenticated Private Gallery Real TeraBox Original/Preview Browser QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_live_gateway.py'
      - '.github/workflows/gallery-private-end-to-end.yml'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_live_gateway.py'
      - '.github/workflows/gallery-private-end-to-end.yml'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
permissions:
  contents: read
jobs:
  syntax-and-auth-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt 'httpx==0.28.1'
      - run: |
          python -m py_compile apps/gallery-archive/qa_live_gateway.py apps/mimmi-gallery/cloud/gateway/main.py
          python apps/mimmi-gallery/cloud/test_gateway.py
  private-cloud-real-byte-readback:
    needs: syntax-and-auth-regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      PRIVATE_GATEWAY_TEST_BASE: http://127.0.0.1:18765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt
      - name: Install checksum-checked TeraBox read client
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpacked"
          binary="$(find "$RUNNER_TEMP/unpacked" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test real private media GET, CORS and exact byte SHA for both models
        shell: bash
        run: |
          set -euo pipefail
          export GALLERY_ACCESS_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$GALLERY_ACCESS_TOKEN"
          export ARCHIVE_REMOTE="archive:MimmiArchive"
          cd apps/mimmi-gallery/cloud/gateway
          python -m uvicorn main:app --host 127.0.0.1 --port 18765 \
            > "$RUNNER_TEMP/private-gateway.txt" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --silent --fail 'http://127.0.0.1:18765/api/health' > /dev/null;then break;fi
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          python apps/gallery-archive/qa_live_gateway.py
          echo 'Both model catalogs and actual full/preview media passed gateway + browser CORS and independent SHA-256.' >> "$GITHUB_STEP_SUMMARY"
