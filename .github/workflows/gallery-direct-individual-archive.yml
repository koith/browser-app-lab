name: Gallery Direct Individual Photo Collection and Verified Storage
on:
  workflow_dispatch:
  # Repeat bounded public-source windows so thousands of registered pages are
  # eventually inspected, without brute-force or bypassing source controls.
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    # Storage-only fixes must not recrawl/reupload known held source objects.
    # All offline regressions still run on pull requests; manual collection stays available.
    paths:
      - apps/gallery-archive/direct_photo_pipeline.py
      - apps/gallery-archive/private_collection_snapshot.py
      - apps/gallery-archive/read_owner_metadata.py
      - apps/gallery-archive/upload_verified_individual.py
      - apps/gallery-archive/commit_verified_owner_catalog.py
      - apps/gallery-archive/owner_upload_web_token.py
      - apps/gallery-archive/collect_teapawt_public.py
      - apps/gallery-archive/visual_public_work.py
      - apps/yui-gallery/public_photo_archive.py
      - apps/*-gallery/public-work-pages.json
  pull_request:
    paths:
      - apps/gallery-archive/direct_photo_pipeline.py
      - apps/gallery-archive/official_sample_recovery.py
      - apps/gallery-archive/test_official_sample_recovery.py
      - apps/gallery-archive/probe_official_missing_bytes.py
      - apps/gallery-archive/defer_verified_batch.py
      - apps/gallery-archive/private_collection_snapshot.py
      - apps/gallery-archive/upload_verified_individual.py
      - apps/gallery-archive/commit_verified_owner_catalog.py
      - apps/gallery-archive/owner_upload_web_token.py
      - apps/gallery-archive/test_private_collection_snapshot.py
      - apps/gallery-archive/test_deferred_verified_batch.py
      - apps/gallery-archive/transfer_individual_files.py
      - apps/gallery-archive/test_transfer_individual_files.py
      - apps/gallery-archive/verify_terabox.py
      - apps/gallery-archive/recover_verified_work_batches.py
      - apps/gallery-archive/test_verified_work_recovery.py
      - apps/gallery-archive/test_remote_readback_deadline.py
      - apps/gallery-archive/test_owner_copyto_fallback.py
      - apps/gallery-archive/collect_teapawt_public.py
      - apps/gallery-archive/test_teapawt_public.py
      - apps/gallery-archive/visual_public_work.py
      - apps/gallery-archive/load_pending_individual.py
      - apps/gallery-archive/read_owner_metadata.py
      - apps/gallery-archive/test_owner_metadata.py
      - apps/gallery-archive/test_pending_individual.py
      - apps/mimmi-gallery/cloud/gateway/individual_import.py
      - apps/mimmi-gallery/cloud/test_individual_import.py
      - apps/gallery-archive/test_public_failures.py
      - apps/yui-gallery/public_photo_archive.py
      - apps/gallery-archive/test_visual_public_work.py
      - apps/gallery-archive/work_coverage.py
      - apps/*-gallery/public-work-pages.json
      - apps/gallery-archive/test_direct_photo_pipeline.py
      - apps/gallery-archive/test_work_coverage.py
      - apps/mimmi-gallery/cloud/gateway/media_cache.py
      - apps/mimmi-gallery/cloud/test_media_cache.py
      - apps/mimmi-gallery/cloud/test_copyto_media_fallback.py
      - .github/workflows/gallery-direct-individual-archive.yml
permissions:
  contents: read
jobs:
  official-publisher-missing-photo-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/mimmi-gallery
            apps/gallery-archive
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow
      - name: Verify exact current public publisher image bytes, no cloud writes
        run: python apps/gallery-archive/probe_official_missing_bytes.py
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt requests beautifulsoup4 Scrapy
      - run: |
          python apps/gallery-archive/test_direct_photo_pipeline.py
          python apps/gallery-archive/test_official_sample_recovery.py
          python apps/gallery-archive/test_public_work_photo_extractor.py
          python apps/gallery-archive/test_reverse_source_bridge.py
      - name: Measure every registered owner work and excluded public source host
        run: |
          python - <<'PY'
          import sys
          from collections import Counter
          from urllib.parse import urlsplit
          from pathlib import Path
          sys.path.insert(0,'apps/gallery-archive')
          from collector_full_census import census
          from direct_photo_pipeline import safe_registered_public_page
          data=census(Path('.'))
          for model in ('yui','mimmi'):
              rows=[v for v in data['targets'] if v['kind']=='work' and v['model']==model and v.get('owner_registered')]
              urls=[u for row in rows for u in row.get('urls',[])]
              safe=[u for u in urls if safe_registered_public_page(u,model)]
              blocked=Counter(urlsplit(u).hostname for u in urls if not safe_registered_public_page(u,model))
              info={'registered_owner_works':len(rows),
                    'works_with_approved_source':sum(any(safe_registered_public_page(u,model) for u in row['urls']) for row in rows),
                    'source_urls':len(urls),'approved_source_urls':len(safe),
                    'excluded_source_hosts':blocked.most_common(12)}
              print('OWNER_CENSUS_PUBLIC_SOURCE_SCOPE',model,info,flush=True)
          PY
          python apps/gallery-archive/test_deferred_verified_batch.py
          python apps/gallery-archive/test_private_collection_snapshot.py
          python apps/gallery-archive/test_commit_verified_owner_catalog.py
          python apps/gallery-archive/test_upload_verified_individual.py
          python apps/gallery-archive/test_owner_upload_web_token.py
          python apps/gallery-archive/test_transfer_individual_files.py
          python apps/gallery-archive/test_teapawt_public.py
          python apps/gallery-archive/test_public_failures.py
          python apps/gallery-archive/test_visual_public_work.py
          python apps/gallery-archive/test_work_coverage.py
          python apps/gallery-archive/test_pending_individual.py
          python apps/gallery-archive/test_owner_metadata.py
          python apps/mimmi-gallery/cloud/test_individual_import.py
          python apps/mimmi-gallery/cloud/test_sealed_session.py
          python apps/mimmi-gallery/cloud/test_cookie_format.py
          python apps/gallery-archive/test_remote_readback_deadline.py
          python apps/gallery-archive/test_owner_copyto_fallback.py
          python apps/gallery-archive/test_verified_work_recovery.py
          python apps/gallery-archive/test_reverse_image_sweep.py
          python apps/mimmi-gallery/cloud/test_media_cache.py
          python apps/mimmi-gallery/cloud/test_gateway.py
          python apps/mimmi-gallery/cloud/test_copyto_media_fallback.py
          python apps/mimmi-gallery/cloud/test_cover_cache.py
  collect-store-readback:
    needs: offline-regressions
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: write
      actions: write
      # Only this exact main-branch collector may request the signed, fresh
      # private catalog already accessible through the user's Render gateway.
      id-token: write
    concurrency:
      group: gallery-terabox-private-mass-upload-${{ matrix.model }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mimmi, yui]
    env:
      GH_TOKEN: ${{ github.token }}
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_UPLOAD_THREADS: '1'
      MODEL: ${{ matrix.model }}
      # 470 author-scoped links fully scanned in production run 41613279077;
      # all 470 media bytes matched existing 454 distinct SHA files, +0 new.
      # Return to rotating 40/link run; no need to re-fetch 470 duplicates each cycle.
      GALLERY_YUI_FEED_SCAN_LIMIT: '40'
      # Only main collector: exact SHA-named pre-existing owner pending queues
      # may be re-read via the same-account signed gateway on provider 400141.
      GALLERY_AUTHORIZED_PENDING_READ: '1'
      # The first cohort is fully proven before this release is merged.
      # Incoming batches still require independent exact media SHA readback.
      ARCHIVE_PUBLICATION_MODE: immediate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 Pillow Scrapy 'playwright==1.58.0' 'httpx==0.28.1'
      - name: Install Chromium only for public registered page rendering
        run: python -m playwright install --with-deps chromium
      - name: Install pinned owner storage client, not a photo archive
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/client" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/client"
          binary="$(find "$RUNNER_TEMP/client" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Requery actual private catalog before collecting any new bytes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODEL" == mimmi ]]; then cookie="$MIMMI_COOKIE";remote='archive:MimmiArchive';else cookie="$YUI_COOKIE";remote='archive:YuiArchive';fi
          # The pinned client mistakes a padded raw ndus token for a complete
          # Cookie header. Preserve the same credential in its normal format.
          cookie="$(python - <<'PY'
          import os,sys
          sys.path.insert(0,'apps/mimmi-gallery/cloud/gateway')
          from cookie_format import cookie_header
          raw=os.environ['MIMMI_COOKIE' if os.environ['MODEL']=='mimmi' else 'YUI_COOKIE']
          header=cookie_header(raw)
          print('OWNER_STORAGE_AUTH_HEADER_NORMALIZED',header!=raw,file=sys.stderr)
          print(header)
          PY
          )"
          test -n "$cookie"
          echo "::add-mask::$cookie"
          echo "RCLONE_CONFIG_ARCHIVE_COOKIE=$cookie" >> "$GITHUB_ENV"
          echo "ARCHIVE_REMOTE=$remote" >> "$GITHUB_ENV"
          export RCLONE_CONFIG_ARCHIVE_COOKIE="$cookie"
          # Before checking remote metadata, try the same authorised TeraBox
          # web session already used for uploads. If normal login needs
          # verification, retain the existing provider-challenge fail-closed gate.
          python apps/gallery-archive/read_owner_metadata.py --remote "$remote" --model "$MODEL" --out "$RUNNER_TEMP/owner-before.json" --published-index "apps/$MODEL-gallery/owner-index.json" --refresh-existing-web-session --signed-gateway-catalog-fallback
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'owner-before.json').read_text())
          assert d['model']==os.environ['MODEL'] and d['schema_version']==1
          print('ACTUAL_OWNER_BASELINE',d['model'],'albums',len(d['albums']),'stored_rows',sum(len(a['images']) for a in d['albums']))
          PY
          if python apps/gallery-archive/safe_rclone.py about "$remote" --json --timeout 60s --retries 1 > "$RUNNER_TEMP/quota-before.json"; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'quota-before.json').read_text())
          print('OWNER_STORAGE_QUOTA_BYTES',{k:d[k] for k in ('total','used','free') if k in d})
          PY
          fi
      - name: Admit only pre-uploaded individual-photo queues from this same private archive
        id: incoming
        run: |
          mkdir -p "$RUNNER_TEMP/stage/originals" "$RUNNER_TEMP/stage/previews"
          python apps/gallery-archive/load_pending_individual.py --owner "$RUNNER_TEMP/owner-before.json" --stage "$RUNNER_TEMP/stage" --remote "$ARCHIVE_REMOTE" --model "$MODEL" --github-output "$GITHUB_OUTPUT"
      - name: Independently re-download and SHA-check every incoming original and preview
        if: steps.incoming.outputs.found == 'true'
        run: python apps/gallery-archive/verify_terabox.py --stage "$RUNNER_TEMP/stage" --remote "$ARCHIVE_REMOTE" --workers 2
      - name: Feed saved image-first source leads back into real photo acquisition
        if: steps.incoming.outputs.found != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/reverse-shards"
          last="$(gh run list --workflow gallery-reverse-full-corpus-ab.yml             --limit 20 --json databaseId,conclusion             --jq '[.[] | select(.conclusion=="success")][0].databaseId' 2>/dev/null || true)"
          if [[ "$last" =~ ^[0-9]+$ ]]; then
            gh run download "$last" --pattern 'reverse-full-*'               --dir "$RUNNER_TEMP/reverse-shards" || true
          fi
          python apps/gallery-archive/reverse_source_bridge.py             --dir "$RUNNER_TEMP/reverse-shards" --model "$MODEL"             --owner "$RUNNER_TEMP/owner-before.json"             --out "$RUNNER_TEMP/reverse-page-leads.json"
      - name: Store only reviewed publisher/creator originals; public rehosts remain discovery leads, never storage
        if: steps.incoming.outputs.found != 'true'
        run: echo 'STORAGE_RIGHTS_GATE publisher-verified-only; discovery elsewhere unchanged'
      - name: Collect all observed public pages into individually verified files, without photo ZIPs
        if: steps.incoming.outputs.found != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/stage/originals" "$RUNNER_TEMP/stage/previews"
          focused=()
          if [[ "$ARCHIVE_PUBLICATION_MODE" == deferred ]]; then focused=(--focused-only); fi
          python apps/gallery-archive/direct_photo_pipeline.py --model "$MODEL" --owner "$RUNNER_TEMP/owner-before.json" --out "$RUNNER_TEMP/stage" --max-new 500 --max-pages 60 --page-cycle "$GITHUB_RUN_NUMBER" --alternative-engines --render-budget 30 --reviewed-source-only --reverse-evidence "$RUNNER_TEMP/reverse-page-leads.json" "${focused[@]}"
      - name: Content-address focused files for an unpublished private batch
        if: env.ARCHIVE_PUBLICATION_MODE == 'deferred' && steps.incoming.outputs.found != 'true'
        run: python apps/gallery-archive/defer_verified_batch.py prepare --stage "$RUNNER_TEMP/stage" --owner "$RUNNER_TEMP/owner-before.json"
      - name: Preserve unverified source correspondence privately before any original transfer
        if: steps.incoming.outputs.found != 'true'
        run: python apps/gallery-archive/private_collection_snapshot.py --stage "$RUNNER_TEMP/stage" --model "$MODEL" --remote "$ARCHIVE_REMOTE" --run-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Merge measured new rows without replacing existing owner photos
        run: python apps/gallery-archive/merge_incremental.py --model "$MODEL" --previous "$RUNNER_TEMP/owner-before.json" --stage "$RUNNER_TEMP/stage"
      - name: Distinguish a real new-file transaction from a no-op
        id: delta
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'stage/metadata/incremental-merge.json').read_text())
          changed=d['new_photos']+d['upgraded_photos']>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('changed='+str(changed).lower()+'\n')
          print('ACTUAL_NEW_PHOTO_TRANSACTION',changed,d['new_photos'],d['upgraded_photos'])
          PY
      - name: Refresh existing authenticated owner web token before individual upload
        if: steps.delta.outputs.changed == 'true' && steps.incoming.outputs.found != 'true'
        run: python apps/gallery-archive/owner_upload_web_token.py --github-env "$GITHUB_ENV" --best-effort
      - name: Upload originals and previews per photo with independent full SHA readback
        if: steps.delta.outputs.changed == 'true' && steps.incoming.outputs.found != 'true'
        run: |
          set -euo pipefail
          python apps/gallery-archive/upload_verified_individual.py \
            --stage "$RUNNER_TEMP/stage" \
            --previous "$RUNNER_TEMP/owner-before.json" \
            --model "$MODEL" --remote "$ARCHIVE_REMOTE"
          python apps/gallery-archive/verify_terabox.py \
            --stage "$RUNNER_TEMP/stage" --remote "$ARCHIVE_REMOTE" \
            --workers 2 --only-staged
      - name: Retain whole independently verified works after a different work fails
        if: failure() && steps.delta.outputs.changed == 'true' && steps.incoming.outputs.found != 'true'
        run: python apps/gallery-archive/recover_verified_work_batches.py --stage "$RUNNER_TEMP/stage" --owner "$RUNNER_TEMP/owner-before.json" --remote "$ARCHIVE_REMOTE"
      - name: Persist the exact remotely verified batch without resetting deployed gallery QA
        if: steps.delta.outputs.changed == 'true' && env.ARCHIVE_PUBLICATION_MODE == 'deferred' && steps.incoming.outputs.found != 'true'
        run: python apps/gallery-archive/defer_verified_batch.py persist --stage "$RUNNER_TEMP/stage" --remote "$ARCHIVE_REMOTE"
      - name: Renew normal owner web upload state before verified catalog commit
        if: steps.delta.outputs.changed == 'true' && env.ARCHIVE_PUBLICATION_MODE != 'deferred'
        run: python apps/gallery-archive/owner_upload_web_token.py --github-env "$GITHUB_ENV" --best-effort
      - name: Commit only remotely SHA-verified catalogue with exact delayed-visibility readback
        if: steps.delta.outputs.changed == 'true' && env.ARCHIVE_PUBLICATION_MODE != 'deferred'
        run: |
          set -euo pipefail
          python apps/gallery-archive/commit_verified_owner_catalog.py \
            --stage "$RUNNER_TEMP/stage" --model "$MODEL" \
            --remote "$ARCHIVE_REMOTE" \
            --out "$RUNNER_TEMP/catalog-readback.json"
      - name: Publish only verified owner metadata, never original image bytes or storage keys
        if: steps.delta.outputs.changed == 'true' && env.ARCHIVE_PUBLICATION_MODE != 'deferred'
        run: |
          python apps/gallery-archive/publish_owner_index.py --model "$MODEL" --input "$RUNNER_TEMP/catalog-readback.json" --output "$RUNNER_TEMP/owner-index.json"
          python apps/gallery-archive/commit_owner_index.py --model "$MODEL" --input "$RUNNER_TEMP/owner-index.json"
      - name: Deploy verified metadata, followed by real deployed browser QA
        if: steps.delta.outputs.changed == 'true' && env.ARCHIVE_PUBLICATION_MODE != 'deferred'
        run: |
          gh workflow run static.yml --ref main
          gh workflow run gallery-deployed-pages-photo-qa.yml --ref main
          gh workflow run gallery-newly-stored-photo-qa.yml --ref main
      - name: Preserve per-file source coverage in the same private owner archive
        if: steps.delta.outputs.changed == 'true'
        run: |
          set -euo pipefail
          audit_path="metadata/audits/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MODEL}.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'stage/metadata'
          path=root/'collection-audit.json';audit=json.loads(path.read_text())
          verified=json.loads((root/'remote-verification.json').read_text())
          assert verified['failed']==0 and verified['media_checked']==verified['full_SHA256_verified']
          audit.update(remote_verified_files=verified['photos'],remote_verified_media_objects=verified['full_SHA256_verified'],
              owner_index_published=os.environ['ARCHIVE_PUBLICATION_MODE']!='deferred',
              publication_mode=os.environ['ARCHIVE_PUBLICATION_MODE'],
              gallery_qa_workflow='gallery-newly-stored-photo-qa.yml')
          path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY
          python apps/gallery-archive/safe_rclone.py copyto "$RUNNER_TEMP/stage/metadata/collection-audit.json" "$ARCHIVE_REMOTE/$audit_path" --ignore-times --timeout 60s --retries 1
          python apps/gallery-archive/safe_rclone.py cat "$ARCHIVE_REMOTE/$audit_path" --timeout 60s --retries 1 > "$RUNNER_TEMP/audit-readback.json"
          cmp "$RUNNER_TEMP/stage/metadata/collection-audit.json" "$RUNNER_TEMP/audit-readback.json"
      - name: Report file persistence and remote verification separately from browser QA
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          metadata=Path(os.environ['RUNNER_TEMP'])/'stage/metadata'
          for name in ('collection-audit.json','incremental-merge.json','remote-verification.json'):
              p=metadata/name
              if p.exists():
                  d=json.loads(p.read_text())
                  print('DIRECT_ARCHIVE_OUTCOME',name,{k:v for k,v in d.items() if k not in ('results','errors')})
          PY
