name: 4LEAF original missing 19 CHR bodies actual 662 pixel QA
on:
  pull_request:
    branches: [main, import/4leaf-round11-native-play-20261103]
    paths:
      - 'apps/4leaf/rog/original/OBS/referenced/**'
      - 'apps/4leaf/rog/chr-body-source-map.js'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/tests/chr-19-recovered-real-game.cjs'
      - '.github/workflows/rog-recovered-19-bodies-qa.yml'
  push:
    branches: [feat/4leaf-recover-19-original-chr-bodies-20261103,main]
    paths:
      - 'apps/4leaf/rog/original/OBS/referenced/**'
      - 'apps/4leaf/rog/chr-body-source-map.js'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/tests/chr-19-recovered-real-game.cjs'
      - '.github/workflows/rog-recovered-19-bodies-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-chr-bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: '0'
          - browser: webkit
            mobile: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source browser engine
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve precise SHA original sprite files
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-19-bodies.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-19-bodies.log
          exit 1
      - name: Exact SHA256 pixels, 19 CHR originals, real game rendering
        env:
          FOURLEAF_BROWSER: ${{ matrix.browser }}
          FOURLEAF_MOBILE: ${{ matrix.mobile }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/chr-19-recovered-real-game.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-19-original-body-screens-${{ matrix.browser }}-mobile-${{ matrix.mobile }}
          path: |
            leaf-chr-19-original-recovered-*.png
            /tmp/leaf-19-bodies.log
          if-no-files-found: ignore
