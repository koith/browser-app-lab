name: INTERSECTION — Append-Only Account Revision & Schedule QA

on:
  pull_request:
    paths:
      - ".github/workflows/intersection-append-only-account-qa.yml"
      - ".github/workflows/intersection-target-account-bundle.yml"
      - "apps/demand-research/target_account_archive.py"
      - "apps/demand-research/target_account_bundle.py"
      - "apps/demand-research/github_temp_bundle.py"
      - "apps/demand-research/test_target_account_archive.py"
      - "apps/demand-research/test_target_account_bundle.py"
      - "apps/demand-research/test_target_account_append_only_schedule.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-append-only-account-qa.yml"
      - ".github/workflows/intersection-target-account-bundle.yml"
      - "apps/demand-research/target_account_archive.py"
      - "apps/demand-research/target_account_bundle.py"
      - "apps/demand-research/github_temp_bundle.py"
      - "apps/demand-research/test_target_account_archive.py"
      - "apps/demand-research/test_target_account_bundle.py"
      - "apps/demand-research/test_target_account_append_only_schedule.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intersection-append-only-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision-and-schedule:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest==8.4.2 cryptography==46.0.4
      - name: Confirm Python archive and append-only test syntax
        run: |
          python -m py_compile apps/demand-research/target_account_archive.py apps/demand-research/target_account_bundle.py apps/demand-research/github_temp_bundle.py apps/demand-research/test_target_account_append_only_schedule.py
      - name: Verify revisions only append, no deletion, and rotating AES registry
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          python -m pytest -q test_target_account_archive.py test_target_account_bundle.py test_target_account_append_only_schedule.py
