name: INTERSECTION — Live Private ZIP Viewer Readback QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/demand-research/verify_live_account_bundle.py"
      - "apps/demand-research/verified_bundle_reader.py"
      - "apps/demand-research/target_account_bundle.py"
      - ".github/workflows/intersection-zip-reader-verify.yml"
  pull_request:
    paths:
      - "apps/demand-research/verify_live_account_bundle.py"
      - "apps/demand-research/verified_bundle_reader.py"
      - ".github/workflows/intersection-zip-reader-verify.yml"

permissions:
  contents: read

jobs:
  offline-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live readback contract without private archive access
        run: |
          python -m py_compile apps/demand-research/verify_live_account_bundle.py apps/demand-research/verified_bundle_reader.py
          python - <<'PY'
          from pathlib import Path
          script=Path(".github/workflows/intersection-zip-reader-verify.yml").read_text()
          assert "rclone help backends | grep -i terabox >/dev/null" in script
          assert ("grep -q" + "i terabox") not in script
          PY
  live-private-reader:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_UPLOAD_THREADS: "1"
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
      DEMAND_TERABOX_REMOTE: "archive:DemandResearch"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install digest-pinned private TeraBox backend
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" || { echo "::error::Private archive credential missing"; exit 1; }
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -i terabox >/dev/null
      - name: Verify archived real ZIP bytes, internal manifest and SNS reader
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          python -m py_compile verify_live_account_bundle.py verified_bundle_reader.py
          python verify_live_account_bundle.py
