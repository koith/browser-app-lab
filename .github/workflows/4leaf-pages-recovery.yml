name: Inspect deployment cleanup eligibility
on:
  push:
    branches: [ops/4leaf-pages-release-recovery-20261101]
    paths: ['.github/workflows/4leaf-pages-recovery.yml']
permissions:
  deployments: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check duplicate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/7470734689/statuses" -f state=inactive -f description='Superseded duplicate deployment record' -F auto_inactive=false
          gh api "repos/$GITHUB_REPOSITORY/deployments/7470734689/statuses" --jq '.[0].state'
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/static.yml/dispatches" -f ref=main
