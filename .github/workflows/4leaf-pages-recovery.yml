name: 4LEAF Pages publishing-source diagnostics
on:
  push:
    branches: [ops/4leaf-pages-release-recovery-20261101]
    paths: ['.github/workflows/4leaf-pages-recovery.yml']
permissions:
  contents: read
  pages: write
  deployments: read
jobs:
  inspect-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Pages build type, source and recent deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'PAGES_CONFIGURATION'
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{status,build_type,source,html_url}'
          echo 'DEPLOYMENTS'
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=12" --jq '[.[] | {id,sha,environment,created_at,original_environment}]'
          echo 'OLD_PAGES_DEPLOYMENT'
          gh api "repos/$GITHUB_REPOSITORY/pages/deployments/bc1328b0940bb693d33e12853051522da10d9665" --jq '.status'
