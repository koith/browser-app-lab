name: 4LEAF Pages stuck deployment recovery (one-time)
on:
  push:
    branches:
      - ops/4leaf-pages-release-recovery-20261101
    paths:
      - '.github/workflows/4leaf-pages-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check stale deployment status and release blocked Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          old=bc1328b0940bb693d33e12853051522da10d9665
          target=e6d06fe74bd430b5fa9142f3ac5750fbc3b39b6a
          echo "Target main: $target; stale previous Pages deployment: $old"
          status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$old" --jq '.status')"
          echo "Stale Pages deployment reported status: $status"
          case "$status" in
            succeed|success)
              echo "API reports successful previous deployment; not cancelling without evidence of an active operation."
              ;;
            *)
              echo "Cancelling only the stalled deployment identified by Pages in error logs."
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$old/cancel"
              ;;
          esac
          echo "Requesting one clean Pages deployment for main"
          gh workflow run static.yml --ref main
