name: Gallery Cloudflare Deployed Photo Browser Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_cloudflare_pages_browser.py'
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/mimmi-gallery/cloudflare-gateway.json'
      - 'apps/yui-gallery/cloudflare-gateway.json'
      - '.github/workflows/gallery-cloudflare-deployed-release.yml'
permissions:
  contents: read
concurrency:
  group: gallery-cloudflare-public-release
  cancel-in-progress: false
jobs:
  real-deployed-photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real browser and image decoding verification
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify exact deployed Pages gallery, original SHA, native image and lightbox
        run: |
          python -m py_compile apps/gallery-archive/qa_cloudflare_pages_browser.py
          python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --browser '${{ matrix.browser }}'
