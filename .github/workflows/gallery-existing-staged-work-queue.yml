name: Independently Verify Previously Uploaded Existing Works
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gallery-existing-staged-work-queue.yml
      - apps/gallery-archive/stage_existing_work.py
  pull_request:
    paths:
      - .github/workflows/gallery-existing-staged-work-queue.yml
      - apps/gallery-archive/stage_existing_work.py
      - apps/gallery-archive/test_stage_existing_work.py
permissions:
  contents: read
jobs:
  validate-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 Pillow
      - run: python apps/gallery-archive/test_stage_existing_work.py
  exact-existing-objects:
    needs: validate-scope
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        work: [v2ph-actor-z63984ma, v2ph-actor-amn8o34z, v2ph-actor-zo5n754z]
    concurrency:
      group: readonly-existing-objects-${{ matrix.work }}
      cancel-in-progress: false
    env:
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 Pillow
      - name: Install checksum-pinned storage client; never a photo bundle
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/client" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/client"
          binary="$(find "$RUNNER_TEMP/client" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Use the same existing owner credential in normal Cookie-header format
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'apps/mimmi-gallery/cloud/gateway')
          from cookie_format import cookie_header
          raw=os.environ['MIMMI_COOKIE'];header=cookie_header(raw)
          if not header:raise ValueError('Existing owner credential is missing')
          print('::add-mask::'+header)
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write('RCLONE_CONFIG_ARCHIVE_COOKIE='+header+'\n')
          print('EXISTING_OWNER_COOKIE_FORMAT_NORMALIZED',header!=raw)
          PY
      - name: Require the fresh complete existing owner catalogue
        run: python apps/gallery-archive/read_owner_metadata.py --remote archive:MimmiArchive --model mimmi --out "$RUNNER_TEMP/owner.json" --published-index apps/mimmi-gallery/owner-index.json
      - name: Reconstruct only one reviewed public edition; no original upload
        id: stage
        run: python apps/gallery-archive/stage_existing_work.py --model mimmi --work '${{ matrix.work }}' --owner "$RUNNER_TEMP/owner.json" --out "$RUNNER_TEMP/stage" --github-output "$GITHUB_OUTPUT"
      - name: Content-address the exact staged source bytes
        if: steps.stage.outputs.changed == 'true'
        run: python apps/gallery-archive/defer_verified_batch.py prepare --stage "$RUNNER_TEMP/stage" --owner "$RUNNER_TEMP/owner.json"
      - name: Independently read EVERY existing original and preview, with exact SHA
        if: steps.stage.outputs.changed == 'true'
        run: python apps/gallery-archive/verify_terabox.py --stage "$RUNNER_TEMP/stage" --remote archive:MimmiArchive --workers 1
      - name: Persist only this fully verified work in a private queue; no live index change
        if: steps.stage.outputs.changed == 'true'
        run: python apps/gallery-archive/defer_verified_batch.py persist --stage "$RUNNER_TEMP/stage" --remote archive:MimmiArchive
      - name: Preserve the distinction between verified storage and gallery delivery
        if: success()
        run: |
          echo "Only exact existing remote photo objects were checked; no photo bytes or live catalog were uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "A private work queue, when created, still requires publication and deployed browser QA." >> "$GITHUB_STEP_SUMMARY"
