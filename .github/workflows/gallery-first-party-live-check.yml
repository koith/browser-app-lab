name: Gallery Real Render Passwordless Viewer Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/gateway/Dockerfile'
      - '.github/workflows/gallery-first-party-live-check.yml'
permissions:
  contents: read
jobs:
  deployed-first-party-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify both live gallery pages have no password prompt and catalogs load
        shell: bash
        run: |
          set -euo pipefail
          base='https://mimmi-private-gallery-free.onrender.com'
          yui=''
          mimmi=''
          for attempt in $(seq 1 12); do
            yui="$(curl -fsS --max-time 45 "$base/gallery/yui/" || true)"
            mimmi="$(curl -fsS --max-time 45 "$base/gallery/mimmi/" || true)"
            if [[ "$yui" == *'owner-media.js'* && "$mimmi" == *'owner-media.js'* ]]; then break; fi
            sleep 15
          done
          [[ "$yui" == *'owner-media.js'* && "$mimmi" == *'owner-media.js'* ]]
          [[ "$yui" != *'name="code"'* && "$mimmi" != *'name="code"'* ]]
          [[ "$yui" != *'type="password"'* && "$mimmi" != *'type="password"'* ]]
          [[ "$yui" != *'내 ZIP 여러 개 가져오기'* && "$mimmi" != *'내 Drive 원본 연결'* ]]
          # Two gallery portals must serve their actual static owner indexes.
          # A 200 HTML shell with 404 metadata produced blank individual photos.
          for asset in gallery/yui/owner-index.json gallery/mimmi/owner-index.json gallery/mimmi/album-grouping.js; do
            status=''
            for attempt in $(seq 1 16); do
              status="$(curl -sSL -o "$RUNNER_TEMP/gallery-required-asset" -w '%{http_code}' --max-time 35 "$base/$asset" || true)"
              if [[ "$status" == '200' ]]; then break; fi
              echo "GALLERY_ASSET_NOT_READY $asset HTTP=$status attempt=$attempt"
              sleep 12
            done
            if [[ "$status" != '200' ]]; then
              echo "::error::Live Render gallery asset unavailable: $asset (HTTP $status)"
              exit 1
            fi
            case "$asset" in
              */owner-index.json)
                python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["schema_version"]==1 and len(d["albums"])>0' "$RUNNER_TEMP/gallery-required-asset" ;;
              */album-grouping.js)
                grep -q 'MimmiAlbumGrouping' "$RUNNER_TEMP/gallery-required-asset" ;;
            esac
            echo "LIVE_GALLERY_ASSET_OK $asset"
          done
          curl -fsS --retry 3 --max-time 110 "$base/api/yui/catalog" -o "$RUNNER_TEMP/yui.json"
          curl -fsS --retry 3 --max-time 110 "$base/api/catalog" -o "$RUNNER_TEMP/mimmi.json"
          python - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          for model,limit in (("yui",2700),("mimmi",2600)):
              data=json.loads((base/f"{model}.json").read_text())
              assert data["model"]==model and data["schema_version"]==1
              albums=data["albums"]
              count=sum(len(a["images"]) for a in albums)
              assert count>=limit, (model,count,limit)
              print("LIVE_PASSWORDLESS_ARCHIVE_OK",model,len(albums),count)
          PY
          echo 'YUI_AND_MIMMI_LIVE_PASSWORDLESS_VIEWER_PASS' >> "$GITHUB_STEP_SUMMARY"
