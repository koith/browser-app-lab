name: Yui Mimmi Deployed GitHub Pages Real Photo Browser QA
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Gallery Automatic New Photo Bytes to Private TeraBox"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-deployed-pages-photo-qa.yml'
      - 'apps/gallery-archive/qa_deployed_pages_gallery.py'
  pull_request:
    paths:
      - '.github/workflows/gallery-deployed-pages-photo-qa.yml'
      - 'apps/gallery-archive/qa_deployed_pages_gallery.py'
permissions:
  contents: read
concurrency:
  group: deployed-real-gallery-browser-check-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  gallery-deployed-visual:
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real browser with mobile viewport, no owner secrets
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Open actual deployed Pages, await owner originals, verify cards, thumbnails, lightbox and reload
        run: |
          python -m py_compile apps/gallery-archive/qa_deployed_pages_gallery.py
          python apps/gallery-archive/qa_deployed_pages_gallery.py --browser ${{ matrix.browser }}
      - name: Report only genuinely browser-opened galleries, not collector ZIP counts
        if: success()
        run: |
          echo "### Live GitHub Pages gallery QA passed: ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This test visited the real deployed site with no bearer token, no owner cookies and no uploaded photos." >> "$GITHUB_STEP_SUMMARY"
          echo "- Both models opened first-party album thumbnails and original lightboxes, then reloaded inside GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
