name: Yui Mimmi Deployed GitHub Pages Real Photo Browser QA
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      # Current Pages publisher can be native rather than static.yml.
      # A successful native deployment must run the same real-photo gate.
      - "Deploy static content to Pages"
      - "pages build and deployment"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-deployed-pages-photo-qa.yml'
      - 'apps/gallery-archive/qa_deployed_pages_gallery.py'
      - 'apps/gallery-archive/pages_single_publisher.py'
      - 'apps/gallery-archive/test_pages_deployment_identity.py'
      # A native Pages publish does not reliably deliver workflow_run.
      # Verify every changed gallery index/UI after its exact source is public.
      - 'apps/mimmi-gallery/**'
      - 'apps/yui-gallery/**'
  pull_request:
    paths:
      - '.github/workflows/gallery-deployed-pages-photo-qa.yml'
      - 'apps/gallery-archive/qa_deployed_pages_gallery.py'
      - 'apps/gallery-archive/pages_single_publisher.py'
      - 'apps/gallery-archive/test_pages_deployment_identity.py'
permissions:
  contents: read
  pages: read
concurrency:
  group: deployed-real-gallery-browser-check-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  syntax-before-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - run: |
          python -m py_compile apps/gallery-archive/qa_deployed_pages_gallery.py apps/gallery-archive/pages_single_publisher.py
          python apps/gallery-archive/test_pages_deployment_identity.py
  gallery-deployed-visual:
    # PR script changes must pass against real, currently published galleries
    # before merge. The post-Pages workflow_run repeats the same live proof.
    if: |
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit]
    steps:
      # The exact successful Pages source is authoritative. Latest main may
      # already contain a different regression fixture or gallery HTML.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Wait for the exact native Pages source before testing the real site
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python apps/gallery-archive/pages_single_publisher.py --wait-native-gallery-equivalent
      - name: Prove checkout matches the Pages deployment event
        if: github.event_name == 'workflow_run'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          echo 'GALLERY_DEPLOYED_PHOTO_QA_EXACT_PAGES_SOURCE_SHA_PASS'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real browser with mobile viewport, no owner secrets
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Open actual deployed Pages, await owner originals, verify cards, thumbnails, lightbox and reload
        run: |
          python -m py_compile apps/gallery-archive/qa_deployed_pages_gallery.py
          python apps/gallery-archive/qa_deployed_pages_gallery.py --browser ${{ matrix.browser }}
      - name: Report only genuinely browser-opened galleries, not collector ZIP counts
        if: success()
        run: |
          echo "### Live GitHub Pages gallery QA passed: ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This test visited the real deployed site with no bearer token, no owner cookies and no uploaded photos." >> "$GITHUB_STEP_SUMMARY"
          echo "- Both models opened first-party album thumbnails and original lightboxes, then reloaded inside GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
