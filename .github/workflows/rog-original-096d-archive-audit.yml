name: 4LEAF 0.96d original client 7-part source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rog-original-096d-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-source-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download original public 4Leaf096d seven-part archive and inspect (never execute)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/leaf096d
          cd /tmp/leaf096d
          links=(
            '150DCE41502C60D919'
            '19102341502C60E718'
            '200FD441502C60E917'
            '19207A41502C60EC07'
            '1804D241502C60EF1F'
            '17792C41502C60F11D'
            '177FD041502C60F622'
          )
          : > status.tsv
          printf 'source\tpart\tstatus\tbytes\tsha256\n' > summary.tsv
          for idx in "${!links[@]}"; do
            part="$((idx+1))"
            file="4Leaf096d.part${part}.rar"
            url="https://t1.daumcdn.net/cfile/tistory/${links[$idx]}"
            echo "Fetching original client part ${part}/7"
            status="$(curl -L --compressed --silent --show-error --max-time 60               --retry 1 --retry-delay 2 -A 'Mozilla/5.0 (compatible; archival verification)'               -H 'Referer: https://dev-trip.tistory.com/120'               -w '%{http_code}' -o "$file" "$url" || true)"
            bytes="$(stat -c %s "$file" 2>/dev/null || echo 0)"
            sha="$(sha256sum "$file" 2>/dev/null | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\t%s\n' "$url" "$part" "$status" "$bytes" "$sha" >> summary.tsv
            if [ "$bytes" -gt 65536 ]; then
              file "$file"
              xxd -l 16 "$file"
            else
              echo "Part ${part} missing/blocked or smaller than RAR header expectation"
              [ -f "$file" ] && head -c 100 "$file" | tr -cd '[:print:]' || true
            fi
          done
          cp summary.tsv "$GITHUB_WORKSPACE/leaf-096d-archive-availability.tsv"
          if [ "$(awk 'NR>1 && $4>65536 {a++} END {print a+0}' summary.tsv)" -ne 7 ]; then
            echo "ARCHIVE_INCOMPLETE: No extraction attempted; retain exact HTTP and hashes."
            exit 0
          fi
          if ! command -v 7z >/dev/null; then
            sudo apt-get -qq update && sudo apt-get -qq install -y p7zip-full
          fi
          if 7z l -slt 4Leaf096d.part1.rar > "$GITHUB_WORKSPACE/leaf-096d-archive-list.txt" 2>&1; then
            echo "ARCHIVE_LIST_PASS: original client archive directory inventory collected."
            grep -Ei 'Path = .*\.(pak|exe|dll|dmp|chr|mve|spr|tis)$'               "$GITHUB_WORKSPACE/leaf-096d-archive-list.txt" | head -100 || true
          else
            echo "ARCHIVE_LIST_FAIL: split archive type/password/damage must be inspected."
            tail -60 "$GITHUB_WORKSPACE/leaf-096d-archive-list.txt" || true
          fi
      - name: Inspect complete original InstallShield client payload without executing binaries
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/leaf096d
          if ! [ -f 4Leaf096d.part7.rar ]; then
            echo 'Original seven-part archive unavailable; stop at availability metadata.'
            exit 0
          fi
          mkdir -p original-installer
          7z x -y -ooriginal-installer 4Leaf096d.part1.rar >/tmp/leaf096d/7zip-extract.log
          echo 'Seven-volume RAR extracted; actual 2003 InstallShield data CAB:'
          ls -lh original-installer/data1.cab
          file original-installer/data1.cab
          if ! command -v unshield >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y unshield
          fi
          if ! unshield l original-installer/data1.cab > "$GITHUB_WORKSPACE/leaf-096d-cab-inventory.txt" 2>&1; then
            echo 'InstallShield CAB not parseable with unshield. Exact diagnostic:'
            tail -70 "$GITHUB_WORKSPACE/leaf-096d-cab-inventory.txt"
            exit 0
          fi
          echo 'INSTALLSHIELD_SOURCE_INVENTORY_PASS'
          echo 'Targeted asset names in original client (source listing):'
          grep -Ei '(ChatTown|ChatRoom|Map|Room|Dice|\\.pak|\\.mve|\\.obs|\\.chr|\\.dmp|\\.dll|\\.exe)'             "$GITHUB_WORKSPACE/leaf-096d-cab-inventory.txt" | head -130 || true
          mkdir -p source-client
          if ! unshield -d source-client x original-installer/data1.cab > /tmp/leaf096d/unshield-extract.log 2>&1; then
            echo 'InstallShield file extraction incomplete; leave originals untouched.'
            tail -80 /tmp/leaf096d/unshield-extract.log
            exit 0
          fi
          echo 'INSTALLSHIELD_ORIGINAL_CLIENT_EXTRACT_PASS'
          find source-client -type f -print0 | sort -z |
            xargs -0 -r sha256sum > "$GITHUB_WORKSPACE/leaf-096d-file-sha256.txt"
          find source-client -type f -printf '%p\t%s bytes\n' |
            sort > "$GITHUB_WORKSPACE/leaf-096d-file-sizes.tsv"
          echo "File count: $(find source-client -type f | wc -l)"
          echo 'Potential original .PAK/.EXE/.DLL or 3D file types:'
          grep -Ei '\\.(pak|exe|dll|dmp|mve|obs|chr|tis|spr|mesh|bin)[[:space:]]'             "$GITHUB_WORKSPACE/leaf-096d-file-sizes.tsv" | head -100 || true
      - name: Decode ORIGINAL ChatMap/MapData/MapInfo/MapObject member indexes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/leaf096d/source-client/4Leaf_Files/ChatMap.pak ]; then
            python3 apps/4leaf/rog/tools/audit-native-chatmap-members.py \
              /tmp/leaf096d/source-client/4Leaf_Files \
              leaf-096d-native-chatmap-members.json
          else
            echo 'Original source files unavailable; do not fabricate PAK member names'
          fi
      - name: Upload original client resource inventory only (no binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourleaf-096d-original-resource-census
          path: |
            leaf-096d-cab-inventory.txt
            leaf-096d-file-sha256.txt
            leaf-096d-file-sizes.tsv
            leaf-096d-native-chatmap-members.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload public file inventory only, not copyrighted binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourleaf-original-096d-client-metadata
          path: |
            leaf-096d-archive-availability.tsv
            leaf-096d-archive-list.txt
          if-no-files-found: ignore
          retention-days: 7
