name: Mimmi Official Social Public Photo Discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mimmi-official-social-public.yml'
      - 'apps/gallery-archive/commit_crawler_research.py'
      - 'apps/gallery-archive/test_commit_crawler_research.py'
  schedule:
    - cron: '30 14 * * 1,4'
  push:
    paths:
      - 'apps/mimmi-gallery/collect_social_public.py'
      - 'apps/mimmi-gallery/test_social_public.py'
      - '.github/workflows/mimmi-official-social-public.yml'
permissions:
  contents: write
concurrency:
  group: mimmi-source-index-writer-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  reconcile-official-social-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile apps/gallery-archive/commit_crawler_research.py
          python apps/gallery-archive/test_commit_crawler_research.py
  collect:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0'
      - name: Verify correct public model account and original public image links
        run: |
          python -m py_compile apps/mimmi-gallery/collect_social_public.py
          python apps/mimmi-gallery/test_social_public.py
      - name: Traverse public profile pages and fetch image byte SHA-256 evidence
        run: python apps/mimmi-gallery/collect_social_public.py --pages 3 --images 160
      - name: Check source provenance and safe non-rehosting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("apps/mimmi-gallery/social-public-previews.json").read_text())
          assert d["model"]=="mimmi" and d["summary"]["private_cloud_archived"]==0
          for a in d["albums"]:
              assert a["images"]==[]
              for p in a["samples"]:
                  assert p["url"].startswith("https://pbs.twimg.com/media/")
                  assert len(p["sha256"])==64 and p["bytes"]>4500
          print("MIMMI_PUBLIC_SOCIAL_IMAGES_EVIDENCE",d["summary"])
          PY
      - name: Reconcile verified official SNS evidence without losing concurrent crawler commits
        if: github.ref == 'refs/heads/main'
        run: |
          python apps/gallery-archive/test_commit_crawler_research.py
          python apps/gallery-archive/commit_crawler_research.py --manifest social-public-previews.json --retries 8
