name: Gallery Cloudflare Exact Full Owner Readback and Real Mobile Acceptance
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_cloudflare_full_remote.py'
      - '.github/workflows/gallery-cloudflare-owner-full-readback.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_cloudflare_full_remote.py'
      - '.github/workflows/gallery-cloudflare-owner-full-readback.yml'
  workflow_dispatch:
  # Only a successful main replica triggers this strict post-replication gate.
  workflow_run:
    workflows:
      - "Gallery Free Bound Assets Replica"
    types: [completed]
permissions:
  contents: read
concurrency:
  group: gallery-full-owner-readonly-proof
  cancel-in-progress: false
jobs:
  exact-owner-originals:
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact image decoding
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Validate script syntax and all owner-index rows
        run: python -m py_compile apps/gallery-archive/qa_cloudflare_full_remote.py
      - name: Probe two incident originals on PR and all 7,724 saved owner originals on main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python apps/gallery-archive/qa_cloudflare_full_remote.py --scope targeted
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # New Mimmi entries require independent exact-byte/pixel proof
            # before the broader full-owner verification is accepted.
            python apps/gallery-archive/qa_cloudflare_full_remote.py --scope recent
            python apps/gallery-archive/qa_cloudflare_full_remote.py --scope all
          else
            python apps/gallery-archive/qa_cloudflare_full_remote.py --scope all
          fi
  recent-mimmi-native-browser:
    # Actual remote storage proof must pass before either real public browser.
    needs: exact-owner-originals
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real native browser and exact original download verifier
        run: |
          python -m pip install --quiet 'playwright==1.58.0' 'requests' 'Pillow==11.3.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify precisely the two newly indexed Mimmi original photos in live gallery
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/qa_new_physical_photos.py \
            --model mimmi --browser '${{ matrix.browser }}' \
            --since-commit cda1fb7946b9ff7db2d08875c26886f4a28a5f78 \
            --current-commit e7ca381c2cae28b5cda7e986966a2b495ad92a4a \
            --out "$RUNNER_TEMP/mimmi-recent-${{ matrix.browser }}.json"
      - name: Report actual displayed/decode/download photos, not index counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('mimmi-recent-*.json'):
              d=json.loads(p.read_text())
              print('G03_LIVE_EXACT_NATIVE', json.dumps({
                  'browser':d.get('browser'), 'all_new_or_upgraded_rows':d.get('all_new_or_upgraded_rows'),
                  'individual_saved_photo_verified':len(d.get('photos',[])),
                  'success':d.get('success',False), 'reload':d.get('reload_pass',False)
              }))
          PY

  six-real-albums:
    needs: exact-owner-originals
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native Chromium and mobile WebKit
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium webkit
      - name: Actual published Pages and six album photo-lightbox WebKit QA
        run: python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --all-p0 --browser webkit
      - name: Actual published Pages and six album photo-lightbox Chromium QA
        run: python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --all-p0 --browser chromium
