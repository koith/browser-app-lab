name: Gallery Unindexed Owner Folder Public Identity Lookup
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-orphan-album-identity-probe.yml'
      - 'apps/gallery-archive/classify_unindexed_album_ids.py'
permissions:
  contents: read
jobs:
  classify-existing-storage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive/classify_unindexed_album_ids.py
            apps/mimmi-gallery/stored-albums.json
            apps/mimmi-gallery/public-work-pages.json
            apps/mimmi-gallery/album-aliases.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile apps/gallery-archive/classify_unindexed_album_ids.py
      - name: Install pinned existing owner storage client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          client="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          test -n "$client"
          install -m 755 "$client" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Classify 53 orphan photo owners against registered PUBLIC works only
        shell: bash
        run: |
          set -euo pipefail
          export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone cat 'archive:MimmiArchive/metadata/catalog.json' --timeout 75s --retries 2 > "$RUNNER_TEMP/owner.json" 2> "$RUNNER_TEMP/secret-errors"
          timeout 660 rclone lsjson 'archive:MimmiArchive' -R --files-only --timeout 75s --retries 2 > "$RUNNER_TEMP/listing.json" 2> "$RUNNER_TEMP/list-errors"
          python apps/gallery-archive/classify_unindexed_album_ids.py \
            --model mimmi --listing "$RUNNER_TEMP/listing.json" \
            --owner "$RUNNER_TEMP/owner.json" \
            --public apps/mimmi-gallery/stored-albums.json \
            --registry apps/mimmi-gallery/public-work-pages.json \
            --aliases apps/mimmi-gallery/album-aliases.json
