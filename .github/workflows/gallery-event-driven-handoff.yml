name: Gallery Event-Driven Verified Handoff

# Event-based: no timer, periodic polling, infinite retry or new ChatGPT chat.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gallery-event-driven-handoff.yml
      - .github/scripts/gallery_event_handoff.cjs
      - .github/scripts/test_gallery_event_handoff.cjs
  issues:
    types: [edited]
  workflow_run:
    workflows:
      - Gallery — First Image Latency and Full SHA Coverage
      - Gallery Quality Branding and Fast Entry Regression QA
      - Yui Mimmi Deployed GitHub Pages Real Photo Browser QA
      - Gallery Real Image Pixel Quality Audit
      - Deploy static content to Pages
    types: [completed]
  pull_request:
    paths:
      - .github/workflows/gallery-event-driven-handoff.yml
      - .github/scripts/gallery_event_handoff.cjs
      - .github/scripts/test_gallery_event_handoff.cjs

permissions:
  contents: read

concurrency:
  group: gallery-event-driven-safe-handoff
  cancel-in-progress: false

jobs:
  regressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check .github/scripts/gallery_event_handoff.cjs
          node --check .github/scripts/test_gallery_event_handoff.cjs
          node .github/scripts/test_gallery_event_handoff.cjs

  continue-safe-work:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issues' || github.event.issue.number == 605) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      # Always checkout trusted main, never a triggering PR's head or artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
      - uses: actions/github-script@v7
        with:
          script: |
            const handoff = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/gallery_event_handoff.cjs');
            await handoff({github, context, core});
