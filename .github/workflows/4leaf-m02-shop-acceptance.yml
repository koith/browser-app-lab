name: 4LEAF M02 original CardShop acceptance

on:
  pull_request:
    paths:
      - "apps/4leaf/rog/game.js"
      - "apps/4leaf/rog/shop-era-2004.js"
      - "apps/4leaf/rog/shop-era-2004.css"
      - "apps/4leaf/rog/tests/m02-original-shop-2004-realuse.cjs"
      - ".github/workflows/4leaf-m02-shop-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax gate
        run: |
          node --check apps/4leaf/rog/game.js
          node --check apps/4leaf/rog/shop-era-2004.js
          node --check apps/4leaf/rog/tests/m02-original-shop-2004-realuse.cjs
      - name: Install browser and dependencies
        working-directory: apps/4leaf/rog
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Serve real web app and original image assets
        run: |
          python3 -m http.server 8765 --directory apps/4leaf/rog >/tmp/4leaf-m02-http.log 2>&1 &
          for i in {1..25}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/4leaf-m02-http.log; exit 1
      - name: Source 2004 shop flow and screenshot comparison
        env:
          FOURLEAF_BROWSER: ${{ matrix.engine }}
          M02_IMAGE_LOG: "1"
        run: node apps/4leaf/rog/tests/m02-original-shop-2004-realuse.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2004-shop-${{ matrix.engine }}
          path: apps/4leaf/rog/tests/m02-screenshots/*.jpg
          if-no-files-found: warn
          retention-days: 30
