name: Gallery TeraBox Existing Owner Original Byte Read Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_existing_owner_exact_file.py'
      - '.github/workflows/gallery-terabox-own-file-read-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_existing_owner_exact_file.py'
      - '.github/workflows/gallery-terabox-own-file-read-diagnostic.yml'
permissions:
  contents: read
jobs:
  offline-syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive/qa_existing_owner_exact_file.py
            apps/mimmi-gallery/cloud/gateway/cookie_format.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile apps/gallery-archive/qa_existing_owner_exact_file.py

  original-byte-readback:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        model: [mimmi, yui]
    env:
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive/qa_existing_owner_exact_file.py
            apps/mimmi-gallery/cloud/gateway/cookie_format.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Install checksum-pinned existing owner storage client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          binary="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Read a pre-existing photo from this model's own authenticated archive
        env:
          MODEL: ${{ matrix.model }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIMMI_COOKIE"
          test -n "$YUI_COOKIE"
          echo "::add-mask::$MIMMI_COOKIE"
          echo "::add-mask::$YUI_COOKIE"
          python apps/gallery-archive/qa_existing_owner_exact_file.py --model "$MODEL"
          echo "- $MODEL: existing original exact SHA + bytes + pixel decode PASS" >> "$GITHUB_STEP_SUMMARY"
