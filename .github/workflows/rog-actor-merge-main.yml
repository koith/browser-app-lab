name: 4LEAF actor source branch sync with latest main
on:
  push:
    branches: [research/4leaf-actor-full-action-20261101]
    paths: [.github/workflows/rog-actor-merge-main.yml]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main without dropping already accepted 4LEAF fixes
        run: |
          set -euo pipefail
          git config user.name "4LEAF source merge bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          node --check apps/4leaf/rog/game.js
          node --check apps/4leaf/rog/genesis-chessman-actors.js
          node --check apps/4leaf/rog/original/OBS/action-full/manifest.js
          git push origin HEAD:refs/heads/research/4leaf-actor-full-action-20261101
