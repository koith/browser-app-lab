name: Gallery ALL Committed Photos pHash vs dHash Pixel Quality A-B
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/gallery-archive/full_pixel_quality_ab.py
      - apps/gallery-archive/full_pixel_quality_aggregate.py
      - apps/gallery-archive/test_full_pixel_quality_ab.py
      - .github/workflows/gallery-full-pixel-quality-ab.yml
permissions:
  contents: read
jobs:
  full-pixel-scope-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow imagehash
      - run: |
          python -m py_compile apps/gallery-archive/full_pixel_quality_ab.py apps/gallery-archive/full_pixel_quality_aggregate.py
          python apps/gallery-archive/test_full_pixel_quality_ab.py
  analyze-every-committed-photo:
    needs: full-pixel-scope-test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [yui, mimmi]
        shard: [0, 1, 2, 3]
    env:
      MODEL: ${{ matrix.model }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow imagehash
      - run: |
          python apps/gallery-archive/full_pixel_quality_ab.py \
            --model "$MODEL" --shard "$SHARD" --shards 4 \
            --out "$RUNNER_TEMP/photo-pixel-$MODEL-$SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-pixel-${{ matrix.model }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/photo-pixel-${{ matrix.model }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 21
  compare-all-pixel-hashes:
    if: always()
    needs: [full-pixel-scope-test, analyze-every-committed-photo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: photo-pixel-*
          path: /tmp/photo-pixel-ab
          merge-multiple: true
      - run: |
          python apps/gallery-archive/full_pixel_quality_aggregate.py \
            --report-dir /tmp/photo-pixel-ab --shards 4 \
            --out /tmp/all-committed-photo-phash-dhash-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-photo-pixel-phash-dhash-ab
          path: /tmp/all-committed-photo-phash-dhash-comparison.json
          if-no-files-found: warn
          retention-days: 21
