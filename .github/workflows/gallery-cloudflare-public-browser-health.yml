name: Gallery Cloudflare Real Browser Health
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/gallery-archive/qa_cloudflare_public_browser_health.py'
      - '.github/workflows/gallery-cloudflare-public-browser-health.yml'
permissions:
  contents: read
jobs:
  real-cloudflare-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install real browser, no cloud token or stored-photo secrets
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Prove already-deployed Cloudflare Worker is actually accessible from browser
        run: |
          python -m py_compile apps/gallery-archive/qa_cloudflare_public_browser_health.py
          python apps/gallery-archive/qa_cloudflare_public_browser_health.py --browser ${{ matrix.browser }}
