name: INTERSECTION — Blocked Automatic Originals and Modal UX QA
on:
  push:
    branches:
      - agent/intersection-block-purge-modal-502-20261118
    paths:
      - apps/demand-research/**
      - .github/workflows/intersection-block-auto-purge-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blocked-auto-erasure:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile apps/demand-research/auto_archive_purge.py apps/demand-research/recovery_spool.py apps/demand-research/gateway.py apps/demand-research/demand_capture_job.py apps/demand-research/test_auto_archive_purge.py
          node --check apps/demand-research/account_archive_view.js
      - name: Install pinned offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest==8.4.2 fastapi==0.115.12 httpx==0.28.1 cryptography==46.0.4 PyJWT==2.10.1 playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify exact-account erasure, encrypted recovery, original retention, and popup behavior
        run: |
          set -euo pipefail
          cd apps/demand-research
          python -m pytest -q test_auto_archive_purge.py test_recovery_spool.py test_degraded_encrypted_capture.py test_encrypted_batch_recovery.py test_gateway.py
          python test_post_modal_inline_backup_browser.py
