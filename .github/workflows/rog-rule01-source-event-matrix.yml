name: 4LEAF RULE-01 original event data acceptance
on:
  push:
    branches: ['main', '4leaf/rule01-completion-20261121']
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/original/maps.js'
      - 'apps/4leaf/rog/original/tiles.js'
      - 'apps/4leaf/rog/tests/rule01-source-event-matrix.cjs'
      - '.github/workflows/rog-rule01-source-event-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-event:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      FOURLEAF_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install "$FOURLEAF_BROWSER" --with-deps
          nohup python3 -m http.server 8765 --directory apps/4leaf/rog >/tmp/rule01.log 2>&1 &
          sleep 2
      - run: node apps/4leaf/rog/tests/rule01-source-event-matrix.cjs
      - name: Verify deployed same-revision original rules via live Chromium/WebKit
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          base=https://koith.github.io/browser-app-lab/apps/4leaf/rog/
          found=0
          for i in $(seq 1 50); do
            if curl -fsSL --max-time 15 "${base}app-version.json?rule01=$GITHUB_SHA-$i" -o /tmp/rule01-public-version && cmp -s apps/4leaf/rog/app-version.json /tmp/rule01-public-version; then
              found=1
              break
            fi
            sleep 8
          done
          test "$found" = 1
          for f in game.js original/maps.js original/tiles.js index.html sw.js; do
            curl -fsSL --max-time 30 "${base}${f}?rule01=$GITHUB_SHA" -o /tmp/rule01-public-file
            cmp "apps/4leaf/rog/$f" /tmp/rule01-public-file
          done
          FOURLEAF_TEST_URL="$base" node apps/4leaf/rog/tests/rule01-source-event-matrix.cjs
