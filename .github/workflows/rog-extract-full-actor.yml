name: 4LEAF original 37-frame actor source extraction
on:
  push:
    branches: [research/4leaf-actor-full-action-20261101]
    paths:
      - .github/workflows/rog-extract-full-actor.yml
      - apps/4leaf/rog/tools/extract-reviewed-actor-complete.py
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install verified source extract dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unshield
          python3 -m pip install --break-system-packages pillow
      - name: Download archived client and verify exact historic SHA1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/leaf-source /tmp/leaf-resources
          python3 - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          p=Path('/tmp/leaf-source/original.zip')
          h=hashlib.sha1()
          req=urllib.request.Request('https://archive.org/download/4leaf/4leaf.zip',headers={'User-Agent':'Mozilla/5.0 (4LEAF archival reproduction)'})
          with urllib.request.urlopen(req,timeout=120) as response,p.open('wb') as f:
              while chunk:=response.read(1<<20):
                  f.write(chunk)
                  h.update(chunk)
                  if f.tell()>90*1024*1024: raise RuntimeError('archive exceeded 90 MiB')
          assert h.hexdigest()=='86526d89679ae39b85fe9808da97ad871b7888d9',h.hexdigest()
          print('ORIGINAL_4LEAF_2002_SHA1_VERIFIED',h.hexdigest())
          PY
          unzip -q /tmp/leaf-source/original.zip data1.cab data1.hdr -d /tmp/leaf-source
          unshield x -d /tmp/leaf-resources /tmp/leaf-source/data1.cab >/dev/null
      - name: Decode genuine complete source actor frames
        run: |
          python3 apps/4leaf/rog/tools/extract-reviewed-actor-complete.py /tmp/leaf-resources "$GITHUB_WORKSPACE"
          node --check apps/4leaf/rog/original/OBS/action-full/manifest.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('apps/4leaf/rog/original/OBS/action-full')
          frames=sorted(p.glob('*.png'))
          assert len(frames)==111,len(frames)
          for stem in ('1040','1046','1078'):
              seq=sorted(p.glob(stem+'-*.png'))
              assert len(seq)==37,(stem,len(seq))
          j=json.loads((p/'provenance.json').read_text())
          assert j['actorCount']==3 and j['totalFrames']==111
          assert j['originalExeActionTableDecoded'] is False
          print('ORIGINAL_CHESSMEN_37_FRAMES_EACH_VERIFIED',j['members'])
          PY
      - name: Commit only exact preserved original source pixels and manifest
        run: |
          set -euo pipefail
          git config user.name "4LEAF source extract bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/4leaf/rog/original/OBS/action-full
          git diff --cached --quiet || git commit -m "data(4leaf): 111 original full 37-frame OBS actor sprites, checksum provenance"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            sleep 3
          done
          exit 1
