name: 4LEAF request latest native GitHub Pages build

# This repository currently uses main-root branch publishing. Commits made
# by GitHub Actions/GITHUB_TOKEN may not automatically publish in native mode.
# Request the latest build without replacing the shared site publisher.
on:
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-native-pages-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

# Only the newest request matters; GitHub itself serializes native Pages builds.
concurrency:
  group: 4leaf-request-native-pages-latest
  cancel-in-progress: true

jobs:
  request-current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a native Pages build only for the latest main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["GITHUB_SHA"]
          if repo != "koith/browser-app-lab" or os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Not the intended 4LEAF main source")

          def api(path, method="GET"):
              req = Request("https://api.github.com/repos/" + repo + path,
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                     "Accept": "application/vnd.github+json",
                                     "X-GitHub-Api-Version": "2022-11-28"},
                            data=b"{}" if method == "POST" else None,
                            method=method)
              with urlopen(req, timeout=30) as response:
                  return response.status, json.loads(response.read() or b"{}")

          _, branch = api("/git/ref/heads/main")
          current = branch["object"]["sha"]
          if current != expected:
              print("SKIP_SUPERSEDED_4LEAF_BUILD", expected, "current:", current)
              raise SystemExit(0)

          _, pages = api("/pages")
          if pages.get("build_type") == "workflow":
              print("SKIP_NATIVE_BUILD_WORKFLOW_PUBLISHER; existing static deploy owns Pages")
              raise SystemExit(0)
          if pages.get("build_type") != "legacy" or pages.get("source") != {"branch": "main", "path": "/"}:
              raise SystemExit("Unsupported Pages source; will not alter settings")

          status, result = api("/pages/builds", "POST")
          if status != 201 or result.get("status") not in ("queued", "building", "built"):
              raise SystemExit("Native Pages build request was not accepted: " + repr(result))
          print("NATIVE_PAGES_BUILD_REQUESTED", expected, result)
          # A successful request is NOT proof that the public CDN serves this SHA.
          # Downstream published browser QA must still inspect the real site.
          PY
