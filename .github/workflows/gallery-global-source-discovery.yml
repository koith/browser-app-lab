name: Yui Mimmi Global Public Source Discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/gallery-archive/global_source_registry.json"
      - "apps/gallery-archive/discover_global_sources.py"
      - "apps/gallery-archive/test_discover_global_sources.py"
      - "apps/gallery-archive/source_name_ledger.py"
      - "apps/gallery-archive/source-names.json"
      - ".github/workflows/gallery-global-source-discovery.yml"
permissions:
  contents: write
concurrency:
  group: gallery-global-source-discovery
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source HTML parsing dependency
        run: python -m pip install requests beautifulsoup4
      - name: Syntax and isolated fixture regression tests
        run: |
          python -m py_compile apps/gallery-archive/discover_global_sources.py
          python apps/gallery-archive/test_discover_global_sources.py
      - name: Scan worldwide public catalogue pages only
        run: |
          python apps/gallery-archive/discover_global_sources.py \
            --out "/tmp/gallery-global-source-leads.json" --timeout 18
      - name: Grow site-observed spelling ledger only on unique same-work evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/source_name_ledger.py \
            --discover /tmp/gallery-global-source-leads.json \
            --out /tmp/gallery-source-names-updated.json
          if ! cmp -s apps/gallery-archive/source-names.json /tmp/gallery-source-names-updated.json; then
            cp /tmp/gallery-source-names-updated.json apps/gallery-archive/source-names.json
            git config user.name "gallery-source-ledger[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/gallery-archive/source-names.json
            git commit -m "data(gallery): retain names from verified matching source catalogues"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No new confirmed source aliases" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish honest acquisition-versus-discovery summary
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("/tmp/gallery-global-source-leads.json").read_text())
          s=d["summary"]
          assert s["sources_checked"] >= 15
          assert s["gallery_images_added"] == s["new_photos_stored"] == 0
          assert all(x["discovery_only_not_gallery"] for x in d["leads"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Yui + Mimmi global discovery (research only)\n\n")
            for k,v in s.items():
              f.write(f"- {k}: {v}\n")
            f.write("\n| Source | Region | Result | Page count | Catalogue entries |\n")
            f.write("|---|---|---|---:|---:|\n")
            for row in d["sources"]:
              f.write(f"| {row['id']} | {row['region']} | {row['status']} | {row['pages_checked']} | {len(row['items'])} |\n")
            f.write("\n**Not a photo import.** Nothing is appended to the user-facing galleries until physical storage and browser loading pass QA.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-mimmi-global-source-leads
          path: /tmp/gallery-global-source-leads.json
          if-no-files-found: warn
          retention-days: 30
