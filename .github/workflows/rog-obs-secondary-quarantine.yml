name: 4LEAF quarantine original secondary OBS resource candidates
on:
  push:
    paths:
      - '.github/workflows/rog-obs-secondary-quarantine.yml'
      - 'apps/4leaf/rog/tools/probe-original-obs-secondary-paks.py'
      - 'apps/4leaf/rog/tools/probe-original-img-extra-spr.py'
      - 'apps/4leaf/rog/tools/emit-original-img-extra-spr.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rog-obs-secondary-quarantine.yml'
      - 'apps/4leaf/rog/tools/probe-original-obs-secondary-paks.py'
      - 'apps/4leaf/rog/tools/probe-original-img-extra-spr.py'
      - 'apps/4leaf/rog/tools/emit-original-img-extra-spr.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read-only-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install strict read-only asset extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unshield
          python3 -m pip install --break-system-packages Pillow
          python3 -m py_compile apps/4leaf/rog/tools/probe-original-obs-secondary-paks.py
      - name: Check authentic 2002 client installer SHA1, extract resource files only
        run: |
          mkdir -p /tmp/leaf-original-installer /tmp/leaf-original-files
          python3 - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          dest=Path('/tmp/leaf-original-installer/4leaf.zip')
          sha='86526d89679ae39b85fe9808da97ad871b7888d9'
          for attempt in range(5):
              try:
                  uri='https://archive.org/download/4leaf/4leaf.zip'
                  req=urllib.request.Request(uri,headers={'User-Agent':'4LEAF original archive source integrity audit/1.0'})
                  hash=hashlib.sha1()
                  with urllib.request.urlopen(req,timeout=120) as stream,dest.open('wb') as f:
                      n=0
                      while buf:=stream.read(1048576):
                          n+=len(buf)
                          if n>90*1024*1024:raise ValueError('Source zip exceeds 90 MiB limit')
                          hash.update(buf);f.write(buf)
                  if hash.hexdigest()!=sha:raise ValueError('Original SHA1 mismatch')
                  print('ORIGINAL_2002_INSTALLER_SHA1_VERIFIED',hash.hexdigest(),n)
                  break
              except Exception as e:
                  dest.unlink(missing_ok=True)
                  if attempt==4:raise
                  print('Retrying verified archive',str(e)[:120])
                  time.sleep(5+attempt*2)
          PY
          unzip -q /tmp/leaf-original-installer/4leaf.zip 'data1.cab' 'data1.hdr' -d /tmp/leaf-original-installer
          unshield x -d /tmp/leaf-original-files /tmp/leaf-original-installer/data1.cab >/dev/null
      - name: Preserve archived 1078 OBS 37-frame RLE sample for faithful front-facing idle recovery
        run: |
          python3 - <<'PY'
          import importlib.util,json,sys,hashlib
          from pathlib import Path
          import glob
          f=Path('apps/4leaf/rog/tools/decode-original-obs-bulk.py')
          spec=importlib.util.spec_from_file_location('sourceobs',f)
          m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          packs=glob.glob('/tmp/leaf-original-files/**/Dice/OBS.pak',recursive=True)
          assert len(packs)==1,packs
          raw=Path(packs[0]).read_bytes()
          source={k.lower():v for k,v in m.source_members(raw)}
          output=Path('/tmp/leaf-front-obs-evidence');output.mkdir(exist_ok=True)
          desc={}
          for name in ['1078.obs','1045.obs','1054.obs']:
              body=source[name]
              frames,palette=m.unpack_frames(body)
              (output/name).write_bytes(body)
              (output/(name+'.palette')).write_bytes(palette)
              sample={}
              for i,(payload,w,h,ox,oy) in enumerate(frames):
                  if i not in (0,1,2,3,10,18,22,24,25,26,28,30,32,35,36):continue
                  sample[i]={'size':[w,h],'offset':[ox,oy],
                   'bytes':len(payload),'rawHead':payload[:32].hex(),
                   'sourceSHA256':hashlib.sha256(payload).hexdigest()}
              desc[name]={'sha256':hashlib.sha256(body).hexdigest(),'frames':len(frames),
               'samples':sample}
          (output/'source-evidence.json').write_text(json.dumps(desc,indent=2))
          print('ARCHIVED_OBS_FRONT_ORIENTATION_RAW_VERIFIED',json.dumps(desc)[:3000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-obs-front-facing-frame-rle-evidence-not-production
          path: /tmp/leaf-front-obs-evidence
          retention-days: 7
      - name: Strictly probe ALL original OBS, OBS2, OBS3 packs for missing character source pixels
        run: |
          python3 apps/4leaf/rog/tools/probe-original-obs-secondary-paks.py /tmp/leaf-original-files /tmp/leaf-original-obs-quarantine
          test -s /tmp/leaf-original-obs-quarantine/secondary-pak-probe.json
      - name: Probe unused genuine IMG.pak battle/result/status SPR with strict native video RLE
        run: |
          python3 -m py_compile apps/4leaf/rog/tools/probe-original-img-extra-spr.py
          source="$(find /tmp/leaf-original-files -type f -ipath '*/Dice/IMG.pak' | head -1)"
          test -n "$source"
          python3 apps/4leaf/rog/tools/probe-original-img-extra-spr.py "$source" /tmp/leaf-img-spr-quarantine
          test -s /tmp/leaf-img-spr-quarantine/source-spr-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-img-spr-strict-candidates-not-production
          path: /tmp/leaf-img-spr-quarantine
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-obs-secondary-strict-candidates-not-production
          path: /tmp/leaf-original-obs-quarantine
          retention-days: 14
      - name: Publish source-verified native 2D IMG GUI PNGs on THIS feature branch only
        if: github.event_name == 'push' && github.ref_name == 'restore-4leaf-secondary-original-obs-audit-20261018'
        run: |
          python3 apps/4leaf/rog/tools/emit-original-img-extra-spr.py \
            /tmp/leaf-img-spr-quarantine apps/4leaf/rog/original/SourceSPRExtra
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4leaf/rog/original/SourceSPRExtra
          if git diff --cached --quiet; then
            echo 'All 100 verified original PNGs already present'
          else
            git commit -m 'assets(4leaf): recover 100 native 2002 battle, magic and GUI sprite images'
            git push origin HEAD:restore-4leaf-secondary-original-obs-audit-20261018
          fi
      - name: Clean downloaded historic executable archive
        if: always()
        run: rm -rf /tmp/leaf-original-installer /tmp/leaf-original-files
