name: Actual Original Galleries Real Private TeraBox Mobile Browser QA
on:
  workflow_dispatch:
  # Every successful photo-byte archive import must prove the physical photos
  # are visible in the existing Yui and Mimmi gallery, not merely uploaded.
  workflow_run:
    workflows:
      - "Gallery Automatic New Photo Bytes to Private TeraBox"
    types: [completed]
  schedule:
    - cron: '48 4 * * *'
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_real_gallery_browser.py'
      - 'apps/gallery-archive/test_viewer_only_ui.py'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/test_copyto_media_fallback.py'
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - 'apps/mimmi-gallery/cloud/gateway/requirements.txt'
      - 'apps/mimmi-gallery/cloud/gateway/Dockerfile'
      - 'apps/mimmi-gallery/cloud/test_first_party_portal.py'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
      - '.github/workflows/gallery-real-private-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_real_gallery_browser.py'
      - 'apps/gallery-archive/test_viewer_only_ui.py'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - 'apps/mimmi-gallery/cloud/gateway/requirements.txt'
      - 'apps/mimmi-gallery/cloud/gateway/Dockerfile'
      - 'apps/mimmi-gallery/cloud/test_first_party_portal.py'
      - 'apps/yui-gallery/owner-media.js'
      - 'apps/mimmi-gallery/owner-media.js'
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
      - '.github/workflows/gallery-real-private-browser-qa.yml'
permissions:
  contents: read
jobs:
  private-photo-browser-code-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile apps/gallery-archive/qa_real_gallery_browser.py
          python apps/gallery-archive/test_viewer_only_ui.py
          python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt
          python apps/mimmi-gallery/cloud/test_first_party_portal.py
          python apps/mimmi-gallery/cloud/test_copyto_media_fallback.py
  real-original-gallery-chromium:
    needs: private-photo-browser-code-qa
    if: |
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install existing free private gallery gateway and mobile Chromium
        run: |
          python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Install pinned private TeraBox byte reader, never echo owner cookie
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          binary="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Load existing Yui and Mimmi gallery URLs in a real mobile-browser viewport
        shell: bash
        run: |
          set -euo pipefail
          export GALLERY_ACCESS_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$GALLERY_ACCESS_TOKEN"
          export ARCHIVE_REMOTE="archive:MimmiArchive"
          (cd apps/mimmi-gallery/cloud/gateway && python -m uvicorn main:app --host 127.0.0.1 --port 18765 \
            > "$RUNNER_TEMP/private-gateway.txt" 2>&1) &
          gateway=$!
          python -m http.server 8765 --bind 127.0.0.1 \
            > "$RUNNER_TEMP/static-qa.txt" 2>&1 &
          site=$!
          trap 'kill "$gateway" "$site" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail 'http://127.0.0.1:18765/api/health' >/dev/null &&
               curl --silent --fail 'http://127.0.0.1:8765/apps/yui-gallery/' >/dev/null; then break;fi
            sleep 1
          done
          python apps/gallery-archive/qa_real_gallery_browser.py
          echo 'Original gallery, actual private photo cover/thumbnail/lightbox, SHA and private authentication PASS for Yui and Mimmi' >> "$GITHUB_STEP_SUMMARY"
