name: INTERSECTION — Scheduled Immutable Public Account Archive

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "SNS public account service"
        required: true
        type: choice
        options:
          - bluesky
          - mastodon
      account:
        description: "Public handle/profile URL; no private login needed"
        required: true
        type: string
      max_pages:
        description: "Public history pages checked (1-4)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "1"
          - "2"
          - "3"
          - "4"
  schedule:
    # Revisit verified user-selected accounts every six hours, oldest first.
    # Only new revisions/deltas are written; old releases are untouched.
    - cron: "43 */6 * * *"
permissions:
  contents: read

jobs:
  private-public-account-bundle:
    concurrency:
      # Independent immutable ZIP writes must not queue behind journal repair.
      group: intersection-target-zip-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
      id-token: write
    env:
      TARGET_PLATFORM: ${{ inputs.platform }}
      TARGET_ACCOUNT: ${{ inputs.account }}
      TARGET_MAX_PAGES: ${{ inputs.max_pages }}
      DEMAND_ACCOUNT_TEMP_STORAGE: github_release
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned encryption dependency for immutable GitHub release
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Capture public originals, encrypt ZIP and verify remote storage SHA
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          umask 077
          if [ "${{ github.event_name }}" = "schedule" ]; then
            timeout --signal=TERM --kill-after=10s 1170s python target_account_bundle.py --scheduled
          else
            timeout --signal=TERM --kill-after=10s 1170s python target_account_bundle.py
          fi
          echo 'Only TARGET_ACCOUNT_GITHUB_TEMP_SHA_VERIFIED or TARGET_ACCOUNT_BUNDLE_REMOTE_VERIFIED with remote_sha256_verified=true confirms independent original readback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub temporary encrypted releases are not permanent archives; keep them until TeraBox migration succeeds.' >> "$GITHUB_STEP_SUMMARY"
