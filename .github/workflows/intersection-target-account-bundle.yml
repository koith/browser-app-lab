name: INTERSECTION — Verified One-ZIP Public Account Rescue

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "SNS public account service"
        required: true
        type: choice
        options:
          - bluesky
          - mastodon
      account:
        description: "Public handle/profile URL; no private login needed"
        required: true
        type: string
      max_pages:
        description: "Public history pages checked (1-4)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "1"
          - "2"
          - "3"
          - "4"
  schedule:
    # Every six hours, independently revisit a rotating saved PUBLIC account.
    # New posts and amended versions are added to the older immutable ZIP.
    - cron: "43 */6 * * *"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/target_account_bundle.py"
      - "apps/demand-research/target_account_archive.py"
      - "apps/demand-research/github_temp_bundle.py"
      - "apps/demand-research/test_target_account_archive.py"
      - "apps/demand-research/test_target_account_bundle.py"
      # Owner-reviewed one-time retry after fixing the public label filter.
      # This path is removed after verifying the encrypted cloud archive.
      - ".github/workflows/intersection-target-account-bundle.yml"

permissions:
  contents: read

jobs:
  private-public-account-bundle:
    # Ordinary merges modifying collector code must NEVER unexpectedly start a
    # partial anonymous TeraBox crawl. A single explicit reviewed merge is
    # allowed to exercise the actual automatic registered-account lane.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[INT-AUTO-VERIFY-20261110]') || contains(github.event.head_commit.message, '[INT-LIVE-RETRY-20261107]')
    concurrency:
      # Independent immutable ZIP writes must not queue behind journal repair.
      group: intersection-target-zip-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
      id-token: write
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_UPLOAD_THREADS: "1"
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
      DEMAND_TERABOX_REMOTE: "archive:DemandResearch"
      # On the one designated owner-reviewed merge only, replay the selected
      # currently public account without depending on a delayed cron queue.
      # No private access, credentials, personal source bytes or target media
      # are committed. Follow-up cleanup removes this emergency input.
      TARGET_PLATFORM: ${{ github.event_name == 'push' && github.actor == 'koith' && contains(github.event.head_commit.message, '[INT-LIVE-RETRY-20261107]') && 'bluesky' || inputs.platform }}
      TARGET_ACCOUNT: ${{ github.event_name == 'push' && github.actor == 'koith' && contains(github.event.head_commit.message, '[INT-LIVE-RETRY-20261107]') && 'liv0706-01.bsky.social' || inputs.account }}
      TARGET_MAX_PAGES: ${{ github.event_name == 'push' && github.actor == 'koith' && contains(github.event.head_commit.message, '[INT-LIVE-RETRY-20261107]') && 'all' || inputs.max_pages }}
      DEMAND_ACCOUNT_TEMP_STORAGE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[INT-AUTO-VERIFY-20261110]') || (github.actor == 'koith' && contains(github.event.head_commit.message, '[INT-LIVE-RETRY-20261107]'))))) && 'github_release' || '' }}
      DEMAND_SCHEDULED_ACCOUNTS: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[INT-AUTO-VERIFY-20261110]'))) && '1' || '0' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require private cloud configuration for legacy scheduled TeraBox only
        if: env.DEMAND_ACCOUNT_TEMP_STORAGE != 'github_release'
        run: |
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" || { echo "::error::Private TeraBox authentication unavailable"; exit 1; }
      - name: Install bounded authenticated encryption for GitHub temporary store
        if: env.DEMAND_ACCOUNT_TEMP_STORAGE == 'github_release'
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Install digest-pinned free TeraBox rclone
        if: env.DEMAND_ACCOUNT_TEMP_STORAGE != 'github_release'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -i terabox >/dev/null
      - name: Capture public originals, encrypt ZIP and verify remote storage SHA
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=10s 1170s python target_account_bundle.py
          echo 'Only TARGET_ACCOUNT_GITHUB_TEMP_SHA_VERIFIED or TARGET_ACCOUNT_BUNDLE_REMOTE_VERIFIED with remote_sha256_verified=true confirms independent original readback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scheduled results must also emit TARGET_ACCOUNT_AUTO_REFRESH_VERIFIED; an upload acknowledgement alone is not a completed account refresh.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub temporary encrypted releases are not permanent archives; keep them until TeraBox migration succeeds.' >> "$GITHUB_STEP_SUMMARY"
