name: INTERSECTION — Scheduled Immutable Public Account Archive

on:
  workflow_dispatch:
    inputs:
      profile_backfill_all:
        description: "Dispatch profile/header/bio refresh for all SHA-verified archived accounts"
        required: false
        type: boolean
        default: false
      profile_index_only:
        description: "Refresh the full SHA-verified account picker without launching capture jobs"
        required: false
        type: boolean
        default: false
      platform:
        description: "SNS public account service"
        required: false
        type: choice
        options:
          - bluesky
          - mastodon
      account:
        description: "Public handle/profile URL; no private login needed"
        required: false
        type: string
      resume_pass:
        description: "Trusted worker continuation pass, bounded and append-only"
        required: false
        default: "0"
        type: string
      max_pages:
        description: "Public history pages checked (1-4)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "1"
          - "2"
          - "3"
          - "4"
  schedule:
    # Check one oldest verified public account each hour to bound staleness.
    # Immutable ZIP updates are written only when new verified content exists;
    # original releases are never edited, removed or replaced.
    - cron: "43 * * * *"
  # A reviewed main workflow change triggers the same SAFE scheduled path now,
  # without waiting for a timer. No fork/PR or public client can run this job.
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-target-account-bundle.yml"
permissions:
  contents: read

jobs:
  dispatch-verified-profile-backfills:
    if: ${{ inputs.profile_backfill_all == true || inputs.profile_index_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PROFILE_INDEX_ONLY: ${{ inputs.profile_index_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AES-256-GCM readback library
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Dispatch all source-verified saved account snapshots
        working-directory: apps/demand-research
        run: python profile_backfill_dispatch.py
  private-public-account-bundle:
    if: ${{ inputs.profile_backfill_all != true && inputs.profile_index_only != true }}
    concurrency:
      # The former constant group serialized EVERY requested account, even
      # when 15 unrelated accounts were already dispatched. A 22-minute job
      # could block all others. Keep each account's immutable ZIP generation
      # ordered, but allow DISTINCT public accounts to run in parallel.
      # The hourly scanner keeps its own isolated single-flight group.
      group: ${{ github.event_name == 'workflow_dispatch' && format('intersection-target-zip-{0}-{1}', inputs.platform, inputs.account) || 'intersection-target-zip-scheduled' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      TARGET_PLATFORM: ${{ inputs.platform }}
      TARGET_ACCOUNT: ${{ inputs.account }}
      TARGET_MAX_PAGES: ${{ inputs.max_pages }}
      TARGET_RESUME_PASS: ${{ inputs.resume_pass }}
      DEMAND_ACCOUNT_TEMP_STORAGE: github_release
      DEMAND_REQUIRE_PROFILE_SNAPSHOT: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned encryption dependency for immutable GitHub release
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Capture public originals, encrypt ZIP and verify remote storage SHA
        working-directory: apps/demand-research
        run: |
          set -euo pipefail
          umask 077
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            timeout --signal=TERM --kill-after=10s 1170s python target_account_bundle.py --scheduled
          else
            test -n "$TARGET_PLATFORM" && test -n "$TARGET_ACCOUNT" || {
              echo "::error::Explicit selected public account required"; exit 1; }
            timeout --signal=TERM --kill-after=10s 1170s python target_account_bundle.py
          fi
          echo 'Only TARGET_ACCOUNT_GITHUB_TEMP_SHA_VERIFIED or TARGET_ACCOUNT_BUNDLE_REMOTE_VERIFIED with remote_sha256_verified=true confirms independent original readback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub temporary encrypted releases are not permanent archives; keep them until TeraBox migration succeeds.' >> "$GITHUB_STEP_SUMMARY"
