name: Yui Mimmi Live Render Actual Photo Browser QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_render_gallery_browser.py'
      - '.github/workflows/gallery-render-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_render_gallery_browser.py'
      - '.github/workflows/gallery-render-browser-qa.yml'
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Render mobile real gallery, photo decode, lightbox, reload
        run: |
          python -m py_compile apps/gallery-archive/qa_render_gallery_browser.py
          python apps/gallery-archive/qa_render_gallery_browser.py --browser ${{ matrix.browser }} ${{ github.event_name == 'pull_request' && '--branch-html' || '' }}
