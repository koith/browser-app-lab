name: 4LEAF 2004 original screenshot pixel tracing - real Dice and ChatRoom
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/tests/trace-original-2004.cjs'
      - 'apps/4leaf/rog/chatroom-native-panels.css'
      - 'apps/4leaf/rog/chatroom-native-2004-frame.css'
      - 'apps/4leaf/rog/dice-2004-full-frame.css'
      - '.github/workflows/rog-source-screenshot-trace.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/tests/trace-original-2004.cjs'
      - 'apps/4leaf/rog/chatroom-native-panels.css'
      - 'apps/4leaf/rog/chatroom-native-2004-frame.css'
      - 'apps/4leaf/rog/dice-2004-full-frame.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-screen-pixel-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check apps/4leaf/rog/tests/trace-original-2004.cjs
          node --check apps/4leaf/rog/game.js
          node --check apps/4leaf/rog/social-chat.js
      - run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve source+assets
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-trace.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsSI http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-trace.log
          exit 1
      - name: Render actual game and room over original 2004 source references, measure pixels, click roll
        env:
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/trace-original-2004.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-2004-original-vs-DOM-pixel-trace
          path: |
            4leaf-trace-*.png
          retention-days: 21
