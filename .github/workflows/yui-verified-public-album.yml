name: Yui Verified Public Photobook Individual Photos
on:
  push:
    paths:
      - apps/yui-gallery/download_verified_public_album.py
      - apps/yui-gallery/public-complete-album-targets.json
      - .github/workflows/yui-verified-public-album.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install requests Pillow
      - name: Compile source first
        run: python -m py_compile apps/yui-gallery/download_verified_public_album.py
      - name: Acquire full public page sequence
        run: python apps/yui-gallery/download_verified_public_album.py
      - name: Verify every individual photo against SHA256
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          for album_id,expected in [('v04',97),('green91',91)]:
            folder=pathlib.Path(f'yui-verified-private-albums/{album_id}')
            manifest=json.loads((folder/'manifest.json').read_text())
            assert len(manifest['images'])==expected
            assert manifest['complete_public_web_sequence'] is True
            for row in manifest['images']:
              image=folder/row['file']
              assert image.is_file() and image.stat().st_size==row['bytes']
              assert hashlib.sha256(image.read_bytes()).hexdigest()==row['sha256']
            print('VERIFIED_COMPLETE_WEB_PHOTOBOOK',album_id,len(manifest['images']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yui-verified-individual-photo-hash-manifests
          path: |
            yui-verified-private-albums/*/manifest.json
            yui-verified-private-albums/summary.json
          if-no-files-found: warn
          retention-days: 90
