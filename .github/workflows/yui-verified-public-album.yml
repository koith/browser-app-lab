name: Yui Verified Public Photobook ZIP
on:
  push:
    paths:
      - apps/yui-gallery/download_verified_public_album.py
      - apps/yui-gallery/public-complete-album-targets.json
      - .github/workflows/yui-verified-public-album.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install requests Pillow
      - name: Compile source first
        run: python -m py_compile apps/yui-gallery/download_verified_public_album.py
      - name: Acquire full public page sequence
        run: python apps/yui-gallery/download_verified_public_album.py
      - name: Verify ZIP content and SHA256 digest against images
        run: |
          python - <<'PY'
          import json,zipfile,hashlib,pathlib
          for album_id,expected in [('v04',97),('green91',91)]:
            p=pathlib.Path(f'yui-verified-private-albums/{album_id}_public_web_album.zip')
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read('manifest.json'))
              assert len(m['images'])==expected
              assert m['complete_public_web_sequence'] is True
              for a in m['images']:
                data=z.read('images/'+a['file'])
                assert len(data)==a['bytes']
                assert hashlib.sha256(data).hexdigest()==a['sha256']
              print('VERIFIED_COMPLETE_WEB_PHOTOBOOK',album_id,len(m['images']),'ZIP_BYTES',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yui-Teddy-Bear-97-public-web-photos
          path: |
            yui-verified-private-albums/*_public_web_album.zip
            yui-verified-private-albums/summary.json
          if-no-files-found: warn
          retention-days: 90
