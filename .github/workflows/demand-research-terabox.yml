name: Demand Research — Private TeraBox Connectivity + QA
on:
  push:
    paths:
      - "apps/demand-research/**"
      - ".github/workflows/demand-research-terabox.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demand-research-cloud-probe
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source syntax and safety tests
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.115.12 httpx==0.28.1 pytest==8.4.2
          cd apps/demand-research
          python -m compileall -q gateway.py upload_verified.py social_sources.py test_gateway.py test_social_sources.py
          python -m pytest -q test_gateway.py test_social_sources.py
      - name: Check cloud credential presence without logging it
        run: |
          if [ -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" ]; then
            echo 'Cloud secret: CONFIGURED (connection not yet verified)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cloud secret: MISSING; no upload or remote read attempted' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install digest-pinned TeraBox rclone
        if: env.RCLONE_CONFIG_ARCHIVE_COOKIE != ''
        run: |
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -qi terabox
      - name: Probe private remote without changing existing archives
        if: env.RCLONE_CONFIG_ARCHIVE_COOKIE != ''
        run: |
          set -euo pipefail
          rclone lsf archive: --max-depth 1 --retries 2 >/dev/null
          echo 'TeraBox account: READ CONNECTIVITY VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research post files: NOT uploaded by this QA job' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit private catalog and sample immutable post checksums (read-only)
        if: env.RCLONE_CONFIG_ARCHIVE_COOKIE != ''
        working-directory: apps/demand-research
        run: |
          python inspect_terabox_status.py
      - name: Verify actual TeraBox write, post bundling and remote SHA256 readback
        # Mutating cloud integrity checks are isolated from normal code/PR CI.
        # They must be explicitly dispatched to avoid orphaning QA prefixes.
        if: env.RCLONE_CONFIG_ARCHIVE_COOKIE != '' && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/demand-smoke/posts/0123456789abcdef/media"
          python - <<'PY'
          import base64,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'demand-smoke'
          image=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL/nwAAAABJRU5ErkJggg==')
          target=root/'posts/0123456789abcdef/media/0001.png'
          target.write_bytes(image)
          item={'id':'0123456789abcdef','platform':'synthetic-qa','posted_at':'2026-11-01T00:00:00Z','text':'SYNTHETIC TEST POST — never classify as real collected data','media':[{'key':'posts/0123456789abcdef/media/0001.png','mime':'image/png','kind':'image','bytes':len(image),'sha256':hashlib.sha256(image).hexdigest(),'remote_verified':False}]}
          (root/'posts/0123456789abcdef/post.json').write_text(json.dumps(item),encoding='utf-8')
          print('SAFE_SYNTHETIC_STAGE_READY',len(image))
          PY
          python apps/demand-research/upload_verified.py --stage "$RUNNER_TEMP/demand-smoke" --remote "archive:DemandResearchQA/${{ github.run_id }}"
          echo 'TeraBox actual upload and remote SHA256 readback: VERIFIED on 1 synthetic post + 1 original PNG' >> "$GITHUB_STEP_SUMMARY"
          rclone purge "archive:DemandResearchQA/${{ github.run_id }}"
          echo 'Synthetic test folder removed after verification' >> "$GITHUB_STEP_SUMMARY"

