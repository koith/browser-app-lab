name: 4LEAF original CHR native duel lunge real browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/native-card-action-sequences.js'
      - 'apps/4leaf/rog/genesis-chessman-actors.js'
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/chr-native-duel-lunge-play.cjs'
      - '.github/workflows/rog-native-duel-lunge-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-native-duel-lunge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-duel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: '0'
          - browser: webkit
            mobile: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser rendering engine
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve original complete 4LEAF assets
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-native-duel.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-native-duel.log
          exit 1
      - name: Actual original table keyed duel for classic OBS and OBS2 OBS3
        env:
          FOURLEAF_BROWSER: ${{ matrix.browser }}
          FOURLEAF_MOBILE: ${{ matrix.mobile }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/chr-native-duel-lunge-play.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-native-duel-frames-${{ matrix.browser }}-mobile-${{ matrix.mobile }}
          path: |
            leaf-r11-duel-lunge-*.png
            /tmp/leaf-native-duel.log
          if-no-files-found: ignore
