name: Aggressive Image-First Weak Album Source Sweep
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/gallery-archive/reverse_seed_priority.py
      - apps/gallery-archive/reverse_sites_parser.py
      - apps/gallery-archive/reverse_image_sweep.py
      - apps/gallery-archive/test_reverse_image_sweep.py
      - .github/workflows/gallery-reverse-priority-sweep.yml
  schedule:
    - cron: "6 0,3,6,9,12,15,18,21 * * *"
  pull_request:
    paths:
      - apps/gallery-archive/reverse_seed_priority.py
      - apps/gallery-archive/reverse_sites_parser.py
      - apps/gallery-archive/reverse_image_sweep.py
      - apps/gallery-archive/test_reverse_image_sweep.py
      - .github/workflows/gallery-reverse-priority-sweep.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: gallery-reverse-priority-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  high-priority-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests==2.32.5'
      - name: Verify owned photo match and search page parsing
        run: |
          python -m py_compile apps/gallery-archive/reverse_seed_priority.py apps/gallery-archive/reverse_sites_parser.py apps/gallery-archive/reverse_image_sweep.py
          python apps/gallery-archive/test_reverse_image_sweep.py
      - name: Visually match low-count archive sets with public sources
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python apps/gallery-archive/reverse_image_sweep.py \
            --seeds 36 --workers 2 \
            --offset "$((GITHUB_RUN_NUMBER * 36))" \
            --out "$RUNNER_TEMP/reverse-leads.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"reverse-leads.json").read_text())
          assert d["research_only"] and d["physical_photos_new"] == 0
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Image-first low-count album search\n\n")
              for k in ("seed_queries","unique_albums_queried","source_pages_accepted","off_model_rejected"):
                  f.write(f"- {k}: {d[k]}\n")
              f.write("\nCandidate URLs are not yet saved images.\n")
          PY
      - name: Resume existing SHA-verified public photo backfill when visual matches exist
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"reverse-leads.json").read_text())
          print(d["source_pages_accepted"])
          PY
          )"
          # Runs once per roughly 24 hours, not after every 3-hour image sweep.
          if [[ "$count" -gt 0 && "$((GITHUB_RUN_NUMBER % 8))" == 0 ]]; then
            gh workflow run gallery-comprehensive-backfill.yml --ref main
            echo "Dispatched existing physical-photo collection and cloud import pipeline" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-first-low-count-source-leads
          path: ${{ runner.temp }}/reverse-leads.json
          retention-days: 30
          if-no-files-found: warn
