name: Mimmi Public KGravure Multi-Album Deep Photo Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - apps/mimmi-gallery/collect_kgravure_public.py
      - apps/mimmi-gallery/test_kgravure_public.py
      - .github/workflows/mimmi-kgravure-bulk.yml
  schedule:
    - cron: '15 5 * * 3,6'
permissions:
  contents: write
concurrency:
  group: mimmi-kgravure-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install free HTML and photo parser
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Test crawler and safe photo host selector
        run: |
          python -m py_compile apps/mimmi-gallery/collect_kgravure_public.py
          python apps/mimmi-gallery/test_kgravure_public.py
      - name: Crawl publicly browsable Mimmi model galleries at scale
        run: python apps/mimmi-gallery/collect_kgravure_public.py --profiles 2 --sets 50 --images 55
      - name: Audit recorded individually verified picture URLs and hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apps/mimmi-gallery/kgravure-public-previews.json').read_text())
          assert d['summary']['private_cloud_originals']==0
          for a in d['albums']:
            assert a['images']==[]
            for im in a['samples']:
              assert im['sha256'] and im['bytes']>5000
              assert im['width']>=300 and im['height']>=300
          print('KGRAVURE_REAL_PHOTO_AUDIT',d['summary'])
          PY
      - name: Persist metadata only, never copyrighted photo bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mimmi-gallery/kgravure-public-previews.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified public Mimmi photos from additional site"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
