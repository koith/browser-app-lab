name: 4LEAF 2004 game visual source audit
on:
  push:
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/world-perspective.css'
      - '.github/workflows/rog-visual-source-audit.yml'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/genesis-chessman-actors.js'
      - 'apps/4leaf/rog/dice-original-obs.css'
      - 'apps/4leaf/rog/dice-source-roll.js'
      - 'apps/4leaf/rog/dice-source-roll.css'
      - 'apps/4leaf/rog/original/SourceSPR/**'
      - 'apps/4leaf/rog/tests/original-source-spr-integrity.cjs'
      - 'apps/4leaf/rog/dice-native-player-portraits.css'
      - 'apps/4leaf/rog/tests/dice-original-visual-qa.cjs'
      - 'apps/4leaf/rog/registry-native-chroma.js'
      - 'apps/4leaf/rog/original/OBS/animation-extra.js'
  pull_request:
    paths:
      - 'apps/4leaf/rog/tests/dice-original-visual-qa.cjs'
      - 'apps/4leaf/rog/dice-native-tis-orientation.css'
      - 'apps/4leaf/rog/dice-native-tis-depth.css'
      - 'apps/4leaf/rog/game.js'
      - '.github/workflows/rog-visual-source-audit.yml'
  workflow_dispatch:
jobs:
  actual-800px-chromium-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 20 source-authentic 2002 ROLL PNG frames against SHA256
        run: node apps/4leaf/rog/tests/original-source-spr-integrity.cjs
      - name: Install genuine desktop Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve real historical static image and game assets with same-origin canvas reads
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-original-source.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsSI http://127.0.0.1:8765/original/Tiles/0015.png >/dev/null && break
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8765/original/Tiles/0015.png
      - name: Capture real 800x600 original DMP/TIS gameplay (never screenshot-overlay implementation)
        env:
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/dice-original-visual-qa.cjs
