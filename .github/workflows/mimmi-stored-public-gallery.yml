name: Mimmi Yui-Style Physically Stored Gallery
on:
  workflow_dispatch:
  # github-actions[bot] source index commits do NOT trigger ordinary push workflows.
  # A workflow_run completion DOES trigger this real-file storage pipeline.
  workflow_run:
    workflows:
      - Mimmi Multi-Page Public Photo Crawl
      - Mimmi DJAWA Public Promotional Image Search
      - Mimmi Official Social Public Photo Discovery
      - Mimmi Free Official Portfolio Discovery
      - Mimmi Free V2PH Public Gallery Photo Discovery
      - Mimmi V2PH Actor Wide Discovery
    types: [completed]
  schedule:
    - cron: '25 3,9,15,21 * * *'
  push:
    paths:
      - 'apps/mimmi-gallery/publish_stored_public.py'
      - 'apps/mimmi-gallery/source-viewer-albums.json'
      - '.github/workflows/mimmi-stored-public-gallery.yml'
permissions:
  contents: write
concurrency:
  group: mimmi-physical-publish
  cancel-in-progress: false
jobs:
  publish-real-public-previews:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file/image verification
        run: python -m pip install requests Pillow
      - name: Save verified public photo bytes, not URL-only entries
        run: python apps/mimmi-gallery/publish_stored_public.py --limit 250 --budget-mb 90 --authorized-public-rehost
      - name: Recheck all archived image bytes against manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('apps/mimmi-gallery')
          data=json.loads((root/'stored-albums.json').read_text())
          n=0
          for album in data['albums']:
              for p in album['images']:
                  path=root/p['url']
                  assert path.is_file() and path.stat().st_size==p['bytes']
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==p['sha256']
                  n+=1
          assert n>0
          print('MIMMI_PHYSICALLY_STORED_VERIFIED',n)
          PY
      - name: iPhone-style local file gallery QA (Chromium and WebKit)
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
          python -m http.server 8765 --directory apps >/tmp/mimmi-static.log 2>&1 &
          node apps/mimmi-gallery/test_mobile_album.cjs
          node apps/mimmi-gallery/test_webkit_photo.cjs
      - name: Commit real individual files and their physical index
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mimmi-gallery/stored-albums/ apps/mimmi-gallery/stored-albums.json
          if ! git diff --cached --quiet; then
            git commit -m "Store and serve actual Mimmi public preview image bytes"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
