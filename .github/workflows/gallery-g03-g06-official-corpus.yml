name: G03 G06 Full Mimmi Official Public Portfolio Physical SHA Sweep
on:
  push:
    branches:
      - feat/gallery-g03-g06-official-corpus-31-20261113
    paths:
      - ".github/workflows/gallery-g03-g06-official-corpus.yml"
      - "apps/mimmi-gallery/public-work-pages.json"
      - "apps/mimmi-gallery/stored-albums.json"
      - "apps/mimmi-gallery/stored-albums/**"
  pull_request:
    paths:
      - ".github/workflows/gallery-g03-g06-official-corpus.yml"
      - "apps/mimmi-gallery/public-work-pages.json"
      - "apps/mimmi-gallery/stored-albums.json"
      - "apps/mimmi-gallery/stored-albums/**"
permissions:
  contents: write
concurrency:
  group: g03-g06-official-mimmi-corpus-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  real-publisher-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0'
      - name: Validate all unambiguous registered original official Mimmi works
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter
          base=Path('apps/mimmi-gallery')
          cat=json.loads((base/'albums.json').read_text())['albums']
          known=json.loads((base/'public-work-pages.json').read_text())['albums']
          urls={x['id']:x['source'] for x in cat if re.fullmatch(
            r'https://djawaphoto\.com/portfolio/[a-z0-9-]+/',x.get('source',''))
            and not x.get('catalogueOnly')}
          registered={}
          for x in known:
            if x['id'] in registered:raise ValueError('duplicate_registered_work_id')
            registered[x['id']]=x
          assert len(urls)==31,len(urls)
          extra=registered.get('djawa-rudy2-codename-wolfgirl')
          assert extra and extra['source']=='https://djawaphoto.com/portfolio/rudy%c2%b2-codename-wolfgirl/'
          assert extra['source_claimed_total_edition_photos']==200
          for aid,url in urls.items():
            rec=registered.get(aid)
            assert rec and (url==rec['source'] or url in rec.get('source_pages',[])),aid
          print('G03_G06_OFFICIAL_MIMMI_32_KNOWN_PUBLISHER_WORKS_REGISTERED_PASS')
          print('ONE_PERCENT_ESCAPED_RUDY2_WORK_HELD_FOR_EXPLICIT_IDENTITY_REVIEW')
          PY
          python -m py_compile apps/gallery-archive/direct_photo_pipeline.py apps/gallery-archive/publish_new_public_photos_to_pages.py
          (cd apps/gallery-archive && python test_direct_photo_pipeline.py)
      - name: Verify eight already staged Rudy2 JPEGs against immutable SHA, bytes and pixels
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          base=Path('apps/mimmi-gallery')
          doc=json.loads((base/'stored-albums.json').read_text())
          album=next(a for a in doc['albums'] if a['id']=='djawa-rudy2-codename-wolfgirl')
          assert len(album['images'])==8, 'Rudy2 expected physical file count changed'
          seen=set()
          for p in album['images']:
            rel=Path(p['url'])
            assert not rel.is_absolute() and '..' not in rel.parts
            assert rel.parts[0]=='stored-albums'
            target=base/rel
            raw=target.read_bytes()
            digest=hashlib.sha256(raw).hexdigest()
            assert digest==p['sha256'] and len(raw)==p['bytes']
            assert digest not in seen
            seen.add(digest)
            with Image.open(target) as im:
              im.load()
              assert im.format=='JPEG'
              assert im.size==(p['width'],p['height'])
          print('G03_G06_RUDY2_EIGHT_PHYSICAL_SHA_BYTES_PIXELS_PASS',len(seen))
          PY
      - name: Visit all 32 exact publisher works in four bounded 10-work batches
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          rows=json.loads(Path('apps/mimmi-gallery/albums.json').read_text())['albums']
          ids=[r['id'] for r in rows if r.get('source','').startswith(
            'https://djawaphoto.com/portfolio/') and '%' not in r.get('source','')]
          assert len(ids)==31,len(ids)
          ids.append('djawa-rudy2-codename-wolfgirl')
          assert len(set(ids))==32,len(ids)
          root=Path(os.environ['RUNNER_TEMP'])/'g03-g06-official'
          for batch,offset in enumerate(range(0,len(ids),10),1):
            sample=ids[offset:offset+10]
            dest=root/('part'+str(batch))
            args=['python','apps/gallery-archive/direct_photo_pipeline.py',
             '--model','mimmi','--owner','apps/mimmi-gallery/owner-index.json',
             '--out',str(dest),'--max-new','60','--max-pages','3',
             '--render-budget','0','--reviewed-source-only']
            for aid in sample:args+=['--album-id',aid]
            print('G03_G06_OFFICIAL_MIMMI_REAL_BATCH',batch,len(sample),flush=True)
            subprocess.run(args,check=True)
          PY
      - name: Publish only new immutable SHA decoded image bytes, with complete batch audit
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import subprocess
          root=Path(os.environ['RUNNER_TEMP'])/'g03-g06-official'
          total=0
          for batch in range(1,5):
            stage=root/('part'+str(batch))
            subprocess.run(['python','apps/gallery-archive/publish_new_public_photos_to_pages.py',
              '--model','mimmi','--stage',str(stage),
              '--limit','70','--budget','50000000'],check=True)
            pub=json.loads((stage/'metadata/pages-publication.json').read_text())
            total+=pub['new_sha_verified_originals']
          print('G03_G06_ACTUALLY_PUBLISHED_NEW_MIMMI_SHA_FILES',total,flush=True)
          PY
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
      - name: Commit only verifiable new immutable photograph bytes to this PR
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'g03-g06-official'
          for batch in range(1,5):
            subprocess.run(['python','apps/gallery-archive/publish_new_public_photos_to_pages.py',
              '--model','mimmi','--stage',str(root/('part'+str(batch))),
              '--limit','70','--budget','50000000'],check=True)
          PY
          git add apps/mimmi-gallery/stored-albums.json apps/mimmi-gallery/stored-albums/
          if git diff --cached --quiet; then
            echo 'G03_G06_NO_NEW_SHA_PUBLIC_PHOTOS_IN_THIS_RUN' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "feat(G03 G06): add verified original Mimmi public photo bytes"
            git push origin "HEAD:refs/heads/$BRANCH"
            echo 'G03_G06_REAL_NEW_MIMMI_ORIGINALS_COMMITTED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g03-g06-31-work-public-coverage-and-sha
          path: |
            ${{ runner.temp }}/g03-g06-official/part*/metadata/collection-audit.json
            ${{ runner.temp }}/g03-g06-official/part*/metadata/pages-publication.json
          retention-days: 7
          if-no-files-found: warn
