name: Gallery Safe Existing-Original Incremental Merge QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/merge_incremental.py'
      - 'apps/gallery-archive/test_incremental.py'
      - 'apps/gallery-archive/test_incremental_model_parity.py'
      - '.github/workflows/gallery-safe-incremental-merge-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/merge_incremental.py'
      - 'apps/gallery-archive/test_incremental.py'
      - 'apps/gallery-archive/test_incremental_model_parity.py'
      - '.github/workflows/gallery-safe-incremental-merge-qa.yml'
permissions:
  contents: read
jobs:
  offline-existing-owner-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/gallery-archive
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check both models retain prior SHA, numbering and verified upgrade policy
        run: |
          python -m py_compile apps/gallery-archive/merge_incremental.py apps/gallery-archive/test_incremental.py apps/gallery-archive/test_incremental_model_parity.py
          python apps/gallery-archive/test_incremental.py
          python apps/gallery-archive/test_incremental_model_parity.py
