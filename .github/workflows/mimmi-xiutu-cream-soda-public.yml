name: Mimmi Secondary CreamSoda Public Gallery Crawl
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2,14 * * 1,4'
  push:
    paths:
      - 'apps/mimmi-gallery/collect_xiutu_public.py'
      - 'apps/mimmi-gallery/test_xiutu_public.py'
      - '.github/workflows/mimmi-xiutu-cream-soda-public.yml'
permissions:
  contents: write
concurrency:
  group: mimmi-xiutu-public-evidence-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  public-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public-photo verification dependencies
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Validate public photo page safety, multi-page navigation and model identity
        run: |
          python -m py_compile apps/mimmi-gallery/collect_xiutu_public.py
          python apps/mimmi-gallery/test_xiutu_public.py
      - name: Visit actually published CreamSoda works and fetch individually accessible image bytes
        run: python apps/mimmi-gallery/collect_xiutu_public.py --category-pages 4 --article-pages 30 --images 400
      - name: Verify each SHA and distinguish source-link evidence from stored media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('apps/mimmi-gallery/xiutu-public-previews.json').read_text())
          assert r['model']=='mimmi' and r['summary']['physical_files_archived']==0
          for a in r['albums']:
              assert a['images']==[] and a['source'].startswith('https://www.xiutu.me/photo/')
              for p in a['samples']:
                  assert p['url'].startswith('https://') and ('.xiutu.me/' in p['url'] or p['url'].startswith('https://img-jp-a.cdnimg.vip/'))
                  assert len(p['sha256'])==64 and p['bytes']>4500
          print('MIMMI_SECONDARY_PUBLIC_CREAMSODA_EVIDENCE_ONLY',r['summary'])
          PY
      - name: Merge long-running verified crawl without Git rebase conflicts
        if: github.ref == 'refs/heads/main'
        run: |
          python apps/gallery-archive/test_commit_crawler_research.py
          python apps/gallery-archive/commit_crawler_research.py --manifest xiutu-public-previews.json --retries 8
