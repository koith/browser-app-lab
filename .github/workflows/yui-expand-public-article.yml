name: YUI Expand Free Public V2PH Album Previews
on:
  push:
    paths:
      - .github/workflows/yui-expand-public-article.yml
      - apps/yui-gallery/crawl_v2ph_public.py
      - apps/yui-gallery/build_expanded_source_albums.py
      - apps/yui-gallery/test_v2ph_public.py
  workflow_dispatch:
  schedule:
    - cron: '22 19 * * 3'
permissions:
  contents: write
concurrency:
  group: yui-expand-free-public-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  crawl-public-albums:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Python browser and original image validator
        run: |
          python -m pip install requests Pillow playwright
          python -m playwright install chromium
      - name: Syntax and safety checks for public page extraction
        run: |
          python -m py_compile apps/yui-gallery/crawl_v2ph_public.py apps/yui-gallery/build_expanded_source_albums.py
          python apps/yui-gallery/test_v2ph_public.py
      - name: Retrieve only freely displayed individual preview images from four distinct Yui albums
        run: |
          python apps/yui-gallery/crawl_v2ph_public.py
      - name: Verify physical image bytes and build source-viewer album records
        run: |
          python apps/yui-gallery/build_expanded_source_albums.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('apps/yui-gallery/expanded-source-albums.json').read_text())
          assert 1<=len(d['albums'])<=4
          photos=sum(len(a['images']) for a in d['albums'])
          assert photos>0
          assert all(a['full_album_complete'] is False for a in d['albums'])
          assert all(len(a['images'])<=5 for a in d['albums'])
          print('NEW_PHYSICALLY_VERIFIED_PUBLIC_PHOTOS',photos,flush=True)
          PY
      - name: Commit only publicly available source URLs for gallery owner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/expanded-source-albums.json
          if ! git diff --cached --quiet; then
            git commit -m "Index additional free publicly visible Yui photos"
            BRANCH="${GITHUB_REF_NAME}"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Preserve hash summary as one uncompressed JSON audit file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: yui-v2ph-public-previews/summary.json
          archive: false
          retention-days: 30
          if-no-files-found: ignore
