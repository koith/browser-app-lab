name: 4LEAF original client resource audit
on:
  push:
    paths:
      - '.github/workflows/rog-original.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and audit original archived 4LEAF client
        run: |
          python - <<'PY'
          import urllib.request,zipfile,os,json,hashlib,io,collections
          from pathlib import Path
          url='https://archive.org/download/4leaf/4leaf.zip'
          Path('audit-output').mkdir(exist_ok=True)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          out=Path('audit-output/archive.zip')
          with urllib.request.urlopen(req,timeout=90) as r,open(out,'wb') as f:
            while chunk:=r.read(1048576):f.write(chunk)
          print('ARCHIVE-DOWNLOAD',out.stat().st_size,hashlib.sha256(out.read_bytes()).hexdigest())
          with zipfile.ZipFile(out) as z:
            infos=z.infolist()
            print('ARCHIVE-ENTRIES',len(infos))
            for entry in infos[:600]:
              print('ARCHIVE-ENTRY',entry.filename,entry.file_size)
            result=[{'name':e.filename,'size':e.file_size,'compressed':e.compress_size} for e in infos]
            Path('audit-output/files.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
            # Only safe, small non-executable image and data samples.
            good={'.png','.bmp','.jpg','.jpeg','.gif','.pcx','.tga','.wav','.mid','.xml','.ini','.txt','.dat','.pak','.res','.dll'}
            count=0
            for item in infos:
              name=Path(item.filename).name
              if item.is_dir() or item.file_size>8000000 or Path(name).suffix.lower() not in good:continue
              if count>=180:break
              safe=''.join(c if c.isalnum() or c in '._-' else '_' for c in name)
              target=Path('audit-output/samples')/(str(count).zfill(3)+'_'+safe)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(item))
              count+=1
            print('AUDIT-SAMPLES',count)
          out.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4leaf-original-client-audit
          path: audit-output/
          retention-days: 2
