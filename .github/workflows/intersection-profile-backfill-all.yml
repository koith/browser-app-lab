name: INTERSECTION — Restore Every Verified Public Profile Snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-profile-backfill-all.yml"
permissions:
  contents: read
  actions: write
concurrency:
  group: intersection-public-profile-restoration-dispatch
  cancel-in-progress: false
jobs:
  start-whitelisted-archive-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Sync all verified account picker records under the existing restricted OIDC identity
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          token=os.environ["GITHUB_TOKEN"]
          url=("https://api.github.com/repos/koith/browser-app-lab"
               "/actions/workflows/intersection-target-account-bundle.yml/dispatches")
          payload={"ref":"main","inputs":{"profile_index_only":"true"}}
          req=Request(url,method="POST",data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"intersection-reviewed-public-profile-repair"})
          with urlopen(req,timeout=25) as response:
              assert response.status==204, "profile inventory dispatch not accepted"
          print("ARCHIVE_INDEX_TRUSTED_REFRESH_DISPATCH_ACCEPTED",flush=True)
          PY
      - name: Confirm status boundary
        run: |
          echo 'The whitelisted main-branch archive workflow will independently verify existing encrypted public-account releases and publish their signed owner-only index; this run DOES NOT launch duplicate captures or claim the source ZIPs were permanently migrated.' >> "$GITHUB_STEP_SUMMARY"
