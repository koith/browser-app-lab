name: INTERSECTION — Restore Every Verified Public Profile Snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-profile-backfill-all.yml"
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: intersection-public-profile-restoration-dispatch
  cancel-in-progress: false
jobs:
  discover-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned AES-GCM verification library
        run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Dispatch individually verifiable, append-only profile backfills
        working-directory: apps/demand-research
        run: python profile_backfill_dispatch.py
      - name: Record real status boundaries
        if: always()
        run: |
          echo 'The inventory run dispatches one capture per independently verified account. It does not verify completed profile/media backups; use each GitHub bundle job and its SHA readback for completion.' >> "$GITHUB_STEP_SUMMARY"
