name: INTERSECTION — Real SNS Pixel-Parity Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intersection-visual-parity.yml"
      - "apps/demand-research/test_live_visual_parity.py"
permissions:
  contents: read
concurrency:
  group: intersection-visual-parity-same-account
  cancel-in-progress: false
jobs:
  pixel-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install exact browser and in-memory image-comparison dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.56.0 Pillow==11.3.0
          python -m py_compile apps/demand-research/test_live_visual_parity.py
      - name: Measure REAL public source and same SHA-bound archived profile pixels
        run: python apps/demand-research/test_live_visual_parity.py
      - name: Interpret only true exact-pixel equality as completion
        if: always()
        run: |
          echo 'This gate checks actual source pages and the same archived SNS account in Chromium/WebKit, mobile/desktop; source blocked or missing = UNVERIFIED, any unequal pixel = FAIL. No screenshots, account handles, authentication secrets, or post content are uploaded as artifacts.' >> "$GITHUB_STEP_SUMMARY"
