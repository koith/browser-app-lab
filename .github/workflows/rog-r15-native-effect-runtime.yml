name: 4LEAF R15 native OBS effects actual duel browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-r15-native-effect-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duel-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source effect runtime and release metadata
        run: |
          node --check apps/4leaf/rog/native-duel-effects.js
          node --check apps/4leaf/rog/original/OBS/duel-effects/manifest.js
          node apps/4leaf/rog/tests/r15-native-effects-source-contract.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install '${{ matrix.engine }}' --with-deps
      - name: Serve native 2002 source game locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/4leaf-r15-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fLsS --max-time 2 http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/4leaf-r15-http.log
          exit 1
      - name: Original CHR 0042 attack -> own 1097 native source effect
        env:
          FOURLEAF_BROWSER: '${{ matrix.engine }}'
        run: node apps/4leaf/rog/tests/r15-native-duel-effect-live.cjs
