name: Gallery Quality Branding and Fast Entry Regression QA
on:
  pull_request:
    paths:
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/image-quality.js'
      - 'apps/mimmi-gallery/image-quality.js'
      - 'apps/yui-gallery/publishers.js'
      - 'apps/mimmi-gallery/publishers.js'
      - 'apps/yui-gallery/publishers.json'
      - 'apps/mimmi-gallery/publishers.json'
      - 'apps/gallery-archive/test_gallery_visual_quality.cjs'
      - 'apps/gallery-archive/audit_gallery_publisher_cover_corpus.cjs'
      - 'apps/yui-gallery/gallery-labels.js'
      - 'apps/mimmi-gallery/gallery-labels.js'
      - 'apps/mimmi-gallery/test_gallery_labels.cjs'
      - 'apps/yui-gallery/test_gallery_labels.cjs'
      - 'apps/gallery-archive/test_publisher_logo_fallback.cjs'
      - 'apps/gallery-archive/test_curated_cover_manifest.cjs'
      - 'apps/gallery-archive/test_cross_model_saved_sha.cjs'
      - 'apps/yui-gallery/album-covers.json'
      - 'apps/mimmi-gallery/album-covers.json'
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - '.github/workflows/gallery-quality-branding-entry-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/image-quality.js'
      - 'apps/mimmi-gallery/image-quality.js'
      - 'apps/yui-gallery/publishers.js'
      - 'apps/mimmi-gallery/publishers.js'
      - 'apps/yui-gallery/publishers.json'
      - 'apps/mimmi-gallery/publishers.json'
      - 'apps/gallery-archive/test_gallery_visual_quality.cjs'
      - 'apps/gallery-archive/audit_gallery_publisher_cover_corpus.cjs'
      - 'apps/yui-gallery/gallery-labels.js'
      - 'apps/mimmi-gallery/gallery-labels.js'
      - 'apps/mimmi-gallery/test_gallery_labels.cjs'
      - 'apps/yui-gallery/test_gallery_labels.cjs'
      - 'apps/gallery-archive/test_publisher_logo_fallback.cjs'
      - 'apps/gallery-archive/test_curated_cover_manifest.cjs'
      - 'apps/gallery-archive/test_cross_model_saved_sha.cjs'
      - 'apps/yui-gallery/album-covers.json'
      - 'apps/mimmi-gallery/album-covers.json'
      - 'apps/mimmi-gallery/cloud/gateway/portal.py'
      - '.github/workflows/gallery-quality-branding-entry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-quality-and-brand-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check photo variant and publisher identity unit tests
        run: |
          node --check apps/yui-gallery/image-quality.js
          node --check apps/mimmi-gallery/image-quality.js
          node apps/gallery-archive/test_gallery_visual_quality.cjs
          node apps/gallery-archive/test_publisher_logo_fallback.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
          node apps/gallery-archive/test_cross_model_saved_sha.cjs
          node apps/gallery-archive/audit_gallery_publisher_cover_corpus.cjs
          node apps/mimmi-gallery/test_gallery_labels.cjs
          node apps/yui-gallery/test_gallery_labels.cjs
      - name: Verify both embedded gallery scripts parse
        run: |
          python - <<'PY'
          import re,subprocess,tempfile,pathlib
          for m in ('yui','mimmi'):
              html=pathlib.Path('apps',m+'-gallery','index.html').read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
              assert scripts,(m,'missing inline JS')
              with tempfile.NamedTemporaryFile(suffix='.js') as f:
                  f.write(scripts[-1].encode());f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
              print('GALLERY_INLINE_SCRIPT_SYNTAX_PASS',m)
          PY
