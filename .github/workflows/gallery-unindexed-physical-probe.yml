name: Gallery Unindexed Existing Owner File SHA Decode Probe
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-unindexed-physical-probe.yml'
      - 'apps/gallery-archive/inspect_unindexed_owner_files.py'
      - 'apps/gallery-archive/test_inspect_unindexed_owner_files.py'
permissions:
  contents: read
concurrency:
  group: gallery-unindexed-byte-probe-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  inspect-existing-media:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mimmi, yui]
    env:
      MODEL: ${{ matrix.model }}
      MIMMI_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
      YUI_COOKIE: ${{ secrets.YUI_TERABOX_COOKIE }}
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/gallery-archive
            apps/mimmi-gallery/cloud/gateway/cookie_format.py
            apps/mimmi-gallery/stored-albums.json
            apps/yui-gallery/stored-albums.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate path filters, compile scanner and run offline tests
        run: |
          set -euo pipefail
          python -m pip install 'Pillow==11.3.0'
          python -m py_compile apps/gallery-archive/inspect_unindexed_owner_files.py
          python apps/gallery-archive/test_inspect_unindexed_owner_files.py
      - name: Install SHA-pinned existing TeraBox read-only client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/rclone-client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/rclone-client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rclone-unpack" "$RUNNER_TEMP/rclone-bin"
          unzip -q "$RUNNER_TEMP/rclone-client.zip" -d "$RUNNER_TEMP/rclone-unpack"
          binary="$(find "$RUNNER_TEMP/rclone-unpack" -type f -name rclone -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/rclone-bin/rclone"
          echo "$RUNNER_TEMP/rclone-bin" >> "$GITHUB_PATH"
      - name: Read real unindexed file bytes and report aggregate SHA/decoding evidence
        shell: bash
        run: |
          set -euo pipefail
          case "$MODEL" in
            mimmi) export RCLONE_CONFIG_ARCHIVE_COOKIE="$MIMMI_COOKIE"; remote='archive:MimmiArchive' ;;
            yui) export RCLONE_CONFIG_ARCHIVE_COOKIE="$YUI_COOKIE"; remote='archive:YuiArchive' ;;
            *) exit 2 ;;
          esac
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          rclone cat "$remote/metadata/catalog.json" --timeout 75s --retries 2 > "$RUNNER_TEMP/catalog.json" 2> "$RUNNER_TEMP/catalog-errors"
          timeout 660 rclone lsjson "$remote" -R --files-only --timeout 75s --retries 2 > "$RUNNER_TEMP/listing.json" 2> "$RUNNER_TEMP/list-errors"
          python apps/gallery-archive/inspect_unindexed_owner_files.py \
            --model "$MODEL" --listing "$RUNNER_TEMP/listing.json" \
            --catalog "$RUNNER_TEMP/catalog.json" \
            --saved "apps/$MODEL-gallery/stored-albums.json" --max 90
          echo 'Only existing stored photo bytes were read. No originals modified or published.' >> "$GITHUB_STEP_SUMMARY"
