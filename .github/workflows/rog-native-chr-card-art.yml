name: 4LEAF exact CHR-owned card images in Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/native-chr-card-art.cjs'
      - '.github/workflows/rog-native-chr-card-art.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/native-chr-card-art.cjs'
      - '.github/workflows/rog-native-chr-card-art.yml'
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR test runs but never cancel published main/SHA checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-owned-card-art:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/4leaf/rog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve exact source branch
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog > /tmp/leaf-card-art.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-card-art.log
          exit 1
      - name: Prove own-source CHR pixels and missing-source fallback
        env:
          FOURLEAF_BROWSER: ${{ matrix.browser }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/native-chr-card-art.cjs
