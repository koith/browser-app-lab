name: Gallery G-MH Reviewed Image CDN Real Physical Backfill
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/collect_observed_gmh_public_images.py'
      - 'apps/gallery-archive/test_collect_observed_gmh_public_images.py'
      - 'apps/gallery-archive/verification/observed-gmh-public-media.json'
      - '.github/workflows/gallery-gmh-observed-public-backfill.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/collect_observed_gmh_public_images.py'
      - 'apps/gallery-archive/verification/observed-gmh-public-media.json'
      - 'apps/yui-gallery/public-work-pages.json'
      - '.github/workflows/gallery-gmh-observed-public-backfill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-gmh-observed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet 'Pillow==11.3.0' 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Verify exact-model, exact-public-image-CDN and physical-byte trust gates
        run: |
          python -m py_compile apps/gallery-archive/collect_observed_gmh_public_images.py
          python apps/gallery-archive/test_collect_observed_gmh_public_images.py
  archive-real-photos:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [mimmi, yui]
    env:
      MODEL: ${{ matrix.model }}
      STAGE: /tmp/gallery-gmh-source-observed
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install --quiet 'Pillow==11.3.0' 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Download only page-observed model/edition CDN photo URLs with robots and SHA checks
        run: |
          python apps/gallery-archive/collect_observed_gmh_public_images.py \
            --model "$MODEL" --stage "$STAGE" \
            --max-photos 120 --max-per-work 30 --budget 45000000
      - name: Publish only physically verified novel files into existing Gallery Pages
        run: |
          python apps/gallery-archive/publish_new_public_photos_to_pages.py \
            --model "$MODEL" --stage "$STAGE" --limit 120 --budget 45000000
          node apps/gallery-archive/test_saved_photo_union.cjs
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['STAGE'])/'metadata'
          audit=json.loads((d/'observed-media-report.json').read_text())
          published=json.loads((d/'pages-publication.json').read_text())
          result={'model':os.environ['MODEL'],
                  'physically_downloaded_sha':audit['real_downloaded_files_staged'],
                  'actual_new_gallery_files':published['new_sha_verified_originals'],
                  'real_quality_upgrades':published['higher_visual_quality_replacements'],
                  'work_counts':audit['work_counts'],
                  'download_failures':audit['errors']}
          print('GMH_REAL_PUBLISHED_PUBLIC_PAGES',json.dumps(result,ensure_ascii=False),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## G-MH public image backfill: '+os.environ['MODEL']+'\\n')
              f.write('~~~json\\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\\n~~~\\n')
          PY
      - name: Commit only genuinely stored verified image files; skip empty campaigns
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$MODEL-gallery/stored-albums.json" "apps/$MODEL-gallery/stored-albums/" "apps/$MODEL-gallery/album-covers.json"
          if git diff --cached --quiet; then
            echo "GMH_NO_NEW_SAVED_PHYSICAL_FILES model=$MODEL"
            exit 0
          fi
          git commit -m "feat(gallery): archive verified $MODEL observed G-MH CDN photos"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::GMH_PHOTO_REBASE_CONFLICT"
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "GMH_REAL_FILES_MAIN_PERSISTED model=$MODEL sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::GMH_REAL_FILES_PUSH_FAILED"
          exit 1
      - name: Persist audit JSON only, not downloaded media as action artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-gmh-audit-${{ matrix.model }}
          path: |
            /tmp/gallery-gmh-source-observed/metadata/observed-media-report.json
            /tmp/gallery-gmh-source-observed/metadata/pages-publication.json
          retention-days: 7
          if-no-files-found: ignore
