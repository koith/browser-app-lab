name: Gallery Full Missing Public Photos — Collect Real Files
on:
  workflow_dispatch:
  schedule:
    - cron: '27 0,8,16 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-full-missing-public-collection.yml'
  pull_request:
    paths:
      - '.github/workflows/gallery-full-missing-public-collection.yml'
      - 'apps/gallery-archive/run_full_public_acquisition.py'
      - 'apps/gallery-archive/test_run_full_public_acquisition.py'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: gallery-full-missing-public-photos
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow==11.3.0' 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Validate full corpus scope, priority and source safety
        run: |
          python -m py_compile apps/gallery-archive/run_full_public_acquisition.py
          python apps/gallery-archive/test_run_full_public_acquisition.py
          python apps/gallery-archive/test_reverse_image_sweep.py
          python apps/gallery-archive/run_full_public_acquisition.py --model mimmi --stage "$RUNNER_TEMP/empty" --plan-only
          python apps/gallery-archive/run_full_public_acquisition.py --model yui --stage "$RUNNER_TEMP/empty" --plan-only
  collect:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mimmi, yui]
    env:
      MODEL: ${{ matrix.model }}
      RUN_NUMBER: ${{ github.run_number }}
      STAGE: /tmp/gallery-public-full
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install free public source parsers and image decoder
        run: |
          python -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0' 'Scrapy>=2.12,<3'
      - name: Find new public image-source pages using real samples and name variations
        shell: bash
        run: |
          mkdir -p "$STAGE"
          python apps/gallery-archive/reverse_image_sweep.py --model "$MODEL" --all-cuts \
            --seeds 8 --offset "$((RUN_NUMBER * 8))" --workers 2 \
            --out "$STAGE/reverse-evidence.json" || echo "REVERSE_PUBLIC_SEARCH_NO_NEW_LEADS"
          python apps/gallery-archive/source_alias_search.py --model "$MODEL" \
            --offset "$((RUN_NUMBER * 3))" --per-work 2 --max-pages 18 \
            --reverse "$STAGE/reverse-evidence.json" \
            --out "$STAGE/source-evidence.json" || echo "ALIASES_PUBLIC_SEARCH_NO_NEW_LEADS"
      - name: Acquire every registered work, prioritizing actual missing cuts
        shell: bash
        run: |
          set -euo pipefail
          python apps/gallery-archive/run_full_public_acquisition.py \
            --model "$MODEL" --run-number "$RUN_NUMBER" \
            --stage "$STAGE/photos" \
            --source-evidence "$STAGE/source-evidence.json" \
            --batch-size 7 --max-per-batch 48 --bytes-per-batch 36000000 \
            --batch-timeout 1200 --alternate-priority
      - name: Replay exact staged SHA bytes onto latest main, then commit actual new photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python apps/gallery-archive/run_full_public_acquisition.py \
            --model "$MODEL" --run-number "$RUN_NUMBER" \
            --stage "$STAGE/photos" --replay-only
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
          git add "apps/$MODEL-gallery/stored-albums.json" "apps/$MODEL-gallery/stored-albums/"
          if git diff --cached --quiet; then
            echo "MODEL=$MODEL NEW_VERIFIED_SHA=0 no_unowned_decoded_public_originals" >> "$GITHUB_STEP_SUMMARY"
            echo "FULL_COLLECTION_NO_NEW_BYTES model=$MODEL"
            exit 0
          fi
          git commit -m "feat(gallery): save SHA-verified new $MODEL public photo originals"
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::New-photo exact-byte reconciliation conflict"
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "MODEL=$MODEL NEW_VERIFIED_SHA_COMMITTED=yes" >> "$GITHUB_STEP_SUMMARY"
              echo "FULL_COLLECTION_NEW_PHOTO_COMMIT model=$MODEL sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 3
          done
          backup="auto/gallery-photos-$MODEL-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$backup"
          gh pr create --base main --head "$backup" \
            --title "Gallery: newly verified $MODEL public image originals" \
            --body "SHA-verified new public-photo files, requiring Pages browser acceptance."
          echo "MODEL=$MODEL NEW_BYTES_STAGED_PR=yes" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve audit metadata, never bundle originals as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-full-public-${{ matrix.model }}-audit
          path: |
            /tmp/gallery-public-full/reverse-evidence.json
            /tmp/gallery-public-full/source-evidence.json
            /tmp/gallery-public-full/photos/full-collection-summary.json
            /tmp/gallery-public-full/photos/batch-*/metadata/collection-audit.json
            /tmp/gallery-public-full/photos/batch-*/metadata/pages-publication.json
          retention-days: 7
          if-no-files-found: warn
