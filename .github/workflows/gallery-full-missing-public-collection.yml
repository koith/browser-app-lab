name: Gallery Full Missing Public Photos — Collect Real Files
on:
  workflow_dispatch:
    inputs:
      campaign_step:
        description: 'Bounded continuation step for the exhaustive SHA queue'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '27 0,8,16 * * *'
  # Collector code maintenance does not implicitly start another archive writer.
  pull_request:
    paths:
      - '.github/workflows/gallery-full-missing-public-collection.yml'
      - 'apps/gallery-archive/run_full_public_acquisition.py'
      - 'apps/gallery-archive/test_run_full_public_acquisition.py'
      - 'apps/gallery-archive/test_durable_incomplete_resume.py'
      - 'apps/gallery-archive/test_publish_verified_quality_upgrade.py'
      - 'apps/gallery-archive/test_saved_photo_union.cjs'
      - 'apps/mimmi-gallery/saved-photo-union.js'
      - 'apps/yui-gallery/saved-photo-union.js'
      - 'apps/gallery-archive/official_sample_supply.py'
      - 'apps/gallery-archive/test_official_sample_supply.py'
      - 'apps/gallery-archive/inventory_unindexed_owner_files.py'
      - 'apps/gallery-archive/test_inventory_unindexed_owner_files.py'
      - '.github/workflows/gallery-unindexed-owner-inventory.yml'
      - 'apps/gallery-archive/run_exhaustive_reverse_search.py'
      - 'apps/gallery-archive/test_exhaustive_reverse_search.py'
      - 'apps/gallery-archive/reverse_image_sweep.py'
      - 'apps/gallery-archive/test_reverse_image_sweep.py'
      - 'apps/gallery-archive/bing_visual_knowledge.py'
      - 'apps/gallery-archive/test_bing_visual_knowledge.py'
      - 'apps/gallery-archive/exhaustive_campaign_controller.py'
      - 'apps/gallery-archive/test_exhaustive_campaign_controller.py'
      - 'apps/gallery-archive/source_alias_search.py'
      - 'apps/gallery-archive/direct_photo_pipeline.py'
      - 'apps/gallery-archive/publish_new_public_photos_to_pages.py'
      - 'apps/gallery-archive/photo_quality_evidence.py'
      - 'apps/yui-gallery/photo_quality_policy.py'
      - 'apps/gallery-archive/test_verified_dynamic_work_publish.py'
      - 'apps/gallery-archive/test_owner_existing_public_source_coverage.py'
      - 'apps/gallery-archive/verified_source_bridge.py'
      - 'apps/gallery-archive/test_verified_source_bridge.py'
      - 'apps/gallery-archive/publisher_completion.py'
      - 'apps/gallery-archive/test_publisher_completion_undeclared.py'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: gallery-full-missing-public-photos-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow==11.3.0' 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Validate full corpus scope, priority and source safety
        run: |
          python -m py_compile apps/gallery-archive/run_full_public_acquisition.py
          python apps/gallery-archive/test_run_full_public_acquisition.py
          python apps/gallery-archive/test_durable_incomplete_resume.py
          python apps/gallery-archive/test_publish_verified_quality_upgrade.py
          python apps/gallery-archive/test_photo_quality_evidence.py
          python apps/yui-gallery/test_photo_quality_policy.py
          node apps/gallery-archive/test_saved_photo_union.cjs
          python apps/gallery-archive/test_official_sample_supply.py
          python apps/gallery-archive/test_publisher_completion_undeclared.py
          python apps/gallery-archive/test_inventory_unindexed_owner_files.py
          python apps/gallery-archive/test_source_alias_search.py
          python apps/gallery-archive/test_reverse_image_sweep.py
          python apps/gallery-archive/test_bing_visual_knowledge.py
          python apps/gallery-archive/test_exhaustive_reverse_search.py
          python apps/gallery-archive/test_exhaustive_campaign_controller.py
          python apps/gallery-archive/test_gallery_full_workflow_order.py
          python apps/gallery-archive/test_verified_source_bridge.py
          python apps/gallery-archive/test_verified_dynamic_work_publish.py
          python apps/gallery-archive/test_owner_existing_public_source_coverage.py
          python apps/gallery-archive/test_publish_photo_provenance.py
          python apps/gallery-archive/run_exhaustive_reverse_search.py --model mimmi --progress /tmp/exhaustive-none.json --progress-out /tmp/exhaustive-none-next.json --out /tmp/exhaustive-none-search.json --plan-only
          python apps/gallery-archive/run_exhaustive_reverse_search.py --model yui --progress /tmp/exhaustive-none.json --progress-out /tmp/exhaustive-none-next.json --out /tmp/exhaustive-none-search.json --plan-only
          python apps/gallery-archive/run_full_public_acquisition.py --model mimmi --stage "$RUNNER_TEMP/empty" --plan-only
          python apps/gallery-archive/run_full_public_acquisition.py --model yui --stage "$RUNNER_TEMP/empty" --plan-only
  collect:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mimmi, yui]
    env:
      MODEL: ${{ matrix.model }}
      RUN_NUMBER: ${{ github.run_number }}
      STAGE: /tmp/gallery-public-full
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install free public source parsers and image decoder
        run: |
          python -m pip install --quiet 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0' 'Scrapy>=2.12,<3' 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Load durable per-model reverse-image checkpoint from separate Git branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          branch="gallery-reverse-progress-$MODEL"
          key="apps/gallery-archive/verification/reverse-progress-$MODEL.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$branch" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh api "repos/$GITHUB_REPOSITORY/contents/$key?ref=$branch" \
             --jq '.content' > "$STAGE/state-base64.txt" 2>/dev/null; then
            tr -d '\n' < "$STAGE/state-base64.txt" | base64 -d > "$STAGE/reverse-state.json"
          else
            echo '{}' > "$STAGE/reverse-state.json"
          fi
          echo "ALL_OWNER_PHOTO_REVERSE_PROGRESS_LOADED model=$MODEL branch=$branch"
      - name: Search ALL owned photo SHAs in persistent bounded campaigns, not 8 samples
        shell: bash
        run: |
          set -euo pipefail
          # Every immutable SHA in both owner and Pages static indexes enters
          # the queue. 256 is per-run work, NOT a cap on total images indexed.
          # The checkpoint resumes at the next unsearched image automatically.
          python apps/gallery-archive/run_exhaustive_reverse_search.py \
            --model "$MODEL" \
            --progress "$STAGE/reverse-state.json" \
            --progress-out "$STAGE/reverse-next.json" \
            --out "$STAGE/reverse-evidence.json" \
            --budget 256 --max-seconds 3300 --workers 3 --stop-after-full \
            --search-revision 4
      - name: Persist reverse-search progress before ANY downstream network research
        shell: bash
        run: |
          set -euo pipefail
          # Update a finished model's last_run_attempts from nonzero to 0
          # ONCE. Otherwise a stale positive value fools the continuation
          # controller into dispatching useless runs indefinitely.
          # Skip later no-op zero-query updates.
          if python - "$STAGE/reverse-evidence.json" "$STAGE/reverse-state.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          old=json.load(open(sys.argv[2]))
          raise SystemExit(0 if report['seed_queries']==0
              and old.get('search_revision')==4
              and old.get('last_run_attempts')==0 else 1)
          PY
          then
            echo "ALL_OWNER_PHOTO_REVERSE_CURSOR_UNCHANGED model=$MODEL"
            exit 0
          fi
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          model=os.environ['MODEL']
          repo=os.environ['GITHUB_REPOSITORY']
          directory=pathlib.Path(os.environ['STAGE'])
          path=f'apps/gallery-archive/verification/reverse-progress-{model}.json'
          branch=f'gallery-reverse-progress-{model}'
          old=subprocess.run(['gh','api',f'repos/{repo}/contents/{path}?ref={branch}',
                             '--jq','.sha'],capture_output=True,text=True)
          data={'message':f'checkpoint(gallery): resume all-owner reverse search for {model}',
                'branch':branch,
                'content':base64.b64encode((directory/'reverse-next.json').read_bytes()).decode()}
          if old.returncode==0 and old.stdout.strip():
              data['sha']=old.stdout.strip()
          (directory/'checkpoint-upload.json').write_text(json.dumps(data))
          PY
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/apps/gallery-archive/verification/reverse-progress-$MODEL.json" \
            --input "$STAGE/checkpoint-upload.json" \
            --jq '.commit.sha' > "$STAGE/checkpoint-commit-sha.txt"
          # A successful API write is not proof of durable progress until
          # the exact per-model branch state can be retrieved and compared.
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/gallery-archive/verification/reverse-progress-$MODEL.json?ref=gallery-reverse-progress-$MODEL" \
            --jq '.content' | base64 -d > "$STAGE/reverse-readback.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['STAGE'])
          expected=json.loads((root/'reverse-next.json').read_text())
          observed=json.loads((root/'reverse-readback.json').read_text())
          assert observed==expected, 'REVERSE_CHECKPOINT_READBACK_MISMATCH'
          PY
          echo "ALL_OWNER_PHOTO_REVERSE_CURSOR_PERSISTED_AND_READBACK model=$MODEL SHA=$(cat "$STAGE/checkpoint-commit-sha.txt")"
      - name: Discover edition-specific public source pages using saved reverse evidence
        shell: bash
        run: |
          set -euo pipefail
          # This may be slow or inaccessible. The full per-SHA reverse cursor
          # has already been durably committed and read back above.
          if ! timeout 540s python apps/gallery-archive/source_alias_search.py --model "$MODEL" \
            --offset "$((RUN_NUMBER * 3))" --per-work 3 --max-pages 96 \
            --work-budget 16 --reverse-limit 128 --reverse "$STAGE/reverse-evidence.json" \
            --out "$STAGE/source-evidence.json"; then
            # Optional source-name enrichment must NOT prevent the independent
            # registered public work collector or block the next SHA batch.
            echo "::warning::SOURCE_ALIAS_SEARCH_UNAVAILABLE model=$MODEL; registered sources still scanned"
            printf '{"schema_version":1,"model":"%s","targets":[],"search_results":[],"research_only_not_yet_saved":true,"source_alias_status":"unavailable"}\n' "$MODEL" > "$STAGE/source-evidence.json"
          fi
      - name: Acquire every registered work, prioritizing actual missing cuts
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python apps/gallery-archive/run_full_public_acquisition.py \
            --model "$MODEL" --run-number "$RUN_NUMBER" \
            --stage "$STAGE/photos" \
            --source-evidence "$STAGE/source-evidence.json" \
            --batch-size 7 --max-per-batch 48 --bytes-per-batch 36000000 \
            --batch-timeout 420 --alternate-priority || status=$?
          # Code 4 means incomplete work, not a genuine collector success.
          # Preserve and publish *only* finalized SHA-pinned files first,
          # then fail the job at the final truthful status gate.
          echo "$status" > "$STAGE/collection-exit-code"
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then exit "$status"; fi
      - name: Replay exact staged SHA bytes onto latest main, then commit actual new photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python apps/gallery-archive/run_full_public_acquisition.py \
            --model "$MODEL" --run-number "$RUN_NUMBER" \
            --stage "$STAGE/photos" --replay-only
          # Persist only the unfinished work IDs, not another large audit.
          # This compact checkpoint is consumed by the next normal run.
          python apps/gallery-archive/run_full_public_acquisition.py \
            --model "$MODEL" --stage "$STAGE/photos" --checkpoint-only
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=Path(os.environ['STAGE'])/'photos/full-replay-summary.json'
          if result.is_file():
              x=json.loads(result.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('- '+x['model']+' new real photos: '+str(x['new_sha_verified_originals'])+
                            ', verified higher-quality replacements: '+
                            str(x['higher_visual_quality_replacements'])+'\\n')
          PY
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
          git add "apps/$MODEL-gallery/stored-albums.json" "apps/$MODEL-gallery/stored-albums/" "apps/$MODEL-gallery/album-covers.json" \
            "apps/gallery-archive/verification/incomplete-$MODEL.json"
          if git diff --cached --quiet; then
            echo "MODEL=$MODEL no new physical files or incomplete-work checkpoint changes" >> "$GITHUB_STEP_SUMMARY"
            echo "FULL_COLLECTION_NO_NEW_BYTES model=$MODEL"
            exit 0
          fi
          git commit -m "feat(gallery): publish $MODEL verified photos, quality upgrades and compact retry checkpoint"
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::New-photo exact-byte reconciliation conflict"
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "MODEL=$MODEL NEW_VERIFIED_SHA_COMMITTED=yes" >> "$GITHUB_STEP_SUMMARY"
              echo "FULL_COLLECTION_NEW_PHOTO_COMMIT model=$MODEL sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 3
          done
          backup="auto/gallery-photos-$MODEL-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$backup"
          gh pr create --base main --head "$backup" \
            --title "Gallery: newly verified $MODEL public image originals" \
            --body "SHA-verified new public-photo files, requiring Pages browser acceptance."
          echo "MODEL=$MODEL NEW_BYTES_STAGED_PR=yes" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve audit metadata, never bundle originals as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-full-public-${{ matrix.model }}-audit
          path: |
            /tmp/gallery-public-full/reverse-evidence.json
            /tmp/gallery-public-full/reverse-next.json
            /tmp/gallery-public-full/source-evidence.json
            /tmp/gallery-public-full/photos/full-collection-summary.json
            /tmp/gallery-public-full/photos/batch-*/metadata/collection-audit.json
            /tmp/gallery-public-full/photos/batch-*/metadata/pages-publication.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fail partial edition sweeps after preserving real files and evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(os.environ['STAGE'])/'photos/full-collection-summary.json'
          if not p.is_file():
              print('::error::FULL_COLLECTION_AUDIT_ABSENT')
              sys.exit(1)
          audit=json.loads(p.read_text())
          missing=audit.get('registered_work_ids_in_incomplete_batches',[])
          if missing or audit.get('collection_all_batches_success') is not True:
              print('::error::GALLERY_PARTIAL_EDITION_SWEEP model='+os.environ['MODEL']+
                    ' incomplete_works='+','.join(missing))
              sys.exit(1)
          print('GALLERY_ALL_REGISTERED_EDITION_BATCHES_FINISHED model='+os.environ['MODEL'])
          PY
  continue_until_exhausted:
    needs: [offline, collect]
    # An edition timeout can fail the truthful CI status gate while the
    # per-photo reverse checkpoint was durably committed. Continue that
    # bounded corpus search, but only if the controller sees actual progress.
    # Stop on invalid checkpoint, skipped collection, PR or unrelated ref.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.offline.result == 'success' && (needs.collect.result == 'success' || needs.collect.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN_STEP: ${{ inputs.campaign_step || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read both immutable checkpoints and decide if any SHA remains
        id: control
        shell: bash
        run: |
          set -euo pipefail
          for model in mimmi yui; do
            gh api "repos/$GITHUB_REPOSITORY/contents/apps/gallery-archive/verification/reverse-progress-$model.json?ref=gallery-reverse-progress-$model" \
              --jq '.content' | base64 -d > "$RUNNER_TEMP/$model-progress.json"
          done
          python apps/gallery-archive/exhaustive_campaign_controller.py \
            --mimmi "$RUNNER_TEMP/mimmi-progress.json" \
            --yui "$RUNNER_TEMP/yui-progress.json" \
            --step "$CAMPAIGN_STEP" --max-steps 64 \
            --github-output "$GITHUB_OUTPUT"
      - name: Dispatch immediate next batch, not wait 8 hours
        if: steps.control.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run gallery-full-missing-public-collection.yml \
            --ref main -f campaign_step="${{ steps.control.outputs.next_step }}"
          echo "GALLERY_FULL_REVERSE_NEXT_BATCH_DISPATCHED step=${{ steps.control.outputs.next_step }}"
      - name: Record exhausted corpus if no photo SHA remains
        if: steps.control.outputs.all_attempted == 'true'
        run: echo 'GALLERY_FULL_REVERSE_FIRST_PASS_ALL_SHA_ATTEMPTED=true' >> "$GITHUB_STEP_SUMMARY"
