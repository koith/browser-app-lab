name: Yui Public Sources To Private Original-Byte Archives
on:
  schedule:
    # Revisit all published public source-indexed photo positions daily; save real bytes only.
    - cron: '8 3 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/yui-gallery/collect_private_batch.py'
      - 'apps/yui-gallery/additional-source-albums.json'
      - 'apps/yui-gallery/test_collect_private_batch.py'
      - '.github/workflows/yui-private-bulk-archive.yml'
  pull_request:
    paths:
      - 'apps/yui-gallery/collect_private_batch.py'
      - 'apps/yui-gallery/additional-source-albums.json'
      - 'apps/yui-gallery/test_collect_private_batch.py'
      - '.github/workflows/yui-private-bulk-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yui-safe-private-original-byte-bulk
  cancel-in-progress: false
jobs:
  verify-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - run: |
          python -m py_compile apps/yui-gallery/collect_private_batch.py
          python apps/yui-gallery/test_collect_private_batch.py
  private-download:
    needs: verify-code
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: pixibb-large
            albums: maid291,last-summer192,tracksuit201
          - id: pixibb-other
            albums: blackroom145,pussylet41-82,dec2023-199,artgravia663-ai32
          - id: source-variety-one
            albums: thru-thru117,sweet-dream110,cream228,ramen125,heart-steal78
          - id: source-variety-two
            albums: seethrough80,yui-vol2-42,kuro-yui58,yui-vol3-106,wet-yui80,teddy-bear97
          - id: public-editorial
            albums: public-yui-sns,djawa-privaty-public-samples,acosta-japan-public-report,gamersky-public-editorial,inven-public-photos,crazygiant-yui-may2023-public,sportsseoul-crazy2020-public,crazygiant-player5-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Download unchanged physical bytes from normally accessible published source URLs
        run: |
          python apps/yui-gallery/collect_private_batch.py \
            --albums '${{ matrix.albums }}' \
            --out /tmp/yui-private-batch \
            --workers 2 \
            --timeout 14
      - name: Keep verified photos in private artifacts, never in public Pages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-original-verified-${{ matrix.id }}
          path: /tmp/yui-private-batch/
          retention-days: 30
          if-no-files-found: warn
