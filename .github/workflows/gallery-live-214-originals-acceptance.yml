name: Gallery Live 214 Existing Incident Originals Acceptance
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/qa_live_214_incident_originals.py'
      - 'apps/gallery-archive/qa_cloudflare_full_remote.py'
      - '.github/workflows/gallery-live-214-originals-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/qa_live_214_incident_originals.py'
      - '.github/workflows/gallery-live-214-originals-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only script syntax and recovery targets
        run: |
          python -m py_compile apps/gallery-archive/qa_live_214_incident_originals.py
          python - <<'PY'
          import ast
          from pathlib import Path
          paths=['apps/gallery-archive/qa_live_214_incident_originals.py',
                 'apps/gallery-archive/restore_known_owner_cache.py',
                 'apps/mimmi-gallery/cloud/gateway/main.py']
          names=['TARGET','TARGET','_INCIDENT_MEDIA']
          trees=[ast.parse(Path(p).read_text()) for p in paths]
          arrays=[]
          for tree,name in zip(trees,names):
            arrays.append(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id==name for x in n.targets)))
          assert arrays[0] == arrays[1] == arrays[2], '214 incident target lists drifted between gateway, rescue, QA'
          assert sum(n for pairs in arrays[0].values() for _,n in pairs)==214
          print('INCIDENT_214_TARGETS_STRICTLY_MATCH_RESCUE_AND_GATEWAY')
          PY
  actual-live-owner-originals:
    needs: compile-contract
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: real Cloudflare exact originals (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        model: [mimmi, yui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read 214 actual deployed Cloudflare signed originals and decode exact SHA
        run: |
          python -m pip install 'Pillow==11.3.0'
          python apps/gallery-archive/qa_live_214_incident_originals.py --model '${{ matrix.model }}'
          echo '${{ matrix.model }}: real Cloudflare original SHA/bytes/pixels PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOTE: This does not establish cold-restart durability or physical iPhone device testing.' >> "$GITHUB_STEP_SUMMARY"

  real-originals-release-gate:
    if: always() && github.event_name != 'pull_request'
    needs: [compile-contract, actual-live-owner-originals]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Never advertise success when actual live photo checks were skipped or failed
        env:
          COMPILE: ${{ needs.compile-contract.result }}
          LIVE: ${{ needs.actual-live-owner-originals.result }}
        run: |
          test "$COMPILE" = success
          test "$LIVE" = success
          echo 'BOTH_MODELS_LIVE_214_CLOUDFLARE_SHA_BYTES_PIXELS_ACCEPTANCE_PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only after this real owner readback may mobile screenshot UI QA run.' >> "$GITHUB_STEP_SUMMARY"
