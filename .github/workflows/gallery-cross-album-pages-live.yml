name: Gallery Cross-Album Exact SHA Real Pages Regression
on:
  pull_request:
    paths:
      - 'apps/mimmi-gallery/index.html'
      - 'apps/yui-gallery/index.html'
      - 'apps/mimmi-gallery/saved-photo-union.js'
      - 'apps/yui-gallery/saved-photo-union.js'
      - 'apps/mimmi-gallery/album-grouping.js'
      - 'apps/gallery-archive/test_cross_album_static_copy.cjs'
      - 'apps/gallery-archive/qa_cross_album_pages_live.py'
      - '.github/workflows/gallery-cross-album-pages-live.yml'
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-cross-album-${{ github.event_name }}-${{ github.ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true
jobs:
  corpus-same-sha-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Full existing-owner SHA crosscheck without external downloads
        run: |
          node --check apps/mimmi-gallery/saved-photo-union.js
          node --check apps/yui-gallery/saved-photo-union.js
          node --test apps/gallery-archive/test_cross_album_static_copy.cjs
      - name: Validate both gallery inline scripts syntax
        run: |
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          for model in ('mimmi','yui'):
              html=Path(f'apps/{model}-gallery/index.html').read_text()
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)):
                  if not script.strip():continue
                  p=subprocess.run(['node','--check','-'],input=script,text=True,capture_output=True)
                  if p.returncode:raise SystemExit(f'{model} inline script {i}: {p.stderr}')
          print('BOTH_GALLERY_INLINE_JS_SYNTAX_PASS')
          PY
  real-pages-browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: corpus-same-sha-contract
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Real Pages photo bytes / decode / lightbox by actual viewer UI
        env:
          CANDIDATE_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          flags=()
          if [ "$CANDIDATE_MODE" = 1 ]; then flags+=(--candidate-html); fi
          python apps/gallery-archive/qa_cross_album_pages_live.py --browser '${{ matrix.browser }}' "${flags[@]}"
