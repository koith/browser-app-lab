name: Mimmi Missing SHA Public Photos To Private ZIP Archive
on:
  workflow_run:
    workflows:
      - "Mimmi Multi-Page Public Photo Crawl"
      - "Mimmi V2PH Actor Wide Discovery"
      - "Mimmi Secondary CreamSoda Public Gallery Crawl"
      - "Mimmi Free Official Portfolio Discovery"
      - "Mimmi Official Social Public Photo Discovery"
      - "Mimmi Free V2PH Public Gallery Photo Discovery"
      - "Mimmi DJAWA Public Promotional Image Search"
    types: [completed]
  schedule:
    # Daily actual missing-photo byte sweep even if research index is unchanged.
    - cron: '36 3,15 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/mimmi-gallery/archive_private_missing.py'
      - 'apps/mimmi-gallery/missing_candidates.py'
      - 'apps/mimmi-gallery/source-viewer-albums.json'
      - 'apps/mimmi-gallery/private-archive-checkpoint.json'
      - 'apps/mimmi-gallery/test_archive_private_missing.py'
      - 'apps/yui-gallery/collect_private_batch.py'
      - '.github/workflows/mimmi-private-missing-archive.yml'
  pull_request:
    paths:
      - 'apps/mimmi-gallery/archive_private_missing.py'
      - 'apps/mimmi-gallery/missing_candidates.py'
      - 'apps/mimmi-gallery/source-viewer-albums.json'
      - 'apps/mimmi-gallery/private-archive-checkpoint.json'
      - 'apps/mimmi-gallery/test_archive_private_missing.py'
      - 'apps/yui-gallery/collect_private_batch.py'
      - '.github/workflows/mimmi-private-missing-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mimmi-private-unsaved-verified-photos
  cancel-in-progress: false
jobs:
  code-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - run: |
          python -m py_compile apps/mimmi-gallery/archive_private_missing.py
          python apps/mimmi-gallery/test_archive_private_missing.py
          python apps/mimmi-gallery/test_missing_candidates.py
          python apps/mimmi-gallery/archive_private_missing.py --dry-run --batch 0 --batches 3
  save-new-photos-private:
    needs: code-qa
    if: |
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [0,1,2]
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.MIMMI_TERABOX_NDUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Read current private TeraBox numbered slots to exclude already saved originals
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE"
          echo "::add-mask::$RCLONE_CONFIG_ARCHIVE_COOKIE"
          curl -fsSL 'https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip' -o "$RUNNER_TEMP/client.zip"
          echo "78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  $RUNNER_TEMP/client.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/client.zip" -d "$RUNNER_TEMP/unpack"
          binary="$(find "$RUNNER_TEMP/unpack" -type f -name rclone -print -quit)"
          install -m 755 "$binary" "$RUNNER_TEMP/bin/rclone"
          "$RUNNER_TEMP/bin/rclone" cat 'archive:MimmiArchive/metadata/catalog.json' \
            --timeout 50s --retries 2 > "$RUNNER_TEMP/mimmi-live-catalog.json" \
            2> "$RUNNER_TEMP/terabox-reader-errors.txt"
          python - <<'PY'
          from pathlib import Path
          import json, os, sys
          sys.path.insert(0, 'apps/mimmi-gallery')
          from missing_candidates import owner_catalog_positions
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"mimmi-live-catalog.json").read_text())
          print("MIMMI_LIVE_OWNER_SAVED_POSITIONS",len(owner_catalog_positions(data)))
          PY
      - name: Save only previously missing, unchanged SHA-256 image bytes into private ZIPs
        run: |
          python apps/mimmi-gallery/archive_private_missing.py \
            --batch ${{ matrix.batch }} \
            --batches 3 \
            --out /tmp/mimmi-private-batch \
            --workers 2 \
            --owner-catalog "$RUNNER_TEMP/mimmi-live-catalog.json"
      - name: Report unresolved photo failures without exposing personal media URLs
        shell: bash
        run: |
          python - <<'PY'
          import json, collections, os
          from pathlib import Path
          audit=json.loads(Path('/tmp/mimmi-private-batch/audit.json').read_text())
          reasons=collections.Counter()
          albums=[]
          for album in audit['albums']:
              failed=album.get('failed',[])
              for item in failed:
                  reason=str(item.get('reason') or 'unknown').lower()
                  if reason.startswith('http_'):
                      category=reason.split()[0].split(':')[0][:30]
                  elif 'sha256_or_byte_length_mismatch' in reason:
                      category='changed_bytes_vs_index'
                  elif 'timeout' in reason or 'timed out' in reason:
                      category='source_timeout'
                  elif 'ssl' in reason or 'connection' in reason:
                      category='source_connection'
                  elif 'origin_451' in reason:
                      category='restricted_origin_451'
                  elif 'unapproved' in reason:
                      category='unapproved_origin'
                  else:
                      category='other_unavailable'
                  reasons[category]+=1
              albums.append({'album':album['album'],
                             'saved':album['physically_saved'],'rejected':len(failed)})
          result={'physically_saved':audit['physically_downloaded'],
                  'rejected':audit['missing_or_rejected'],
                  'rejection_causes':dict(reasons.most_common()),
                  'albums':albums}
          print('MIMMI_FAILED_GAP_DIAGNOSTICS',json.dumps(result,ensure_ascii=False),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### Mimmi actual photo gap download audit\\n')
              out.write('New downloaded real photos: '+str(result['physically_saved'])+'\\n')
              out.write('Remaining inaccessible/changed candidates: '+str(result['rejected'])+'\\n')
              for key,count in reasons.most_common():
                  out.write('- '+key+': '+str(count)+'\\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mimmi-original-new-private-${{ matrix.batch }}
          path: /tmp/mimmi-private-batch/
          retention-days: 30
          if-no-files-found: warn
