name: Yui Public Mirror Verified MP4 Archive
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/yui_public_mirror_video_archive.py'
      - 'apps/gallery-archive/test_yui_public_mirror_video_archive.py'
      - 'apps/yui-gallery/videos.json'
      - 'apps/yui-gallery/videos.html'
      - 'apps/gallery-archive/test_video_gallery.cjs'
      - 'apps/gallery-archive/qa_video_gallery.py'
      - '.github/workflows/gallery-yui-mirror-video.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/yui_public_mirror_video_archive.py'
      - '.github/workflows/gallery-yui-mirror-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-yui-mirror-video-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          node apps/gallery-archive/test_video_gallery.cjs
          python -m py_compile apps/gallery-archive/yui_public_mirror_video_archive.py
          python apps/gallery-archive/test_yui_public_mirror_video_archive.py
  real-video-import:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5'
      - name: Ensure complete MP4 stream can be verified before archive
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Download only exact publicly observed mirror videos, respect robots and validate ffprobe
        run: |
          python apps/gallery-archive/yui_public_mirror_video_archive.py \
            --max-files 6 --report "$RUNNER_TEMP/yui-mirror-video-report.json"
      - name: Commit actual SHA-verified MP4 bytes and manifest only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yui-gallery/videos.json
          if [[ -d apps/yui-gallery/stored-videos ]]; then
            git add apps/yui-gallery/stored-videos/
          fi
          if git diff --cached --quiet; then
            echo "YUI_MIRROR_MP4_NEW_ARCHIVED_FILES=0"
            exit 0
          fi
          git commit -m "feat(gallery): archive SHA ffprobe verified Yui public mirror MP4"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::YUI_VIDEO_REBASE_CONFLICT"
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "YUI_MIRROR_MP4_ARCHIVED_MAIN sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::YUI_VIDEO_COMMIT_FAILED"
          exit 1
      - name: Preserve only audit JSON, not MP4 in CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yui-mirror-video-audit
          path: ${{ runner.temp }}/yui-mirror-video-report.json
          retention-days: 7
          if-no-files-found: ignore
