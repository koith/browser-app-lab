name: Gallery Private Durable Owner Mirror Offline QA
on:
  pull_request:
    paths:
      - 'apps/gallery-archive/backfill_private_owner_replica.py'
      - 'apps/gallery-archive/test_private_durable_owner_backfill.py'
      - 'apps/gallery-archive/private_mirror_free_policy.py'
      - 'apps/gallery-archive/test_private_mirror_free_policy.py'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/test_owner_durable_s3_mirror.py'
      - '.github/workflows/gallery-optin-private-b2-owner-mirror.yml'
      - '.github/workflows/gallery-private-durable-owner-offline-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/backfill_private_owner_replica.py'
      - 'apps/gallery-archive/test_private_durable_owner_backfill.py'
      - 'apps/gallery-archive/private_mirror_free_policy.py'
      - 'apps/gallery-archive/test_private_mirror_free_policy.py'
      - 'apps/mimmi-gallery/cloud/gateway/main.py'
      - 'apps/mimmi-gallery/cloud/test_owner_durable_s3_mirror.py'
      - '.github/workflows/gallery-optin-private-b2-owner-mirror.yml'
      - '.github/workflows/gallery-private-durable-owner-offline-qa.yml'
permissions:
  contents: read
jobs:
  offline-private-no-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local test dependencies only
        run: python -m pip install -r apps/mimmi-gallery/cloud/gateway/requirements.txt 'boto3==1.40.70'
      - name: Syntax and private mirror append-only safety
        run: |
          python -m py_compile apps/gallery-archive/backfill_private_owner_replica.py apps/gallery-archive/test_private_durable_owner_backfill.py apps/gallery-archive/private_mirror_free_policy.py apps/gallery-archive/test_private_mirror_free_policy.py
          python apps/gallery-archive/test_private_durable_owner_backfill.py
          python apps/gallery-archive/test_private_mirror_free_policy.py
          python apps/mimmi-gallery/cloud/test_owner_durable_s3_mirror.py
          echo 'Synthetic private SHA/ACL/no-overwrite contract passed; no owner source bytes copied.' >> "$GITHUB_STEP_SUMMARY"
