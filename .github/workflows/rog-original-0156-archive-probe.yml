name: 4LEAF archived 2002 installer source census (CHR 0156)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rog-original-0156-archive-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve official 2002 v0.96d ZIP from public preservation mirrors
        run: |
          mkdir -p /tmp/4leaf-origin
          ok=0
          for url in \
            'https://archive.org/download/4leaf/4leaf.zip' \
            'https://ia801607.us.archive.org/34/items/4leaf/4leaf.zip' \
            'https://ia601607.us.archive.org/34/items/4leaf/4leaf.zip'; do
            echo "CHECK_ARCHIVE_HOST ${url%%/34/*}"
            if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 160 \
              --silent --show-error "$url" -o /tmp/4leaf-origin/4leaf.zip; then
              size=$(wc -c </tmp/4leaf-origin/4leaf.zip)
              digest=$(sha1sum /tmp/4leaf-origin/4leaf.zip | awk '{print $1}')
              echo "OBSERVED_ARCHIVE_SIZE=$size SHA1=$digest"
              if [ "$size" = "64537476" ] && [ "$digest" = "86526d89679ae39b85fe9808da97ad871b7888d9" ]; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::All archive mirrors failed exact size/SHA1 validation. No original data was recovered."
            exit 1
          fi
      - name: Examine all 25 archive entries and nested installer formats without executing software
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib, json, re
          from pathlib import Path
          src=Path('/tmp/4leaf-origin/4leaf.zip')
          assert src.stat().st_size==64537476
          assert hashlib.sha1(src.read_bytes()).hexdigest()=='86526d89679ae39b85fe9808da97ad871b7888d9'
          with ZipFile(src) as z:
            records=[{'name':f.filename,'size':f.file_size,'compressed':f.compress_size}
                     for f in z.infolist() if not f.is_dir()]
            print('OFFICIAL_2002_ORIGINAL_ZIP_FILES',len(records))
            for row in records: print('ORIGINAL_ENTRY',row['name'],row['size'])
            pak=[r for r in records if re.search(r'(?i)(obs2?\.pak|\.obs)$',r['name'])]
            print('DIRECT_ORIGINAL_OBS_MEMBERS',pak)
            executables=[r for r in records if r['name'].lower().endswith(('.exe','.msi','.cab','.bin'))]
            print('NESTED_INSTALLER_CANDIDATES',executables)
            report={
              'archive':'https://archive.org/details/4leaf',
              'release':'2002-07-16 v0.96d',
              'source_zip_sha1':'86526d89679ae39b85fe9808da97ad871b7888d9',
              'source_zip_size':64537476,'entries':records,
              'direct_obs_entries':pak,'nested_installers':executables,
              'chr_0156_original_obs2_1222':'UNVERIFIED_NO_FABRICATED_RECOVERY'
            }
            Path('4leaf-original-0156-installer-census.json').write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          PY
          if command -v 7z >/dev/null; then
            7z l -slt /tmp/4leaf-origin/4leaf.zip > /tmp/4leaf-origin/sevenzip-list.txt
            echo '7ZIP_INSTALLED=true'
            sed -n '1,110p' /tmp/4leaf-origin/sevenzip-list.txt
          else
            echo '7ZIP_INSTALLED=false; zipfile inspection completed'
          fi
      - name: Inspect nested InstallShield data1.cab and extracted resource filenames
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          root=Path('/tmp/4leaf-origin')
          with ZipFile(root/'4leaf.zip') as source:
            for name in ('data1.cab','data1.hdr'):
              (root/name).write_bytes(source.read(name))
          cab=root/'data1.cab'
          assert cab.stat().st_size==63103324
          print('INSTALLSHIELD_CAB_SHA256',hashlib.sha256(cab.read_bytes()).hexdigest())
          PY
          echo 'TRY_NATIVE_7ZIP_CAB_LIST'
          7z l -slt /tmp/4leaf-origin/data1.cab > /tmp/4leaf-origin/7zip-data1-list.txt 2>&1 || true
          grep -Ei 'OBS2?\.PAK|1222\.OBS|Path = |Errors:|Error:' /tmp/4leaf-origin/7zip-data1-list.txt | head -n 65 || true
          if ! command -v unshield >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq unshield
          fi
          echo 'TRY_UNSHIELD_INSTALLSHIELD_LIST'
          if unshield l /tmp/4leaf-origin/data1.cab > /tmp/4leaf-origin/unshield-list.txt 2>&1; then
            echo 'UNSHIELD_LIST_SUCCESS'
            grep -Ei 'OBS2?\.PAK|1222\.OBS|[.]PAK' /tmp/4leaf-origin/unshield-list.txt | head -n 70 || true
            mkdir -p /tmp/4leaf-origin/extracted
            timeout 180 unshield x -d /tmp/4leaf-origin/extracted /tmp/4leaf-origin/data1.cab \
              > /tmp/4leaf-origin/unshield-extract.txt 2>&1 || true
            find /tmp/4leaf-origin/extracted -type f \( -iname '*obs*' -o -iname '*dice*' \) \
              | head -n 85 || true
          else
            echo 'UNSHIELD_UNSUPPORTED_CAB_HEADER; alternate decoder still needed'
            head -n 35 /tmp/4leaf-origin/unshield-list.txt || true
          fi
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('/tmp/4leaf-origin')
          report_path=Path('4leaf-original-0156-installer-census.json')
          report=json.loads(report_path.read_text())
          reports=[]
          for name in ('7zip-data1-list.txt','unshield-list.txt','unshield-extract.txt'):
            p=root/name
            if not p.exists():continue
            data=p.read_text(errors='replace')
            matches=[line for line in data.splitlines() if re.search(r'(?i)obs2?\.pak|1222\.obs',line)]
            reports.append({'file':name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'lines':len(data.splitlines()),'obs_candidates':matches[:100]})
            print('INSTALLSHIELD_INTERNAL_OBS_EVIDENCE',name, matches[:25])
          paths=list((root/'extracted').rglob('*')) if (root/'extracted').exists() else []
          extracted=[]
          for path in paths:
            if path.is_file() and ('obs' in path.name.lower() or 'dice' in path.name.lower()):
              relative=str(path.relative_to(root/'extracted'))
              extracted.append({'path':relative,'size':path.stat().st_size,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          report['cab_inspection']=reports
          report['extracted_candidate_hashes_only']=extracted[:100]
          report['chr_0156_original_obs2_1222']='UNVERIFIED_UNTIL_ARCHIVED_ORIGINAL_OBS_MEMBER_IS_IDENTIFIED'
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('NESTED_INSTALLER_ORIGINAL_PAK_CANDIDATES',len(extracted))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fourleaf-0156-original-installer-metadata-only
          path: 4leaf-original-0156-installer-census.json
          if-no-files-found: ignore
          retention-days: 14
