name: Yui Known Missing 18 Photo Slots Physical Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yui-known-missing-18-recovery.yml'
  schedule:
    # Retry public published image bytes, twice daily. No 451 bypass/paywall use.
    - cron: '3 2,14 * * *'
permissions:
  contents: read
concurrency:
  group: yui-private-known-18-slot-capture
  cancel-in-progress: false
jobs:
  known-gap-photos-to-private-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 62
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: teddy-bear97
            albums: teddy-bear97
          - id: wet-yui80
            albums: wet-yui80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install physical photo integrity verifier
        run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Verify known missing photo numbers before physical source capture
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('apps/yui-gallery')
          a=json.loads((base/'additional-source-albums.json').read_text())
          indexed={x['id']:x for x in a['albums']}
          for album, missing in [('teddy-bear97',[26,27,28,35,36,37,38,40,64,72,73,80,84,91,95,96,97]),('wet-yui80',[2])]:
              assert album in indexed,album
              positions={x['number'] for x in indexed[album]['images']}
              print('KNOWN_MISSING_PUBLIC_SLOT_RECORDS',album,'/',len(set(missing)&positions),
                    'of',len(missing),'listed. This is NOT saved-file count.')
          PY
      - name: Save actually accessible matching public image bytes into private ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python apps/yui-gallery/collect_private_batch.py \
            --albums '${{ matrix.albums }}' \
            --out /tmp/known-gaps \
            --workers 3 --timeout 13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-original-verified-known-gaps-${{ matrix.id }}
          path: /tmp/known-gaps/
          retention-days: 30
          if-no-files-found: warn
