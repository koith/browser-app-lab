name: Mimmi Latest Beta18 Archive Data Integrity and Index
on:
  workflow_dispatch:
  push:
    paths:
      - apps/mimmi-gallery/build_model_gallery.py
      - apps/mimmi-gallery/official-previews.json
      - apps/mimmi-gallery/v2ph-public-previews.json
      - apps/mimmi-gallery/v2ph-actor-previews.json
      - apps/mimmi-gallery/pixibb-public-previews.json
      - apps/mimmi-gallery/social-public-previews.json
      - apps/mimmi-gallery/research-preview-links.json
      - .github/workflows/mimmi-gallery-beta18-index.yml
permissions:
  contents: write
concurrency:
  group: mimmi-source-index-writer-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  indexed-photo-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate complete catalog from verified source image evidence
        run: |
          python -m py_compile apps/mimmi-gallery/build_model_gallery.py
          python apps/mimmi-gallery/build_model_gallery.py
          python - <<'PY'
          import json,re
          from urllib.parse import urlsplit
          from pathlib import Path
          root=Path("apps/mimmi-gallery")
          d=json.loads((root/"source-viewer-albums.json").read_text())
          assert d["model"]=="mimmi" and d["version"]=="v0.1.0-mimmi.8"
          assert d["summary"]["verified_unique_source_images"]>=390,d["summary"]
          assert len(d["albums"])>=30
          catalog=json.loads((root/"albums.json").read_text())
          assert sum(a["id"].startswith("research-no-") for a in catalog["albums"])==52
          assert d["fully_acquired_paid_photobooks"]==0
          assert d["private_cloud_archived_image_files"]==0
          seen=set()
          for a in d["albums"]:
            assert a["images"] and a["sourceHosted"] and a["id"]
            assert a["completeness"] in ("partial_public_previews","advertised_public_sequence_verified")
            for p in a["images"]:
              assert p["sha256"] not in seen
              seen.add(p["sha256"])
              parsed=urlsplit(p["url"])
              h=parsed.hostname or ""
              safe=(h=="cdn.v2ph.com" and parsed.path.startswith("/photos/")) or (h in ("djawaphoto.com","www.djawaphoto.com") and parsed.path.startswith("/wp-content/uploads/")) or (h in ("public-files.gumroad.com","assets.gumroad.com","static-2.gumroad.com") and parsed.path.startswith("/")) or (h=="pbs.twimg.com" and parsed.path.startswith("/media/")) or (h=="cosplay.pixibb.com" and parsed.path.startswith("/wp-content/uploads/")) or bool(re.fullmatch(r"(?:imgx[0-9]{2,4}|images[0-9]{1,4}|cdn|img|files)\\.pixibb\\.com",h))
              assert parsed.scheme=="https" and safe and not parsed.username and not parsed.password,p["url"]
          print("MIMMI_BETA18_DEDUP_SOURCE_IMAGES_PASS",len(d["albums"]),len(seen))
          PY
      - name: Commit gallery data on main only, no feature-branch cross-run conflicts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mimmi-gallery/albums.json apps/mimmi-gallery/source-viewer-albums.json
          if ! git diff --cached --quiet; then
            git commit -m "Index Mimmi verified image albums using latest beta18 gallery schema"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
