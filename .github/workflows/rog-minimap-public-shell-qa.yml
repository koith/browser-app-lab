name: 4LEAF real public HTML and original DMP minimap bootstrap QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/tests/dice-native-minimap-navigation.cjs'
      - '.github/workflows/rog-minimap-public-shell-qa.yml'
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmp-minimap-html:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve true DMP game for PR
        if: github.event_name != 'workflow_run'
        run: |
          nohup python3 -m http.server 8765 --directory apps/4leaf/rog >/tmp/leaf-minimap-html.log 2>&1 &
          for i in 1 2 3 4 5 6 7; do
            if curl -fSsI http://127.0.0.1:8765/index.html >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-minimap-html.log
          exit 1
      - name: Verify original DMP camera pointer, keyboard and real Pages HTML bootstrap
        env:
          FOURLEAF_TEST_URL: ${{ github.event_name == 'workflow_run' && 'https://koith.github.io/browser-app-lab/apps/4leaf/rog/' || 'http://127.0.0.1:8765/' }}
        run: node apps/4leaf/rog/tests/dice-native-minimap-navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-dmp-minimap-shell-${{ github.event_name }}
          path: leaf-*.png
          retention-days: 14
