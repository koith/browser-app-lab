name: Gallery Crawl Reliability and SHA Reuse QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/commit_crawler_research.py'
      - 'apps/gallery-archive/test_commit_crawler_research.py'
      - 'apps/mimmi-gallery/collect_pixibb_public.py'
      - 'apps/mimmi-gallery/test_pixibb_public.py'
      - 'apps/mimmi-gallery/collect_xiutu_public.py'
      - 'apps/mimmi-gallery/test_xiutu_public.py'
      - '.github/workflows/gallery-crawler-efficiency-qa.yml'
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install parser dependencies; do not open any external photo sites in tests
        run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0' 'beautifulsoup4==4.14.2'
      - name: Compile both crawlers, safe merger, and regression tests
        run: |
          python -m py_compile \
            apps/gallery-archive/commit_crawler_research.py \
            apps/gallery-archive/test_commit_crawler_research.py \
            apps/mimmi-gallery/collect_pixibb_public.py \
            apps/mimmi-gallery/collect_xiutu_public.py
      - name: Verify git conflict recovery and both HTML-only crawling adapters
        run: |
          python apps/gallery-archive/test_commit_crawler_research.py
          python apps/mimmi-gallery/test_pixibb_public.py
          python apps/mimmi-gallery/test_xiutu_public.py
      - name: Mark code validated; physical photo counts require independent TeraBox and deployed browser QA
        run: |
          echo 'PASS: two crawlers avoid re-reading previous SHA-verified bytes; retryable evidence merge retains source results' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not certify newly stored original image files.' >> "$GITHUB_STEP_SUMMARY"
