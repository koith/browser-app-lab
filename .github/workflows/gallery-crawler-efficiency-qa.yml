name: Gallery Crawl Reliability and SHA Reuse QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/gallery-archive/commit_crawler_research.py'
      - 'apps/gallery-archive/public_crawl_transport.py'
      - 'apps/gallery-archive/test_public_crawl_transport.py'
      - 'apps/gallery-archive/test_commit_crawler_research.py'
      - 'apps/mimmi-gallery/collect_pixibb_public.py'
      - 'apps/mimmi-gallery/test_pixibb_public.py'
      - 'apps/mimmi-gallery/collect_xiutu_public.py'
      - 'apps/mimmi-gallery/test_xiutu_public.py'
      - '.github/workflows/gallery-crawler-efficiency-qa.yml'
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/mimmi-gallery
            apps/gallery-archive
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install parser dependencies; do not open any external photo sites in tests
        run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0' 'beautifulsoup4==4.14.2'
      - name: Compile both crawlers, safe merger, and regression tests
        run: |
          python -m py_compile \
            apps/gallery-archive/commit_crawler_research.py \
            apps/gallery-archive/public_crawl_transport.py \
            apps/gallery-archive/test_public_crawl_transport.py \
            apps/gallery-archive/test_commit_crawler_research.py \
            apps/mimmi-gallery/collect_pixibb_public.py \
            apps/mimmi-gallery/collect_xiutu_public.py
      - name: Verify git conflict recovery and both HTML-only crawling adapters
        run: |
          python apps/gallery-archive/test_commit_crawler_research.py
          python apps/gallery-archive/test_public_crawl_transport.py
          python apps/mimmi-gallery/test_pixibb_public.py
          python apps/mimmi-gallery/test_xiutu_public.py
      - name: Estimate real redundant HTTP GETs avoided from the verified source catalogs
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          root=Path("apps/mimmi-gallery")
          sys.path.insert(0,str(root.resolve()))
          from collect_pixibb_public import cached_verified_photo
          from collect_xiutu_public import previous_verified_photo
          for name,fn in (("PixiBB",cached_verified_photo),("CreamSoda",previous_verified_photo)):
              file=root/("pixibb-public-previews.json" if name=="PixiBB" else "xiutu-public-previews.json")
              d=json.loads(file.read_text(encoding="utf-8"))
              samples=[p for a in d["albums"] for p in a.get("samples",[])]
              reusable=sum(fn(p["url"],p) is not None for p in samples)
              measured=round(reusable/max(1,len(samples))*100,1)
              print("SHA_CACHE_BENCHMARK",name,"previously_checked",len(samples),
                    "reusable_without_image_GET",reusable,"percent",measured)
              assert len(samples)>20 and reusable/len(samples)>0.8
          PY
      - name: Mark code validated; physical photo counts require independent TeraBox and deployed browser QA
        run: |
          echo 'PASS: two crawlers avoid re-reading previous SHA-verified bytes; retryable evidence merge retains source results; transient retry policy respects 403/451' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not certify newly stored original image files.' >> "$GITHUB_STEP_SUMMARY"
