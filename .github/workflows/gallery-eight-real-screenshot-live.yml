name: Gallery Eight Real Albums and 99 Screenshot Tiles Mobile Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-eight-real-screenshot-live.yml'
      - 'apps/gallery-archive/qa_cloudflare_pages_browser.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-eight-real-screenshot-live.yml'
      - 'apps/gallery-archive/qa_cloudflare_pages_browser.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-eight-real-screenshot-qa
  cancel-in-progress: false
jobs:
  mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native mobile WebKit and image decoder
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps webkit
      - name: Check actual deployed 8 albums and 99 screenshot tiles natively
        shell: bash
        run: |
          # PR source is not published yet. Use checked-out candidate JS
          # on the real Pages origin, while Worker originals stay live.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --all-p0 --browser webkit
          else
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --all-p0 --browser webkit
          fi
  desktop-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native Chromium and image decoder
        run: |
          python -m pip install --quiet 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Check actual deployed 8 albums and 99 screenshot tiles natively
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --all-p0 --browser chromium
          else
            python apps/gallery-archive/qa_cloudflare_pages_browser.py --deployed --all-p0 --browser chromium
          fi
