name: Yui Gallery Browser Smoke
on:
  push:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate primary photo gallery source
        run: |
          node --check apps/yui-gallery/gallery.js
          node --check apps/yui-gallery/gallery-import.js
          node --check apps/yui-gallery/test_photo_gallery.cjs
      - name: Install mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2 jszip@3.10.1
          npx playwright install chromium
      - name: Validate image-first gallery and full-screen photo navigation
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-web.log 2>&1 &
          node apps/yui-gallery/test_photo_gallery.cjs
