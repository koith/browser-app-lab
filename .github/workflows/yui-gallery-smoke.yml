name: Yui Gallery Browser Smoke
on:
  push:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('apps/yui-gallery/index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1)throw Error('Expected exactly one application script');
          new vm.Script(scripts[0][1]);
          const feed=JSON.parse(fs.readFileSync('apps/yui-gallery/feed.json'));
          const albums=JSON.parse(fs.readFileSync('apps/yui-gallery/albums.json'));
          if(!feed.images.length||!albums.albums.length)throw Error('Empty gallery');
          console.log('PASS: JS syntax, photo links',feed.images.length,'albums',albums.albums.length);
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test browser loading
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://koith.github.io/browser-app-lab/apps/yui-gallery/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#total')?.textContent?.includes('공개 SNS 사진'),{timeout:20000});
            const imgs=await page.locator('#media img').count();
            if(imgs<10)throw Error('Insufficient image cards: '+imgs);
            await page.waitForTimeout(2400);
            const loaded=await page.locator('#media img').evaluateAll(a=>a.filter(img=>img.complete&&img.naturalWidth>0).length);
            if(loaded<2)throw Error('Image elements exist but image bytes did not load; loaded='+loaded);
            await page.locator('#media img').first().click();
            if(!(await page.locator('#lightbox').evaluate(e=>e.classList.contains('show'))))throw Error('Full-size image overlay did not open');
            await page.locator('#close').click();
            await page.screenshot({path:'gallery-mobile-photos.png',fullPage:true});
            const newest=await page.evaluate(()=>photos[0]?.date);
            await page.selectOption('#mediaSort','date-asc');
            const oldest=await page.evaluate(()=>photos[0]?.date);
            if(!newest||!oldest||Date.parse(oldest)>=Date.parse(newest))throw Error('Photo date sort failed: '+newest+' / '+oldest);
            await page.selectOption('#mediaSort','name-asc');
            const imageNames=await page.evaluate(()=>photos.map(x=>x.name||x.caption||''));
            if(imageNames.length<2||imageNames[0].localeCompare(imageNames.at(-1),'ko',{numeric:true})>0)throw Error('Photo name sort failed');
            await page.selectOption('#mediaSort','date-desc');
            const imageDownload=await page.evaluate(async()=>{try{const r=await fetch(cdn(photos[0].url,'orig'),{mode:'cors'});return {ok:r.ok,status:r.status,type:r.headers.get('content-type')}}catch(e){return {ok:false,error:String(e)}}});
            console.log('PUBLIC_IMAGE_DOWNLOAD_CHECK',JSON.stringify(imageDownload));
            await page.locator('[data-view="albums"]').click();
            await page.waitForTimeout(500);
            const albums=await page.locator('.album').count();
            if(albums<50)throw Error('Insufficient albums: '+albums);
            await page.selectOption('#albumSort','name-asc');
            const names=await page.locator('.album strong').allTextContents();
            if(names.length<50 || names.some((x,i)=>i>0 && names[i-1].localeCompare(x,'ko',{numeric:true,sensitivity:'base'})>0))throw Error('Album name ascending sort failed');
            await page.selectOption('#albumSort','date-desc');
            const albumFirstDate=await page.locator('.album .when').first().textContent();
            if(!albumFirstDate.includes('2026'))throw Error('Album newest-first date sort failed: '+albumFirstDate);
            await page.selectOption('#albumSort','date-asc');
            const albumOldestDate=await page.locator('.album .when').first().textContent();
            if(!albumOldestDate.includes('2025'))throw Error('Album oldest-first date sort failed: '+albumOldestDate);
            if(errors.length)throw Error('Browser errors: '+errors.join('; '));
            console.log(JSON.stringify({passed:true,imgs,loaded,albums,newest,oldest,albumFirstDate,albumOldestDate,errors}));
            await page.screenshot({path:'gallery-mobile.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-mobile-smoke
          path: |
            gallery-mobile.png
            gallery-mobile-photos.png
          if-no-files-found: ignore
