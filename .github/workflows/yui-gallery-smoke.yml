name: Yui Gallery Browser Smoke
on:
  push:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physically stored photos and application syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm'),crypto=require('crypto');
          const root='apps/yui-gallery/';
          const html=fs.readFileSync(root+'index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!js)throw Error('No app JS');
          new vm.Script(js[1]);
          const db=JSON.parse(fs.readFileSync(root+'stored-albums.json'));
          let n=0;
          for(const album of db.albums){
            for(const x of album.images){
              const data=fs.readFileSync(root+x.url);
              const hash=crypto.createHash('sha256').update(data).digest('hex');
              if(hash!==x.sha256||data.length!==x.bytes)throw Error('Storage integrity '+x.url);
              n++;
            }
          }
          if(n<10)throw Error('Insufficient stored photos '+n);
          console.log('VERIFIED_STORED_PHOTOS',n, 'ALBUMS',db.albums.length);
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test real stored photobooks in mobile browser
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-web.log 2>&1 &
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},acceptDownloads:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#total')?.textContent?.includes('실제 저장'),{timeout:20000});
            const tab=await page.locator('.tab.active').textContent();
            if(!tab.includes('화보'))throw Error('Album not primary '+tab);
            const cards=await page.locator('.album').count();
            if(cards<1)throw Error('Named stored photobook missing '+cards);
            const summary=await page.locator('.album').first().innerText();
            if(!summary.includes('87장 미확보'))throw Error('Wrong archive completeness count: '+summary);
            const saved=await page.locator('.album-cover').count();
            if(saved<1)throw Error('Named album physical cover missing '+saved);
            const cover=await page.locator('.album-cover').first().evaluate(i=>({complete:i.complete,w:i.naturalWidth,h:i.naturalHeight}));
            if(!cover.w)throw Error('Album cover image bytes not loaded');
            await page.locator('.open-album:not([disabled])').first().click();
            await page.waitForTimeout(500);
            const imgs=await page.locator('#media img').count();
            if(imgs<1)throw Error('No actual stored files in album');
            if(imgs<10)throw Error('Expected ten actual first-page album files, got '+imgs);
            const test=await page.locator('#media img').first().evaluate(i=>({src:i.currentSrc,w:i.naturalWidth}));
            if(!test.src.includes('/stored-albums/')||!test.w)throw Error('Album image not served from physical storage '+JSON.stringify(test));
            await page.locator('#media img').first().click();
            const full=await page.locator('#big').evaluate(i=>({w:i.naturalWidth,src:i.src}));
            await page.waitForFunction(()=>document.querySelector('#big').naturalWidth>0,{timeout:8000});
            await page.locator('#saveOne').click();
            await page.screenshot({path:'yui-album-mobile.png',fullPage:false});
            await page.locator('#close').click();
            await page.locator('[data-view="albums"]').click();
            await page.locator('#includeUnassigned').check();
            await page.waitForTimeout(300);
            if((await page.locator('.album-cover').count())<7)throw Error('Other source preview files not accessible');
            await page.locator('#includeUnassigned').uncheck();
            await page.selectOption('#albumSort','name-desc');
            const afterSort=await page.locator('.album strong').first().textContent();
            if(errors.length)throw Error('JS errors '+errors.join(';'));
            console.log('VERIFIED_MOBILE_ALBUM',{cards,saved,imgs,cover,firstImage:test,firstSorted:afterSort,errorCount:errors.length});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-album-mobile-screenshot
          path: yui-album-mobile.png
          if-no-files-found: ignore
