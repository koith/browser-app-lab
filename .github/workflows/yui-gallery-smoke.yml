name: Yui Gallery Browser Smoke
on:
  push:
    paths:
      - apps/yui-gallery/**
      - .github/workflows/yui-gallery-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release version and free cloud truth-in-status
        run: node apps/yui-gallery/test_version.cjs
      - name: Verify physically stored photos and application syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm'),crypto=require('crypto');
          const root='apps/yui-gallery/';
          const html=fs.readFileSync(root+'index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!js)throw Error('No app JS');
          new vm.Script(js[1]);
          const db=JSON.parse(fs.readFileSync(root+'stored-albums.json'));
          let n=0;
          for(const album of db.albums){
            for(const x of album.images){
              const data=fs.readFileSync(root+x.url);
              const hash=crypto.createHash('sha256').update(data).digest('hex');
              if(hash!==x.sha256||data.length!==x.bytes)throw Error('Storage integrity '+x.url);
              n++;
            }
          }
          if(n<10)throw Error('Insufficient stored photos '+n);
          console.log('VERIFIED_STORED_PHOTOS',n, 'ALBUMS',db.albums.length);
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test photo-first gallery in mobile browser
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-web.log 2>&1 &
          node - <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          const local=JSON.parse(fs.readFileSync('apps/yui-gallery/stored-albums.json'));
          const extra=fs.existsSync('apps/yui-gallery/additional-source-albums.json')?JSON.parse(fs.readFileSync('apps/yui-gallery/additional-source-albums.json')):{albums:[]};
          const base=fs.existsSync('apps/yui-gallery/source-viewer-albums.json')?JSON.parse(fs.readFileSync('apps/yui-gallery/source-viewer-albums.json')):{albums:[]};
          const remote=[...new Map([...base.albums,...extra.albums].map(a=>[a.id,a])).values()];
          const remoteCount=remote.reduce((n,a)=>n+a.images.length,0);
          const aliases=JSON.parse(fs.readFileSync('apps/yui-gallery/album-aliases.json')).aliases;
          const remoteIds=new Set(remote.map(a=>a.id));
          const localVisible=local.albums.filter(a=>!remoteIds.has(aliases[a.id]||a.id));
          const hasSources=fs.existsSync('apps/yui-gallery/source-viewer-albums.json');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},acceptDownloads:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#total')?.textContent?.includes('albums'),{timeout:20000});
            const version=await page.locator('#app-version').innerText();
            if(version!==JSON.parse(fs.readFileSync('apps/yui-gallery/version.json')).version)throw Error('Current version missing at header top right');
            const vbox=await page.locator('#app-version').boundingBox();
            if(!vbox||vbox.x<190||vbox.y>25||vbox.height>18)throw Error('Version is not small/top-right');
            if(!await page.locator('[data-filter="albums"]').evaluate(x=>x.classList.contains('active')))throw Error('Albums not default view');
            const albumCount=await page.locator('.album').count(),expectedAlbums=localVisible.length+remote.length;
            if(albumCount!==expectedAlbums)throw Error('Expected '+expectedAlbums+' albums, got '+albumCount);
            if(await page.locator('.album[data-id="v04"]').count())throw Error('Duplicate Teddy preview card remains');
            await page.locator('.album[data-id="teddy-bear97"]').click();
            const detailCount=await page.locator('#detailphotos .photo').count();
            if(detailCount!==97)throw Error('Complete 97-photo Teddy Bear edition missing');
            const localPhoto=page.locator('#detailphotos .photo').filter({has:page.locator('img[src^="stored-albums/"]')}).first();
            const startIndex=Number(await localPhoto.getAttribute('data-i'));
            await localPhoto.click();
            await page.waitForFunction(()=>document.querySelector('#full').naturalWidth>0,{timeout:10000});
            if(!(await page.locator('#full').getAttribute('src')).startsWith('stored-albums/'))throw Error('Exact-hash local fallback missing');
            await page.locator('#next').click();
            if(!(await page.locator('#position').innerText()).startsWith(((startIndex+1)%97+1)+' /'))throw Error('Next image failed');
            await page.locator('#close').click();
            await page.locator('#back').click();
            if(hasSources){
              for(const [id,expected] of [['athletic-club104',104],['green91',91]]){
                await page.locator('.album[data-id="'+id+'"]').click();
                if(await page.locator('#detailphotos .photo').count()!==expected)throw Error('Missing source album photos: '+id);
                await page.locator('#detailphotos .photo').first().click();
                try{
                  await page.waitForFunction(()=>document.querySelector('#full').naturalWidth>100,{timeout:15000});
                }catch(error){throw Error('Source-host image cannot load in gallery: '+id+': '+await page.locator('#full').getAttribute('src'))}
                await page.locator('#close').click();
                await page.locator('#back').click();
              }
            }
            await page.locator('[data-filter="photos"]').click();
            const allPhotos=await page.locator('#photogrid .photo').count();
            const expectedPhotos=localVisible.reduce((n,a)=>n+a.images.length,0)+remoteCount;
            if(allPhotos!==expectedPhotos)throw Error('Expected '+expectedPhotos+' photo records, got '+allPhotos);
            await page.screenshot({path:'yui-album-mobile.png',fullPage:false});
            await page.locator('[data-filter="all"]').click();
            const allWorks=await page.locator('.album').count();
            if(allWorks<40)throw Error('Catalog collapsed: '+allWorks);
            if(errors.length)throw Error('JavaScript errors: '+errors.join('; '));
            console.log('YUI_IMAGE_FIRST_GALLERY_MOBILE_PASS',{albumCount,detailCount,allPhotos,allWorks,version,sourceRemoteBrowserQA:hasSources});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: yui-album-mobile.png
          archive: false
          retention-days: 90
          if-no-files-found: warn
