name: Yui Gallery Physical Files Only
on:
  push:
    paths:
      - 'apps/yui-gallery/**'
      - '.github/workflows/yui-gallery-smoke.yml'
  pull_request:
    paths:
      - 'apps/yui-gallery/**'
      - '.github/workflows/yui-gallery-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stored-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the manifest and physical file hashes
        run: |
          node apps/yui-gallery/test_version.cjs
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),vm=require('vm');
          const base='apps/yui-gallery/';
          const data=JSON.parse(fs.readFileSync(base+'stored-albums.json'));
          const html=fs.readFileSync(base+'index.html','utf8');
          const inline=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!inline)throw Error('Missing inline JavaScript');
          new vm.Script(inline[1]);
          if(html.includes("fetch('source-viewer-albums.json'")||html.includes("fetch('additional-source-albums.json'"))throw Error('Source-hosted preview is active');
          let count=0;
          for(const a of data.albums)for(const p of a.images){
            if(!p.url.startsWith('stored-albums/'+a.id+'/'))throw Error('External gallery media');
            const buf=fs.readFileSync(base+p.url);
            if(buf.length!==p.bytes||crypto.createHash('sha256').update(buf).digest('hex')!==p.sha256)throw Error('Wrong file '+p.url);
            count++;
          }
          console.log('YUI_PHYSICAL_FILES_VERIFIED',count,data.albums.length);
          NODE
      - name: Install Chromium and iPhone WebKit
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Render saved images only in both mobile engines
        run: |
          python -m http.server 8765 --directory apps/yui-gallery >/tmp/yui-http.log 2>&1 &
          node - <<'NODE'
          const fs=require('fs'),{chromium,webkit}=require('playwright');
          const data=JSON.parse(fs.readFileSync('apps/yui-gallery/stored-albums.json'));
          const photos=data.albums.flatMap(a=>a.images);
          async function check(engine,name){
            const browser=await engine.launch();
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[],external=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('request',r=>{if(r.resourceType()==='image'&&!r.url().startsWith('http://127.0.0.1:8765/')&&new URL(r.url()).hostname!=='mimmi-private-gallery-free.onrender.com')external.push(r.url())});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('#total')?.textContent?.includes('albums'));
              const cards=await page.locator('#albumgrid .album').count();
              const runtime=await page.evaluate(()=>({albums:available().length,photos:stored.reduce((n,a)=>n+validImages(a).length,0)}));
              if(cards!==runtime.albums)throw Error('Rendered saved owner+local album count wrong '+cards);
              if(await page.locator('#inventory').innerText()!==runtime.photos+'장 · 실제 저장본')throw Error('Inventory counts unarchived media');
              const urls=await page.evaluate(()=>available().flatMap(a=>validImages(a).map(p=>p.url).filter(u=>u?.startsWith('stored-albums/'))));
              if(urls.length!==photos.length||urls.some(x=>!x.startsWith('stored-albums/')))throw Error('Remote photo shown');
              const failed=await page.evaluate(async list=>{
                const bad=[];
                for(const url of list){
                  const image=new Image();
                  const ok=await new Promise(resolve=>{image.onload=()=>resolve(image.naturalWidth>50);image.onerror=()=>resolve(false);image.src=url});
                  if(!ok)bad.push(url);
                }
                return bad;
              },urls);
              if(failed.length)throw Error('Stored photo render failure '+failed[0]);
              const publicId=await page.evaluate(()=>available().find(a=>canonicalId(a.id)===a.id&&validImages(a).some(p=>p.url?.startsWith('stored-albums/')))?.id);
              if(!publicId)throw Error('No stored public file to check');
              await page.locator('#albumgrid [data-id="'+publicId+'"]').click();
              await page.locator('#detailphotos .photo:has(img[src^="stored-albums/"])').first().click();
              await page.waitForFunction(()=>document.querySelector('#full')?.naturalWidth>50);
              const shown=await page.locator('#full').getAttribute('src');
              if(!shown.startsWith('stored-albums/'))throw Error('Lightbox hotlink');
              if(external.length||errors.length)throw Error(JSON.stringify({external,errors}));
              await page.screenshot({path:'yui-stored-'+name+'.png'});
              console.log('YUI_LOCAL_ONLY_'+name.toUpperCase()+'_PASS',cards,photos.length);
            }finally{await browser.close()}
          }
          (async()=>{await check(chromium,'chromium');await check(webkit,'webkit')})().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yui-stored-browser-proof
          path: yui-stored-*.png
          retention-days: 14
          if-no-files-found: ignore
