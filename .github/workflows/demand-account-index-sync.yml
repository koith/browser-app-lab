name: INTERSECTION — Private Public-Account Index Hourly Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/account_index.py"
      - "apps/demand-research/account_index_sources.py"
      - "apps/demand-research/account_index_job.py"
      - ".github/workflows/demand-account-index-sync.yml"
permissions:
  contents: read
concurrency:
  group: intersection-private-account-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RCLONE_CONFIG_ARCHIVE_TYPE: terabox
      RCLONE_CONFIG_ARCHIVE_COOKIE: ${{ secrets.DEMAND_TERABOX_NDUS || secrets.YUI_TERABOX_NDUS || secrets.YUI_TERABOX_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runner and private credential
        run: |
          test -n "$RCLONE_CONFIG_ARCHIVE_COOKIE" || { echo "::error::Private TeraBox credential not configured"; exit 1; }
          python -m py_compile apps/demand-research/account_index.py apps/demand-research/account_index_sources.py apps/demand-research/account_index_job.py
      - name: Install digest-pinned private TeraBox backend
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gulp79/rclone-extra/releases/download/v1.75.2-extra/rclone-linux-amd64.zip -o /tmp/rclone.zip
          echo '78855325a2a8d83b3feee3a8363d32e1211babbf4cda6356fa8ca5f472075062  /tmp/rclone.zip' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone-extra
          find /tmp/rclone-extra -type f -name rclone -exec sudo install -m 755 {} /usr/local/bin/rclone \;
          rclone help backends | grep -i terabox >/dev/null
          rm -rf /tmp/rclone.zip /tmp/rclone-extra
      - name: Index authorized originals and checkpoint private DB with remote SHA256 readback
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fastapi==0.115.12
          cd apps/demand-research
          # Keep a bounded failure result and preserve the last verified snapshot.
          # The job itself allows 15 minutes; reserve time for safe cleanup.
          timeout --signal=TERM --kill-after=15s 780s python account_index_job.py
          echo 'Private account-index sync: successful, see masked aggregate-only run log' >> "$GITHUB_STEP_SUMMARY"
