name: 4LEAF permanent restoration ledger integrity
on:
  push:
    paths:
      - 'apps/4leaf/rog/docs/RESTORATION_LEDGER.json'
      - 'apps/4leaf/rog/tools/restoration-ledger.cjs'
      - 'apps/4leaf/rog/tests/restoration-ledger.cjs'
      - 'apps/4leaf/rog/tests/fl-workstream-coverage.cjs'
      - 'apps/4leaf/rog/docs/FL_WORKSTREAM_RECONCILIATION_2026-10-20.md'
      - '.github/workflows/rog-restoration-ledger.yml'
      - 'apps/4leaf/rog/docs/evidence/source-maps/**'
      - 'apps/4leaf/rog/tools/*source-evidence*.py'
      - 'apps/4leaf/rog/tools/decode-obs-extended.py'
      - 'apps/4leaf/rog/tests/test_*evidence.py'
      - 'apps/4leaf/rog/tests/test_decode_obs_extended.py'
      - 'apps/4leaf/rog/tests/test_obs_structure_37.py'
  pull_request:
    paths:
      - 'apps/4leaf/rog/docs/RESTORATION_LEDGER.json'
      - 'apps/4leaf/rog/tools/restoration-ledger.cjs'
      - 'apps/4leaf/rog/tests/restoration-ledger.cjs'
      - 'apps/4leaf/rog/tests/fl-workstream-coverage.cjs'
      - 'apps/4leaf/rog/docs/FL_WORKSTREAM_RECONCILIATION_2026-10-20.md'
      - '.github/workflows/rog-restoration-ledger.yml'
      - 'apps/4leaf/rog/docs/evidence/source-maps/**'
      - 'apps/4leaf/rog/tools/*source-evidence*.py'
      - 'apps/4leaf/rog/tools/decode-obs-extended.py'
      - 'apps/4leaf/rog/tests/test_*evidence.py'
      - 'apps/4leaf/rog/tests/test_decode_obs_extended.py'
      - 'apps/4leaf/rog/tests/test_obs_structure_37.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect-user-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical work ledger and protected requirements
        run: node apps/4leaf/rog/tools/restoration-ledger.cjs check
      - name: Verify no request or registered task was silently erased
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node apps/4leaf/rog/tools/restoration-ledger.cjs check --against "$BASE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            node apps/4leaf/rog/tools/restoration-ledger.cjs check --against HEAD^
          fi
      - name: Regression-test false completion and truncated history
        run: node apps/4leaf/rog/tests/restoration-ledger.cjs
      - name: Verify 16 historical FL requirements and 60 canonical ledger IDs
        run: node apps/4leaf/rog/tests/fl-workstream-coverage.cjs
      - name: Surface exact remaining original restoration work
        run: node apps/4leaf/rog/tools/restoration-ledger.cjs open

  round7-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - name: Verify synthetic wide and embedded source chain decoder
        run: python apps/4leaf/rog/tests/test_decode_obs_extended.py
      - name: Rebuild all 8 original source evidence JSONs and audit SHA256
        run: python apps/4leaf/rog/tests/test_source_evidence.py
      - name: Isolate STRUCTURAL_37 from EXT_STRUCTURAL_37
        run: python apps/4leaf/rog/tests/test_obs_structure_37.py
