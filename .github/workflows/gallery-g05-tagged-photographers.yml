name: G05 Yui Tag-Credited Public Photographer Physical Originals
on:
  pull_request:
    paths:
      - '.github/workflows/gallery-g05-tagged-photographers.yml'
      - 'apps/gallery-archive/collect_yui_tagged_public_photographers.py'
      - 'apps/gallery-archive/test_collect_yui_tagged_public_photographers.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-g05-credited-public-photo-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  public-tagged-actual-jpeg:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0'
      - name: Validate strict photographer credit, foreign author exclusion and real SHA persistence
        run: |
          python -m py_compile apps/gallery-archive/collect_yui_tagged_public_photographers.py
          python apps/gallery-archive/test_collect_yui_tagged_public_photographers.py
      - name: Visit only normally public credited photographer posts and save actual source bytes
        run: |
          python apps/gallery-archive/collect_yui_tagged_public_photographers.py --pages 2 --max-new 75 --max-bytes 60000000
          node apps/gallery-archive/test_saved_photo_union.cjs
          node apps/gallery-archive/test_curated_cover_manifest.cjs
      - name: Atomically commit only genuine new photo file bytes and exact SHA manifest
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/yui-gallery/stored-albums.json apps/yui-gallery/stored-albums/
          if git diff --cached --quiet; then
            echo 'G05_ZERO_NEW_SHA_NOT_FULL_PARENT_COMPLETE' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'feat(G05): archive true public Yui-tagged photographer JPEGs with SHA'
            git push origin "HEAD:refs/heads/$BRANCH"
            echo 'G05_NEW_REAL_JPEG_SHA_FILES_IN_PR_VERIFY_PAGES_AFTER_MERGE' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g05-tagged-public-photographer-byte-report
          path: .gallery-g05-tagged-photographer-report.json
          retention-days: 7
          if-no-files-found: warn
