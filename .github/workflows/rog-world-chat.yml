name: 4LEAF world map and real social chat integration
on:
  push:
    paths:
      - 'apps/4leaf/rog/world-map.js'
      - 'apps/4leaf/rog/world-map-source-moon.css'
      - 'apps/4leaf/rog/tests/world-map-moon.cjs'
      - 'apps/4leaf/rog/street-world.js'
      - 'apps/4leaf/rog/shop-native.js'
      - 'apps/4leaf/rog/cardshop-native-controls.js'
      - 'apps/4leaf/rog/cardshop-native-controls.css'
      - 'apps/4leaf/rog/cardshop-original-2003.css'
      - 'apps/4leaf/rog/dice-native-stage.js'
      - 'apps/4leaf/rog/dice-native-stage.css'
      - 'apps/4leaf/rog/dice-native-map-buttons.css'
      - 'apps/4leaf/rog/dice-native-map-buttons.js'
      - 'apps/4leaf/rog/dice-native-room-buttons.js'
      - 'apps/4leaf/rog/dice-native-room-buttons.css'
      - 'apps/4leaf/rog/town-native-room-hotspots.css'
      - 'apps/4leaf/rog/native-chattown-scale.css'
      - 'apps/4leaf/rog/original-chat-input.css'
      - 'apps/4leaf/rog/original-world-notice.css'
      - 'apps/4leaf/rog/original-shell-accurate.css'
      - 'apps/4leaf/rog/mainframe-native-toolbar.css'
      - 'apps/4leaf/rog/tests/mainframe-native-toolbar.cjs'
      - 'apps/4leaf/rog/original/MainFrame/toolbarbtn.png'
      - 'apps/4leaf/rog/original/MainFrame/pannel.png'
      - 'apps/4leaf/rog/central-client.js'
      - 'apps/4leaf/rog/sw.js'
      - 'apps/4leaf/rog/social-chat.js'
      - 'apps/4leaf/rog/world-social.css'
      - 'apps/4leaf/rog/chatroom-native-exit.js'
      - 'apps/4leaf/rog/chatroom-native-talkbox.js'
      - 'apps/4leaf/rog/chatroom-native-talkbox.css'
      - 'apps/4leaf/rog/chatroom-native-ringbtn.css'
      - 'apps/4leaf/rog/registry-native-avatar-dialog.js'
      - 'apps/4leaf/rog/registry-native-avatar-dialog.css'
      - 'apps/4leaf/rog/tests/registry-native-avatar-dialog.cjs'
      - 'apps/4leaf/rog/original/Registry/avatardialog*.png'
      - 'apps/4leaf/rog/chatroom-native-owner-dialog.js'
      - 'apps/4leaf/rog/chatroom-native-expressions.js'
      - 'apps/4leaf/rog/knighttown-native.js'
      - 'apps/4leaf/rog/knighttown-native.css'
      - 'apps/4leaf/rog/tests/knighttown-original.cjs'
      - 'apps/4leaf/rog/tests/knighttown-sign-registration.cjs'
      - 'apps/4leaf/rog/original/KnightTown/**'
      - 'apps/4leaf/rog/chatroom-native-expressions.css'
      - 'apps/4leaf/rog/tests/chatroom-native-expressions.cjs'
      - 'apps/4leaf/rog/chatroom-native-owner-dialog.css'
      - 'apps/4leaf/rog/tests/chatroom-native-owner-dialog.cjs'
      - 'apps/4leaf/rog/chatroom-native-scrollbar.js'
      - 'apps/4leaf/rog/chatroom-native-scrollbar.css'
      - 'apps/4leaf/rog/tests/chat-native-scrollbar.cjs'
      - 'apps/4leaf/rog/chatroom-native-exit.css'
      - 'apps/4leaf/rog/index.html'
      - 'apps/4leaf/rog/dice-native-player-portraits.css'
      - 'apps/4leaf/rog/dice-native-chessmen-hud.css'
      - 'apps/4leaf/rog/dice-original-selector.css'
      - 'apps/4leaf/rog/dice-native-menu-chrome.css'
      - 'apps/4leaf/rog/dice-native-dialog-event.css'
      - 'apps/4leaf/rog/dice-native-tis-depth.css'
      - 'apps/4leaf/rog/dice-native-tis-alpha.js'
      - 'apps/4leaf/rog/tests/dice-native-tis-alpha.cjs'
      - 'apps/4leaf/rog/tests/dice-native-tis-depth.cjs'
      - 'apps/4leaf/rog/tests/dice-native-dialog-event.cjs'
      - 'apps/4leaf/rog/tests/dice-chessmen-hud.cjs'
      - 'apps/4leaf/rog/tests/registry-native-portraits.cjs'
      - 'apps/4leaf/rog/tests/world-chat.cjs'
      - 'apps/4leaf/rog/tests/chatroom-native-furniture-sizes.cjs'
      - 'apps/4leaf/rog/tests/social-network.cjs'
      - 'apps/4leaf/rog/lobby-ui.js'
      - 'apps/4leaf/rog/lobby.css'
      - 'apps/4leaf/rog/tests/dice-channel.cjs'
      - 'apps/4leaf/rog/tests/asset-retry.cjs'
      - '.github/workflows/rog-world-chat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-*.yml'
  workflow_dispatch:
jobs:
  world-and-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Run site on same origin for actual inter-tab messaging
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog > /tmp/4leaf-http.log 2>&1 &
          # A busy ephemeral Actions runner can take longer than a hardcoded
          # two-second sleep. Validate real asset availability, not elapsed time.
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 -I http://127.0.0.1:8765/original/WorldMap/worldmapback.png; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Original-asset HTTP server never became ready.'
            cat /tmp/4leaf-http.log
            exit 1
          fi
      - name: Verify actual 120x270 MainFrame toolbar sprites, native panel and working cross-scene navigation
        run: node apps/4leaf/rog/tests/mainframe-native-toolbar.cjs
      - name: Register original 161x51 MainFrame 4LEAF logo across WorldMap and ChatRoom archive captures
        run: node apps/4leaf/rog/tests/mainframe-snaplogo-registration.cjs
      - name: Verify room3/5 source-sized original foreground PNGs and instantaneous character seat placement
        run: node apps/4leaf/rog/tests/chatroom-native-furniture-sizes.cjs
      - name: Quantify genuine ChatRoom room4 table placement from the 2004-02-11 screenshot
        run: node apps/4leaf/rog/tests/chatroom-furniture-registration.cjs
      - name: Verify recovered 196x267 expression atlas and real two-peer emotion chat in Chromium
        run: node apps/4leaf/rog/tests/chatroom-native-expressions.cjs
      - name: Verify three recovered Registry avatar panel PNGs, 12 selectable source characters and two real peers
        run: node apps/4leaf/rog/tests/registry-native-avatar-dialog.cjs
      - name: Verify recovered ChatRoom room-master atlas with real input, private admission, Cancel and 503 fallback
        run: node apps/4leaf/rog/tests/chatroom-native-owner-dialog.cjs
      - name: Correlate all six original KnightTown sign atlas source pixels against native background
        run: node apps/4leaf/rog/tests/knighttown-sign-registration.cjs
      - name: Verify recovered original KnightTown 794x404 six live regions and mobile
        run: node apps/4leaf/rog/tests/knighttown-original.cjs
      - name: Verify original world, regions, rooms, messages and mobile
        run: node apps/4leaf/rog/tests/world-chat.cjs
      - name: Verify original WorldMap, ChatTown and 115x103 ChatRoom furniture work after cold offline install
        run: node apps/4leaf/rog/tests/native-offline-cache.cjs
      - name: Verify original 52x40 ChatRoom scrollbar with real messages and pointer drag
        run: node apps/4leaf/rog/tests/chat-native-scrollbar.cjs
      - name: Verify live source Registry chroma key, true side player portraits, game turns and mobile
        run: node apps/4leaf/rog/tests/registry-native-portraits.cjs
      - name: Verify source 2x2 right-hand chessmen party and genuine consumables in Chromium
        run: node apps/4leaf/rog/tests/dice-chessmen-hud.cjs
      - name: Verify authentic native 796x528 WorldMap plus separate source screenshot full moon
        run: node apps/4leaf/rog/tests/world-map-moon.cjs
      - name: Decode original red/pink TIS source matte, preserve 145x97 true art and live map turns
        run: node apps/4leaf/rog/tests/dice-native-tis-alpha.cjs
      - name: Verify native 145x97 TIS and independently depth-sorted original DMP cells in live Chromium
        run: node apps/4leaf/rog/tests/dice-native-tis-depth.cjs
      - name: Validate real original Genesis dialog and game event message in Chromium
        run: node apps/4leaf/rog/tests/dice-native-dialog-event.cjs
      - name: Verify original TOWN SELECT is used solely for dice game channels
        run: node apps/4leaf/rog/tests/dice-channel.cjs
      - name: Verify original ChatRoom furniture survives transient CDN HTTP 503
        run: node apps/4leaf/rog/tests/asset-retry.cjs
      - name: Verify cross-device peer-to-peer ChatRoom with real RTCDataChannel
        run: node apps/4leaf/rog/tests/social-network.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-world-and-social-chat-screens
          path: leaf-*.png
          retention-days: 7
