name: Gallery Newly Stored Exact Original Mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/gallery-archive/qa_new_physical_photos.py
      - apps/gallery-archive/verification/new-physical-photos-2026-10-30.json
      - .github/workflows/gallery-newly-stored-photo-qa.yml
  pull_request:
    paths:
      - apps/gallery-archive/qa_new_physical_photos.py
      - apps/gallery-archive/verification/new-physical-photos-2026-10-30.json
      - .github/workflows/gallery-newly-stored-photo-qa.yml
permissions:
  contents: read
concurrency:
  group: newly-stored-exact-originals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile apps/gallery-archive/qa_new_physical_photos.py
  actual-deployed-originals:
    needs: syntax
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {model: yui, browser: chromium, shard: 0, shards: 2}
          - {model: yui, browser: webkit, shard: 0, shards: 2}
          - {model: yui, browser: chromium, shard: 1, shards: 2}
          - {model: yui, browser: webkit, shard: 1, shards: 2}
          - {model: mimmi, browser: chromium, shard: 0, shards: 8}
          - {model: mimmi, browser: webkit, shard: 0, shards: 8}
          - {model: mimmi, browser: chromium, shard: 1, shards: 8}
          - {model: mimmi, browser: webkit, shard: 1, shards: 8}
          - {model: mimmi, browser: chromium, shard: 2, shards: 8}
          - {model: mimmi, browser: webkit, shard: 2, shards: 8}
          - {model: mimmi, browser: chromium, shard: 3, shards: 8}
          - {model: mimmi, browser: webkit, shard: 3, shards: 8}
          - {model: mimmi, browser: chromium, shard: 4, shards: 8}
          - {model: mimmi, browser: webkit, shard: 4, shards: 8}
          - {model: mimmi, browser: chromium, shard: 5, shards: 8}
          - {model: mimmi, browser: webkit, shard: 5, shards: 8}
          - {model: mimmi, browser: chromium, shard: 6, shards: 8}
          - {model: mimmi, browser: webkit, shard: 6, shards: 8}
          - {model: mimmi, browser: chromium, shard: 7, shards: 8}
          - {model: mimmi, browser: webkit, shard: 7, shards: 8}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright==1.58.0' requests
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Decode exact archived thumbnails and full images, then download and SHA check actual bytes
        run: |
          python apps/gallery-archive/qa_new_physical_photos.py --model '${{ matrix.model }}' --browser '${{ matrix.browser }}' --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}' --since-commit e4b633fc189429e79c9b70038ef6f2b6b9fdd0a5 --out "$RUNNER_TEMP/physical-${{ matrix.model }}-${{ matrix.browser }}-${{ matrix.shard }}.json"
      - name: Summarize real deployed results without any photo bundles
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('physical-*.json'):
              print('REAL_DEPLOYED_QA_RESULT',json.loads(p.read_text()))
          PY
