name: Gallery Newly Stored Exact Original Mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/gallery-archive/qa_new_physical_photos.py
      - apps/gallery-archive/native_qa_checkpoint.py
      - apps/gallery-archive/test_native_qa_checkpoint.py
      - apps/gallery-archive/verification/native-qa-checkpoint-2026-10-31.json
      - apps/gallery-archive/test_physical_qa_matrix.py
      - apps/gallery-archive/physical_qa_matrix.py
      - apps/gallery-archive/verification/new-physical-photos-2026-10-30.json
      - .github/workflows/gallery-newly-stored-photo-qa.yml
  pull_request:
    paths:
      - apps/gallery-archive/qa_new_physical_photos.py
      - apps/gallery-archive/native_qa_checkpoint.py
      - apps/gallery-archive/test_native_qa_checkpoint.py
      - apps/gallery-archive/verification/native-qa-checkpoint-2026-10-31.json
      - apps/gallery-archive/test_physical_qa_matrix.py
      - apps/gallery-archive/physical_qa_matrix.py
      - apps/gallery-archive/verification/new-physical-photos-2026-10-30.json
      - .github/workflows/gallery-newly-stored-photo-qa.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: newly-stored-exact-originals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      has_changes: ${{ steps.partition.outputs.has_changes }}
      since_commit: ${{ steps.partition.outputs.since_commit }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'playwright==1.58.0' requests PyYAML
      - run: python -m py_compile apps/gallery-archive/qa_new_physical_photos.py
      - run: python apps/gallery-archive/test_physical_qa_matrix.py
      - run: python apps/gallery-archive/test_native_qa_checkpoint.py
      - name: Partition every changed original against the exact completed baseline
        id: partition
        if: github.ref == 'refs/heads/main'
        run: python apps/gallery-archive/physical_qa_matrix.py --current-commit '${{ github.sha }}' --github-output "$GITHUB_OUTPUT"
  actual-deployed-originals:
    needs: syntax
    if: github.ref == 'refs/heads/main' && needs.syntax.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.syntax.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install 'playwright==1.58.0' requests
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Decode exact archived thumbnails and full images, then download and SHA check actual bytes
        run: |
          python apps/gallery-archive/qa_new_physical_photos.py --model '${{ matrix.model }}' --browser '${{ matrix.browser }}' --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}' --since-commit '${{ needs.syntax.outputs.since_commit }}' --current-commit '${{ github.sha }}' --out "$RUNNER_TEMP/physical-${{ matrix.model }}-${{ matrix.browser }}-${{ matrix.shard }}.json"
      - name: Summarize real deployed results without any photo bundles
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('physical-*.json'):
              print('REAL_DEPLOYED_QA_RESULT',json.loads(p.read_text()))
          PY
