name: INTERSECTION — Deployed Pages Desktop and Mobile QA

on:
  pull_request:
    paths:
      - "apps/demand-research/test_deployed_pages_browser.py"
      - "apps/demand-research/test_live_render_browser.py"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/target_archive_client.js"
      - ".github/workflows/intersection-deployed-pages-qa.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/post_activity_ranking.js"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/target_archive_client.js"
      - "apps/demand-research/test_deployed_pages_browser.py"
      - "apps/demand-research/test_live_render_browser.py"
      - ".github/workflows/intersection-deployed-pages-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intersection-deployed-pages-production
  cancel-in-progress: false

jobs:
  code-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate read-only deployment QA syntax
        run: python -m py_compile apps/demand-research/test_deployed_pages_browser.py apps/demand-research/test_live_render_browser.py

  deployed-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Real Render LIVE Chromium + mobile WebKit first-tab and archives
        run: python apps/demand-research/test_live_render_browser.py


  # Do not make a broken GitHub Pages UI check hide an otherwise good
  # production Render deployment. Parallel suites report distinct failures.
  pages-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify GitHub Pages Chromium + mobile WebKit separately
        run: python apps/demand-research/test_deployed_pages_browser.py
