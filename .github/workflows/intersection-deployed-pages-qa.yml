name: INTERSECTION — Deployed Pages Desktop and Mobile QA

on:
  pull_request:
    paths:
      - "apps/demand-research/test_deployed_pages_browser.py"
      - "apps/demand-research/test_live_render_browser.py"
      - "apps/demand-research/test_live_public_ranking_browser.py"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/target_archive_client.js"
      - ".github/workflows/intersection-deployed-pages-qa.yml"
  push:
    branches: [main]
    paths:
      - "apps/demand-research/index.html"
      - "apps/demand-research/post_activity_ranking.js"
      - "apps/demand-research/public_video_trends.js"
      - "apps/demand-research/target_archive_client.js"
      - "apps/demand-research/test_deployed_pages_browser.py"
      - "apps/demand-research/test_live_render_browser.py"
      - "apps/demand-research/test_live_public_ranking_browser.py"
      - ".github/workflows/intersection-deployed-pages-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new PR syntax check must not evict a pending production LIVE browser QA.
  # Production runs are serialized; each PR gets an independent fast lane.
  group: ${{ github.event_name == 'pull_request' && format('intersection-deployed-pages-pr-{0}', github.head_ref) || 'intersection-deployed-pages-production' }}
  cancel-in-progress: false
  # Since May 2026 GitHub can retain up to 100 pending runs instead of
  # silently cancelling the previous pending QA on every main push.
  queue: max

jobs:
  code-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate read-only deployment QA syntax
        run: python -m py_compile apps/demand-research/test_deployed_pages_browser.py apps/demand-research/test_live_render_browser.py apps/demand-research/test_live_public_ranking_browser.py

  deployed-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Prebuilt version-pinned Chromium/WebKit and system dependencies.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Python Playwright API (browser is preinstalled)
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Real Render LIVE Chromium + mobile WebKit first-tab and archives
        run: python apps/demand-research/test_live_render_browser.py


  # Do not make a broken GitHub Pages UI check hide an otherwise good
  # production Render deployment. Parallel suites report distinct failures.
  pages-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Python Playwright API (browser is preinstalled)
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify GitHub Pages Chromium + mobile WebKit separately
        run: python apps/demand-research/test_deployed_pages_browser.py

  # Separate production data QA from synthetic static Pages tests. A blocked
  # SNS endpoint should be reported RED, not disguised as passing fake rows.
  real-ranking-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Playwright Python for real read-only RANK QA
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Actual deployed public posts, cohort counts and 10/5-column RANK
        run: python apps/demand-research/test_live_public_ranking_browser.py
