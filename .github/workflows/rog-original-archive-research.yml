name: 4LEAF original 2002 client metadata research
on:
  pull_request:
    paths:
      - 'apps/4leaf/rog/tools/inspect-original-client-archive.cjs'
      - 'apps/4leaf/rog/tools/inspect-original-client-zip.cjs'
      - 'apps/4leaf/rog/tools/inspect-original-pak-signatures.cjs'
      - 'apps/4leaf/rog/tools/original-pak-index.cjs'
      - 'apps/4leaf/rog/tools/inspect-original-member-signatures.cjs'
      - 'apps/4leaf/rog/tools/probe-original-spr.py'
      - 'apps/4leaf/rog/tools/decode-original-img-spr.py'
      - 'apps/4leaf/rog/tools/emit-original-img-ui.py'
      - 'apps/4leaf/rog/tests/original-pak-index.cjs'
      - 'apps/4leaf/rog/docs/original-evidence-crosscheck-2026-10-17.md'
      - '.github/workflows/rog-original-archive-research.yml'
  workflow_dispatch:
jobs:
  archive-preservation-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query archived 2002 official 4LEAF client file metadata only, without executing Windows code
        run: node apps/4leaf/rog/tools/inspect-original-client-archive.cjs
      - name: Attach original client metadata status for source-audit trail
        uses: actions/upload-artifact@v4
        with:
          name: original-4leaf-client-metadata
          path: original-4leaf-client-metadata.json
          retention-days: 14

  archive-source-zip-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install static InstallShield CAB index utilities (read-only, no setup.exe execution)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unshield cabextract
      - name: Download public 2002 ZIP into ephemeral tmp, verify SHA1, list central directory only, NEVER execute or publish binaries
        run: node apps/4leaf/rog/tools/inspect-original-client-zip.cjs
      - name: Preserve safe ZIP file-list report only
        uses: actions/upload-artifact@v4
        with:
          name: original-4leaf-zip-listing
          path: original-4leaf-zip-listing.json
          retention-days: 14

  verified-pak-header-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install safe InstallShield resource de-archiver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unshield
      - name: Test recovered bitwise-inverted PAK header, filename and payload length parser
        run: node apps/4leaf/rog/tests/original-pak-index.cjs
      - name: Install preservation image decoder for native original BMPs
        run: python3 -m pip install --user Pillow
      - name: Verify original ZIP SHA1, unpack original PAKs into ephemeral tmp, inspect signatures and SHA256 ONLY
        run: node apps/4leaf/rog/tools/inspect-original-pak-signatures.cjs
      - name: Preserve harmless original PAK header and checksum audit only, never the copyrighted payloads
        uses: actions/upload-artifact@v4
        with:
          name: original-4leaf-pak-signatures
          path: original-4leaf-pak-signatures.json
          retention-days: 14
