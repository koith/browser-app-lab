name: 4LEAF P0 unfinished match replacement safety QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/dice-new-match-confirmation.cjs'
      - '.github/workflows/rog-match-replacement-qa.yml'
  push:
    branches: [main]
    paths:
      - 'apps/4leaf/rog/game.js'
      - 'apps/4leaf/rog/tests/dice-new-match-confirmation.cjs'
      - '.github/workflows/rog-match-replacement-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-in-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: '0'
          - browser: webkit
            mobile: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium or WebKit browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve complete real 4LEAF asset directory
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog > /tmp/leaf-game-preservation.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leaf-game-preservation.log
          exit 1
      - name: Real ROOM READY, cancel replacement, preserve save, explicitly replace
        env:
          FOURLEAF_BROWSER: ${{ matrix.browser }}
          FOURLEAF_MOBILE: ${{ matrix.mobile }}
          FOURLEAF_TEST_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/dice-new-match-confirmation.cjs
