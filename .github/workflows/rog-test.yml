name: 4LEAF dynamic game smoke tests
on:
  push:
    paths:
      - 'apps/4leaf/rog/**'
      - '.github/workflows/rog-test.yml'
  workflow_dispatch:
# Cancel stale checks when a developer pushes another commit to the same PR.
# Production/main checks remain pinned to their unique SHA and are NEVER cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve real source graphics over same-origin HTTP
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/4leaf/rog >/tmp/leaf-smoke-http.log 2>&1 &
          for n in $(seq 1 10); do if curl --fail --silent --head http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/leaf-smoke-http.log; exit 1
      - name: Test functional 4LEAF scenes and dice flow
        env:
          FOURLEAF_SMOKE_URL: http://127.0.0.1:8765/
        run: node apps/4leaf/rog/tests/smoke.cjs
      - name: Fail closed on unbacked saved games and recover safely when storage returns
        env:
          FOURLEAF_SMOKE_URL: http://127.0.0.1:8765/
        run: node --test apps/4leaf/rog/tests/dice-corrupt-save-preflight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rog-browser-screenshots
          path: rog-*.png
