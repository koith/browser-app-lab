# Simple workflow for deploying static content to GitHub Pages
# Ensure the current SHA-verified Mimmi stored-albums photos are actually served
# by GitHub Pages; actions-bot image commits alone do not trigger this workflow.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # The preserved ~878 MiB photo artifact exceeded the default deploy-pages
    # 10 minute client timeout while GitHub Pages was updating files.
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://koith.github.io/browser-app-lab/' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select the existing single Pages publisher without admin changes
        id: publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python apps/gallery-archive/pages_single_publisher.py --select "$GITHUB_OUTPUT"
      - name: Setup Pages
        if: steps.publishing.outputs.publisher == 'workflow'
        uses: actions/configure-pages@v5
      - name: Bind the public artifact to its exact checked-out source
        if: steps.publishing.outputs.publisher == 'workflow'
        run: python apps/gallery-archive/pages_deployment_identity.py --write gallery-deployment.json
      - name: Upload artifact
        if: steps.publishing.outputs.publisher == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        if: steps.publishing.outputs.publisher == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
      - name: Verify the native publisher actually exposes this exact commit
        if: steps.publishing.outputs.publisher == 'native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python apps/gallery-archive/pages_single_publisher.py --wait-native
