name: Mimmi Instagram Public Carousel Photos
on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * 2,5'
  push:
    paths:
      - 'apps/mimmi-gallery/collect_imginn_public.py'
      - 'apps/mimmi-gallery/test_imginn_public.py'
      - '.github/workflows/mimmi-instagram-public-multipost.yml'
permissions:
  contents: write
concurrency:
  group: mimmi-instagram-public-crawler-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  public-posts:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-page image parser and Chromium
        run: |
          python -m pip install 'requests==2.32.5' 'Pillow==11.3.0' 'beautifulsoup4==4.14.2' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python -m py_compile apps/mimmi-gallery/collect_imginn_public.py
          python apps/mimmi-gallery/test_imginn_public.py
      - name: Discover real images by scrolling profile and visiting normal carousel posts
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            python apps/mimmi-gallery/collect_imginn_public.py --posts 180 --images 600
          else
            python apps/mimmi-gallery/collect_imginn_public.py --posts 16 --images 60
          fi
      - name: Verify all public CDN byte evidence, no generated URLs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("apps/mimmi-gallery/imginn-public-previews.json").read_text())
          assert d["model"]=="mimmi" and len(d["albums"])==1
          assert d["summary"]["private_cloud_archived"]==0
          a=d["albums"][0]
          assert a["images"]==[]
          for p in a["samples"]:
              assert len(p["sha256"])==64 and p["bytes"]>4500
              assert p["url"].startswith("https://scontent-") and ".cdninstagram.com/" in p["url"] or p["url"].startswith("https://scontent-") and ".fbcdn.net/" in p["url"]
          print("MIMMI_IMG_INSTA_PUBLIC_BYTES_VERIFIED",d["summary"])
          PY
      - name: Commit only genuinely verified gallery photos, if any
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path("apps/mimmi-gallery/imginn-public-previews.json").read_text())
          if d["summary"]["public_media_verified"]==0:
              print("MIMMI_INSTAGRAM_PUBLIC_NO_ACCESSIBLE_MEDIA: no fake photos")
              sys.exit(0)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mimmi-gallery/imginn-public-previews.json
          if ! git diff --cached --quiet; then git commit -m "Verify Mimmi public Instagram individual and carousel photo source URLs"; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          python apps/mimmi-gallery/build_model_gallery.py
          git add apps/mimmi-gallery/source-viewer-albums.json apps/mimmi-gallery/albums.json
          if ! git diff --cached --quiet; then git commit -m "Index verified Mimmi public Instagram carousel photos"; fi
          git push origin "HEAD:$GITHUB_REF_NAME"
